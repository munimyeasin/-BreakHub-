<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="tapBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140600" />
      <stop offset="50%" stop-color="#2D1000" />
      <stop offset="100%" stop-color="#090518" />
    </linearGradient>
    <linearGradient id="tapBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#FFEDD5" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#tapBgDark); }
    .theme-grid-line { stroke: #FB923C; stroke-opacity: 0.15; }
    .theme-btn-base { fill: #2B1506; stroke: #000000; }
    .theme-badge-rect { fill: #FFE600; stroke: #000000; }
    .theme-badge-text { fill: #000000; }
    .theme-tag-rect { fill: #FF007F; stroke: #000000; }
    .theme-tag-text { fill: #FFFFFF; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#tapBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.1; }
      .theme-btn-base { fill: #FFFFFF; stroke: #000000; }
      .theme-badge-rect { fill: #FFE600; stroke: #000000; }
      .theme-badge-text { fill: #000000; }
      .theme-tag-rect { fill: #FF007F; stroke: #000000; }
      .theme-tag-text { fill: #FFFFFF; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Speed Shockwave Ripple Rings -->
  <g class="theme-grid-line" stroke-width="2">
    <ellipse cx="200" cy="265" rx="160" ry="55" fill="none" stroke-dasharray="8,6" />
    <ellipse cx="200" cy="265" rx="120" ry="42" fill="none" />
    <ellipse cx="200" cy="265" rx="80" ry="28" fill="none" />
  </g>

  <!-- Giant Glowing Arcade Button Base (3D Neo-Brutalist) -->
  <g transform="translate(200, 245)" filter="url(#brutalShadow)">
    <!-- Outer Button Ring Base -->
    <ellipse cx="0" cy="20" rx="95" ry="38" class="theme-btn-base" stroke-width="4" />
    <!-- Golden Cap -->
    <ellipse cx="0" cy="4" rx="78" ry="30" fill="#FF7700" stroke="#000000" stroke-width="3" />
    <ellipse cx="0" cy="-2" rx="75" ry="28" fill="#FFE600" stroke="#000000" stroke-width="3.5" />
    <!-- Highlight -->
    <ellipse cx="-15" cy="-10" rx="42" ry="12" fill="#FFFFFF" opacity="0.6" />
    <text x="0" y="7" font-family="'Impact', 'Arial Black', sans-serif" font-size="22" fill="#000000" font-weight="900" text-anchor="middle" letter-spacing="1">TAP!</text>
  </g>

  <!-- Lightning Sparks Bursting from Tip -->
  <g stroke="#000000" stroke-width="3.5" fill="none">
    <path d="M 195,220 L 175,195 L 190,180 L 165,155 L 200,155 L 180,125" stroke="#FFE600" />
    <path d="M 215,220 L 235,190 L 220,180 L 245,155 L 215,150 L 235,120" stroke="#00F0FF" />
  </g>

  <!-- Cartoon Robo-Glove Tapping Pose -->
  <g transform="translate(180, 50)" filter="url(#brutalShadowSm)">
    <!-- Arm -->
    <rect x="-10" y="0" width="60" height="90" rx="16" fill="#00F0FF" stroke="#000000" stroke-width="3.5" />
    <rect x="-14" y="68" width="68" height="22" rx="8" fill="#FFE600" stroke="#000000" stroke-width="3" />

    <!-- Index Finger extended downward -->
    <rect x="5" y="80" width="30" height="95" rx="15" fill="#FFFFFF" stroke="#000000" stroke-width="3.5" />

    <!-- Thumb folded in -->
    <ellipse cx="-5" cy="115" rx="14" ry="18" fill="#FFFFFF" stroke="#000000" stroke-width="3.5" />

    <!-- Cute Smiling Face on Glove -->
    <circle cx="10" cy="38" r="3" fill="#000000" />
    <circle cx="30" cy="38" r="3" fill="#000000" />
    <path d="M 16,46 Q 20,52 24,46" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- CPS / APM Meter Pill (Top Right) -->
  <g transform="translate(315, 85)" filter="url(#brutalShadowSm)">
    <rect x="-40" y="-22" width="80" height="44" rx="12" fill="#FF007F" stroke="#000000" stroke-width="3" />
    <text x="0" y="-4" font-family="'Impact', 'Arial Black', sans-serif" font-size="11" fill="#FFFFFF" font-weight="900" text-anchor="middle" letter-spacing="0.5">MAX</text>
    <text x="0" y="14" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" fill="#FFE600" font-weight="900" text-anchor="middle" letter-spacing="1">CPS ⚡</text>
  </g>

  <!-- Top Tag Pill: PRECISION REFLEX CLICKER -->
  <g transform="translate(200, 24)" filter="url(#brutalShadowSm)">
    <rect x="-90" y="-10" width="180" height="20" rx="6" class="theme-tag-rect" stroke-width="2" />
    <text x="0" y="4" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1">PRECISION REFLEX CLICKER</text>
  </g>

  <!-- Bottom Title Badge Pill: HYPER TAPPER -->
  <g transform="translate(200, 366)" filter="url(#brutalShadowSm)">
    <rect x="-90" y="-15" width="180" height="30" rx="10" class="theme-badge-rect" stroke-width="3" />
    <text x="0" y="5" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1.5">HYPER TAPPER</text>
  </g>
</svg>
