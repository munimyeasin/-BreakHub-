<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="slicerBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18000f" />
      <stop offset="50%" stop-color="#2a0518" />
      <stop offset="100%" stop-color="#070014" />
    </linearGradient>
    <linearGradient id="slicerBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FFF1F2" />
      <stop offset="100%" stop-color="#FFE4E6" />
    </linearGradient>

    <!-- Katana Blade Steel & Laser Edge -->
    <linearGradient id="bladeSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="bladeNeonEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3DF5" />
      <stop offset="50%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Hilt & Guard -->
    <linearGradient id="hiltGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF570" />
      <stop offset="100%" stop-color="#D49B00" />
    </linearGradient>
    <linearGradient id="hiltDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Target Wheel Gradient -->
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0099CC" />
      <stop offset="100%" stop-color="#006699" />
    </linearGradient>

    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="100%" stop-color="#FFE600" />
    </linearGradient>

    <!-- Neo-Brutalist Hard Drop Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowLg" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="slashGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF007F" flood-opacity="0.85" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#slicerBgDark); }
    .theme-grid-line { stroke: #FFFFFF; stroke-opacity: 0.12; }
    .theme-frame-bg { fill: #140516; stroke: #FF007F; }
    .theme-stage-grid { stroke: #3D1030; }
    .theme-badge-rect { fill: #FF007F; stroke: #000000; }
    .theme-badge-text { fill: #FFFFFF; }
    .theme-tag-rect { fill: #FFDE59; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#slicerBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.08; }
      .theme-frame-bg { fill: #FFFFFF; stroke: #000000; }
      .theme-stage-grid { stroke: #E2E8F0; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Retro Cyber Grid Backdrop -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- Neo Sparks & Blade Embers -->
  <g fill="#FFDE59">
    <polygon points="40,46 42,54 50,56 42,58 40,66 38,58 30,56 38,54" />
    <polygon points="360,40 362,48 370,50 362,52 360,60 358,52 350,50 358,48" />
    <polygon points="365,300 367,306 373,308 367,310 365,316 363,310 357,308 363,306" />
    <polygon points="34,310 36,316 42,318 36,320 34,326 32,320 26,318 32,316" />
  </g>

  <!-- 3D MAIN ARCADE CONTAINER -->
  <g filter="url(#brutalShadowLg)">
    <rect x="36" y="38" width="328" height="298" rx="22" class="theme-frame-bg" stroke-width="4" />
  </g>

  <!-- Inner Playfield Dojo Stage -->
  <rect x="48" y="48" width="304" height="278" rx="16" fill="#08020B" stroke="#000000" stroke-width="2.5" />

  <!-- Perspective Arena Grid Lines -->
  <g class="theme-stage-grid" stroke-width="1.5" stroke-dasharray="4,3">
    <line x1="48" y1="88" x2="352" y2="88" />
    <line x1="48" y1="136" x2="352" y2="136" />
    <line x1="48" y1="184" x2="352" y2="184" />
    <line x1="48" y1="232" x2="352" y2="232" />
    <line x1="48" y1="280" x2="352" y2="280" />
    <line x1="96" y1="48" x2="96" y2="326" />
    <line x1="148" y1="48" x2="148" y2="326" />
    <line x1="200" y1="48" x2="200" y2="326" />
    <line x1="252" y1="48" x2="252" y2="326" />
    <line x1="304" y1="48" x2="304" y2="326" />
  </g>

  <!-- Spinning Target Wheel at center (200, 185) with Stuck Blades -->
  <g transform="translate(200, 185)" filter="url(#brutalShadow)">
    <circle cx="0" cy="0" r="65" fill="url(#wheelGrad)" stroke="#000000" stroke-width="3.5" />
    <circle cx="0" cy="0" r="26" fill="#140516" stroke="#FFE600" stroke-width="2.5" />
    <circle cx="0" cy="0" r="8" fill="#FF007F" stroke="#000000" stroke-width="2" />

    <!-- Stuck Blade 1 -->
    <g transform="rotate(0) translate(0, -95)" filter="url(#brutalShadowSm)">
      <polygon points="-4,30 4,30 3,0 0,-12 -3,0" fill="url(#bladeSteel)" stroke="#000000" stroke-width="2" />
      <polygon points="1,25 3,25 2,0 0,-10 1,0" fill="url(#bladeNeonEdge)" />
      <rect x="-6" y="20" width="12" height="12" rx="2" fill="url(#hiltDark)" stroke="#000000" stroke-width="1.5" />
    </g>
    <!-- Stuck Blade 2 -->
    <g transform="rotate(110) translate(0, -95)" filter="url(#brutalShadowSm)">
      <polygon points="-4,30 4,30 3,0 0,-12 -3,0" fill="url(#bladeSteel)" stroke="#000000" stroke-width="2" />
      <polygon points="1,25 3,25 2,0 0,-10 1,0" fill="url(#bladeNeonEdge)" />
      <rect x="-6" y="20" width="12" height="12" rx="2" fill="url(#hiltDark)" stroke="#000000" stroke-width="1.5" />
    </g>
    <!-- Stuck Blade 3 -->
    <g transform="rotate(235) translate(0, -95)" filter="url(#brutalShadowSm)">
      <polygon points="-4,30 4,30 3,0 0,-12 -3,0" fill="url(#bladeSteel)" stroke="#000000" stroke-width="2" />
      <polygon points="1,25 3,25 2,0 0,-10 1,0" fill="url(#bladeNeonEdge)" />
      <rect x="-6" y="20" width="12" height="12" rx="2" fill="url(#hiltDark)" stroke="#000000" stroke-width="1.5" />
    </g>
  </g>

  <!-- FLYING THROWING KNIFE (Active throw upward) -->
  <g transform="translate(200, 260) rotate(-25)" filter="url(#brutalShadowLg)">
    <polygon points="-5,50 5,50 4,0 0,-25 -4,0" fill="url(#bladeSteel)" stroke="#000000" stroke-width="2.5" />
    <polygon points="2,40 4,40 3,0 0,-20 2,0" fill="url(#bladeNeonEdge)" />
    <!-- Handle -->
    <rect x="-7" y="32" width="14" height="18" rx="3" fill="url(#hiltDark)" stroke="#000000" stroke-width="2" />
    <ellipse cx="0" cy="50" rx="4" ry="2.5" fill="url(#hiltGold)" stroke="#000000" stroke-width="1.5" />
  </g>

  <!-- ACTION POPUP COMBO BADGE: "BULLSEYE x5!" -->
  <g transform="translate(260, 110)" filter="url(#brutalShadow)">
    <polygon points="0,-18 6,-6 20,-10 12,-1 24,8 10,10 12,22 2,16 -3,22 -2,10 -14,14 -10,2 -22,-2 -10,-8 -14,-20 -4,-12" fill="url(#badgeGold)" stroke="#000000" stroke-width="2" />
    <text x="0" y="3.5" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="8.5" fill="#000000" text-anchor="middle" letter-spacing="0.5">
      HIT x5!
    </text>
  </g>

  <!-- TOP TAG RIBBON: "KNIFE THROWER // ACTION" -->
  <g transform="translate(200, 32)" filter="url(#brutalShadowSm)">
    <rect x="-85" y="-12" width="170" height="24" rx="8" class="theme-tag-rect" stroke-width="2.5" />
    <text x="0" y="4.5" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="1.2">
      BLADE THROW // ACTION
    </text>
  </g>

  <!-- BOTTOM TITLE MARQUEE: "CYBER KNIFE THROWER" -->
  <g transform="translate(200, 360)" filter="url(#brutalShadowLg)">
    <rect x="-125" y="-18" width="250" height="36" rx="12" class="theme-badge-rect" stroke-width="3.5" />
    <rect x="-120" y="-14" width="240" height="28" rx="8" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.3" />
    <text x="0" y="6" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="1.2">
      CYBER KNIFE THROWER
    </text>
  </g>

  <!-- Bottom Rivets -->
  <circle cx="84" cy="360" r="3" fill="#000000" />
  <circle cx="316" cy="360" r="3" fill="#000000" />
</svg>
