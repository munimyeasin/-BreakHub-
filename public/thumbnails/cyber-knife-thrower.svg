<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0014" />
      <stop offset="50%" stop-color="#1b032d" />
      <stop offset="100%" stop-color="#020008" />
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="knifeSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="brutalShadowLg" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgDark)" />

  <!-- Cyber Grid -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5">
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
  </g>

  <!-- Main Spinning Cyber Wheel at center (200, 160) -->
  <g transform="translate(200, 160)" filter="url(#brutalShadowLg)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="75" fill="url(#wheelGrad)" stroke="#000000" stroke-width="4" />
    <!-- Inner bullseye core -->
    <circle cx="0" cy="0" r="30" fill="#0f172a" stroke="#facc15" stroke-width="3" />
    <circle cx="0" cy="0" r="10" fill="#f43f5e" stroke="#000000" stroke-width="2" />

    <!-- Stuck Knife 1 (Top) -->
    <g transform="rotate(0) translate(0, -115)">
      <polygon points="-5,40 5,40 4,0 0,-15 -4,0" fill="url(#knifeSteel)" stroke="#000000" stroke-width="2.5" />
      <rect x="-8" y="25" width="16" height="15" rx="3" fill="#1e293b" stroke="#000000" stroke-width="2" />
    </g>

    <!-- Stuck Knife 2 (Right) -->
    <g transform="rotate(90) translate(0, -115)">
      <polygon points="-5,40 5,40 4,0 0,-15 -4,0" fill="url(#knifeSteel)" stroke="#000000" stroke-width="2.5" />
      <rect x="-8" y="25" width="16" height="15" rx="3" fill="#1e293b" stroke="#000000" stroke-width="2" />
    </g>

    <!-- Stuck Knife 3 (Left-Bottom) -->
    <g transform="rotate(210) translate(0, -115)">
      <polygon points="-5,40 5,40 4,0 0,-15 -4,0" fill="url(#knifeSteel)" stroke="#000000" stroke-width="2.5" />
      <rect x="-8" y="25" width="16" height="15" rx="3" fill="#1e293b" stroke="#000000" stroke-width="2" />
    </g>
  </g>

  <!-- Flying Knife throwing upward from bottom (200, 310) -->
  <g transform="translate(200, 270)" filter="url(#brutalShadowLg)">
    <polygon points="-6,45 6,45 5,0 0,-20 -5,0" fill="#38bdf8" stroke="#000000" stroke-width="3" />
    <polygon points="-3,35 3,35 2,5 0,-10 -2,5" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Spark Embers -->
  <g fill="#facc15">
    <circle cx="200" cy="80" r="4" />
    <circle cx="160" cy="110" r="3" />
    <circle cx="240" cy="110" r="3.5" />
  </g>

  <!-- Title Banner -->
  <g transform="translate(200, 350)" filter="url(#brutalShadowLg)">
    <rect x="-140" y="-18" width="280" height="36" rx="12" fill="#facc15" stroke="#000000" stroke-width="3.5" />
    <text x="0" y="6" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="14" fill="#000000" text-anchor="middle" letter-spacing="1">
      CYBER KNIFE THROWER
    </text>
  </g>
</svg>
