<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <!-- Background -->
  <rect width="300" height="200" fill="#4ec0ca" />
  <circle cx="50" cy="50" r="20" fill="#ffffff" opacity="0.3" />
  <circle cx="240" cy="150" r="30" fill="#ffffff" opacity="0.3" />

  <!-- Playing Card Graphic -->
  <g transform="translate(100, 30) rotate(-8)">
    <rect width="100" height="140" rx="16" fill="#e53935" stroke="#000" stroke-width="4" />
    <rect x="8" y="8" width="84" height="124" rx="12" fill="none" stroke="#fff" stroke-width="2" />
    <ellipse cx="50" cy="70" rx="36" ry="48" fill="#fff" stroke="#000" stroke-width="3" />
    <text x="50" y="82" font-family="sans-serif" font-weight="900" font-size="44" fill="#1e88e5" text-anchor="middle" transform="rotate(12 50 70)">UNO</text>
  </g>

  <!-- Large UNO Text Overlay -->
  <text x="150" y="115" font-family="monospace" font-weight="900" font-size="48" fill="#fdd835" stroke="#000" stroke-width="6" text-anchor="middle" filter="drop-shadow(3px 3px 0px #000)">UNO</text>

  <!-- EARLY ACCESS Badge -->
  <g transform="translate(170, 155)">
    <rect width="120" height="30" rx="8" fill="#f59e0b" stroke="#000" stroke-width="3" />
    <text x="60" y="20" font-family="monospace" font-weight="900" font-size="11" fill="#000" text-anchor="middle">EARLY ACCESS</text>
  </g>
</svg>
