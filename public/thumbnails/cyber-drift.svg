<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="neoShadowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000000" />
    </filter>
    <filter id="neoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" />
    </filter>
    <filter id="neoShadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Neo Ground -->
  <rect width="400" height="400" fill="#FAF8F5" />

  <!-- Subtle Dot Matrix Grid -->
  <g fill="#000000" opacity="0.08">
    <circle cx="40" cy="40" r="2" /><circle cx="100" cy="40" r="2" /><circle cx="160" cy="40" r="2" /><circle cx="220" cy="40" r="2" /><circle cx="280" cy="40" r="2" /><circle cx="340" cy="40" r="2" />
    <circle cx="40" cy="100" r="2" /><circle cx="100" cy="100" r="2" /><circle cx="160" cy="100" r="2" /><circle cx="220" cy="100" r="2" /><circle cx="280" cy="100" r="2" /><circle cx="340" cy="100" r="2" />
    <circle cx="40" cy="160" r="2" /><circle cx="100" cy="160" r="2" /><circle cx="160" cy="160" r="2" /><circle cx="220" cy="160" r="2" /><circle cx="280" cy="160" r="2" /><circle cx="340" cy="160" r="2" />
    <circle cx="40" cy="220" r="2" /><circle cx="100" cy="220" r="2" /><circle cx="160" cy="220" r="2" /><circle cx="220" cy="220" r="2" /><circle cx="280" cy="220" r="2" /><circle cx="340" cy="220" r="2" />
    <circle cx="40" cy="280" r="2" /><circle cx="100" cy="280" r="2" /><circle cx="160" cy="280" r="2" /><circle cx="220" cy="280" r="2" /><circle cx="280" cy="280" r="2" /><circle cx="340" cy="280" r="2" />
    <circle cx="40" cy="340" r="2" /><circle cx="100" cy="340" r="2" /><circle cx="160" cy="340" r="2" /><circle cx="220" cy="340" r="2" /><circle cx="280" cy="340" r="2" /><circle cx="340" cy="340" r="2" />
  </g>

  <!-- Outer Structural Border -->
  <rect x="12" y="12" width="376" height="376" rx="20" fill="none" stroke="#000000" stroke-width="4" />

  <!-- Main Showcase Container -->
  <rect x="36" y="36" width="328" height="328" rx="16" fill="#C0F7FE" stroke="#000000" stroke-width="3.5" filter="url(#neoShadowLg)" />

  <!-- Asphalt Road Strip (Curved Neo Asphalt Track) -->
  <path d="M40 310 C120 310 160 270 170 190 C180 110 240 70 360 70" fill="none" stroke="#FFFFFF" stroke-width="120" stroke-linecap="round" />
  <path d="M40 310 C120 310 160 270 170 190 C180 110 240 70 360 70" fill="none" stroke="#000000" stroke-width="126" stroke-linecap="round" />
  <path d="M40 310 C120 310 160 270 170 190 C180 110 240 70 360 70" fill="none" stroke="#FFFFFF" stroke-width="118" stroke-linecap="round" />

  <!-- Road Center Dashes -->
  <path d="M40 310 C120 310 160 270 170 190 C180 110 240 70 360 70" fill="none" stroke="#F7CB46" stroke-width="6" stroke-dasharray="14 12" />

  <!-- Drift Skid Marks (Dual Neo-Brutalist Black Tracks) -->
  <path d="M100 290 C150 280 180 230 195 180" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  <path d="M115 305 C165 295 195 245 210 195" fill="none" stroke="#FE90E8" stroke-width="5" stroke-linecap="round" />

  <!-- Smoke Particle Puffs -->
  <circle cx="120" cy="310" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" filter="url(#neoShadowSm)" />
  <circle cx="140" cy="300" r="10" fill="#FFDC8B" stroke="#000000" stroke-width="2" />
  <circle cx="102" cy="295" r="8" fill="#FE90E8" stroke="#000000" stroke-width="2" />

  <!-- Apex Curbs (Candy Cane Neo Red & Yellow) -->
  <g transform="translate(190, 110) rotate(45)" filter="url(#neoShadowSm)">
    <rect x="-30" y="-8" width="60" height="16" rx="4" fill="#FE90E8" stroke="#000000" stroke-width="2.5" />
    <line x1="-10" y1="-8" x2="-10" y2="8" stroke="#000000" stroke-width="2.5" />
    <line x1="10" y1="-8" x2="10" y2="8" stroke="#000000" stroke-width="2.5" />
  </g>

  <!-- Neo-Brutalist Drift Sports Car (Rotated Drift Angle) -->
  <g transform="translate(210, 175) rotate(-35)" filter="url(#neoShadow)">
    <!-- Car Wheels -->
    <rect x="-38" y="-28" width="16" height="10" rx="3" fill="#000000" />
    <rect x="22" y="-28" width="16" height="10" rx="3" fill="#000000" />
    <rect x="-38" y="18" width="16" height="10" rx="3" fill="#000000" />
    <rect x="22" y="18" width="16" height="10" rx="3" fill="#000000" />

    <!-- Car Main Chassis -->
    <rect x="-44" y="-22" width="88" height="44" rx="12" fill="#FE90E8" stroke="#000000" stroke-width="3.5" />

    <!-- Racing Stripes -->
    <rect x="-44" y="-7" width="88" height="14" fill="#F7CB46" stroke="#000000" stroke-width="2" />

    <!-- Windshield -->
    <rect x="-14" y="-15" width="28" height="30" rx="6" fill="#C0F7FE" stroke="#000000" stroke-width="2.5" />
    <path d="M-6 -10 L6 -10 L10 10 L-2 10 Z" fill="#FFFFFF" opacity="0.6" />

    <!-- Headlights -->
    <circle cx="40" cy="-14" r="5" fill="#F7CB46" stroke="#000000" stroke-width="2" />
    <circle cx="40" cy="14" r="5" fill="#F7CB46" stroke="#000000" stroke-width="2" />

    <!-- Rear Wing -->
    <rect x="-48" y="-24" width="8" height="48" rx="3" fill="#99E885" stroke="#000000" stroke-width="2.5" />
  </g>

  <!-- Apex Multiplier Floating Badge -->
  <g transform="translate(290, 275) rotate(6)" filter="url(#neoShadowSm)">
    <rect x="-56" y="-18" width="112" height="36" rx="8" fill="#F7CB46" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="6" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="14" fill="#000000" text-anchor="middle">🔥 10X DRIFT</text>
  </g>

  <!-- Speed Needle Gauge Tag -->
  <g transform="translate(100, 75) rotate(-6)" filter="url(#neoShadowSm)">
    <rect x="-50" y="-16" width="100" height="32" rx="8" fill="#99E885" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="5" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">⚡ 180 KM/H</text>
  </g>

  <!-- Corner Figma Transform Nodes -->
  <rect x="6" y="6" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="382" y="6" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="6" y="382" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="382" y="382" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
</svg>
