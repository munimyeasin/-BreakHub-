<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="neoShadowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000000" />
    </filter>
    <filter id="neoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" />
    </filter>
    <filter id="neoShadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Neo Ground -->
  <rect width="400" height="400" fill="#FAF8F5" />

  <!-- Dot Matrix Background -->
  <g fill="#000000" opacity="0.08">
    <circle cx="40" cy="40" r="2" /><circle cx="100" cy="40" r="2" /><circle cx="160" cy="40" r="2" /><circle cx="220" cy="40" r="2" /><circle cx="280" cy="40" r="2" /><circle cx="340" cy="40" r="2" />
    <circle cx="40" cy="100" r="2" /><circle cx="100" cy="100" r="2" /><circle cx="160" cy="100" r="2" /><circle cx="220" cy="100" r="2" /><circle cx="280" cy="100" r="2" /><circle cx="340" cy="100" r="2" />
    <circle cx="40" cy="160" r="2" /><circle cx="100" cy="160" r="2" /><circle cx="160" cy="160" r="2" /><circle cx="220" cy="160" r="2" /><circle cx="280" cy="160" r="2" /><circle cx="340" cy="160" r="2" />
    <circle cx="40" cy="220" r="2" /><circle cx="100" cy="220" r="2" /><circle cx="160" cy="220" r="2" /><circle cx="220" cy="220" r="2" /><circle cx="280" cy="220" r="2" /><circle cx="340" cy="220" r="2" />
    <circle cx="40" cy="280" r="2" /><circle cx="100" cy="280" r="2" /><circle cx="160" cy="280" r="2" /><circle cx="220" cy="280" r="2" /><circle cx="280" cy="280" r="2" /><circle cx="340" cy="280" r="2" />
    <circle cx="40" cy="340" r="2" /><circle cx="100" cy="340" r="2" /><circle cx="160" cy="340" r="2" /><circle cx="220" cy="340" r="2" /><circle cx="280" cy="340" r="2" /><circle cx="340" cy="340" r="2" />
  </g>

  <!-- Outer Border -->
  <rect x="12" y="12" width="376" height="376" rx="20" fill="none" stroke="#000000" stroke-width="4" />

  <!-- Main Container -->
  <rect x="36" y="36" width="328" height="328" rx="16" fill="#C0F7FE" stroke="#000000" stroke-width="3.5" filter="url(#neoShadowLg)" />

  <!-- Starfield Crosses -->
  <g stroke="#000000" stroke-width="2" stroke-linecap="round">
    <line x1="80" y1="75" x2="80" y2="85" /><line x1="75" y1="80" x2="85" y2="80" />
    <line x1="310" y1="85" x2="310" y2="95" /><line x1="305" y1="90" x2="315" y2="90" />
    <line x1="90" y1="280" x2="90" y2="290" /><line x1="85" y1="285" x2="95" y2="285" />
    <line x1="320" y1="260" x2="320" y2="270" /><line x1="315" y1="265" x2="325" y2="265" />
  </g>

  <!-- Enemy Alien Drone Craft -->
  <g transform="translate(130, 100)" filter="url(#neoShadowSm)">
    <polygon points="0,-16 24,12 -24,12" fill="#FE90E8" stroke="#000000" stroke-width="2.5" />
    <circle cx="0" cy="4" r="5" fill="#000000" />
  </g>
  <g transform="translate(270, 110)" filter="url(#neoShadowSm)">
    <polygon points="0,-16 24,12 -24,12" fill="#99E885" stroke="#000000" stroke-width="2.5" />
    <circle cx="0" cy="4" r="5" fill="#000000" />
  </g>

  <!-- Laser Plasma Beams (Thick Neo Yellow & Pink Bars) -->
  <g stroke="#000000" stroke-width="3">
    <rect x="182" y="100" width="8" height="40" rx="3" fill="#F7CB46" filter="url(#neoShadowSm)" />
    <rect x="210" y="100" width="8" height="40" rx="3" fill="#F7CB46" filter="url(#neoShadowSm)" />
    <rect x="140" y="130" width="6" height="30" rx="2" fill="#FE90E8" />
    <rect x="254" y="130" width="6" height="30" rx="2" fill="#FE90E8" />
  </g>

  <!-- Player Neo Starfighter Spaceship (Isometric Upwards Heading) -->
  <g transform="translate(200, 245)" filter="url(#neoShadow)">
    <!-- Thruster Flame -->
    <polygon points="0,52 -12,28 12,28" fill="#F7CB46" stroke="#000000" stroke-width="2.5" />
    <polygon points="0,42 -6,28 6,28" fill="#FE90E8" stroke="#000000" stroke-width="2" />

    <!-- Main Fuselage Wings -->
    <polygon points="0,-50 48,24 24,30 0,16 -24,30 -48,24" fill="#FFFFFF" stroke="#000000" stroke-width="3.5" />

    <!-- Wing Cannons -->
    <rect x="-44" y="-10" width="8" height="36" rx="3" fill="#FE90E8" stroke="#000000" stroke-width="2.5" />
    <rect x="36" y="-10" width="8" height="36" rx="3" fill="#FE90E8" stroke="#000000" stroke-width="2.5" />

    <!-- Center Armor Spine -->
    <polygon points="0,-40 12,10 0,6 -12,10" fill="#99E885" stroke="#000000" stroke-width="2.5" />

    <!-- Cockpit Glass -->
    <ellipse cx="0" cy="-12" rx="7" ry="14" fill="#C0F7FE" stroke="#000000" stroke-width="2.5" />
    <line x1="-3" y1="-18" x2="3" y2="-6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Floating Stats Ribbon -->
  <g transform="translate(200, 335) rotate(-1)" filter="url(#neoShadowSm)">
    <rect x="-80" y="-14" width="160" height="28" rx="8" fill="#F7CB46" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="5" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">🚀 60 FPS • 3X SPREAD</text>
  </g>

  <!-- Corner Figma Transform Nodes -->
  <rect x="6" y="6" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="382" y="6" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="6" y="382" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="382" y="382" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
</svg>
