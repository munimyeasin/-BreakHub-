<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="starfighterBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030014" />
      <stop offset="50%" stop-color="#0a0526" />
      <stop offset="100%" stop-color="#021b2b" />
    </linearGradient>
    <linearGradient id="starfighterBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- 3D Starfighter Hull Palettes -->
    <!-- Cyan Jet Armor Face & Sides -->
    <linearGradient id="fighterCyanFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="fighterCyanSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>

    <!-- Jet Wing Trim & Spoilers (Neon Yellow) -->
    <linearGradient id="fighterYellowFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF570" />
      <stop offset="100%" stop-color="#FFDE59" />
    </linearGradient>
    <linearGradient id="fighterYellowSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49B00" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Cockpit Canopy (Glowing Neon Magenta) -->
    <linearGradient id="canopyFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF70D9" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <linearGradient id="canopySide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BE185D" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>

    <!-- Plasma Laser Blast -->
    <linearGradient id="laserCyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="40%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Thruster Fire Gradient -->
    <linearGradient id="thrusterFire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#00F0FF" />
      <stop offset="70%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#FFDE59" stop-opacity="0" />
    </linearGradient>

    <!-- Enemy Drone Palette -->
    <linearGradient id="enemyDroneFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="100%" stop-color="#C9184A" />
    </linearGradient>
    <linearGradient id="enemyDroneSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800F2F" />
      <stop offset="100%" stop-color="#590D22" />
    </linearGradient>

    <!-- Badge Gold Gradient -->
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="100%" stop-color="#FFE600" />
    </linearGradient>

    <!-- Neo-Brutalist Hard Drop Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowLg" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="plasmaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#starfighterBgDark); }
    .theme-grid-line { stroke: #FFFFFF; stroke-opacity: 0.12; }
    .theme-frame-bg { fill: #08051E; stroke: #00F0FF; }
    .theme-stage-grid { stroke: #1E1548; }
    .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
    .theme-badge-text { fill: #000000; }
    .theme-tag-rect { fill: #FFDE59; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#starfighterBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.08; }
      .theme-frame-bg { fill: #FFFFFF; stroke: #000000; }
      .theme-stage-grid { stroke: #E2E8F0; }
      .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
      .theme-badge-text { fill: #000000; }
      .theme-tag-rect { fill: #FFDE59; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Retro Cyber Grid Backdrop -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- Neo Sparks & Warp Dust -->
  <g fill="#FFDE59">
    <polygon points="40,46 42,54 50,56 42,58 40,66 38,58 30,56 38,54" />
    <polygon points="360,40 362,48 370,50 362,52 360,60 358,52 350,50 358,48" />
    <polygon points="365,300 367,306 373,308 367,310 365,316 363,310 357,308 363,306" />
    <polygon points="34,310 36,316 42,318 36,320 34,326 32,320 26,318 32,316" />
  </g>

  <!-- 3D MAIN ARCADE CONTAINER -->
  <g filter="url(#brutalShadowLg)">
    <rect x="36" y="38" width="328" height="298" rx="22" class="theme-frame-bg" stroke-width="4" />
  </g>

  <!-- Inner Playfield Space Stage -->
  <rect x="48" y="48" width="304" height="278" rx="16" fill="#03010E" stroke="#000000" stroke-width="2.5" />

  <!-- Perspective Space Grid & Warp Lines -->
  <g class="theme-stage-grid" stroke-width="1.5" stroke-dasharray="4,3">
    <!-- Starfield Grid -->
    <line x1="48" y1="90" x2="352" y2="90" />
    <line x1="48" y1="140" x2="352" y2="140" />
    <line x1="48" y1="190" x2="352" y2="190" />
    <line x1="48" y1="240" x2="352" y2="240" />
    <line x1="48" y1="290" x2="352" y2="290" />
    <!-- Warp Perspective Rays -->
    <line x1="200" y1="48" x2="60" y2="326" />
    <line x1="200" y1="48" x2="110" y2="326" />
    <line x1="200" y1="48" x2="160" y2="326" />
    <line x1="200" y1="48" x2="240" y2="326" />
    <line x1="200" y1="48" x2="290" y2="326" />
    <line x1="200" y1="48" x2="340" y2="326" />
  </g>

  <!-- WARP PARTICLES & SPACE ASTEROIDS -->
  <g fill="#00F0FF" opacity="0.6">
    <circle cx="90" cy="110" r="1.5" />
    <circle cx="310" cy="120" r="2" />
    <circle cx="140" cy="80" r="1.5" />
    <circle cx="280" cy="95" r="1.5" />
  </g>

  <!-- ENEMY DRONE SWARM 1 (Top-Left: Diving Aggressor) -->
  <g transform="translate(100, 75) rotate(-15)" filter="url(#brutalShadowSm)">
    <g stroke="#000000" stroke-width="2">
      <!-- 3D Extruded Drone Hull -->
      <polygon points="0,15 15,35 15,42 0,22" fill="url(#enemyDroneSide)" />
      <polygon points="30,15 15,35 15,42 30,22" fill="url(#enemyDroneSide)" />
      <!-- Drone Core Face -->
      <polygon points="15,0 30,22 15,35 0,22" fill="url(#enemyDroneFace)" />
      <!-- Drone Eye Core -->
      <polygon points="15,8 22,20 15,26 8,20" fill="#FFE600" />
    </g>
    <!-- Explosion Spark Shockwave -->
    <circle cx="15" cy="18" r="4" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- ENEMY DRONE SWARM 2 (Top-Right: Exploding Drone with Sparks) -->
  <g transform="translate(265, 80) rotate(20)" filter="url(#brutalShadowSm)">
    <g stroke="#000000" stroke-width="2">
      <polygon points="15,0 30,22 15,35 0,22" fill="url(#enemyDroneFace)" />
      <polygon points="30,15 15,35 15,42 30,22" fill="url(#enemyDroneSide)" />
      <polygon points="15,8 22,20 15,26 8,20" fill="#FFE600" />
    </g>
    <!-- Plasma Explosion Ring -->
    <circle cx="15" cy="18" r="14" fill="none" stroke="#FF007F" stroke-width="2.5" stroke-dasharray="3,3" opacity="0.85" />
  </g>

  <!-- PLASMA DUAL LASER CANNON BEAMS (Firing Upwards) -->
  <g filter="url(#plasmaGlow)">
    <!-- Left Laser Cannon Beam -->
    <polygon points="135,185 139,185 141,60 133,60" fill="url(#laserCyan)" />
    <line x1="137" y1="185" x2="137" y2="60" stroke="#FFFFFF" stroke-width="2" />
    <!-- Right Laser Cannon Beam -->
    <polygon points="261,185 265,185 267,60 259,60" fill="url(#laserCyan)" />
    <line x1="263" y1="185" x2="263" y2="60" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- 3D HERO NEON STARFIGHTER INTERCEPTOR -->
  <g transform="translate(200, 210)" filter="url(#brutalShadowLg)">
    <!-- Thruster Exhaust Jet Flames -->
    <g transform="translate(0, 48)">
      <polygon points="-12,0 0,45 12,0" fill="url(#thrusterFire)" />
      <polygon points="-6,0 0,30 6,0" fill="#FFFFFF" />
      <polygon points="-38,0 -34,22 -30,0" fill="url(#thrusterFire)" />
      <polygon points="30,0 34,22 38,0" fill="url(#thrusterFire)" />
    </g>

    <!-- 3D Extrusion Side Hull Polygons (Dark Drop Sides) -->
    <g stroke="#000000" stroke-width="3">
      <!-- Bottom Fuselage Extrusion -->
      <polygon points="-65,15 -72,25 -20,52 -20,44" fill="url(#fighterCyanSide)" />
      <polygon points="65,15 72,25 20,52 20,44" fill="url(#fighterCyanSide)" />
      <!-- Center Engine Under-Belly Depth -->
      <polygon points="-20,44 -20,54 20,54 20,44" fill="url(#fighterCyanSide)" />
    </g>

    <!-- Main 3D Starfighter Wings & Fuselage Body -->
    <g stroke="#000000" stroke-width="3">
      <!-- Left Swept Wing -->
      <polygon points="0,-45 -65,15 -62,38 -20,44 0,10" fill="url(#fighterCyanFace)" />
      <!-- Right Swept Wing -->
      <polygon points="0,-45 65,15 62,38 20,44 0,10" fill="url(#fighterCyanFace)" />
      <!-- Neon Yellow Wingtips & Laser Rails -->
      <polygon points="-65,15 -74,20 -62,38" fill="url(#fighterYellowFace)" />
      <polygon points="65,15 74,20 62,38" fill="url(#fighterYellowFace)" />
      <!-- Forward Nose Cone / Fuselage Spine -->
      <polygon points="0,-65 -16,-10 0,25 16,-10" fill="url(#fighterCyanFace)" />
      <!-- Wing Spoiler Ridges -->
      <polygon points="-22,-5 -45,18 -38,24 -18,6" fill="url(#fighterYellowFace)" />
      <polygon points="22,-5 45,18 38,24 18,6" fill="url(#fighterYellowFace)" />
    </g>

    <!-- 3D Glowing Cockpit Canopy -->
    <g stroke="#000000" stroke-width="2.5">
      <polygon points="0,-38 -10,-8 0,8 10,-8" fill="url(#canopyFace)" />
      <polygon points="0,-38 0,8 10,-8" fill="url(#canopySide)" />
    </g>

    <!-- High-Gloss Specular Highlight Reflections -->
    <!-- Cockpit Glint -->
    <polygon points="-2,-34 -7,-12 -2,-12" fill="#FFFFFF" opacity="0.8" />
    <!-- Wing Lead Edge Highlights -->
    <polygon points="0,-62 -14,-10 0,-15" fill="#FFFFFF" opacity="0.75" />
    <polygon points="0,-45 -60,14 -45,10 0,-30" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- ACTION POPUP COMBO BADGE: "HYPER DRIVE!" -->
  <g transform="translate(195, 140)" filter="url(#brutalShadow)">
    <polygon points="0,-22 8,-8 24,-14 16,-1 30,10 14,14 18,28 4,20 -4,28 -2,14 -18,18 -12,4 -28,-2 -14,-10 -20,-24 -6,-16" fill="url(#badgeGold)" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="9" fill="#000000" text-anchor="middle" letter-spacing="0.5">
      HYPER DRIVE!
    </text>
  </g>

  <!-- TOP TAG RIBBON: "PLASMA COMBAT // 60 FPS" -->
  <g transform="translate(200, 32)" filter="url(#brutalShadowSm)">
    <rect x="-85" y="-12" width="170" height="24" rx="8" class="theme-tag-rect" stroke-width="2.5" />
    <text x="0" y="4.5" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="10.5" text-anchor="middle" letter-spacing="1.2">
      SPACE COMBAT // ARCADE
    </text>
  </g>

  <!-- BOTTOM TITLE MARQUEE: "NEON STARFIGHTER" -->
  <g transform="translate(200, 360)" filter="url(#brutalShadowLg)">
    <rect x="-120" y="-18" width="240" height="36" rx="12" class="theme-badge-rect" stroke-width="3.5" />
    <rect x="-115" y="-14" width="230" height="28" rx="8" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.3" />
    <text x="0" y="6" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="16" text-anchor="middle" letter-spacing="1.5">
      NEON STARFIGHTER
    </text>
  </g>

  <!-- Bottom Left/Right Rivet Accents -->
  <circle cx="89" cy="360" r="3" fill="#000000" />
  <circle cx="311" cy="360" r="3" fill="#000000" />
</svg>
