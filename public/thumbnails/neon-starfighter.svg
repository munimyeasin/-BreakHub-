<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="spaceBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050114" />
      <stop offset="50%" stop-color="#0E0826" />
      <stop offset="100%" stop-color="#180033" />
    </linearGradient>
    <linearGradient id="spaceBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#FFECC8" />
    </linearGradient>

    <!-- Spaceship & Laser Gradients -->
    <linearGradient id="shipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="60%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#7700FF" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#00FFCC" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="100%" stop-color="#FFE600" />
    </linearGradient>

    <!-- Neo-Brutalist Hard Drop Shadow Filters -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#spaceBgDark); }
    .theme-grid-line { stroke: #FFFFFF; stroke-opacity: 0.15; }
    .theme-star { fill: #FFFFFF; opacity: 0.8; }
    .theme-star-accent { fill: #FFE600; opacity: 0.9; }
    .theme-star-cyan { fill: #00F0FF; opacity: 0.9; }
    .theme-card-bg { fill: #130F26; stroke: #FFE600; }
    .theme-asteroid { fill: #2B1D45; stroke: #000000; }
    .theme-asteroid-sm { fill: #441E38; stroke: #000000; }
    .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
    .theme-badge-text { fill: #000000; }
    .theme-tag-rect { fill: #FFE600; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#spaceBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.12; }
      .theme-star { fill: #7C3AED; opacity: 0.7; }
      .theme-star-accent { fill: #D97706; opacity: 0.9; }
      .theme-star-cyan { fill: #0284C7; opacity: 0.9; }
      .theme-card-bg { fill: #FFFFFF; stroke: #000000; }
      .theme-asteroid { fill: #E9D5FF; stroke: #000000; }
      .theme-asteroid-sm { fill: #FCE7F3; stroke: #000000; }
      .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
      .theme-badge-text { fill: #000000; }
      .theme-tag-rect { fill: #FFE600; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Subtle Space Grid Lines -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- Twinkle Cyber Stars -->
  <circle cx="80" cy="70" r="3.5" class="theme-star" />
  <circle cx="340" cy="80" r="4.5" class="theme-star-accent" />
  <circle cx="45" cy="200" r="3" class="theme-star-cyan" />
  <circle cx="360" cy="270" r="3.5" class="theme-star-accent" />
  <circle cx="70" cy="320" r="2.5" class="theme-star" />

  <!-- Cute Asteroids with Neo-Brutalist Shadows -->
  <g transform="translate(65, 110)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="30" class="theme-asteroid" stroke-width="3" />
    <circle cx="-10" cy="-10" r="7" fill="#000000" opacity="0.3" />
    <circle cx="12" cy="5" r="9" fill="#000000" opacity="0.3" />
    <circle cx="-5" cy="14" r="5" fill="#000000" opacity="0.3" />
    <!-- Cartoon surprised face on asteroid -->
    <circle cx="-6" cy="-2" r="3" fill="#FFFFFF" />
    <circle cx="6" cy="-2" r="3" fill="#FFFFFF" />
    <circle cx="-5" cy="-2" r="1.5" fill="#000000" />
    <circle cx="7" cy="-2" r="1.5" fill="#000000" />
    <ellipse cx="0" cy="7" rx="3.5" ry="5" fill="#FF0055" />
  </g>

  <g transform="translate(325, 140)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="22" class="theme-asteroid-sm" stroke-width="3" />
    <circle cx="-6" cy="-6" r="5" fill="#000000" opacity="0.3" />
    <circle cx="7" cy="4" r="4" fill="#000000" opacity="0.3" />
  </g>

  <!-- Plasma Lasers Fired Upwards with Hard Shadows -->
  <g filter="url(#brutalShadowSm)">
    <rect x="156" y="45" width="10" height="70" rx="5" fill="#000000" />
    <rect x="154" y="43" width="10" height="70" rx="5" fill="url(#laserGrad)" stroke="#000000" stroke-width="2" />
    <rect x="236" y="45" width="10" height="70" rx="5" fill="#000000" />
    <rect x="234" y="43" width="10" height="70" rx="5" fill="url(#laserGrad)" stroke="#000000" stroke-width="2" />
    <rect x="196" y="25" width="10" height="75" rx="5" fill="#000000" />
    <rect x="194" y="23" width="10" height="75" rx="5" fill="url(#laserGrad)" stroke="#000000" stroke-width="2" />
  </g>

  <!-- Main Starfighter Ship with Neo-Brutalist Thick Borders and Hard Shadow -->
  <g transform="translate(200, 240)" filter="url(#brutalShadow)">
    <!-- Engine Plasma Exhaust Flames -->
    <path d="M -22,65 Q -22,105 0,115 Q 22,105 22,65 Z" fill="#00F0FF" stroke="#000000" stroke-width="3" />
    <path d="M -12,65 Q -12,95 0,105 Q 12,95 12,65 Z" fill="#FFE600" />

    <!-- Left Wing -->
    <path d="M -15,10 L -75,50 L -75,65 L -15,50 Z" fill="#0088FF" stroke="#000000" stroke-width="3.5" />
    <rect x="-76" y="32" width="10" height="28" rx="4" fill="#FF007F" stroke="#000000" stroke-width="2" />

    <!-- Right Wing -->
    <path d="M 15,10 L 75,50 L 75,65 L 15,50 Z" fill="#0088FF" stroke="#000000" stroke-width="3.5" />
    <rect x="66" y="32" width="10" height="28" rx="4" fill="#FF007F" stroke="#000000" stroke-width="2" />

    <!-- Fuselage Body (Chunky spaceship) -->
    <path d="M 0,-70 L 35,25 L 25,65 L -25,65 L -35,25 Z" fill="url(#shipGrad)" stroke="#000000" stroke-width="4" />

    <!-- Cockpit Dome -->
    <ellipse cx="0" cy="-5" rx="20" ry="28" fill="#130F26" stroke="#00F0FF" stroke-width="3" />

    <!-- Pilot Visor / Robot Eyes -->
    <ellipse cx="0" cy="-6" rx="14" ry="11" fill="#FFE600" stroke="#000000" stroke-width="2" />
    <circle cx="-5" cy="-7" r="3.5" fill="#000000" />
    <circle cx="5" cy="-7" r="3.5" fill="#000000" />
    <circle cx="-4" cy="-8" r="1.2" fill="#FFFFFF" />
    <circle cx="6" cy="-8" r="1.2" fill="#FFFFFF" />
    <!-- Pilot Smile -->
    <path d="M -5,0 Q 0,4 5,0" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Cockpit Glass Reflection -->
    <path d="M -10,-22 Q 0,-27 10,-22" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Powerup Orb (Spread Shot 3X) -->
  <g transform="translate(195, 30)" filter="url(#brutalShadowSm)">
    <circle cx="5" cy="5" r="17" fill="url(#goldGrad)" stroke="#000000" stroke-width="3" />
    <text x="5" y="10" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" fill="#000000" font-weight="900" text-anchor="middle">3X</text>
  </g>

  <!-- Top Ribbon Badge: "SPACE COMBAT" -->
  <g transform="translate(200, 40)" filter="url(#brutalShadowSm)">
    <rect x="-65" y="-12" width="130" height="24" rx="8" class="theme-tag-rect" stroke-width="2.5" />
    <text x="0" y="4" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">SPACE COMBAT</text>
  </g>

  <!-- Bottom Title Badge: "NEON STARFIGHTER" -->
  <g transform="translate(200, 362)" filter="url(#brutalShadowSm)">
    <rect x="-95" y="-15" width="190" height="30" rx="10" class="theme-badge-rect" stroke-width="3" />
    <text x="0" y="5" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1.2">NEON STARFIGHTER</text>
  </g>
</svg>