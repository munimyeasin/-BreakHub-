<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050114" />
      <stop offset="60%" stop-color="#0d0933" />
      <stop offset="100%" stop-color="#1b0042" />
    </linearGradient>
    <linearGradient id="shipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="60%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#7700ff" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00ffcc" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    <filter id="shipGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f0ff" flood-opacity="0.85" />
    </filter>
    <filter id="laserGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#00ffcc" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Deep Space Background -->
  <rect width="400" height="400" fill="url(#spaceBg)" />

  <!-- Cartoon Twinkle Stars & Nebula -->
  <circle cx="80" cy="60" r="3" fill="#ffffff" />
  <circle cx="340" cy="80" r="4" fill="#ffe600" />
  <circle cx="45" cy="200" r="2.5" fill="#00ffff" />
  <circle cx="360" cy="280" r="3" fill="#ff00ea" />
  <circle cx="70" cy="330" r="2" fill="#ffffff" />

  <!-- Cartoon Asteroid with cute craters -->
  <g transform="translate(60, 110)">
    <circle cx="0" cy="0" r="32" fill="#3a2b4c" stroke="#8855aa" stroke-width="3" />
    <circle cx="-10" cy="-10" r="8" fill="#201530" />
    <circle cx="12" cy="5" r="10" fill="#201530" />
    <circle cx="-5" cy="15" r="6" fill="#201530" />
    <!-- Cartoon surprised face on asteroid -->
    <circle cx="-6" cy="-2" r="3" fill="#ffffff" />
    <circle cx="6" cy="-2" r="3" fill="#ffffff" />
    <circle cx="-5" cy="-2" r="1.5" fill="#000000" />
    <circle cx="7" cy="-2" r="1.5" fill="#000000" />
    <ellipse cx="0" cy="7" rx="3.5" ry="5" fill="#ff0055" />
  </g>

  <g transform="translate(320, 150)">
    <circle cx="0" cy="0" r="24" fill="#442a35" stroke="#cc4466" stroke-width="2.5" />
    <circle cx="-6" cy="-6" r="6" fill="#221118" />
    <circle cx="8" cy="4" r="5" fill="#221118" />
  </g>

  <!-- Plasma Lasers Fired Upwards -->
  <g filter="url(#laserGlow)">
    <rect x="160" y="45" width="8" height="65" rx="4" fill="url(#laserGrad)" />
    <rect x="232" y="45" width="8" height="65" rx="4" fill="url(#laserGrad)" />
    <rect x="196" y="25" width="8" height="70" rx="4" fill="url(#laserGrad)" />
  </g>

  <!-- Cute Starfighter Ship -->
  <g filter="url(#shipGlow)" transform="translate(200, 245)">
    <!-- Engine Plasma Exhaust Flames -->
    <path d="M -22,65 Q -22,105 0,115 Q 22,105 22,65 Z" fill="#00f0ff" />
    <path d="M -12,65 Q -12,95 0,105 Q 12,95 12,65 Z" fill="#ffffff" />

    <!-- Left Wing -->
    <path d="M -15,10 L -75,50 L -75,65 L -15,50 Z" fill="#0088ff" stroke="#ffffff" stroke-width="3.5" />
    <rect x="-76" y="32" width="10" height="28" rx="4" fill="#ff007f" stroke="#ffffff" stroke-width="2" />

    <!-- Right Wing -->
    <path d="M 15,10 L 75,50 L 75,65 L 15,50 Z" fill="#0088ff" stroke="#ffffff" stroke-width="3.5" />
    <rect x="66" y="32" width="10" height="28" rx="4" fill="#ff007f" stroke="#ffffff" stroke-width="2" />

    <!-- Fuselage Body (Chunky cute spaceship) -->
    <path d="M 0,-70 L 35,25 L 25,65 L -25,65 L -35,25 Z" fill="url(#shipGrad)" stroke="#ffffff" stroke-width="4.5" />

    <!-- Cute Cockpit Dome -->
    <ellipse cx="0" cy="-5" rx="20" ry="30" fill="#0d0221" stroke="#00f0ff" stroke-width="3" />

    <!-- Cute Cartoon Pilot inside Cockpit -->
    <!-- Pilot Visor / Robot Eyes -->
    <ellipse cx="0" cy="-6" rx="14" ry="12" fill="#ffe600" />
    <circle cx="-5" cy="-7" r="4" fill="#0d0221" />
    <circle cx="5" cy="-7" r="4" fill="#0d0221" />
    <circle cx="-4" cy="-8" r="1.5" fill="#ffffff" />
    <circle cx="6" cy="-8" r="1.5" fill="#ffffff" />
    <!-- Pilot Smile -->
    <path d="M -5,1 Q 0,5 5,1" stroke="#0d0221" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Cockpit Glass Shiny Reflection -->
    <path d="M -10,-24 Q 0,-30 10,-24" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Powerup Orb (Spread Shot 3X) -->
  <g transform="translate(195, 30)" filter="url(#shipGlow)">
    <circle cx="5" cy="5" r="16" fill="#ffe600" stroke="#ffffff" stroke-width="3" />
    <text x="5" y="10" font-family="'Arial Black', sans-serif" font-size="12" fill="#000000" font-weight="900" text-anchor="middle">3X</text>
  </g>

  <!-- Title Badge -->
  <rect x="25" y="340" width="150" height="32" rx="10" fill="#00f0ff" opacity="0.2" stroke="#00f0ff" stroke-width="1.5" />
  <text x="100" y="361" fill="#00f0ff" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">STARFIGHTER</text>
</svg>
