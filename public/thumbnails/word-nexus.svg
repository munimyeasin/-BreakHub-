<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="nexusBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08031A" />
      <stop offset="50%" stop-color="#140A30" />
      <stop offset="100%" stop-color="#031024" />
    </linearGradient>
    <linearGradient id="nexusBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#FFECC8" />
    </linearGradient>

    <!-- Synaptic Gradients -->
    <linearGradient id="cyanLinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>
    <linearGradient id="pinkLinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="100%" stop-color="#D9006C" />
    </linearGradient>
    <linearGradient id="goldLinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="100%" stop-color="#FFE600" />
    </linearGradient>
    <linearGradient id="limeLinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="100%" stop-color="#00CC44" />
    </linearGradient>

    <!-- Hard Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#nexusBgDark); }
    .theme-grid-line { stroke: #FFFFFF; stroke-opacity: 0.15; }
    .theme-card-body { fill: #110B29; stroke: #FFE600; }
    .theme-node-slot { fill: #08031A; stroke: #2D1A54; }
    .theme-connector { stroke: #00F0FF; }
    .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
    .theme-badge-text { fill: #000000; }
    .theme-tag-rect { fill: #FFE600; stroke: #000000; }
    .theme-tag-text { fill: #000000; }
    .theme-node-card { fill: #1A103D; stroke: #522794; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#nexusBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.12; }
      .theme-card-body { fill: #FFFFFF; stroke: #000000; }
      .theme-node-slot { fill: #FFF8E7; stroke: #CBD5E1; }
      .theme-connector { stroke: #000000; }
      .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
      .theme-badge-text { fill: #000000; }
      .theme-tag-rect { fill: #FFE600; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
      .theme-node-card { fill: #FFFFFF; stroke: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Subtle Retro Grid Pattern -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- 3D Neo-Brutalist Main Arena Platform -->
  <rect x="44" y="44" width="316" height="316" rx="28" fill="#000000" />
  <rect x="40" y="38" width="316" height="316" rx="28" class="theme-card-body" stroke-width="3.5" />

  <!-- Connecting Synaptic Pulses (Circuit Wire Path) -->
  <path d="M 100,120 L 200,120 L 200,200 L 300,200 L 300,280" fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 100,120 L 200,120 L 200,200 L 300,200 L 300,280" fill="none" class="theme-connector" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Synaptic Node 1: START ("FIRE") -->
  <g transform="translate(100, 120)" filter="url(#brutalShadowSm)">
    <rect x="-42" y="-24" width="84" height="48" rx="12" fill="#000000" />
    <rect x="-45" y="-27" width="84" height="48" rx="12" fill="url(#cyanLinkGrad)" stroke="#000000" stroke-width="2.5" />
    <text x="-3" y="-8" font-family="'Impact', 'Arial Black', sans-serif" font-size="9" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1">ORIGIN</text>
    <text x="-3" y="12" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1">FIRE</text>
  </g>

  <!-- Synaptic Node 2: BRIDGE ("TRUCK") -->
  <g transform="translate(200, 120)" filter="url(#brutalShadowSm)">
    <rect x="-38" y="-20" width="76" height="40" rx="10" fill="#000000" />
    <rect x="-40" y="-22" width="76" height="40" rx="10" fill="url(#goldLinkGrad)" stroke="#000000" stroke-width="2.5" />
    <text x="-2" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1">TRUCK</text>
  </g>

  <!-- Center Clashing Link Icon (Chain Link Core) -->
  <g transform="translate(200, 200)" filter="url(#brutalShadow)">
    <circle cx="0" cy="0" r="32" fill="#000000" />
    <circle cx="-2" cy="-2" r="32" fill="url(#limeLinkGrad)" stroke="#000000" stroke-width="3" />

    <!-- Link Icon Geometry -->
    <path d="M -12,-6 C -18,-12 -12,-18 -6,-12 L 0,-6" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 12,6 C 18,12 12,18 6,12 L 0,6" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />

    <path d="M -12,-6 C -18,-12 -12,-18 -6,-12 L 0,-6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <path d="M 12,6 C 18,12 12,18 6,12 L 0,6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Synaptic Node 3: BRIDGE ("HOSE") -->
  <g transform="translate(300, 200)" filter="url(#brutalShadowSm)">
    <rect x="-38" y="-20" width="76" height="40" rx="10" fill="#000000" />
    <rect x="-40" y="-22" width="76" height="40" rx="10" fill="url(#goldLinkGrad)" stroke="#000000" stroke-width="2.5" />
    <text x="-2" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1">HOSE</text>
  </g>

  <!-- Synaptic Node 4: TARGET ("WATER") -->
  <g transform="translate(300, 280)" filter="url(#brutalShadowSm)">
    <rect x="-42" y="-24" width="84" height="48" rx="12" fill="#000000" />
    <rect x="-45" y="-27" width="84" height="48" rx="12" fill="url(#pinkLinkGrad)" stroke="#000000" stroke-width="2.5" />
    <text x="-3" y="-8" font-family="'Impact', 'Arial Black', sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">TARGET</text>
    <text x="-3" y="12" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">WATER</text>
  </g>

  <!-- Brain Synapse Aura Indicator (Bottom Left) -->
  <g transform="translate(100, 250)" filter="url(#brutalShadowSm)">
    <rect x="-35" y="-18" width="70" height="36" rx="8" class="theme-node-card" stroke-width="2" />
    <text x="0" y="5" font-family="'Impact', 'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#00F0FF" text-anchor="middle">CHAIN 🔗</text>
  </g>

  <!-- Top Ribbon Badge: "WORD ASSOCIATION" -->
  <g transform="translate(200, 40)" filter="url(#brutalShadowSm)">
    <rect x="-70" y="-12" width="140" height="24" rx="8" class="theme-tag-rect" stroke-width="2.5" />
    <text x="0" y="4" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">FIRST TO CONNECT</text>
  </g>

  <!-- Bottom Title Badge Pill: "WORD NEXUS 2077" -->
  <g transform="translate(200, 362)" filter="url(#brutalShadowSm)">
    <rect x="-95" y="-15" width="190" height="30" rx="10" class="theme-badge-rect" stroke-width="3" />
    <text x="0" y="5" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1.5">WORD NEXUS 2077</text>
  </g>
</svg>
