<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="neoShadowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000000" />
    </filter>
    <filter id="neoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" />
    </filter>
    <filter id="neoShadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Neo Ground -->
  <rect width="400" height="400" fill="#FAF8F5" />

  <!-- Dot Matrix Grid -->
  <g fill="#000000" opacity="0.08">
    <circle cx="40" cy="40" r="2" /><circle cx="100" cy="40" r="2" /><circle cx="160" cy="40" r="2" /><circle cx="220" cy="40" r="2" /><circle cx="280" cy="40" r="2" /><circle cx="340" cy="40" r="2" />
    <circle cx="40" cy="100" r="2" /><circle cx="100" cy="100" r="2" /><circle cx="160" cy="100" r="2" /><circle cx="220" cy="100" r="2" /><circle cx="280" cy="100" r="2" /><circle cx="340" cy="100" r="2" />
    <circle cx="40" cy="160" r="2" /><circle cx="100" cy="160" r="2" /><circle cx="160" cy="160" r="2" /><circle cx="220" cy="160" r="2" /><circle cx="280" cy="160" r="2" /><circle cx="340" cy="160" r="2" />
    <circle cx="40" cy="220" r="2" /><circle cx="100" cy="220" r="2" /><circle cx="160" cy="220" r="2" /><circle cx="220" cy="220" r="2" /><circle cx="280" cy="220" r="2" /><circle cx="340" cy="220" r="2" />
    <circle cx="40" cy="280" r="2" /><circle cx="100" cy="280" r="2" /><circle cx="160" cy="280" r="2" /><circle cx="220" cy="280" r="2" /><circle cx="280" cy="280" r="2" /><circle cx="340" cy="280" r="2" />
    <circle cx="40" cy="340" r="2" /><circle cx="100" cy="340" r="2" /><circle cx="160" cy="340" r="2" /><circle cx="220" cy="340" r="2" /><circle cx="280" cy="340" r="2" /><circle cx="340" cy="340" r="2" />
  </g>

  <!-- Outer Border -->
  <rect x="12" y="12" width="376" height="376" rx="20" fill="none" stroke="#000000" stroke-width="4" />

  <!-- Main Container -->
  <rect x="36" y="36" width="328" height="328" rx="16" fill="#C0F7FE" stroke="#000000" stroke-width="3.5" filter="url(#neoShadowLg)" />

  <!-- Nested 3x3 Macro Tiles -->
  <g filter="url(#neoShadowSm)">
    <!-- Top-Left Captured X Tile -->
    <rect x="56" y="56" width="86" height="86" rx="10" fill="#FE90E8" stroke="#000000" stroke-width="3" />
    <text x="99" y="112" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="52" fill="#000000" text-anchor="middle">X</text>

    <!-- Top-Center Mini 3x3 Grid Tile -->
    <rect x="157" y="56" width="86" height="86" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
    <line x1="185" y1="62" x2="185" y2="136" stroke="#000000" stroke-width="2" />
    <line x1="215" y1="62" x2="215" y2="136" stroke="#000000" stroke-width="2" />
    <line x1="163" y1="85" x2="237" y2="85" stroke="#000000" stroke-width="2" />
    <line x1="163" y1="113" x2="237" y2="113" stroke="#000000" stroke-width="2" />

    <!-- Top-Right Captured O Tile -->
    <rect x="258" y="56" width="86" height="86" rx="10" fill="#F7CB46" stroke="#000000" stroke-width="3" />
    <text x="301" y="112" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="52" fill="#000000" text-anchor="middle">O</text>

    <!-- Mid-Left Mini Grid -->
    <rect x="56" y="157" width="86" height="86" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
    <circle cx="99" cy="200" r="16" fill="#F7CB46" stroke="#000000" stroke-width="2" />

    <!-- Mid-Center Giant Active Board Tile -->
    <rect x="157" y="157" width="86" height="86" rx="10" fill="#99E885" stroke="#000000" stroke-width="3.5" />
    <text x="200" y="213" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="52" fill="#000000" text-anchor="middle">X</text>

    <!-- Mid-Right Mini Grid -->
    <rect x="258" y="157" width="86" height="86" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
    <line x1="286" y1="163" x2="286" y2="237" stroke="#000000" stroke-width="2" />
    <line x1="316" y1="163" x2="316" y2="237" stroke="#000000" stroke-width="2" />

    <!-- Bottom-Left Mini Grid -->
    <rect x="56" y="258" width="86" height="86" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
    <text x="99" y="310" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="36" fill="#FE90E8" stroke="#000000" stroke-width="1.5" text-anchor="middle">X</text>

    <!-- Bottom-Center Mini Grid -->
    <rect x="157" y="258" width="86" height="86" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
    <circle cx="200" cy="301" r="16" fill="#F7CB46" stroke="#000000" stroke-width="2" />

    <!-- Bottom-Right Captured X Tile (Winning Diagonal) -->
    <rect x="258" y="258" width="86" height="86" rx="10" fill="#FE90E8" stroke="#000000" stroke-width="3" />
    <text x="301" y="314" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="52" fill="#000000" text-anchor="middle">X</text>
  </g>

  <!-- Macro Winning Diagonal Bar -->
  <line x1="60" y1="60" x2="340" y2="340" stroke="#000000" stroke-width="10" stroke-linecap="round" />
  <line x1="60" y1="60" x2="340" y2="340" stroke="#F7CB46" stroke-width="5" stroke-linecap="round" />

  <!-- Top Multi-Grid Tag -->
  <g transform="translate(200, 26) rotate(1)">
    <rect x="-85" y="-14" width="170" height="28" rx="8" fill="#F7CB46" stroke="#000000" stroke-width="2.5" filter="url(#neoShadowSm)" />
    <text x="0" y="5" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">✦ 9 NESTED BOARDS ✦</text>
  </g>

  <!-- Corner Figma Transform Nodes -->
  <rect x="6" y="6" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="382" y="6" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="6" y="382" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="382" y="382" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
</svg>
