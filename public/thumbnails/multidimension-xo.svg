<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="multiBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050314" />
      <stop offset="50%" stop-color="#12082b" />
      <stop offset="100%" stop-color="#021726" />
    </linearGradient>
    <linearGradient id="multiBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#FFECC8" />
    </linearGradient>

    <!-- Colors -->
    <linearGradient id="xCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>
    <linearGradient id="oPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="100%" stop-color="#D9006C" />
    </linearGradient>
    <linearGradient id="starGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="100%" stop-color="#FFE600" />
    </linearGradient>

    <!-- Hard Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#multiBgDark); }
    .theme-grid-line { stroke: #FFFFFF; stroke-opacity: 0.15; }
    .theme-macro-box { fill: #0B0819; stroke: #FFE600; }
    .theme-macro-sep { stroke: #A855F7; }
    .theme-mini-box { fill: #140B33; stroke: #5B21B6; }
    .theme-mini-conquered-x { fill: #00F0FF; fill-opacity: 0.15; stroke: #00F0FF; }
    .theme-mini-conquered-o { fill: #FF007F; fill-opacity: 0.15; stroke: #FF007F; }
    .theme-active-quad { fill: #FFE600; fill-opacity: 0.2; stroke: #FFE600; }
    .theme-subgrid { stroke: #FFFFFF; stroke-opacity: 0.25; }
    .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
    .theme-badge-text { fill: #000000; }
    .theme-tag-rect { fill: #FFE600; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#multiBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.12; }
      .theme-macro-box { fill: #FFFFFF; stroke: #000000; }
      .theme-macro-sep { stroke: #000000; }
      .theme-mini-box { fill: #FFF8E7; stroke: #CBD5E1; }
      .theme-mini-conquered-x { fill: #E0F2FE; stroke: #0284C7; }
      .theme-mini-conquered-o { fill: #FCE7F3; stroke: #DB2777; }
      .theme-active-quad { fill: #FEF08A; stroke: #EAB308; }
      .theme-subgrid { stroke: #000000; stroke-opacity: 0.2; }
      .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
      .theme-badge-text { fill: #000000; }
      .theme-tag-rect { fill: #FFE600; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Subtle Retro Grid Pattern -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- 3D Neo-Brutalist Main Outer Macro Container -->
  <rect x="42" y="36" width="320" height="320" rx="20" fill="#000000" />
  <rect x="38" y="32" width="320" height="320" rx="20" class="theme-macro-box" stroke-width="3.5" />

  <!-- Thick Macro Grid Separator Lines -->
  <g class="theme-macro-sep" stroke-width="4.5" stroke-linecap="round">
    <line x1="144" y1="38" x2="144" y2="346" />
    <line x1="252" y1="38" x2="252" y2="346" />
    <line x1="44" y1="138" x2="352" y2="138" />
    <line x1="44" y1="246" x2="352" y2="246" />
  </g>

  <!-- 9 MINI-BOARDS -->

  <!-- Top-Left Board: Conquered by Giant 'X' -->
  <g transform="translate(44, 38)">
    <rect width="94" height="94" rx="10" class="theme-mini-conquered-x" stroke-width="2" />
    <g transform="translate(47, 47)" filter="url(#brutalShadowSm)">
      <line x1="-24" y1="-24" x2="24" y2="24" stroke="#000000" stroke-width="12" stroke-linecap="round" />
      <line x1="24" y1="-24" x2="-24" y2="24" stroke="#000000" stroke-width="12" stroke-linecap="round" />
      <line x1="-24" y1="-24" x2="24" y2="24" stroke="url(#xCyanGrad)" stroke-width="8" stroke-linecap="round" />
      <line x1="24" y1="-24" x2="-24" y2="24" stroke="url(#xCyanGrad)" stroke-width="8" stroke-linecap="round" />
      <line x1="-22" y1="-22" x2="22" y2="22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      <line x1="22" y1="-22" x2="-22" y2="22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Top-Center Board: Mini Battle -->
  <g transform="translate(150, 38)">
    <rect width="96" height="94" rx="10" class="theme-mini-box" stroke-width="1.5" />
    <g class="theme-subgrid" stroke-width="1.5">
      <line x1="32" y1="10" x2="32" y2="84" />
      <line x1="64" y1="10" x2="64" y2="84" />
      <line x1="10" y1="31" x2="86" y2="31" />
      <line x1="10" y1="62" x2="86" y2="62" />
    </g>
    <g transform="translate(16, 16)"><line x1="-7" y1="-7" x2="7" y2="7" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" /><line x1="7" y1="-7" x2="-7" y2="7" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" /></g>
    <g transform="translate(48, 16)"><circle cx="0" cy="0" r="8" fill="none" stroke="#FF007F" stroke-width="3" /></g>
    <g transform="translate(80, 47)"><line x1="-7" y1="-7" x2="7" y2="7" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" /><line x1="7" y1="-7" x2="-7" y2="7" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" /></g>
    <g transform="translate(16, 78)"><circle cx="0" cy="0" r="8" fill="none" stroke="#FF007F" stroke-width="3" /></g>
  </g>

  <!-- Top-Right Board: Conquered by Giant 'O' -->
  <g transform="translate(258, 38)">
    <rect width="94" height="94" rx="10" class="theme-mini-conquered-o" stroke-width="2" />
    <g transform="translate(47, 47)" filter="url(#brutalShadowSm)">
      <circle cx="0" cy="0" r="26" fill="none" stroke="#000000" stroke-width="13" />
      <circle cx="0" cy="0" r="26" fill="none" stroke="url(#oPinkGrad)" stroke-width="9" />
      <circle cx="0" cy="0" r="26" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
    </g>
  </g>

  <!-- Middle-Left Board: Mini Grid -->
  <g transform="translate(44, 144)">
    <rect width="94" height="96" rx="10" class="theme-mini-box" stroke-width="1.5" />
    <g class="theme-subgrid" stroke-width="1.5">
      <line x1="31" y1="10" x2="31" y2="86" />
      <line x1="62" y1="10" x2="62" y2="86" />
      <line x1="10" y1="32" x2="84" y2="32" />
      <line x1="10" y1="64" x2="84" y2="64" />
    </g>
    <g transform="translate(47, 48)"><circle cx="0" cy="0" r="8" fill="none" stroke="#FF007F" stroke-width="3" /></g>
    <g transform="translate(78, 79)"><line x1="-7" y1="-7" x2="7" y2="7" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" /><line x1="7" y1="-7" x2="-7" y2="7" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" /></g>
  </g>

  <!-- Middle-Center Board: ACTIVE TARGET CLASH -->
  <g transform="translate(150, 144)">
    <rect width="96" height="96" rx="10" class="theme-active-quad" stroke-width="2.5" />
    <g class="theme-subgrid" stroke-width="1.5">
      <line x1="32" y1="10" x2="32" y2="86" />
      <line x1="64" y1="10" x2="64" y2="86" />
      <line x1="10" y1="32" x2="86" y2="32" />
      <line x1="10" y1="64" x2="86" y2="64" />
    </g>
    <!-- Center Clash Star -->
    <g transform="translate(48, 48)" filter="url(#brutalShadowSm)">
      <polygon points="0,-16 5,-4 16,-4 8,4 11,15 0,8 -11,15 -8,4 -16,-4 -5,-4" fill="url(#starGoldGrad)" stroke="#000000" stroke-width="2" />
    </g>
    <g transform="translate(16, 48)"><line x1="-7" y1="-7" x2="7" y2="7" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" /><line x1="7" y1="-7" x2="-7" y2="7" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" /></g>
    <g transform="translate(80, 48)"><circle cx="0" cy="0" r="8" fill="none" stroke="#FF007F" stroke-width="3" /></g>
  </g>

  <!-- Middle-Right Board: Mini Grid -->
  <g transform="translate(258, 144)">
    <rect width="94" height="96" rx="10" class="theme-mini-box" stroke-width="1.5" />
    <g class="theme-subgrid" stroke-width="1.5">
      <line x1="31" y1="10" x2="31" y2="86" />
      <line x1="62" y1="10" x2="62" y2="86" />
      <line x1="10" y1="32" x2="84" y2="32" />
      <line x1="10" y1="64" x2="84" y2="64" />
    </g>
    <g transform="translate(16, 16)"><circle cx="0" cy="0" r="8" fill="none" stroke="#FF007F" stroke-width="3" /></g>
    <g transform="translate(47, 79)"><line x1="-7" y1="-7" x2="7" y2="7" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" /><line x1="7" y1="-7" x2="-7" y2="7" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" /></g>
  </g>

  <!-- Bottom-Left Board: Mini Grid -->
  <g transform="translate(44, 252)">
    <rect width="94" height="94" rx="10" class="theme-mini-box" stroke-width="1.5" />
    <g class="theme-subgrid" stroke-width="1.5">
      <line x1="31" y1="10" x2="31" y2="84" />
      <line x1="62" y1="10" x2="62" y2="84" />
      <line x1="10" y1="31" x2="84" y2="31" />
      <line x1="10" y1="62" x2="84" y2="62" />
    </g>
    <g transform="translate(78, 16)"><circle cx="0" cy="0" r="8" fill="none" stroke="#FF007F" stroke-width="3" /></g>
    <g transform="translate(47, 47)"><line x1="-7" y1="-7" x2="7" y2="7" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" /><line x1="7" y1="-7" x2="-7" y2="7" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" /></g>
  </g>

  <!-- Bottom-Center Board: Mini Grid -->
  <g transform="translate(150, 252)">
    <rect width="96" height="94" rx="10" class="theme-mini-box" stroke-width="1.5" />
    <g class="theme-subgrid" stroke-width="1.5">
      <line x1="32" y1="10" x2="32" y2="84" />
      <line x1="64" y1="10" x2="64" y2="84" />
      <line x1="10" y1="31" x2="86" y2="31" />
      <line x1="10" y1="62" x2="86" y2="62" />
    </g>
    <g transform="translate(16, 78)"><line x1="-7" y1="-7" x2="7" y2="7" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" /><line x1="7" y1="-7" x2="-7" y2="7" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" /></g>
    <g transform="translate(48, 16)"><circle cx="0" cy="0" r="8" fill="none" stroke="#FF007F" stroke-width="3" /></g>
  </g>

  <!-- Bottom-Right Board: Conquered by Giant 'X' -->
  <g transform="translate(258, 252)">
    <rect width="94" height="94" rx="10" class="theme-mini-conquered-x" stroke-width="2" />
    <g transform="translate(47, 47)" filter="url(#brutalShadowSm)">
      <line x1="-24" y1="-24" x2="24" y2="24" stroke="#000000" stroke-width="12" stroke-linecap="round" />
      <line x1="24" y1="-24" x2="-24" y2="24" stroke="#000000" stroke-width="12" stroke-linecap="round" />
      <line x1="-24" y1="-24" x2="24" y2="24" stroke="url(#xCyanGrad)" stroke-width="8" stroke-linecap="round" />
      <line x1="24" y1="-24" x2="-24" y2="24" stroke="url(#xCyanGrad)" stroke-width="8" stroke-linecap="round" />
      <line x1="-22" y1="-22" x2="22" y2="22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      <line x1="22" y1="-22" x2="-22" y2="22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Top Ribbon Badge: "NESTED 9X9" -->
  <g transform="translate(200, 36)" filter="url(#brutalShadowSm)">
    <rect x="-60" y="-12" width="120" height="24" rx="8" class="theme-tag-rect" stroke-width="2.5" />
    <text x="0" y="4" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">NESTED 9X9</text>
  </g>

  <!-- Bottom Title Badge: "MULTIDIMENSION XO" -->
  <g transform="translate(200, 364)" filter="url(#brutalShadowSm)">
    <rect x="-105" y="-15" width="210" height="30" rx="10" class="theme-badge-rect" stroke-width="3" />
    <text x="0" y="5" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1.2">MULTIDIMENSION XO</text>
  </g>
</svg>