<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18000F" />
      <stop offset="50%" stop-color="#2A0518" />
      <stop offset="100%" stop-color="#070014" />
    </linearGradient>
    <radialGradient id="bgMagGlow" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="rgba(255,0,127,0.2)" />
      <stop offset="40%" stop-color="rgba(0,240,255,0.1)" />
      <stop offset="100%" stop-color="rgba(24,0,15,0)" />
    </radialGradient>
    <linearGradient id="gridLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#3D1030" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowLg" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="xoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF007F" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" fill="url(#bgDark)" />

  <!-- Radial Magenta / Cyan Glow -->
  <circle cx="200" cy="190" r="270" fill="url(#bgMagGlow)" />

  <!-- White Cyber Dashed Grid -->
  <g stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4,3">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- 3D MAIN ARCADE CONTAINER -->
  <g filter="url(#brutalShadowLg)">
    <rect x="36" y="38" width="328" height="298" rx="22" fill="#140516" stroke="#FF007F" stroke-width="4" />
  </g>

  <!-- Inner Playfield Void Stage -->
  <rect x="48" y="48" width="304" height="278" rx="16" fill="#08020B" stroke="#000000" stroke-width="2.5" />

  <!-- Perspective Arena Grid Lines (Dashed Cyber Grid) -->
  <g stroke="#3D1030" stroke-width="1.5" stroke-dasharray="4,3">
    <line x1="48" y1="88" x2="352" y2="88" />
    <line x1="48" y1="136" x2="352" y2="136" />
    <line x1="48" y1="184" x2="352" y2="184" />
    <line x1="48" y1="232" x2="352" y2="232" />
    <line x1="48" y1="280" x2="352" y2="280" />
    <line x1="96" y1="48" x2="96" y2="326" />
    <line x1="148" y1="48" x2="148" y2="326" />
    <line x1="200" y1="48" x2="200" y2="326" />
    <line x1="252" y1="48" x2="252" y2="326" />
    <line x1="304" y1="48" x2="304" y2="326" />
  </g>

  <!-- Nested 3D cyan/magenta X/O Grid Node Ring (Macro outer boundary) -->
  <g filter="url(#brutalShadowLg)">
    <!-- Outer macro sector ring: 3D extruded diamond nodes on a circle -->
    <g stroke="#3D1030" stroke-width="1.2" stroke-dasharray="3,4">
      <polygon points="70,70 100,100 130,70 100,130" fill="#0A0212" stroke="#FF007F" stroke-width="1.5" />
      <polygon points="170,70 200,100 230,70 200,130" fill="#0A0212" stroke="#FFE600" stroke-width="1.5" />
      <polygon points="270,70 300,100 330,70 300,130" fill="#0A0212" stroke="#00F0FF" stroke-width="1.5" />
    </g>

    <!-- 3D Hero Cyan X Node (Top-Left Macro Sector) -->
    <g transform="translate(100, 100)" filter="url(#brutalShadow)">
      <g stroke="#000000" stroke-width="2.5">
        <line x1="-24,-24" x2="24,24" stroke="#0080B3" stroke-width="12" stroke-linecap="round" />
        <line x1="24,-24" x2="-24,24" stroke="#0080B3" stroke-width="12" stroke-linecap="round" />
        <line x1="-20,-20" x2="20,20" stroke="#7DF9FF" stroke-width="8" stroke-linecap="round" />
        <line x1="20,-20" x2="-20,20" stroke="#7DF9FF" stroke-width="8" stroke-linecap="round" />
        <!-- Extruded side facets -->
        <polygon points="-24,-24 -12,-30 0,-22 -12,-16 -24,-8" fill="#005B80" opacity="0.8" />
        <polygon points="24,24 12,30 0,22 12,16 24,8" fill="#005B80" opacity="0.8" />
        <polygon points="24,-24 12,-30 0,-22 12,-16 24,-8" fill="#005B80" opacity="0.8" />
        <polygon points="-24,24 -12,30 0,22 -12,16 -24,8" fill="#005B80" opacity="0.8" />
      </g>
      <path d="M -16,-14 L -8,-20 L 16,8 L 8,16 Z" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- 3D Hero Magenta O Node (Top-Right Macro Sector) -->
    <g transform="translate(300, 100)" filter="url(#brutalShadow)">
      <g stroke="#000000" stroke-width="2.5">
        <ellipse cx="3" cy="5" rx="22" ry="20" fill="#BA005C" opacity="0.8" stroke="#000000" stroke-width="2.5" />
        <ellipse cx="0" cy="0" rx="22" ry="20" fill="#FF63C6" />
        <ellipse cx="0" cy="0" rx="11" ry="9" fill="#000000" opacity="0.7" />
        <ellipse cx="0" cy="0" rx="22" ry="20" fill="none" stroke="#BA005C" stroke-width="2.5" opacity="0.8" />
      </g>
      <path d="M -14,-10 A 16 14 0 0 1 14,-10 A 10 8 0 0 0 -14,-10 Z" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- Nested inner X/O node ring (center area) -->
    <g filter="url(#xoGlow)">
      <!-- Cyan X center -->
      <g transform="translate(150, 150)" filter="url(#brutalShadow)">
        <g stroke="#000000" stroke-width="2.5">
          <line x1="-18,-18" x2="18,18" stroke="#0080B3" stroke-width="10" stroke-linecap="round" />
          <line x1="18,-18" x2="-18,18" stroke="#0080B3" stroke-width="10" stroke-linecap="round" />
          <line x1="-15,-15" x2="15,15" stroke="#7DF9FF" stroke-width="7" stroke-linecap="round" />
          <line x1="15,-15" x2="-15,15" stroke="#7DF9FF" stroke-width="7" stroke-linecap="round" />
        </g>
        <path d="M -12,-11 L -6,-15 L 10,10 L 6,16 Z" fill="#FFFFFF" opacity="0.85" />
      </g>

      <!-- Magenta O inner ring -->
      <g transform="translate(250, 150)" filter="url(#brutalShadow)">
        <g stroke="#000000" stroke-width="2.5">
          <circle cx="2" cy="4" r="16" fill="none" stroke="#BA005C" stroke-width="9" />
          <circle cx="0" cy="0" r="16" fill="#FF63C6" />
          <circle cx="0" cy="0" r="8" fill="#000000" opacity="0.7" />
        </g>
        <path d="M -11,-9 A 12 10 0 0 1 11,-9 A 7 5 0 0 0 -11,-9 Z" fill="#FFFFFF" opacity="0.8" />
      </g>

      <!-- Gold center node badge -->
      <g transform="translate(200, 190)" filter="url(#brutalShadowSm)">
        <circle cx="0" cy="0" r="14" fill="url(#xoBgDark)" stroke="#000000" stroke-width="2" />
        <circle cx="0" cy="0" r="10" fill="#000000" />
        <polygon points="0,-6 5,4 -5,4" fill="#FFE600" />
      </g>
    </g>

    <!-- Orbit particles along ring -->
    <g fill="#FFE600" opacity="0.6">
      <circle cx="100" cy="100" r="1.4" />
      <circle cx="300" cy="100" r="1.4" />
      <circle cx="150" cy="150" r="1.2" />
      <circle cx="250" cy="150" r="1.2" />
      <circle cx="200" cy="190" r="1.5" />
    </g>
  </g>

  <!-- Action Popup Combo Badge: "QUANTUM WARP!" -->
  <g transform="translate(200, 110)" filter="url(#brutalShadow)">
    <polygon points="0,-22 8,-8 24,-14 16,-1 30,10 14,14 18,28 4,20 -4,28 -2,14 -18,18 -12,4 -28,-2 -14,-10 -20,-24 -6,-16" fill="#FFF066" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="8.5" fill="#000000" text-anchor="middle" letter-spacing="0.5">
      QUANTUM WARP!
    </text>
  </g>

  <!-- Top Tag Ribbon: "TACTICAL 9X9 MATRIX // NESTED" -->
  <g transform="translate(200, 32)" filter="url(#brutalShadowSm)">
    <rect x="-85" y="-12" width="170" height="24" rx="8" fill="#FF007F" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="4.5" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="10.5" text-anchor="middle" letter-spacing="1.2">
      TACTICAL 9X9 MATRIX
    </text>
  </g>

  <!-- Bottom Title Marquee: "MULTIDIMENSION XO" -->
  <g transform="translate(200, 360)" filter="url(#brutalShadowLg)">
    <rect x="-125" y="-18" width="250" height="36" rx="12" fill="#FF007F" stroke="#000000" stroke-width="3.5" />
    <rect x="-120" y="-14" width="240" height="28" rx="8" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.3" />
    <text x="0" y="6" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="15" text-anchor="middle" letter-spacing="1.5">
      MULTIDIMENSION XO
    </text>
  </g>

  <!-- Bottom Left/Right Rivet Accents -->
  <circle cx="84" cy="360" r="3" fill="#000000" />
  <circle cx="316" cy="360" r="3" fill="#000000" />
</svg>