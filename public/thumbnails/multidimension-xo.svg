<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="multiXoBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020014" />
      <stop offset="50%" stop-color="#0e0728" />
      <stop offset="100%" stop-color="#001524" />
    </linearGradient>
    <linearGradient id="multiXoBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#F5F3FF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>

    <!-- 3D Cyan "X" Node Palettes -->
    <linearGradient id="xoCyanFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DF9FF" />
      <stop offset="100%" stop-color="#00D0FF" />
    </linearGradient>
    <linearGradient id="xoCyanSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0099CC" />
      <stop offset="100%" stop-color="#005B80" />
    </linearGradient>

    <!-- 3D Pink "O" Node Palettes -->
    <linearGradient id="xoPinkFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF66CC" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <linearGradient id="xoPinkSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8005A" />
      <stop offset="100%" stop-color="#7A003C" />
    </linearGradient>

    <!-- 3D Yellow Macro Node -->
    <linearGradient id="xoYellowFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF570" />
      <stop offset="100%" stop-color="#FFDE59" />
    </linearGradient>
    <linearGradient id="xoYellowSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49B00" />
      <stop offset="100%" stop-color="#8A6500" />
    </linearGradient>

    <!-- Quantum Laser Beam Warp -->
    <linearGradient id="warpLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="100%" stop-color="#FFE600" />
    </linearGradient>

    <!-- Neo-Brutalist Hard Drop Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowLg" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#multiXoBgDark); }
    .theme-grid-line { stroke: #FFFFFF; stroke-opacity: 0.12; }
    .theme-frame-bg { fill: #0B0620; stroke: #FFE600; }
    .theme-stage-grid { stroke: #26164A; }
    .theme-sector-card { fill: #070314; stroke: #3A2375; }
    .theme-active-sector { fill: #160B3B; stroke: #FFE600; }
    .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
    .theme-badge-text { fill: #000000; }
    .theme-tag-rect { fill: #FFDE59; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#multiXoBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.08; }
      .theme-frame-bg { fill: #FFFFFF; stroke: #000000; }
      .theme-stage-grid { stroke: #E2E8F0; }
      .theme-sector-card { fill: #F8FAFC; stroke: #CBD5E1; }
      .theme-active-sector { fill: #FEF9C3; stroke: #EAB308; }
      .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
      .theme-badge-text { fill: #000000; }
      .theme-tag-rect { fill: #FFDE59; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Retro Cyber Grid Backdrop -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- Neo Sparks & Floating Quanta -->
  <g fill="#FFDE59">
    <polygon points="40,46 42,54 50,56 42,58 40,66 38,58 30,56 38,54" />
    <polygon points="360,40 362,48 370,50 362,52 360,60 358,52 350,50 358,48" />
    <polygon points="365,300 367,306 373,308 367,310 365,316 363,310 357,308 363,306" />
    <polygon points="34,310 36,316 42,318 36,320 34,326 32,320 26,318 32,316" />
  </g>

  <!-- 3D MAIN ARCADE CONTAINER -->
  <g filter="url(#brutalShadowLg)">
    <rect x="36" y="38" width="328" height="298" rx="22" class="theme-frame-bg" stroke-width="4" />
  </g>

  <!-- Inner Playfield Matrix Stage -->
  <rect x="48" y="48" width="304" height="278" rx="16" fill="#04010C" stroke="#000000" stroke-width="2.5" />

  <!-- 3X3 NESTED MACRO BOARD LAYOUT -->
  <!-- 9 Sector Blocks (Isometric Matrix Perspective) -->
  <g stroke-width="2">
    <!-- Row 1: S0, S1, S2 -->
    <rect x="62" y="60" width="80" height="74" rx="8" class="theme-sector-card" />
    <rect x="160" y="60" width="80" height="74" rx="8" class="theme-sector-card" />
    <rect x="258" y="60" width="80" height="74" rx="8" class="theme-sector-card" />

    <!-- Row 2: S3, S4 (Active Playable Golden Sector!), S5 -->
    <rect x="62" y="146" width="80" height="74" rx="8" class="theme-sector-card" />
    <rect x="160" y="146" width="80" height="74" rx="8" class="theme-active-sector" stroke-width="3" />
    <rect x="258" y="146" width="80" height="74" rx="8" class="theme-sector-card" />

    <!-- Row 3: S6, S7, S8 -->
    <rect x="62" y="232" width="80" height="74" rx="8" class="theme-sector-card" />
    <rect x="160" y="232" width="80" height="74" rx="8" class="theme-sector-card" />
    <rect x="258" y="232" width="80" height="74" rx="8" class="theme-sector-card" />
  </g>

  <!-- Mini Grid Lines Inside Sectors -->
  <g stroke="#372363" stroke-width="1.2" stroke-dasharray="2,2">
    <!-- Center Active Sector 4 Internal 3x3 Grid -->
    <line x1="186" y1="150" x2="186" y2="216" />
    <line x1="214" y1="150" x2="214" y2="216" />
    <line x1="164" y1="170" x2="236" y2="170" />
    <line x1="164" y1="196" x2="236" y2="196" />
  </g>

  <!-- MACRO CAPTURED SECTORS (Giant Semi-Transparent Watermarks) -->
  <!-- Top-Left S0 Captured by 'X' -->
  <g stroke="#00F0FF" stroke-width="5" opacity="0.85" stroke-linecap="round">
    <line x1="76" y1="74" x2="128" y2="120" />
    <line x1="128" y1="74" x2="76" y2="120" />
  </g>
  <!-- Top-Right S2 Captured by 'O' -->
  <g stroke="#FF007F" stroke-width="5" opacity="0.85">
    <circle cx="298" cy="97" r="24" fill="none" />
  </g>

  <!-- QUANTUM WARP LASER BEAM (Routing from S0 -> Center S4 -> S8) -->
  <g filter="url(#neonGlow)">
    <path d="M 102,97 Q 160,183 200,183 T 298,269" stroke="url(#warpLaser)" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="8,4" />
  </g>

  <!-- 3D HERO EXTRUDED FLOATING "X" NODE (Bottom Left Forefront: X=95, Y=255) -->
  <g transform="translate(100, 258) rotate(-12)" filter="url(#brutalShadowLg)">
    <g stroke="#000000" stroke-width="2.5">
      <!-- 3D Extrusion Sides -->
      <polygon points="-24,-24 -18,-30 -8,-20 -14,-14" fill="url(#xoCyanSide)" />
      <polygon points="14,14 20,8 30,18 24,24" fill="url(#xoCyanSide)" />
      <polygon points="-24,24 -18,18 -8,28 -14,34" fill="url(#xoCyanSide)" />
      <polygon points="14,-14 20,-20 30,-10 24,-4" fill="url(#xoCyanSide)" />
      <!-- Main 3D Cross Bars Face -->
      <polygon points="-20,-28 -28,-20 20,28 28,20" fill="url(#xoCyanFace)" />
      <polygon points="20,-28 28,-20 -20,28 -28,20" fill="url(#xoCyanFace)" />
    </g>
    <!-- Specular Highlight -->
    <path d="M -22,-18 L -16,-24 L 20,12 L 14,18 Z" fill="#FFFFFF" opacity="0.75" />
  </g>

  <!-- 3D HERO EXTRUDED FLOATING "O" TORUS NODE (Center-Right Forefront: X=295, Y=265) -->
  <g transform="translate(295, 265) rotate(10)" filter="url(#brutalShadowLg)">
    <g stroke="#000000" stroke-width="2.5">
      <!-- 3D Torus Extrusion Depth -->
      <ellipse cx="4" cy="6" rx="28" ry="24" fill="url(#xoPinkSide)" />
      <!-- Main Torus Face -->
      <ellipse cx="0" cy="0" rx="28" ry="24" fill="url(#xoPinkFace)" />
      <!-- Torus Inner Hole -->
      <ellipse cx="0" cy="0" rx="14" ry="12" fill="#04010C" stroke="#000000" stroke-width="2" />
    </g>
    <!-- Specular Crescent Reflection -->
    <path d="M -18,-14 A 24 20 0 0 1 18,-14 A 18 15 0 0 0 -18,-14 Z" fill="#FFFFFF" opacity="0.75" />
  </g>

  <!-- 3D ACTIVE SECTOR CENTRAL GOLDEN PIN BADGE -->
  <g transform="translate(200, 183)" filter="url(#brutalShadow)">
    <circle cx="0" cy="0" r="14" fill="url(#xoYellowFace)" stroke="#000000" stroke-width="2.5" />
    <circle cx="0" cy="0" r="10" fill="#000000" />
    <polygon points="0,-6 5,4 -5,4" fill="#FFE600" />
  </g>

  <!-- ACTION POPUP COMBO BADGE: "QUANTUM WARP!" -->
  <g transform="translate(200, 120)" filter="url(#brutalShadow)">
    <polygon points="0,-22 8,-8 24,-14 16,-1 30,10 14,14 18,28 4,20 -4,28 -2,14 -18,18 -12,4 -28,-2 -14,-10 -20,-24 -6,-16" fill="url(#badgeGold)" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="8.5" fill="#000000" text-anchor="middle" letter-spacing="0.5">
      QUANTUM WARP!
    </text>
  </g>

  <!-- TOP TAG RIBBON: "TACTICAL 9X9 MATRIX" -->
  <g transform="translate(200, 32)" filter="url(#brutalShadowSm)">
    <rect x="-85" y="-12" width="170" height="24" rx="8" class="theme-tag-rect" stroke-width="2.5" />
    <text x="0" y="4.5" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="10.5" text-anchor="middle" letter-spacing="1.2">
      ULTIMATE 9X9 // NESTED
    </text>
  </g>

  <!-- BOTTOM TITLE MARQUEE: "MULTIDIMENSION XO" -->
  <g transform="translate(200, 360)" filter="url(#brutalShadowLg)">
    <rect x="-125" y="-18" width="250" height="36" rx="12" class="theme-badge-rect" stroke-width="3.5" />
    <rect x="-120" y="-14" width="240" height="28" rx="8" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.3" />
    <text x="0" y="6" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="15" text-anchor="middle" letter-spacing="1.5">
      MULTIDIMENSION XO
    </text>
  </g>

  <!-- Bottom Left/Right Rivet Accents -->
  <circle cx="84" cy="360" r="3" fill="#000000" />
  <circle cx="316" cy="360" r="3" fill="#000000" />
</svg>
