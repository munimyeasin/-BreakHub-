<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="multiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050314" />
      <stop offset="50%" stop-color="#12082b" />
      <stop offset="100%" stop-color="#021726" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonCyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f0ff" flood-opacity="0.9" />
    </filter>
    <filter id="neonPinkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff007f" flood-opacity="0.9" />
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ffd700" flood-opacity="0.9" />
    </filter>
    <filter id="gridMacroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a855f7" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#multiBg)" />

  <!-- Macro Outer Container & Thick Grid Lines (Dividing 9 mini-boards) -->
  <rect x="40" y="30" width="320" height="320" rx="16" fill="#09051d" stroke="#3b1d6e" stroke-width="2.5" opacity="0.9" />

  <!-- Thick Macro Grid Separators -->
  <g stroke="#a855f7" stroke-width="4" filter="url(#gridMacroGlow)" opacity="0.85" stroke-linecap="round">
    <line x1="146" y1="35" x2="146" y2="345" />
    <line x1="254" y1="35" x2="254" y2="345" />
    <line x1="45" y1="136" x2="355" y2="136" />
    <line x1="45" y1="244" x2="355" y2="244" />
  </g>

  <!-- 9 MINI-BOARDS -->

  <!-- Top-Left Board: Conquered by Giant 'X' -->
  <g transform="translate(45, 35)">
    <rect width="96" height="96" rx="8" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-width="1.5" />
    <!-- Giant Neon X Macro Symbol -->
    <g filter="url(#neonCyanGlow)" transform="translate(48, 48)">
      <line x1="-30" y1="-30" x2="30" y2="30" stroke="#00f0ff" stroke-width="11" stroke-linecap="round" />
      <line x1="30" y1="-30" x2="-30" y2="30" stroke="#00f0ff" stroke-width="11" stroke-linecap="round" />
      <line x1="-30" y1="-30" x2="30" y2="30" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      <line x1="30" y1="-30" x2="-30" y2="30" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>

  <!-- Top-Center Board: Active Mini-Battle in Progress -->
  <g transform="translate(152, 35)">
    <rect width="96" height="96" rx="8" fill="#140b33" stroke="#5b21b6" stroke-width="1" />
    <!-- Sub-grid lines -->
    <line x1="32" y1="8" x2="32" y2="88" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    <line x1="64" y1="8" x2="64" y2="88" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    <line x1="8" y1="32" x2="88" y2="32" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    <line x1="8" y1="64" x2="88" y2="64" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    <!-- Mini X and O moves -->
    <g transform="translate(16, 16)"><line x1="-8" y1="-8" x2="8" y2="8" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" /><line x1="8" y1="-8" x2="-8" y2="8" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" /></g>
    <g transform="translate(48, 16)"><circle cx="0" cy="0" r="9" fill="none" stroke="#ff007f" stroke-width="3" /></g>
    <g transform="translate(80, 48)"><line x1="-8" y1="-8" x2="8" y2="8" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" /><line x1="8" y1="-8" x2="-8" y2="8" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" /></g>
    <g transform="translate(16, 80)"><circle cx="0" cy="0" r="9" fill="none" stroke="#ff007f" stroke-width="3" /></g>
  </g>

  <!-- Top-Right Board: Conquered by Giant 'O' -->
  <g transform="translate(260, 35)">
    <rect width="96" height="96" rx="8" fill="#ff007f" fill-opacity="0.08" stroke="#ff007f" stroke-width="1.5" />
    <!-- Giant Neon O Macro Symbol -->
    <g filter="url(#neonPinkGlow)" transform="translate(48, 48)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#ff007f" stroke-width="11" />
      <circle cx="0" cy="0" r="32" fill="none" stroke="#ffffff" stroke-width="4" />
    </g>
  </g>

  <!-- Middle-Left Board: Mini Grid -->
  <g transform="translate(45, 142)">
    <rect width="96" height="96" rx="8" fill="#140b33" stroke="#5b21b6" stroke-width="1" />
    <line x1="32" y1="8" x2="32" y2="88" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    <line x1="64" y1="8" x2="64" y2="88" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    <line x1="8" y1="32" x2="88" y2="32" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    <line x1="8" y1="64" x2="88" y2="64" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    <g transform="translate(48, 48)"><circle cx="0" cy="0" r="9" fill="none" stroke="#ff007f" stroke-width="3" /></g>
    <g transform="translate(80, 80)"><line x1="-8" y1="-8" x2="8" y2="8" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" /><line x1="8" y1="-8" x2="-8" y2="8" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" /></g>
  </g>

  <!-- Middle-Center Board: ACTIVE TARGET QUADRANT (Pulsing Target) -->
  <g transform="translate(152, 142)">
    <rect width="96" height="96" rx="8" fill="#ffd700" fill-opacity="0.12" stroke="#ffd700" stroke-width="2.5" filter="url(#goldGlow)" />
    <!-- Sub-grid lines -->
    <line x1="32" y1="8" x2="32" y2="88" stroke="#ffd700" stroke-width="1.5" opacity="0.5" />
    <line x1="64" y1="8" x2="64" y2="88" stroke="#ffd700" stroke-width="1.5" opacity="0.5" />
    <line x1="8" y1="32" x2="88" y2="32" stroke="#ffd700" stroke-width="1.5" opacity="0.5" />
    <line x1="8" y1="64" x2="88" y2="64" stroke="#ffd700" stroke-width="1.5" opacity="0.5" />
    <!-- Center Clash Symbol -->
    <g transform="translate(48, 48)">
      <polygon points="0,-16 5,-3 16,-3 8,4 11,15 0,8 -11,15 -8,4 -16,-3 -5,-3" fill="#ffe600" stroke="#fff" stroke-width="1.5" />
    </g>
    <g transform="translate(16, 48)"><line x1="-7" y1="-7" x2="7" y2="7" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" /><line x1="7" y1="-7" x2="-7" y2="7" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" /></g>
    <g transform="translate(80, 48)"><circle cx="0" cy="0" r="8" fill="none" stroke="#ff007f" stroke-width="2.5" /></g>
  </g>

  <!-- Middle-Right Board: Mini Grid -->
  <g transform="translate(260, 142)">
    <rect width="96" height="96" rx="8" fill="#140b33" stroke="#5b21b6" stroke-width="1" />
    <line x1="32" y1="8" x2="32" y2="88" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    <line x1="64" y1="8" x2="64" y2="88" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    <line x1="8" y1="32" x2="88" y2="32" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    <line x1="8" y1="64" x2="88" y2="64" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    <g transform="translate(16, 16)"><circle cx="0" cy="0" r="9" fill="none" stroke="#ff007f" stroke-width="3" /></g>
    <g transform="translate(48, 80)"><line x1="-8" y1="-8" x2="8" y2="8" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" /><line x1="8" y1="-8" x2="-8" y2="8" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" /></g>
  </g>

  <!-- Bottom-Left Board: Mini Grid -->
  <g transform="translate(45, 248)">
    <rect width="96" height="96" rx="8" fill="#140b33" stroke="#5b21b6" stroke-width="1" />
    <line x1="32" y1="8" x2="32" y2="88" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    <line x1="64" y1="8" x2="64" y2="88" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    <line x1="8" y1="32" x2="88" y2="32" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    <line x1="8" y1="64" x2="88" y2="64" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    <g transform="translate(80, 16)"><circle cx="0" cy="0" r="9" fill="none" stroke="#ff007f" stroke-width="3" /></g>
    <g transform="translate(48, 48)"><line x1="-8" y1="-8" x2="8" y2="8" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" /><line x1="8" y1="-8" x2="-8" y2="8" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" /></g>
  </g>

  <!-- Bottom-Center Board: Mini Grid -->
  <g transform="translate(152, 248)">
    <rect width="96" height="96" rx="8" fill="#140b33" stroke="#5b21b6" stroke-width="1" />
    <line x1="32" y1="8" x2="32" y2="88" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    <line x1="64" y1="8" x2="64" y2="88" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    <line x1="8" y1="32" x2="88" y2="32" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    <line x1="8" y1="64" x2="88" y2="64" stroke="#ffffff" stroke-width="1" opacity="0.2" />
    <g transform="translate(16, 80)"><line x1="-8" y1="-8" x2="8" y2="8" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" /><line x1="8" y1="-8" x2="-8" y2="8" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" /></g>
    <g transform="translate(48, 16)"><circle cx="0" cy="0" r="9" fill="none" stroke="#ff007f" stroke-width="3" /></g>
  </g>

  <!-- Bottom-Right Board: Conquered by Giant 'X' -->
  <g transform="translate(260, 248)">
    <rect width="96" height="96" rx="8" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-width="1.5" />
    <g filter="url(#neonCyanGlow)" transform="translate(48, 48)">
      <line x1="-30" y1="-30" x2="30" y2="30" stroke="#00f0ff" stroke-width="11" stroke-linecap="round" />
      <line x1="30" y1="-30" x2="-30" y2="30" stroke="#00f0ff" stroke-width="11" stroke-linecap="round" />
      <line x1="-30" y1="-30" x2="30" y2="30" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      <line x1="30" y1="-30" x2="-30" y2="30" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>

  <!-- Futuristic Bottom Label & Cyber Badge -->
  <g transform="translate(200, 375)">
    <rect x="-115" y="-16" width="230" height="28" rx="8" fill="#09051d" stroke="#a855f7" stroke-width="1.5" />
    <text x="0" y="3" fill="#00f0ff" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1.5">
      MULTIDIMENSION <tspan fill="#ff007f">XO</tspan>
    </text>
  </g>
</svg>
