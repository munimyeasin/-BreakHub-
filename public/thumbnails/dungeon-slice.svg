<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none">
  <rect width="200" height="120" rx="16" fill="#090014"/>
  <rect x="8" y="8" width="184" height="104" rx="12" fill="#180028" stroke="#000000" stroke-width="4"/>

  <!-- Glowing Center Core -->
  <circle cx="100" cy="60" r="18" fill="#00F0FF" stroke="#000000" stroke-width="3"/>
  <circle cx="100" cy="60" r="8" fill="#FFFFFF"/>

  <!-- Creeping Enemies -->
  <circle cx="45" cy="40" r="10" fill="#FF0055" stroke="#000000" stroke-width="2.5"/>
  <circle cx="155" cy="80" r="10" fill="#A3E635" stroke="#000000" stroke-width="2.5"/>

  <!-- Neon Slash Ray -->
  <line x1="30" y1="90" x2="170" y2="30" stroke="#FFE600" stroke-width="5" stroke-linecap="round"/>

  <!-- Action Badge -->
  <rect x="120" y="16" width="60" height="18" rx="6" fill="#FFE600" stroke="#000000" stroke-width="2"/>
  <text x="150" y="29" font-family="monospace" font-weight="900" font-size="9" fill="#000000" text-anchor="middle">SOON</text>
</svg>
