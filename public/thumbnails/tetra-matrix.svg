<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="tetraBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05021a" />
      <stop offset="45%" stop-color="#12062e" />
      <stop offset="100%" stop-color="#02142b" />
    </linearGradient>
    <linearGradient id="tetraBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#FFE8C2" />
    </linearGradient>

    <!-- 3D Tetromino Color Palettes -->
    <!-- Cyan (I Piece) -->
    <linearGradient id="cyanFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DF9FF" />
      <stop offset="100%" stop-color="#00D0FF" />
    </linearGradient>
    <linearGradient id="cyanSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0099CC" />
      <stop offset="100%" stop-color="#006699" />
    </linearGradient>

    <!-- Yellow (O Piece) -->
    <linearGradient id="yellowFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF570" />
      <stop offset="100%" stop-color="#FFDE59" />
    </linearGradient>
    <linearGradient id="yellowSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49B00" />
      <stop offset="100%" stop-color="#A67800" />
    </linearGradient>

    <!-- Pink/Magenta (T Piece) -->
    <linearGradient id="pinkFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF63C6" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <linearGradient id="pinkSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BA005C" />
      <stop offset="100%" stop-color="#8A0044" />
    </linearGradient>

    <!-- Lime Green (S Piece) -->
    <linearGradient id="limeFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7BFF9E" />
      <stop offset="100%" stop-color="#00FF66" />
    </linearGradient>
    <linearGradient id="limeSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B84A" />
      <stop offset="100%" stop-color="#008033" />
    </linearGradient>

    <!-- Orange (L Piece) -->
    <linearGradient id="orangeFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBD59" />
      <stop offset="100%" stop-color="#FF8800" />
    </linearGradient>
    <linearGradient id="orangeSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C25A00" />
      <stop offset="100%" stop-color="#8F3F00" />
    </linearGradient>

    <!-- Royal Blue (J Piece) -->
    <linearGradient id="blueFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="blueSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Red/Rose (Z Piece) -->
    <linearGradient id="roseFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B8B" />
      <stop offset="100%" stop-color="#FF1A4B" />
    </linearGradient>
    <linearGradient id="roseSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2002B" />
      <stop offset="100%" stop-color="#8A001E" />
    </linearGradient>

    <!-- Laser Speed Trail Gradient -->
    <linearGradient id="laserTrail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="40%" stop-color="#00F0FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="100%" stop-color="#FFE600" />
    </linearGradient>

    <!-- Neo-Brutalist Hard Drop Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowLg" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.75" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#tetraBgDark); }
    .theme-grid-line { stroke: #FFFFFF; stroke-opacity: 0.12; }
    .theme-frame-bg { fill: #0B081E; stroke: #FFE600; }
    .theme-stage-grid { stroke: #2A1C54; }
    .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
    .theme-badge-text { fill: #000000; }
    .theme-tag-rect { fill: #FFDE59; stroke: #000000; }
    .theme-tag-text { fill: #000000; }
    .theme-stat-bg { fill: #130B2E; stroke: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#tetraBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.1; }
      .theme-frame-bg { fill: #FFFFFF; stroke: #000000; }
      .theme-stage-grid { stroke: #E2E8F0; }
      .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
      .theme-badge-text { fill: #000000; }
      .theme-tag-rect { fill: #FFDE59; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
      .theme-stat-bg { fill: #FFF8E7; stroke: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Retro Cyber Grid Backdrop -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- Twinkle Stars & Neo Sparks -->
  <g fill="#FFDE59">
    <polygon points="40,46 42,54 50,56 42,58 40,66 38,58 30,56 38,54" />
    <polygon points="360,40 362,48 370,50 362,52 360,60 358,52 350,50 358,48" />
    <polygon points="365,300 367,306 373,308 367,310 365,316 363,310 357,308 363,306" />
    <polygon points="34,310 36,316 42,318 36,320 34,326 32,320 26,318 32,316" />
  </g>

  <!-- 3D NEO-BRUTALIST MAIN ARCADE MATRIX CONTAINER -->
  <g filter="url(#brutalShadowLg)">
    <rect x="36" y="38" width="328" height="298" rx="22" class="theme-frame-bg" stroke-width="4" />
  </g>

  <!-- Matrix Inner Playfield Stage -->
  <rect x="48" y="48" width="304" height="278" rx="16" fill="#04020E" stroke="#000000" stroke-width="2.5" />

  <!-- Perspective Floor Grid (Matrix Stage Lines) -->
  <g class="theme-stage-grid" stroke-width="1.5" stroke-dasharray="4,3">
    <line x1="48" y1="84" x2="352" y2="84" />
    <line x1="48" y1="122" x2="352" y2="122" />
    <line x1="48" y1="160" x2="352" y2="160" />
    <line x1="48" y1="198" x2="352" y2="198" />
    <line x1="48" y1="236" x2="352" y2="236" />
    <line x1="48" y1="274" x2="352" y2="274" />
    <line x1="86" y1="48" x2="86" y2="326" />
    <line x1="124" y1="48" x2="124" y2="326" />
    <line x1="162" y1="48" x2="162" y2="326" />
    <line x1="200" y1="48" x2="200" y2="326" />
    <line x1="238" y1="48" x2="238" y2="326" />
    <line x1="276" y1="48" x2="276" y2="326" />
    <line x1="314" y1="48" x2="314" y2="326" />
  </g>

  <!-- BOTTOM MATRIX STACK (Isometric Polyominoes Settled at Bottom) -->
  <g stroke="#000000" stroke-width="2">
    <!-- Blue J-Piece (Bottom Left: X=58, Y=264) -->
    <g transform="translate(58, 240)">
      <rect x="0" y="32" width="30" height="30" rx="4" fill="url(#blueFace)" />
      <rect x="30" y="32" width="30" height="30" rx="4" fill="url(#blueFace)" />
      <rect x="60" y="32" width="30" height="30" rx="4" fill="url(#blueFace)" />
      <rect x="0" y="2" width="30" height="30" rx="4" fill="url(#blueFace)" />
      <!-- Bevel Reflection Accents -->
      <path d="M 4,6 L 24,6 L 24,10 L 8,10 L 8,26 L 4,26 Z" fill="#FFFFFF" opacity="0.6" />
    </g>

    <!-- Orange L-Piece (Bottom Mid-Left: X=148, Y=240) -->
    <g transform="translate(148, 240)">
      <rect x="0" y="32" width="30" height="30" rx="4" fill="url(#orangeFace)" />
      <rect x="30" y="32" width="30" height="30" rx="4" fill="url(#orangeFace)" />
      <rect x="60" y="32" width="30" height="30" rx="4" fill="url(#orangeFace)" />
      <rect x="60" y="2" width="30" height="30" rx="4" fill="url(#orangeFace)" />
      <!-- Bevel Reflection -->
      <path d="M 64,6 L 84,6 L 84,26 L 80,26 L 80,10 L 64,10 Z" fill="#FFFFFF" opacity="0.6" />
    </g>

    <!-- Green S-Piece (Bottom Right: X=244, Y=240) -->
    <g transform="translate(244, 240)">
      <rect x="30" y="2" width="30" height="30" rx="4" fill="url(#limeFace)" />
      <rect x="60" y="2" width="30" height="30" rx="4" fill="url(#limeFace)" />
      <rect x="0" y="32" width="30" height="30" rx="4" fill="url(#limeFace)" />
      <rect x="30" y="32" width="30" height="30" rx="4" fill="url(#limeFace)" />
    </g>
  </g>

  <!-- GHOST PIECE WIREFRAME LANDING PROJECTION (Center Column Gap: X=180, Y=140..270) -->
  <g stroke="#00F0FF" stroke-width="2.5" stroke-dasharray="4,3" fill="#00F0FF" fill-opacity="0.16">
    <rect x="184" y="200" width="32" height="32" rx="4" />
    <rect x="184" y="234" width="32" height="32" rx="4" />
    <rect x="184" y="268" width="32" height="32" rx="4" />
  </g>

  <!-- LINE CLEAR ENERGY LASER WAVE (Row 270 Horizontal Blast) -->
  <g filter="url(#cyanGlow)">
    <line x1="50" y1="284" x2="350" y2="284" stroke="#00F0FF" stroke-width="8" opacity="0.75" />
    <line x1="50" y1="284" x2="350" y2="284" stroke="#FFFFFF" stroke-width="3" />
  </g>

  <!-- 3D FLOATING POLYOMINO 1: YELLOW O-PIECE (2x2 Box on Top-Left) -->
  <g transform="translate(62, 70) rotate(-10)" filter="url(#brutalShadow)">
    <g stroke="#000000" stroke-width="2.5">
      <!-- 3D Extrusion Depth -->
      <polygon points="62,0 70,-6 70,58 62,64" fill="url(#yellowSide)" />
      <polygon points="0,0 8,-6 70,-6 62,0" fill="url(#yellowSide)" />
      <!-- 4 Blocks (2x2) -->
      <rect x="0" y="0" width="30" height="30" rx="4" fill="url(#yellowFace)" />
      <rect x="32" y="0" width="30" height="30" rx="4" fill="url(#yellowFace)" />
      <rect x="0" y="32" width="30" height="30" rx="4" fill="url(#yellowFace)" />
      <rect x="32" y="32" width="30" height="30" rx="4" fill="url(#yellowFace)" />
    </g>
    <!-- Glossy Bevel Reflection -->
    <path d="M 4,4 L 26,4 L 4,26 Z" fill="#FFFFFF" opacity="0.7" />
    <path d="M 36,4 L 58,4 L 36,26 Z" fill="#FFFFFF" opacity="0.7" />
  </g>

  <!-- 3D FLOATING POLYOMINO 2: PINK T-PIECE (Top-Right Flying Piece) -->
  <g transform="translate(250, 72) rotate(14)" filter="url(#brutalShadow)">
    <g stroke="#000000" stroke-width="2.5">
      <!-- 3D Extrusion Depth -->
      <polygon points="94,0 102,-6 102,24 94,30" fill="url(#pinkSide)" />
      <polygon points="0,0 8,-6 102,-6 94,0" fill="url(#pinkSide)" />
      <polygon points="62,32 70,26 70,58 62,64" fill="url(#pinkSide)" />
      <!-- 4 Blocks of T Shape -->
      <rect x="0" y="0" width="30" height="30" rx="4" fill="url(#pinkFace)" />
      <rect x="32" y="0" width="30" height="30" rx="4" fill="url(#pinkFace)" />
      <rect x="64" y="0" width="30" height="30" rx="4" fill="url(#pinkFace)" />
      <rect x="32" y="32" width="30" height="30" rx="4" fill="url(#pinkFace)" />
    </g>
    <!-- Glossy Reflection -->
    <path d="M 4,4 L 26,4 L 4,26 Z" fill="#FFFFFF" opacity="0.7" />
    <path d="M 36,36 L 58,36 L 36,58 Z" fill="#FFFFFF" opacity="0.7" />
  </g>

  <!-- 3D HERO CENTRAL SLAMMING CYAN I-TETROMINO (Vertical 4-Block Bar with Hard Drop Trails) -->
  <!-- Hard Drop Motion Laser Trails -->
  <g opacity="0.9">
    <rect x="184" y="44" width="32" height="60" fill="url(#laserTrail)" />
    <line x1="178" y1="100" x2="164" y2="124" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="222" y1="100" x2="236" y2="124" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="200" y1="46" x2="200" y2="96" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6,4" />
  </g>

  <!-- Main Slamming Cyan I-Bar (4 Blocks) -->
  <g transform="translate(184, 96)" filter="url(#brutalShadowLg)">
    <g stroke="#000000" stroke-width="3">
      <!-- 3D Side Depth -->
      <polygon points="32,0 40,-7 40,123 32,130" fill="url(#cyanSide)" />
      <polygon points="0,0 8,-7 40,-7 32,0" fill="url(#cyanSide)" />
      <!-- 4 Stacked Blocks -->
      <rect x="0" y="0" width="32" height="30" rx="4" fill="url(#cyanFace)" />
      <rect x="0" y="33" width="32" height="30" rx="4" fill="url(#cyanFace)" />
      <rect x="0" y="66" width="32" height="30" rx="4" fill="url(#cyanFace)" />
      <rect x="0" y="99" width="32" height="30" rx="4" fill="url(#cyanFace)" />
    </g>
    <!-- High-Gloss Specular Highlight Strip -->
    <path d="M 4,4 L 28,4 L 4,28 Z" fill="#FFFFFF" opacity="0.8" />
    <path d="M 4,37 L 28,37 L 4,61 Z" fill="#FFFFFF" opacity="0.8" />
    <path d="M 4,70 L 28,70 L 4,94 Z" fill="#FFFFFF" opacity="0.8" />
    <path d="M 4,103 L 28,103 L 4,127 Z" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- ACTION POPUP COMBO BADGE: "4X TETRIS!" -->
  <g transform="translate(200, 168)" filter="url(#brutalShadow)">
    <polygon points="0,-22 8,-8 24,-14 16,-1 30,10 14,14 18,28 4,20 -4,28 -2,14 -18,18 -12,4 -28,-2 -14,-10 -20,-24 -6,-16" fill="url(#goldGrad)" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="10" fill="#000000" text-anchor="middle" letter-spacing="0.5">
      4X TETRIS!
    </text>
  </g>

  <!-- TOP TAG RIBBON: "POLYOMINO ARCADE // SRS" -->
  <g transform="translate(200, 32)" filter="url(#brutalShadowSm)">
    <rect x="-85" y="-12" width="170" height="24" rx="8" class="theme-tag-rect" stroke-width="2.5" />
    <text x="0" y="4.5" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="10.5" text-anchor="middle" letter-spacing="1.2">
      POLYOMINO // SRS MATRIX
    </text>
  </g>

  <!-- BOTTOM TITLE MARQUEE: "TETRA MATRIX" -->
  <g transform="translate(200, 360)" filter="url(#brutalShadowLg)">
    <!-- Outer Brutalist Layer -->
    <rect x="-115" y="-18" width="230" height="36" rx="12" class="theme-badge-rect" stroke-width="3.5" />
    <!-- Inner Accent Line -->
    <rect x="-110" y="-14" width="220" height="28" rx="8" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.3" />
    <!-- Title Text -->
    <text x="0" y="6" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="17" text-anchor="middle" letter-spacing="2">
      TETRA MATRIX
    </text>
  </g>

  <!-- Bottom Left Small Rivet Accents -->
  <circle cx="94" cy="360" r="3" fill="#000000" />
  <circle cx="306" cy="360" r="3" fill="#000000" />
</svg>
