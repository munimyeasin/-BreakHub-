<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="tetraBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#040612" />
      <stop offset="50%" stopColor="#110928" />
      <stop offset="100%" stopColor="#021424" />
    </linearGradient>
    <linearGradient id="tetraBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFDF0" />
      <stop offset="50%" stopColor="#FFF8E7" />
      <stop offset="100%" stopColor="#FFECC8" />
    </linearGradient>

    <!-- Block Gradients -->
    <linearGradient id="cyanBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#67F6FF" />
      <stop offset="100%" stopColor="#00D2FF" />
    </linearGradient>
    <linearGradient id="yellowBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF275" />
      <stop offset="100%" stopColor="#FFDE59" />
    </linearGradient>
    <linearGradient id="pinkBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF4DB8" />
      <stop offset="100%" stopColor="#FF0080" />
    </linearGradient>
    <linearGradient id="limeBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#66FF99" />
      <stop offset="100%" stopColor="#00FF66" />
    </linearGradient>
    <linearGradient id="roseBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF6688" />
      <stop offset="100%" stopColor="#FF3366" />
    </linearGradient>
    <linearGradient id="orangeBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFB347" />
      <stop offset="100%" stopColor="#FF9900" />
    </linearGradient>
    <linearGradient id="blueBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#60A5FA" />
      <stop offset="100%" stopColor="#3B82F6" />
    </linearGradient>

    <!-- Hard Neo-Brutalist Drop Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" floodColor="#000000" floodOpacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" floodColor="#000000" floodOpacity="1" />
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#tetraBgDark); }
    .theme-grid-line { stroke: #FFFFFF; stroke-opacity: 0.12; }
    .theme-matrix-bg { fill: #070614; stroke: #00F0FF; }
    .theme-matrix-grid { stroke: #1E1B4B; stroke-opacity: 0.7; }
    .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
    .theme-badge-text { fill: #000000; }
    .theme-tag-rect { fill: #FFDE59; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#tetraBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.1; }
      .theme-matrix-bg { fill: #FFFFFF; stroke: #000000; }
      .theme-matrix-grid { stroke: #E2E8F0; stroke-opacity: 0.9; }
      .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
      .theme-badge-text { fill: #000000; }
      .theme-tag-rect { fill: #FFDE59; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Subtle Retro Backdrop Grid Pattern -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="280" x2="400" y2="280" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="0" y1="360" x2="400" y2="360" />
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
  </g>

  <!-- 3D Brutalist Matrix Well Container (Center Frame) -->
  <g>
    <!-- Hard Black Shadow -->
    <rect x="100" y="38" width="208" height="308" rx="16" fill="#000000" />
    <!-- Matrix Main Frame -->
    <rect x="96" y="34" width="208" height="308" rx="16" class="theme-matrix-bg" stroke-width="3.5" />
  </g>

  <!-- Internal Matrix Grid (Cell size: 18x18, Grid: 10 cols x 15 rows visible) -->
  <g class="theme-matrix-grid" stroke-width="1">
    <!-- Vertical lines (10 cols, start X = 110, step = 18) -->
    <line x1="128" y1="44" x2="128" y2="332" />
    <line x1="146" y1="44" x2="146" y2="332" />
    <line x1="164" y1="44" x2="164" y2="332" />
    <line x1="182" y1="44" x2="182" y2="332" />
    <line x1="200" y1="44" x2="200" y2="332" />
    <line x1="218" y1="44" x2="218" y2="332" />
    <line x1="236" y1="44" x2="236" y2="332" />
    <line x1="254" y1="44" x2="254" y2="332" />
    <line x1="272" y1="44" x2="272" y2="332" />

    <!-- Horizontal lines (start Y = 44, step = 18) -->
    <line x1="110" y1="62" x2="290" y2="62" />
    <line x1="110" y1="80" x2="290" y2="80" />
    <line x1="110" y1="98" x2="290" y2="98" />
    <line x1="110" y1="116" x2="290" y2="116" />
    <line x1="110" y1="134" x2="290" y2="134" />
    <line x1="110" y1="152" x2="290" y2="152" />
    <line x1="110" y1="170" x2="290" y2="170" />
    <line x1="110" y1="188" x2="290" y2="188" />
    <line x1="110" y1="206" x2="290" y2="206" />
    <line x1="110" y1="224" x2="290" y2="224" />
    <line x1="110" y1="242" x2="290" y2="242" />
    <line x1="110" y1="260" x2="290" y2="260" />
    <line x1="110" y1="278" x2="290" y2="278" />
    <line x1="110" y1="296" x2="290" y2="296" />
    <line x1="110" y1="314" x2="290" y2="314" />
  </g>

  <!-- STACKED BLOCKS AT THE BOTTOM (Rows 12-15) -->
  <g stroke="#000000" stroke-width="1.8">
    <!-- Bottom Row (Row 15: Y=296..314) -->
    <!-- Yellow O piece left: X=110, 128 -->
    <rect x="110" y="296" width="18" height="18" rx="2" fill="url(#yellowBlock)" />
    <rect x="128" y="296" width="18" height="18" rx="2" fill="url(#yellowBlock)" />
    <rect x="110" y="278" width="18" height="18" rx="2" fill="url(#yellowBlock)" />
    <rect x="128" y="278" width="18" height="18" rx="2" fill="url(#yellowBlock)" />

    <!-- Orange L piece mid-left: X=146, 164, 182 -->
    <rect x="146" y="296" width="18" height="18" rx="2" fill="url(#orangeBlock)" />
    <rect x="164" y="296" width="18" height="18" rx="2" fill="url(#orangeBlock)" />
    <rect x="182" y="296" width="18" height="18" rx="2" fill="url(#orangeBlock)" />
    <rect x="182" y="278" width="18" height="18" rx="2" fill="url(#orangeBlock)" />

    <!-- Pink T piece mid-right: X=200, 218, 236 -->
    <rect x="200" y="296" width="18" height="18" rx="2" fill="url(#pinkBlock)" />
    <rect x="218" y="296" width="18" height="18" rx="2" fill="url(#pinkBlock)" />
    <rect x="236" y="296" width="18" height="18" rx="2" fill="url(#pinkBlock)" />
    <rect x="218" y="278" width="18" height="18" rx="2" fill="url(#pinkBlock)" />

    <!-- Blue J piece right: X=254, 272 -->
    <rect x="254" y="296" width="18" height="18" rx="2" fill="url(#blueBlock)" />
    <rect x="272" y="296" width="18" height="18" rx="2" fill="url(#blueBlock)" />
    <rect x="272" y="278" width="18" height="18" rx="2" fill="url(#blueBlock)" />
    <rect x="272" y="260" width="18" height="18" rx="2" fill="url(#blueBlock)" />

    <!-- Green S piece: X=146, 164, 182, Y=260, 278 -->
    <rect x="164" y="260" width="18" height="18" rx="2" fill="url(#limeBlock)" />
    <rect x="182" y="260" width="18" height="18" rx="2" fill="url(#limeBlock)" />
    <rect x="146" y="278" width="18" height="18" rx="2" fill="url(#limeBlock)" />

    <!-- Red Z piece: X=200, 218, 236, Y=260, 242 -->
    <rect x="200" y="260" width="18" height="18" rx="2" fill="url(#roseBlock)" />
    <rect x="218" y="260" width="18" height="18" rx="2" fill="url(#roseBlock)" />
    <rect x="218" y="242" width="18" height="18" rx="2" fill="url(#roseBlock)" />
    <rect x="236" y="242" width="18" height="18" rx="2" fill="url(#roseBlock)" />
  </g>

  <!-- GHOST PIECE WIREFRAME PROJECTION (Cyan I piece vertical landing target at X=128, Y=242..296) -->
  <g stroke="#00F0FF" stroke-width="1.8" stroke-dasharray="3,2" fill="#00F0FF" fill-opacity="0.15">
    <rect x="128" y="206" width="18" height="18" rx="2" />
    <rect x="128" y="224" width="18" height="18" rx="2" />
    <rect x="128" y="242" width="18" height="18" rx="2" />
    <rect x="128" y="260" width="18" height="18" rx="2" />
  </g>

  <!-- FALLING ACTIVE CYAN I-PIECE (Hard Drop Slam in motion at X=128, Y=80..134) -->
  <g stroke="#000000" stroke-width="2" filter="url(#brutalShadowSm)">
    <rect x="128" y="80" width="18" height="18" rx="2" fill="url(#cyanBlock)" />
    <rect x="128" y="98" width="18" height="18" rx="2" fill="url(#cyanBlock)" />
    <rect x="128" y="116" width="18" height="18" rx="2" fill="url(#cyanBlock)" />
    <rect x="128" y="134" width="18" height="18" rx="2" fill="url(#cyanBlock)" />
  </g>

  <!-- Motion Trails & Laser Sparks -->
  <g stroke="#00F0FF" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="137" y1="56" x2="137" y2="76" stroke-dasharray="4,3" />
    <line x1="126" y1="140" x2="120" y2="152" />
    <line x1="148" y1="140" x2="154" y2="152" />
  </g>

  <!-- SIDE PANELS: HOLD & NEXT CARDS -->
  <!-- Left Side: HOLD Card -->
  <g filter="url(#brutalShadowSm)">
    <rect x="22" y="60" width="58" height="64" rx="10" fill="#000000" />
    <rect x="20" y="58" width="58" height="64" rx="10" class="theme-matrix-bg" stroke-width="2.5" />
    <rect x="25" y="64" width="48" height="14" rx="4" fill="#FF0080" stroke="#000000" stroke-width="1.5" />
    <text x="49" y="74.5" fill="#FFFFFF" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="8" text-anchor="middle" letter-spacing="0.5">HOLD</text>
    <!-- Mini Yellow O Piece inside Hold -->
    <g stroke="#000000" stroke-width="1.2">
      <rect x="36" y="84" width="12" height="12" rx="1.5" fill="url(#yellowBlock)" />
      <rect x="49" y="84" width="12" height="12" rx="1.5" fill="url(#yellowBlock)" />
      <rect x="36" y="97" width="12" height="12" rx="1.5" fill="url(#yellowBlock)" />
      <rect x="49" y="97" width="12" height="12" rx="1.5" fill="url(#yellowBlock)" />
    </g>
  </g>

  <!-- Right Side: NEXT Card -->
  <g filter="url(#brutalShadowSm)">
    <rect x="322" y="60" width="58" height="64" rx="10" fill="#000000" />
    <rect x="320" y="58" width="58" height="64" rx="10" class="theme-matrix-bg" stroke-width="2.5" />
    <rect x="325" y="64" width="48" height="14" rx="4" fill="#00FF66" stroke="#000000" stroke-width="1.5" />
    <text x="349" y="74.5" fill="#000000" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="8" text-anchor="middle" letter-spacing="0.5">NEXT</text>
    <!-- Mini Pink T Piece inside Next -->
    <g stroke="#000000" stroke-width="1.2">
      <rect x="343" y="84" width="12" height="12" rx="1.5" fill="url(#pinkBlock)" />
      <rect x="330" y="97" width="12" height="12" rx="1.5" fill="url(#pinkBlock)" />
      <rect x="343" y="97" width="12" height="12" rx="1.5" fill="url(#pinkBlock)" />
      <rect x="356" y="97" width="12" height="12" rx="1.5" fill="url(#pinkBlock)" />
    </g>
  </g>

  <!-- TOP TAG RIBBON: "TETRA GRID // 2077" -->
  <g filter="url(#brutalShadowSm)">
    <rect x="132" y="16" width="136" height="24" rx="6" fill="#000000" />
    <rect x="130" y="14" width="136" height="24" rx="6" class="theme-tag-rect" stroke-width="2" />
    <text x="198" y="30" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="11" text-anchor="middle" letter-spacing="1.5">
      TETRA GRID // SRS
    </text>
  </g>

  <!-- BOTTOM TITLE BADGE: "TETRA MATRIX" -->
  <g filter="url(#brutalShadow)">
    <rect x="66" y="348" width="268" height="42" rx="12" fill="#000000" />
    <rect x="62" y="344" width="268" height="42" rx="12" class="theme-badge-rect" stroke-width="3" />
    <text x="196" y="372" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="20" text-anchor="middle" letter-spacing="2">
      TETRA MATRIX
    </text>
  </g>

  <!-- Top-Right Sparkling Cyber Star -->
  <polygon points="350,24 354,34 364,38 354,42 350,52 346,42 336,38 346,34" fill="#FFDE59" stroke="#000000" stroke-width="1.5" filter="url(#brutalShadowSm)" />
</svg>
