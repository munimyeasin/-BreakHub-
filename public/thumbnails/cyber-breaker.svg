<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="breakerBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B001A" />
      <stop offset="60%" stop-color="#180436" />
      <stop offset="100%" stop-color="#050E26" />
    </linearGradient>
    <linearGradient id="breakerBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#breakerBgDark); }
    .theme-grid-line { stroke: #00F0FF; stroke-opacity: 0.15; }
    .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
    .theme-badge-text { fill: #000000; }
    .theme-tag-rect { fill: #FFE600; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#breakerBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.1; }
      .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
      .theme-badge-text { fill: #000000; }
      .theme-tag-rect { fill: #FFE600; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Cyber Grid Lines -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="60" x2="400" y2="60" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="180" x2="400" y2="180" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="300" x2="400" y2="300" />
  </g>

  <!-- Colorful Neo-Brutalist Brick Grid -->
  <!-- Row 1: Magenta -->
  <g stroke="#000000" stroke-width="3" filter="url(#brutalShadowSm)">
    <rect x="35" y="55" width="60" height="22" rx="6" fill="#FF007F" />
    <rect x="105" y="55" width="60" height="22" rx="6" fill="#FF007F" />
    <rect x="175" y="55" width="60" height="22" rx="6" fill="#FF007F" />
    <rect x="245" y="55" width="60" height="22" rx="6" fill="#FF007F" />
    <rect x="315" y="55" width="50" height="22" rx="6" fill="#FF007F" />

    <!-- Row 2: Cyan -->
    <rect x="35" y="85" width="60" height="22" rx="6" fill="#00F0FF" />
    <rect x="105" y="85" width="60" height="22" rx="6" fill="#00F0FF" />
    <!-- Exploded gap at 175 -->
    <rect x="245" y="85" width="60" height="22" rx="6" fill="#00F0FF" />
    <rect x="315" y="85" width="50" height="22" rx="6" fill="#00F0FF" />

    <!-- Row 3: Lime Green -->
    <rect x="35" y="115" width="60" height="22" rx="6" fill="#00FF88" />
    <rect x="105" y="115" width="60" height="22" rx="6" fill="#00FF88" />
    <rect x="245" y="115" width="60" height="22" rx="6" fill="#00FF88" />
    <rect x="315" y="115" width="50" height="22" rx="6" fill="#00FF88" />

    <!-- Row 4: Bright Gold -->
    <rect x="35" y="145" width="60" height="22" rx="6" fill="#FFE600" />
    <rect x="105" y="145" width="60" height="22" rx="6" fill="#FFE600" />
    <rect x="245" y="145" width="60" height="22" rx="6" fill="#FFE600" />
    <rect x="315" y="145" width="50" height="22" rx="6" fill="#FFE600" />
  </g>

  <!-- Brick Shatter Explosion at (205, 100) -->
  <g transform="translate(205, 100)">
    <!-- Shards -->
    <rect x="-25" y="-18" width="16" height="12" rx="3" fill="#00F0FF" stroke="#000000" stroke-width="2" transform="rotate(-25)" />
    <rect x="15" y="-22" width="14" height="10" rx="3" fill="#00F0FF" stroke="#000000" stroke-width="2" transform="rotate(35)" />
    <rect x="-18" y="15" width="12" height="12" rx="3" fill="#FF007F" stroke="#000000" stroke-width="2" transform="rotate(45)" />
    <rect x="20" y="12" width="15" height="10" rx="3" fill="#00FF88" stroke="#000000" stroke-width="2" transform="rotate(-40)" />

    <!-- Star Burst -->
    <polygon points="0,-25 7,-8 25,-8 11,3 17,21 0,10 -17,21 -11,3 -25,-8 -7,-8" fill="#FFE600" stroke="#000000" stroke-width="2" />
    <!-- "HIT!" text -->
    <text x="0" y="5" font-family="'Impact', 'Arial Black', sans-serif" font-size="12" fill="#000000" font-weight="900" text-anchor="middle">HIT!</text>
  </g>

  <!-- Cute Smiling Bouncing Energy Ball -->
  <g transform="translate(195, 205)" filter="url(#brutalShadowSm)">
    <!-- Ball trail -->
    <ellipse cx="10" cy="35" rx="14" ry="8" fill="#FFE600" opacity="0.4" transform="rotate(25 10 35)" />
    <circle cx="0" cy="0" r="28" fill="#FFE600" stroke="#000000" stroke-width="3.5" />

    <!-- Cute Eyes -->
    <ellipse cx="-8" cy="-5" rx="5" ry="7" fill="#000000" />
    <circle cx="-6" cy="-7" r="2" fill="#FFFFFF" />
    <ellipse cx="8" cy="-5" rx="5" ry="7" fill="#000000" />
    <circle cx="10" cy="-7" r="2" fill="#FFFFFF" />

    <!-- Smile & Cheeks -->
    <path d="M -7,6 Q 0,14 7,6" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="-15" cy="4" r="3.5" fill="#FF007F" />
    <circle cx="15" cy="4" r="3.5" fill="#FF007F" />
  </g>

  <!-- Neon Paddle with Brutalist Drop Shadow -->
  <g transform="translate(200, 305)" filter="url(#brutalShadow)">
    <rect x="-70" y="0" width="140" height="24" rx="12" fill="#00F0FF" stroke="#000000" stroke-width="3.5" />
    <!-- Center Light -->
    <circle cx="0" cy="12" r="6" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
    <!-- Grips -->
    <rect x="-55" y="6" width="26" height="12" rx="4" fill="#0088FF" stroke="#000000" stroke-width="1.5" />
    <rect x="29" y="6" width="26" height="12" rx="4" fill="#0088FF" stroke="#000000" stroke-width="1.5" />
  </g>

  <!-- Top Tag Pill: NEON PADDLE ARCADE -->
  <g transform="translate(200, 24)" filter="url(#brutalShadowSm)">
    <rect x="-85" y="-10" width="170" height="20" rx="6" class="theme-tag-rect" stroke-width="2" />
    <text x="0" y="4" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1">NEON PADDLE ARCADE</text>
  </g>

  <!-- Bottom Title Badge Pill: CYBER BRICK BREAKER -->
  <g transform="translate(200, 366)" filter="url(#brutalShadowSm)">
    <rect x="-105" y="-15" width="210" height="30" rx="10" class="theme-badge-rect" stroke-width="3" />
    <text x="0" y="5" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1.2">CYBER BRICK BREAKER</text>
  </g>
</svg>
