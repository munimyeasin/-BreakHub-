<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="neoShadowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000000" />
    </filter>
    <filter id="neoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" />
    </filter>
    <filter id="neoShadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Neo Ground -->
  <rect width="400" height="400" fill="#FAF8F5" />

  <!-- Dot Matrix Grid -->
  <g fill="#000000" opacity="0.08">
    <circle cx="40" cy="40" r="2" /><circle cx="100" cy="40" r="2" /><circle cx="160" cy="40" r="2" /><circle cx="220" cy="40" r="2" /><circle cx="280" cy="40" r="2" /><circle cx="340" cy="40" r="2" />
    <circle cx="40" cy="100" r="2" /><circle cx="100" cy="100" r="2" /><circle cx="160" cy="100" r="2" /><circle cx="220" cy="100" r="2" /><circle cx="280" cy="100" r="2" /><circle cx="340" cy="100" r="2" />
    <circle cx="40" cy="160" r="2" /><circle cx="100" cy="160" r="2" /><circle cx="160" cy="160" r="2" /><circle cx="220" cy="160" r="2" /><circle cx="280" cy="160" r="2" /><circle cx="340" cy="160" r="2" />
    <circle cx="40" cy="220" r="2" /><circle cx="100" cy="220" r="2" /><circle cx="160" cy="220" r="2" /><circle cx="220" cy="220" r="2" /><circle cx="280" cy="220" r="2" /><circle cx="340" cy="220" r="2" />
    <circle cx="40" cy="280" r="2" /><circle cx="100" cy="280" r="2" /><circle cx="160" cy="280" r="2" /><circle cx="220" cy="280" r="2" /><circle cx="280" cy="280" r="2" /><circle cx="340" cy="280" r="2" />
    <circle cx="40" cy="340" r="2" /><circle cx="100" cy="340" r="2" /><circle cx="160" cy="340" r="2" /><circle cx="220" cy="340" r="2" /><circle cx="280" cy="340" r="2" /><circle cx="340" cy="340" r="2" />
  </g>

  <!-- Outer Border -->
  <rect x="12" y="12" width="376" height="376" rx="20" fill="none" stroke="#000000" stroke-width="4" />

  <!-- Main Container -->
  <rect x="36" y="36" width="328" height="328" rx="16" fill="#C0F7FE" stroke="#000000" stroke-width="3.5" filter="url(#neoShadowLg)" />

  <!-- Playfield Canvas Ground -->
  <rect x="52" y="52" width="296" height="296" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="3" />

  <!-- Colorful Brick Rows with Hard Drop Shadows -->
  <!-- Row 1: Neo Pink -->
  <g filter="url(#neoShadowSm)">
    <rect x="68" y="70" width="58" height="22" rx="6" fill="#FE90E8" stroke="#000000" stroke-width="2.5" />
    <rect x="136" y="70" width="58" height="22" rx="6" fill="#FE90E8" stroke="#000000" stroke-width="2.5" />
    <rect x="204" y="70" width="58" height="22" rx="6" fill="#FE90E8" stroke="#000000" stroke-width="2.5" />
    <rect x="272" y="70" width="58" height="22" rx="6" fill="#FE90E8" stroke="#000000" stroke-width="2.5" />

    <!-- Row 2: Neo Yellow -->
    <rect x="68" y="102" width="58" height="22" rx="6" fill="#F7CB46" stroke="#000000" stroke-width="2.5" />
    <rect x="136" y="102" width="58" height="22" rx="6" fill="#F7CB46" stroke="#000000" stroke-width="2.5" />
    <!-- Smashed brick at 204 -->
    <rect x="272" y="102" width="58" height="22" rx="6" fill="#F7CB46" stroke="#000000" stroke-width="2.5" />

    <!-- Row 3: Neo Green -->
    <rect x="68" y="134" width="58" height="22" rx="6" fill="#99E885" stroke="#000000" stroke-width="2.5" />
    <rect x="136" y="134" width="58" height="22" rx="6" fill="#99E885" stroke="#000000" stroke-width="2.5" />
    <rect x="272" y="134" width="58" height="22" rx="6" fill="#99E885" stroke="#000000" stroke-width="2.5" />
  </g>

  <!-- Brick Shatter Explosion Impact Point (233, 113) -->
  <g transform="translate(233, 113)">
    <!-- Exploding brick shards -->
    <rect x="-18" y="-14" width="12" height="10" rx="3" fill="#F7CB46" stroke="#000000" stroke-width="2" transform="rotate(-30)" />
    <rect x="12" y="-16" width="10" height="8" rx="2" fill="#FE90E8" stroke="#000000" stroke-width="2" transform="rotate(40)" />
    <rect x="-12" y="12" width="10" height="10" rx="3" fill="#99E885" stroke="#000000" stroke-width="2" transform="rotate(45)" />

    <!-- Pop Stamp -->
    <g transform="rotate(-8)" filter="url(#neoShadowSm)">
      <polygon points="0,-18 6,-6 18,-6 8,2 12,14 0,6 -12,14 -8,2 -18,-6 -6,-6" fill="#FE90E8" stroke="#000000" stroke-width="2" />
      <text x="0" y="3" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="8" fill="#000000" text-anchor="middle">HIT!</text>
    </g>
  </g>

  <!-- Bouncing Ball with Trail -->
  <g transform="translate(210, 200)" filter="url(#neoShadowSm)">
    <circle cx="0" cy="0" r="18" fill="#FE90E8" stroke="#000000" stroke-width="3" />
    <circle cx="-4" cy="-4" r="5" fill="#FFFFFF" />
  </g>

  <!-- Mechanical Tactile Paddle -->
  <g transform="translate(130, 290)" filter="url(#neoShadow)">
    <rect x="0" y="0" width="140" height="24" rx="10" fill="#F7CB46" stroke="#000000" stroke-width="3.5" />
    <rect x="45" y="4" width="50" height="16" rx="6" fill="#99E885" stroke="#000000" stroke-width="2" />
    <circle cx="70" cy="12" r="4" fill="#000000" />
  </g>

  <!-- Top Multi-Ball Tag -->
  <g transform="translate(200, 26) rotate(1)">
    <rect x="-80" y="-14" width="160" height="28" rx="8" fill="#F7CB46" stroke="#000000" stroke-width="2.5" filter="url(#neoShadowSm)" />
    <text x="0" y="5" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">💥 MULTI-BALL BREAK</text>
  </g>

  <!-- Corner Figma Transform Nodes -->
  <rect x="6" y="6" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="382" y="6" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="6" y="382" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="382" y="382" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
</svg>
