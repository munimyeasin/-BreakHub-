<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="dashBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080017" />
      <stop offset="50%" stop-color="#1A0538" />
      <stop offset="100%" stop-color="#380036" />
    </linearGradient>
    <linearGradient id="dashBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </linearGradient>

    <!-- 3D Runner Palettes -->
    <linearGradient id="runnerFaceCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DF9FF" />
      <stop offset="100%" stop-color="#00D0FF" />
    </linearGradient>
    <linearGradient id="runnerSideCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088B8" />
      <stop offset="100%" stop-color="#004D66" />
    </linearGradient>

    <linearGradient id="thrusterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="35%" stop-color="#FFE600" />
      <stop offset="70%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <!-- 3D Gold Energy Coin -->
    <linearGradient id="coinFaceGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF570" />
      <stop offset="100%" stop-color="#FFDE59" />
    </linearGradient>
    <linearGradient id="coinSideGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49B00" />
      <stop offset="100%" stop-color="#805D00" />
    </linearGradient>

    <!-- 3D Hazard Spikes -->
    <linearGradient id="spikeFacePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF66B2" />
      <stop offset="100%" stop-color="#FF0055" />
    </linearGradient>
    <linearGradient id="spikeSidePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B3003C" />
      <stop offset="100%" stop-color="#660022" />
    </linearGradient>

    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="100%" stop-color="#FFE600" />
    </linearGradient>

    <!-- Neo-Brutalist Hard Drop Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowLg" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="jetGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF007F" flood-opacity="0.85" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#dashBgDark); }
    .theme-grid-line { stroke: #00F0FF; stroke-opacity: 0.12; }
    .theme-frame-bg { fill: #120424; stroke: #00F0FF; }
    .theme-stage-grid { stroke: #2E0B54; }
    .theme-floor { fill: #0B0317; stroke: #00F0FF; }
    .theme-badge-rect { fill: #FF007F; stroke: #000000; }
    .theme-badge-text { fill: #FFFFFF; }
    .theme-tag-rect { fill: #FFE600; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#dashBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.08; }
      .theme-frame-bg { fill: #FFFFFF; stroke: #000000; }
      .theme-stage-grid { stroke: #E2E8F0; }
      .theme-floor { fill: #F1F5F9; stroke: #000000; }
      .theme-badge-rect { fill: #FF007F; stroke: #000000; }
      .theme-badge-text { fill: #FFFFFF; }
      .theme-tag-rect { fill: #FFE600; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Retro Cyber Grid Backdrop -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- Neo Sparks & Cyber Dust -->
  <g fill="#FFE600">
    <polygon points="40,46 42,54 50,56 42,58 40,66 38,58 30,56 38,54" />
    <polygon points="360,40 362,48 370,50 362,52 360,60 358,52 350,50 358,48" />
    <polygon points="365,300 367,306 373,308 367,310 365,316 363,310 357,308 363,306" />
    <polygon points="34,310 36,316 42,318 36,320 34,326 32,320 26,318 32,316" />
  </g>

  <!-- 3D MAIN ARCADE CONTAINER -->
  <g filter="url(#brutalShadowLg)">
    <rect x="36" y="38" width="328" height="298" rx="22" class="theme-frame-bg" stroke-width="4" />
  </g>

  <!-- Inner Playfield Matrix Stage -->
  <rect x="48" y="48" width="304" height="278" rx="16" fill="#06010F" stroke="#000000" stroke-width="2.5" />

  <!-- Speed Motion Grid & Neon Highway Floor -->
  <g class="theme-stage-grid" stroke-width="1.2">
    <line x1="48" y1="100" x2="352" y2="100" stroke-dasharray="8,6" opacity="0.4" />
    <line x1="48" y1="160" x2="352" y2="160" stroke-dasharray="6,4" opacity="0.6" />
    <line x1="48" y1="220" x2="352" y2="220" stroke-dasharray="4,4" opacity="0.8" />
  </g>

  <!-- 3D Perspective Road Deck (Bottom Section) -->
  <g>
    <polygon points="48,270 352,270 352,326 48,326" class="theme-floor" stroke="#000000" stroke-width="2.5" />
    <line x1="48" y1="270" x2="352" y2="270" stroke="#00F0FF" stroke-width="3" />
    <!-- Road Perspective Stripes -->
    <line x1="80" y1="270" x2="60" y2="326" stroke="#00F0FF" stroke-width="2" opacity="0.6" />
    <line x1="150" y1="270" x2="135" y2="326" stroke="#00F0FF" stroke-width="2" opacity="0.6" />
    <line x1="220" y1="270" x2="215" y2="326" stroke="#00F0FF" stroke-width="2" opacity="0.6" />
    <line x1="290" y1="270" x2="295" y2="326" stroke="#00F0FF" stroke-width="2" opacity="0.6" />
  </g>

  <!-- 3D EXTRUDED LASER HAZARD SPIKES (Right Side: X=300, Y=225) -->
  <g transform="translate(300, 220)" filter="url(#brutalShadowSm)">
    <!-- Base Platform -->
    <rect x="-20" y="32" width="40" height="18" rx="4" fill="#1E072E" stroke="#000000" stroke-width="2" />
    <!-- 3D Spikes -->
    <g stroke="#000000" stroke-width="2.5">
      <!-- Spike 1 -->
      <polygon points="-16,32 -6,2 -2,32" fill="url(#spikeFacePink)" />
      <polygon points="-6,2 0,6 4,32 -2,32" fill="url(#spikeSidePink)" />
      <!-- Spike 2 -->
      <polygon points="2,32 12,8 16,32" fill="url(#spikeFacePink)" />
      <polygon points="12,8 16,12 20,32 16,32" fill="url(#spikeSidePink)" />
    </g>
    <!-- Laser Beam between tips -->
    <line x1="-6" y1="2" x2="12" y2="8" stroke="#FFE600" stroke-width="2.5" stroke-dasharray="3,2" />
  </g>

  <!-- 3D FLOATING GOLDEN ENERGY COIN (Target: X=275, Y=115) -->
  <g transform="translate(275, 115) rotate(15)" filter="url(#brutalShadow)">
    <g stroke="#000000" stroke-width="3">
      <!-- 3D Extrusion Side -->
      <polygon points="0,26 8,34 38,34 30,26" fill="url(#coinSideGold)" />
      <polygon points="30,0 38,8 38,34 30,26" fill="url(#coinSideGold)" />
      <!-- Coin Front Face -->
      <circle cx="15" cy="13" r="22" fill="url(#coinFaceGold)" />
    </g>
    <!-- Lightning Bolt Insignia -->
    <polygon points="15,2 8,14 14,14 11,24 22,11 16,11" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" />
  </g>

  <!-- 3D HERO CYBER RUNNER LEAPING (Center Left: X=150, Y=145) -->
  <g transform="translate(150, 140)" filter="url(#brutalShadowLg)">
    <!-- Jetpack Flame Thrusters -->
    <g filter="url(#jetGlow)">
      <path d="M -30,25 Q -65,35 -50,55 Q -60,70 -25,55 Q -40,40 -30,25" fill="url(#thrusterGrad)" stroke="#000000" stroke-width="2" />
    </g>

    <!-- 3D Jetpack Box -->
    <g stroke="#000000" stroke-width="3">
      <polygon points="-32,28 -24,34 -24,2 -32,-4" fill="#D97706" />
      <rect x="-32" y="-4" width="18" height="32" rx="4" fill="#F59E0B" />
    </g>

    <!-- 3D Cyber Suit Body -->
    <g stroke="#000000" stroke-width="3.5">
      <!-- Side Extrusion -->
      <polygon points="18,36 26,44 26,-4 18,-12" fill="url(#runnerSideCyan)" />
      <polygon points="-18,36 -10,44 26,44 18,36" fill="url(#runnerSideCyan)" />
      <!-- Torso Face -->
      <rect x="-18" y="-12" width="36" height="48" rx="12" fill="url(#runnerFaceCyan)" />
    </g>
    <!-- Specular Highlight Gloss -->
    <polygon points="-12,-6 12,-6 6,6 -12,6" fill="#FFFFFF" opacity="0.8" />

    <!-- Cyber Armor Chest Core -->
    <polygon points="0,2 -8,14 8,14" fill="#FFE600" stroke="#000000" stroke-width="2" />

    <!-- Running Arms -->
    <!-- Front Arm -->
    <g stroke="#000000" stroke-width="3">
      <path d="M 12,6 Q 32,-4 38,12" stroke="#000000" stroke-width="9" fill="none" stroke-linecap="round" />
      <path d="M 12,6 Q 32,-4 38,12" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" />
      <circle cx="38" cy="12" r="6" fill="#FFE600" stroke="#000000" stroke-width="2" />
    </g>
    <!-- Back Arm -->
    <g stroke="#000000" stroke-width="3">
      <path d="M -10,12 Q -26,2 -28,18" stroke="#000000" stroke-width="9" fill="none" stroke-linecap="round" />
      <path d="M -10,12 Q -26,2 -28,18" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" />
      <circle cx="-28" cy="18" r="6" fill="#FFE600" stroke="#000000" stroke-width="2" />
    </g>

    <!-- Leaping Kinetic Legs -->
    <!-- Front Leg -->
    <g stroke="#000000" stroke-width="3.5">
      <path d="M 8,32 Q 22,52 34,48" stroke="#000000" stroke-width="10" fill="none" stroke-linecap="round" />
      <path d="M 8,32 Q 22,52 34,48" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" />
      <!-- Neon Kicks -->
      <rect x="28" y="40" width="18" height="12" rx="4" fill="#FF007F" stroke="#000000" stroke-width="2.5" />
    </g>
    <!-- Back Leg -->
    <g stroke="#000000" stroke-width="3.5">
      <path d="M -8,32 Q -24,48 -36,40" stroke="#000000" stroke-width="10" fill="none" stroke-linecap="round" />
      <path d="M -8,32 Q -24,48 -36,40" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" />
      <!-- Neon Kicks -->
      <rect x="-42" y="34" width="18" height="12" rx="4" fill="#FF007F" stroke="#000000" stroke-width="2.5" />
    </g>

    <!-- 3D Cyber Helmet Head -->
    <g transform="translate(0, -32)" filter="url(#brutalShadowSm)">
      <g stroke="#000000" stroke-width="3.5">
        <polygon points="18,12 24,18 24,-14 18,-20" fill="#D4B000" />
        <ellipse cx="0" cy="0" rx="22" ry="20" fill="#FFE600" />
      </g>
      <!-- Cyber Visor Glasses -->
      <rect x="-6" y="-6" width="28" height="16" rx="6" fill="#000000" stroke="#00F0FF" stroke-width="2" />
      <rect x="-2" y="-3" width="20" height="10" rx="4" fill="#00F0FF" />
      <line x1="2" y1="-1" x2="14" y2="-1" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <!-- Ear Antenna -->
      <rect x="-18" y="-4" width="6" height="12" rx="2" fill="#FF007F" stroke="#000000" stroke-width="1.8" />
    </g>
  </g>

  <!-- ACTION POPUP COMBO BADGE: "WARP JUMP!" -->
  <g transform="translate(200, 115)" filter="url(#brutalShadow)">
    <polygon points="0,-22 8,-8 24,-14 16,-1 30,10 14,14 18,28 4,20 -4,28 -2,14 -18,18 -12,4 -28,-2 -14,-10 -20,-24 -6,-16" fill="url(#badgeGold)" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="9.5" fill="#000000" text-anchor="middle" letter-spacing="0.5">
      WARP JUMP!
    </text>
  </g>

  <!-- TOP TAG RIBBON: "HIGH SPEED CYBER RUNNER" -->
  <g transform="translate(200, 32)" filter="url(#brutalShadowSm)">
    <rect x="-85" y="-12" width="170" height="24" rx="8" class="theme-tag-rect" stroke-width="2.5" />
    <text x="0" y="4.5" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="1.2">
      HIGH SPEED CYBER RUNNER
    </text>
  </g>

  <!-- BOTTOM TITLE MARQUEE: "CYBER DASH 2077" -->
  <g transform="translate(200, 360)" filter="url(#brutalShadowLg)">
    <rect x="-125" y="-18" width="250" height="36" rx="12" class="theme-badge-rect" stroke-width="3.5" />
    <rect x="-120" y="-14" width="240" height="28" rx="8" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.3" />
    <text x="0" y="6" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="15" text-anchor="middle" letter-spacing="1.5">
      CYBER DASH 2077
    </text>
  </g>

  <!-- Bottom Left/Right Rivet Accents -->
  <circle cx="84" cy="360" r="3" fill="#000000" />
  <circle cx="316" cy="360" r="3" fill="#000000" />
</svg>
