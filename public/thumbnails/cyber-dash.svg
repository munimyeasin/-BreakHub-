<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="dashBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070014" />
      <stop offset="50%" stop-color="#19063B" />
      <stop offset="100%" stop-color="#3D0043" />
    </linearGradient>
    <linearGradient id="dashBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </linearGradient>
    <linearGradient id="runnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="thrusterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="60%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#dashBgDark); }
    .theme-grid-line { stroke: #00F0FF; stroke-opacity: 0.15; }
    .theme-floor { fill: #0C0721; stroke: #000000; }
    .theme-badge-rect { fill: #FF007F; stroke: #000000; }
    .theme-badge-text { fill: #FFFFFF; }
    .theme-tag-rect { fill: #FFE600; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#dashBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.1; }
      .theme-floor { fill: #FFFFFF; stroke: #000000; }
      .theme-badge-rect { fill: #FF007F; stroke: #000000; }
      .theme-badge-text { fill: #FFFFFF; }
      .theme-tag-rect { fill: #FFE600; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Speed Lines Background -->
  <g class="theme-grid-line" stroke-width="2.5" stroke-linecap="round">
    <line x1="30" y1="60" x2="180" y2="60" />
    <line x1="10" y1="130" x2="120" y2="130" />
    <line x1="40" y1="210" x2="220" y2="210" />
    <line x1="20" y1="280" x2="160" y2="280" />
  </g>

  <!-- Platform Floor -->
  <g transform="translate(0, 310)">
    <rect x="-10" y="0" width="420" height="90" class="theme-floor" stroke-width="4" />
    <line x1="0" y1="0" x2="400" y2="0" stroke="#00F0FF" stroke-width="4" />
    <g stroke="#00F0FF" stroke-width="2" opacity="0.3">
      <line x1="50" y1="0" x2="30" y2="90" />
      <line x1="120" y1="0" x2="100" y2="90" />
      <line x1="190" y1="0" x2="170" y2="90" />
      <line x1="260" y1="0" x2="240" y2="90" />
      <line x1="330" y1="0" x2="310" y2="90" />
    </g>
  </g>

  <!-- Laser Hurdle Hazard (Obstacle) -->
  <g filter="url(#brutalShadowSm)" transform="translate(320, 230)">
    <rect x="0" y="10" width="18" height="70" rx="6" fill="#FF0055" stroke="#000000" stroke-width="3" />
    <rect x="25" y="40" width="18" height="40" rx="6" fill="#FF0055" stroke="#000000" stroke-width="3" />
    <line x1="9" y1="25" x2="34" y2="55" stroke="#FFE600" stroke-width="4" stroke-dasharray="4,2" />
    <!-- Hazard Icon -->
    <polygon points="9,-5 0,10 18,10" fill="#FFE600" stroke="#000000" stroke-width="2" />
  </g>

  <!-- Collectible Energy Coin -->
  <g filter="url(#brutalShadowSm)" transform="translate(280, 115)">
    <circle cx="0" cy="0" r="20" fill="#FFE600" stroke="#000000" stroke-width="3.5" />
    <circle cx="0" cy="0" r="14" fill="#FF7700" stroke="#000000" stroke-width="1.5" />
    <text x="0" y="6" font-family="'Arial Black', sans-serif" font-size="16" fill="#FFFFFF" font-weight="900" text-anchor="middle">⚡</text>
    <!-- Sparkles -->
    <polygon points="0,-30 3,-22 11,-19 3,-16 0,-8 -3,-16 -11,-19 -3,-22" fill="#FFE600" stroke="#000000" stroke-width="1" />
  </g>

  <!-- Cartoon Cyber Runner in Leaping Sprint -->
  <g transform="translate(135, 110)" filter="url(#brutalShadow)">
    <!-- Jetpack Flames -->
    <path d="M -25,50 Q -65,65 -45,75 Q -55,90 -20,80 Q -35,65 -25,50" fill="url(#thrusterGrad)" stroke="#000000" stroke-width="2" />

    <!-- Jetpack Box -->
    <rect x="-28" y="25" width="22" height="35" rx="6" fill="#FFAA00" stroke="#000000" stroke-width="3.5" />

    <!-- Runner Body / Hoodie -->
    <rect x="-10" y="20" width="48" height="52" rx="16" fill="url(#runnerGrad)" stroke="#000000" stroke-width="4" />

    <!-- Arms / Hands in running sprint pose -->
    <path d="M 30,35 Q 55,20 65,38" stroke="#000000" stroke-width="10" fill="none" stroke-linecap="round" />
    <path d="M 30,35 Q 55,20 65,38" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" />
    <circle cx="65" cy="38" r="8" fill="#FFE600" stroke="#000000" stroke-width="2.5" />

    <path d="M -5,45 Q -25,35 -30,50" stroke="#000000" stroke-width="10" fill="none" stroke-linecap="round" />
    <path d="M -5,45 Q -25,35 -30,50" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" />
    <circle cx="-30" cy="50" r="8" fill="#FFE600" stroke="#000000" stroke-width="2.5" />

    <!-- Legs in dynamic leap -->
    <!-- Front Leg -->
    <path d="M 22,65 Q 40,85 55,80" stroke="#000000" stroke-width="11" fill="none" stroke-linecap="round" />
    <path d="M 22,65 Q 40,85 55,80" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" />
    <!-- Sneaker Front -->
    <rect x="50" y="70" width="24" height="15" rx="6" fill="#FF007F" stroke="#000000" stroke-width="3" />

    <!-- Back Leg -->
    <path d="M 0,65 Q -20,85 -35,75" stroke="#000000" stroke-width="11" fill="none" stroke-linecap="round" />
    <path d="M 0,65 Q -20,85 -35,75" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" />
    <!-- Sneaker Back -->
    <rect x="-48" y="70" width="24" height="15" rx="6" fill="#FF007F" stroke="#000000" stroke-width="3" />

    <!-- Cute Round Head with Cyber Visor Helmet -->
    <circle cx="15" cy="-2" r="32" fill="#FFE600" stroke="#000000" stroke-width="4" />
    <!-- Cyber Visor / Goggles -->
    <rect x="0" y="-12" width="40" height="22" rx="8" fill="#00F0FF" stroke="#000000" stroke-width="3" />
    <!-- Cute Visor Highlight -->
    <line x1="8" y1="-7" x2="32" y2="-7" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    <!-- Smiling Mouth -->
    <path d="M 8,16 Q 16,24 24,16" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Cute Blushing Cheek -->
    <circle cx="2" cy="12" r="4" fill="#FF007F" />
  </g>

  <!-- Top Tag Pill: ENDLESS CYBER PLATFORMER -->
  <g transform="translate(200, 24)" filter="url(#brutalShadowSm)">
    <rect x="-95" y="-10" width="190" height="20" rx="6" class="theme-tag-rect" stroke-width="2" />
    <text x="0" y="4" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="8.5" font-weight="900" text-anchor="middle" letter-spacing="1">ENDLESS CYBER PLATFORMER</text>
  </g>

  <!-- Bottom Title Badge Pill: CYBER DASH 2077 -->
  <g transform="translate(200, 366)" filter="url(#brutalShadowSm)">
    <rect x="-95" y="-15" width="190" height="30" rx="10" class="theme-badge-rect" stroke-width="3" />
    <text x="0" y="5" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1.5">CYBER DASH 2077</text>
  </g>
</svg>
