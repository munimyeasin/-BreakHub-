<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070014" />
      <stop offset="60%" stop-color="#19063b" />
      <stop offset="100%" stop-color="#3d0043" />
    </linearGradient>
    <linearGradient id="runnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    <linearGradient id="thrusterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="60%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#7700ff" />
    </linearGradient>
    <filter id="dashGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f0ff" flood-opacity="0.8" />
    </filter>
    <filter id="laserGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff007f" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#dashBg)" />

  <!-- Speed Lines Background -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.15" stroke-linecap="round">
    <line x1="30" y1="60" x2="180" y2="60" />
    <line x1="10" y1="130" x2="120" y2="130" />
    <line x1="40" y1="210" x2="220" y2="210" />
    <line x1="20" y1="280" x2="160" y2="280" />
    <line x1="50" y1="340" x2="260" y2="340" />
  </g>

  <!-- Neon Platform Floor -->
  <rect x="0" y="320" width="400" height="80" fill="#0c0721" />
  <line x1="0" y1="320" x2="400" y2="320" stroke="#00f0ff" stroke-width="5" filter="url(#dashGlow)" />
  <g stroke="#00f0ff" stroke-width="1.5" opacity="0.3">
    <line x1="50" y1="320" x2="30" y2="400" />
    <line x1="120" y1="320" x2="100" y2="400" />
    <line x1="190" y1="320" x2="170" y2="400" />
    <line x1="260" y1="320" x2="240" y2="400" />
    <line x1="330" y1="320" x2="310" y2="400" />
  </g>

  <!-- Laser Hurdle Hazard (Cartoon Obstacle) -->
  <g filter="url(#laserGlow)">
    <rect x="315" y="240" width="18" height="80" rx="6" fill="#ff0055" stroke="#ffffff" stroke-width="3" />
    <rect x="340" y="270" width="18" height="50" rx="6" fill="#ff0055" stroke="#ffffff" stroke-width="3" />
    <line x1="324" y1="255" x2="349" y2="285" stroke="#ffffff" stroke-width="4" />
    <!-- Hazard Warning icon -->
    <polygon points="324,220 315,235 333,235" fill="#ffe600" stroke="#000" stroke-width="1.5" />
  </g>

  <!-- Cute Cartoon Runner Boy in mid-air Jump -->
  <g filter="url(#dashGlow)" transform="translate(140, 110)">
    <!-- Jetpack Flames -->
    <path d="M -25,50 Q -65,65 -45,75 Q -55,90 -20,80 Q -35,65 -25,50" fill="url(#thrusterGrad)" />

    <!-- Jetpack Box -->
    <rect x="-28" y="25" width="22" height="35" rx="6" fill="#ffaa00" stroke="#ffffff" stroke-width="3" />

    <!-- Runner Body / Hoodie -->
    <rect x="-10" y="20" width="46" height="50" rx="16" fill="url(#runnerGrad)" stroke="#ffffff" stroke-width="4" />

    <!-- Arms / Hands in running sprint pose -->
    <path d="M 30,35 Q 55,20 65,38" stroke="#ffffff" stroke-width="9" fill="none" stroke-linecap="round" />
    <circle cx="65" cy="38" r="8" fill="#ffe600" stroke="#000" stroke-width="2" />

    <path d="M -5,45 Q -25,35 -30,50" stroke="#ffffff" stroke-width="9" fill="none" stroke-linecap="round" />
    <circle cx="-30" cy="50" r="8" fill="#ffe600" stroke="#000" stroke-width="2" />

    <!-- Legs in dynamic leap -->
    <!-- Front Leg -->
    <path d="M 22,65 Q 40,85 55,80" stroke="#ffffff" stroke-width="10" fill="none" stroke-linecap="round" />
    <!-- Sneaker Front -->
    <rect x="50" y="70" width="22" height="14" rx="6" fill="#ff007f" stroke="#ffffff" stroke-width="2.5" />

    <!-- Back Leg -->
    <path d="M 0,65 Q -20,85 -35,75" stroke="#ffffff" stroke-width="10" fill="none" stroke-linecap="round" />
    <!-- Sneaker Back -->
    <rect x="-48" y="70" width="22" height="14" rx="6" fill="#ff007f" stroke="#ffffff" stroke-width="2.5" />

    <!-- Cute Round Head with Cyber Visor Helmet -->
    <circle cx="15" cy="-2" r="32" fill="#0d0221" stroke="#ffffff" stroke-width="4" />
    <!-- Cyber Visor / Goggles -->
    <rect x="0" y="-12" width="38" height="20" rx="8" fill="#00f0ff" stroke="#ffffff" stroke-width="2.5" />
    <!-- Cute Visor Highlight -->
    <line x1="8" y1="-7" x2="30" y2="-7" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <!-- Smiling Mouth -->
    <path d="M 8,16 Q 16,24 24,16" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Cute Blushing Cheek -->
    <circle cx="2" cy="12" r="4" fill="#ff007f" />
  </g>

  <!-- Collectible Energy Coin -->
  <g filter="url(#dashGlow)">
    <circle cx="270" cy="120" r="18" fill="#ffe600" stroke="#ffffff" stroke-width="3" />
    <circle cx="270" cy="120" r="12" fill="#ffaa00" />
    <text x="270" y="125" font-family="'Arial Black', sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">⚡</text>
    <!-- Sparkles -->
    <path d="M 270,90 L 273,98 L 281,101 L 273,104 L 270,112 L 267,104 L 259,101 L 267,98 Z" fill="#ffffff" />
  </g>

  <!-- Title Badge -->
  <rect x="25" y="340" width="130" height="32" rx="10" fill="#ff007f" opacity="0.2" stroke="#ff007f" stroke-width="1.5" />
  <text x="90" y="361" fill="#ff007f" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">CYBER DASH</text>
</svg>
