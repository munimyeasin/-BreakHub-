<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="puzBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080219" />
      <stop offset="50%" stop-color="#190638" />
      <stop offset="100%" stop-color="#2D0A54" />
    </linearGradient>
    <linearGradient id="puzBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>

    <!-- Glow & Brutal Shadows -->
    <filter id="cubeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FFE600" flood-opacity="0.8" />
    </filter>
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#puzBgDark); }
    .theme-grid-line { stroke: #C084FC; stroke-opacity: 0.15; }
    .theme-board-bg { fill: #1B093B; stroke: #FFE600; }
    .theme-slot-bg { fill: #100424; stroke: #33115E; }
    .theme-badge-rect { fill: #FFE600; stroke: #000000; }
    .theme-badge-text { fill: #000000; }
    .theme-tag-rect { fill: #C084FC; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#puzBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.1; }
      .theme-board-bg { fill: #FFFFFF; stroke: #000000; }
      .theme-slot-bg { fill: #F1F5F9; stroke: #E2E8F0; }
      .theme-badge-rect { fill: #FFE600; stroke: #000000; }
      .theme-badge-text { fill: #000000; }
      .theme-tag-rect { fill: #C084FC; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Cyber Grid Pattern Overlay -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- 4x4 Grid Board Platform with Neo-Brutalist Drop Shadow -->
  <g filter="url(#brutalShadow)">
    <rect x="44" y="44" width="312" height="300" rx="24" class="theme-board-bg" stroke-width="4" />
  </g>

  <!-- Grid Cell Slots (4x4 Matrix) -->
  <g class="theme-slot-bg" stroke-width="2">
    <!-- Row 0 -->
    <rect x="56" y="56" width="65" height="65" rx="14" />
    <rect x="131" y="56" width="65" height="65" rx="14" />
    <rect x="206" y="56" width="65" height="65" rx="14" />
    <rect x="281" y="56" width="65" height="65" rx="14" />

    <!-- Row 1 -->
    <rect x="56" y="131" width="65" height="65" rx="14" />
    <rect x="131" y="131" width="65" height="65" rx="14" />
    <rect x="206" y="131" width="65" height="65" rx="14" />
    <rect x="281" y="131" width="65" height="65" rx="14" />

    <!-- Row 2 -->
    <rect x="56" y="206" width="65" height="65" rx="14" />
    <rect x="131" y="206" width="65" height="65" rx="14" />
    <rect x="206" y="206" width="65" height="65" rx="14" />
    <rect x="281" y="206" width="65" height="65" rx="14" />

    <!-- Row 3 -->
    <rect x="56" y="281" width="65" height="65" rx="14" />
    <rect x="131" y="281" width="65" height="65" rx="14" />
    <rect x="206" y="281" width="65" height="65" rx="14" />
    <rect x="281" y="281" width="65" height="65" rx="14" />
  </g>

  <!-- Number Cube 8 (Orange Top Left) -->
  <g transform="translate(56, 56)" filter="url(#brutalShadowSm)">
    <rect width="65" height="65" rx="14" fill="#FB923C" stroke="#000000" stroke-width="3" />
    <text x="32.5" y="44" font-family="'Arial Black', 'Impact', sans-serif" font-size="30" fill="#000000" font-weight="900" text-anchor="middle">8</text>
    <circle cx="20" cy="18" r="2.5" fill="#000" />
    <circle cx="45" cy="18" r="2.5" fill="#000" />
  </g>

  <!-- Number Cube 16 (Pink Top Mid-Left) -->
  <g transform="translate(131, 56)" filter="url(#brutalShadowSm)">
    <rect width="65" height="65" rx="14" fill="#FF007F" stroke="#000000" stroke-width="3" />
    <text x="32.5" y="43" font-family="'Arial Black', 'Impact', sans-serif" font-size="26" fill="#000000" font-weight="900" text-anchor="middle">16</text>
    <circle cx="18" cy="18" r="2.5" fill="#000" />
    <circle cx="47" cy="18" r="2.5" fill="#000" />
  </g>

  <!-- Number Cube 32 (Purple Top Right) -->
  <g transform="translate(281, 56)" filter="url(#brutalShadowSm)">
    <rect width="65" height="65" rx="14" fill="#C084FC" stroke="#000000" stroke-width="3" />
    <text x="32.5" y="43" font-family="'Arial Black', 'Impact', sans-serif" font-size="26" fill="#000000" font-weight="900" text-anchor="middle">32</text>
  </g>

  <!-- Number Cube 2 (Cyan Mid Left) -->
  <g transform="translate(56, 131)" filter="url(#brutalShadowSm)">
    <rect width="65" height="65" rx="14" fill="#00F0FF" stroke="#000000" stroke-width="3" />
    <text x="32.5" y="44" font-family="'Arial Black', 'Impact', sans-serif" font-size="30" fill="#000000" font-weight="900" text-anchor="middle">2</text>
    <!-- Cute Face -->
    <circle cx="20" cy="18" r="2.5" fill="#000" />
    <circle cx="45" cy="18" r="2.5" fill="#000" />
    <path d="M 28,24 Q 32.5,28 37,24" stroke="#000" stroke-width="1.5" fill="none" />
  </g>

  <!-- Number Cube 4 (Lime Mid-Center) -->
  <g transform="translate(131, 131)" filter="url(#brutalShadowSm)">
    <rect width="65" height="65" rx="14" fill="#A3E635" stroke="#000000" stroke-width="3" />
    <text x="32.5" y="44" font-family="'Arial Black', 'Impact', sans-serif" font-size="30" fill="#000000" font-weight="900" text-anchor="middle">4</text>
    <circle cx="20" cy="18" r="2.5" fill="#000" />
    <circle cx="45" cy="18" r="2.5" fill="#000" />
  </g>

  <!-- Number Cube 64 (Row 2 Left) -->
  <g transform="translate(56, 206)" filter="url(#brutalShadowSm)">
    <rect width="65" height="65" rx="14" fill="#E11D48" stroke="#000000" stroke-width="3" />
    <text x="32.5" y="43" font-family="'Arial Black', 'Impact', sans-serif" font-size="26" fill="#FFFFFF" font-weight="900" text-anchor="middle">64</text>
  </g>

  <!-- Number Cube 128 (Row 3 Left) -->
  <g transform="translate(56, 281)" filter="url(#brutalShadowSm)">
    <rect width="65" height="65" rx="14" fill="#FFE600" stroke="#000000" stroke-width="3" />
    <text x="32.5" y="43" font-family="'Arial Black', 'Impact', sans-serif" font-size="24" fill="#000000" font-weight="900" text-anchor="middle">128</text>
  </g>

  <!-- Number Cube 512 (Row 3 Mid-Left) -->
  <g transform="translate(131, 281)" filter="url(#brutalShadowSm)">
    <rect width="65" height="65" rx="14" fill="#00F0FF" stroke="#000000" stroke-width="3" />
    <text x="32.5" y="43" font-family="'Arial Black', 'Impact', sans-serif" font-size="24" fill="#000000" font-weight="900" text-anchor="middle">512</text>
  </g>

  <!-- Giant Golden 2048 Crown Cube Merging! -->
  <g filter="url(#cubeGlow)" transform="translate(206, 175)">
    <g filter="url(#brutalShadow)">
      <!-- Golden Cube Body -->
      <rect x="0" y="0" width="140" height="140" rx="24" fill="#FFE600" stroke="#000000" stroke-width="4.5" />

      <!-- Cute Crown on 2048 Cube -->
      <polygon points="35,-16 48,6 70,-20 92,6 105,-16 105,6 35,6" fill="#FF7700" stroke="#000000" stroke-width="3" />
      <circle cx="35" cy="-16" r="3.5" fill="#FF007F" stroke="#000000" stroke-width="1.5" />
      <circle cx="70" cy="-20" r="4.5" fill="#00F0FF" stroke="#000000" stroke-width="1.5" />
      <circle cx="105" cy="-16" r="3.5" fill="#FF007F" stroke="#000000" stroke-width="1.5" />

      <!-- 2048 Big Text -->
      <text x="70" y="86" font-family="'Impact', 'Arial Black', sans-serif" font-size="40" fill="#000000" font-weight="900" text-anchor="middle" letter-spacing="1">2048</text>

      <!-- Cute Happy Eyes & Blushing Face -->
      <ellipse cx="46" cy="40" rx="6" ry="8" fill="#000000" />
      <circle cx="48" cy="37" r="2.5" fill="#FFFFFF" />
      <ellipse cx="94" cy="40" rx="6" ry="8" fill="#000000" />
      <circle cx="96" cy="37" r="2.5" fill="#FFFFFF" />

      <path d="M 58,50 Q 70,62 82,50" stroke="#000000" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <circle cx="32" cy="50" r="6" fill="#FF007F" opacity="0.7" />
      <circle cx="108" cy="50" r="6" fill="#FF007F" opacity="0.7" />

      <!-- Sparkles -->
      <polygon points="126,-10 129,-3 136,0 129,3 126,10 123,3 116,0 123,-3" fill="#000000" />
      <polygon points="126,-10 129,-3 136,0 129,3 126,10 123,3 116,0 123,-3" fill="#FFFFFF" transform="scale(0.8) translate(30,0)" />
    </g>
  </g>

  <!-- Top Tag Pill: SLIDING NUMBER MERGE -->
  <g transform="translate(200, 24)" filter="url(#brutalShadowSm)">
    <rect x="-85" y="-10" width="170" height="20" rx="6" class="theme-tag-rect" stroke-width="2" />
    <text x="0" y="4" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1">SLIDING NUMBER MERGE</text>
  </g>

  <!-- Bottom Title Badge Pill: QUANTUM 2048 -->
  <g transform="translate(200, 366)" filter="url(#brutalShadowSm)">
    <rect x="-95" y="-15" width="190" height="30" rx="10" class="theme-badge-rect" stroke-width="3" />
    <text x="0" y="5" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1.5">QUANTUM 2048</text>
  </g>
</svg>
