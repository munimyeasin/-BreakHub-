<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="q2048BgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e041d" />
      <stop offset="50%" stop-color="#1e083c" />
      <stop offset="100%" stop-color="#080114" />
    </linearGradient>
    <linearGradient id="q2048BgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#F5EEFF" />
    </linearGradient>

    <!-- 3D 2048 Hero Gold Palette -->
    <linearGradient id="cube2048Face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF97A" />
      <stop offset="50%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#FFC000" />
    </linearGradient>
    <linearGradient id="cube2048Side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49B00" />
      <stop offset="100%" stop-color="#805D00" />
    </linearGradient>

    <!-- 3D 1024 Purple Palette -->
    <linearGradient id="cube1024Face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8B4FE" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="cube1024Side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B21A8" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>

    <!-- 3D 512 Pink Palette -->
    <linearGradient id="cube512Face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF77C8" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <linearGradient id="cube512Side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8005A" />
      <stop offset="100%" stop-color="#700037" />
    </linearGradient>

    <!-- 3D 256 Cyan Palette -->
    <linearGradient id="cube256Face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DF9FF" />
      <stop offset="100%" stop-color="#00D0FF" />
    </linearGradient>
    <linearGradient id="cube256Side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088B8" />
      <stop offset="100%" stop-color="#005070" />
    </linearGradient>

    <!-- 3D 128 Lime Palette -->
    <linearGradient id="cube128Face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BEF264" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>
    <linearGradient id="cube128Side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4D7C0F" />
      <stop offset="100%" stop-color="#365314" />
    </linearGradient>

    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="100%" stop-color="#FFE600" />
    </linearGradient>

    <!-- Neo-Brutalist Hard Drop Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowLg" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="fusionGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#FFE600" flood-opacity="0.85" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#q2048BgDark); }
    .theme-grid-line { stroke: #FFFFFF; stroke-opacity: 0.12; }
    .theme-frame-bg { fill: #14082B; stroke: #FFE600; }
    .theme-stage-grid { stroke: #2D1456; }
    .theme-slot-bg { fill: #1A0B36; stroke: #3D1C7A; }
    .theme-badge-rect { fill: #FFE600; stroke: #000000; }
    .theme-badge-text { fill: #000000; }
    .theme-tag-rect { fill: #C084FC; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#q2048BgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.08; }
      .theme-frame-bg { fill: #FFFFFF; stroke: #000000; }
      .theme-stage-grid { stroke: #E2E8F0; }
      .theme-slot-bg { fill: #F8FAFC; stroke: #CBD5E1; }
      .theme-badge-rect { fill: #FFE600; stroke: #000000; }
      .theme-badge-text { fill: #000000; }
      .theme-tag-rect { fill: #C084FC; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Retro Cyber Grid Backdrop -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- Neo Sparks & Power Nodes -->
  <g fill="#FFE600">
    <polygon points="40,46 42,54 50,56 42,58 40,66 38,58 30,56 38,54" />
    <polygon points="360,40 362,48 370,50 362,52 360,60 358,52 350,50 358,48" />
    <polygon points="365,300 367,306 373,308 367,310 365,316 363,310 357,308 363,306" />
    <polygon points="34,310 36,316 42,318 36,320 34,326 32,320 26,318 32,316" />
  </g>

  <!-- 3D MAIN ARCADE CONTAINER -->
  <g filter="url(#brutalShadowLg)">
    <rect x="36" y="38" width="328" height="298" rx="22" class="theme-frame-bg" stroke-width="4" />
  </g>

  <!-- Inner Playfield Matrix Stage -->
  <rect x="48" y="48" width="304" height="278" rx="16" fill="#070212" stroke="#000000" stroke-width="2.5" />

  <!-- 4x4 Tactile Recessed Grid Slots -->
  <g class="theme-slot-bg" stroke-width="2">
    <!-- Row 0 -->
    <rect x="58" y="58" width="65" height="58" rx="10" />
    <rect x="130" y="58" width="65" height="58" rx="10" />
    <rect x="202" y="58" width="65" height="58" rx="10" />
    <rect x="274" y="58" width="65" height="58" rx="10" />
    <!-- Row 1 -->
    <rect x="58" y="123" width="65" height="58" rx="10" />
    <rect x="130" y="123" width="65" height="58" rx="10" />
    <rect x="202" y="123" width="65" height="58" rx="10" />
    <rect x="274" y="123" width="65" height="58" rx="10" />
    <!-- Row 2 -->
    <rect x="58" y="188" width="65" height="58" rx="10" />
    <rect x="130" y="188" width="65" height="58" rx="10" />
    <rect x="202" y="188" width="65" height="58" rx="10" />
    <rect x="274" y="188" width="65" height="58" rx="10" />
    <!-- Row 3 -->
    <rect x="58" y="253" width="65" height="58" rx="10" />
    <rect x="130" y="253" width="65" height="58" rx="10" />
    <rect x="202" y="253" width="65" height="58" rx="10" />
    <rect x="274" y="253" width="65" height="58" rx="10" />
  </g>

  <!-- 3D PERIPHERAL NUMBER CUBES -->
  <!-- Top-Left Cube: "128" Lime (Slot 0,0) -->
  <g transform="translate(60, 60)" filter="url(#brutalShadowSm)">
    <g stroke="#000000" stroke-width="2">
      <!-- 3D Extrusion Side -->
      <polygon points="0,50 6,56 65,56 61,50" fill="url(#cube128Side)" />
      <polygon points="61,0 67,6 67,56 61,50" fill="url(#cube128Side)" />
      <!-- Face -->
      <rect x="0" y="0" width="61" height="50" rx="8" fill="url(#cube128Face)" />
    </g>
    <text x="30.5" y="34" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="22" fill="#000000" text-anchor="middle">128</text>
  </g>

  <!-- Top-MidLeft Cube: "256" Cyan (Slot 0,1) -->
  <g transform="translate(132, 60)" filter="url(#brutalShadowSm)">
    <g stroke="#000000" stroke-width="2">
      <polygon points="0,50 6,56 65,56 61,50" fill="url(#cube256Side)" />
      <polygon points="61,0 67,6 67,56 61,50" fill="url(#cube256Side)" />
      <rect x="0" y="0" width="61" height="50" rx="8" fill="url(#cube256Face)" />
    </g>
    <text x="30.5" y="34" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="22" fill="#000000" text-anchor="middle">256</text>
  </g>

  <!-- Mid-Left Cube: "512" Pink (Slot 1,0) -->
  <g transform="translate(60, 125)" filter="url(#brutalShadowSm)">
    <g stroke="#000000" stroke-width="2">
      <polygon points="0,50 6,56 65,56 61,50" fill="url(#cube512Side)" />
      <polygon points="61,0 67,6 67,56 61,50" fill="url(#cube512Side)" />
      <rect x="0" y="0" width="61" height="50" rx="8" fill="url(#cube512Face)" />
    </g>
    <text x="30.5" y="34" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="22" fill="#000000" text-anchor="middle">512</text>
  </g>

  <!-- Bottom-Left Cube: "1024" Purple (Slot 3,0) -->
  <g transform="translate(60, 255)" filter="url(#brutalShadowSm)">
    <g stroke="#000000" stroke-width="2">
      <polygon points="0,50 6,56 65,56 61,50" fill="url(#cube1024Side)" />
      <polygon points="61,0 67,6 67,56 61,50" fill="url(#cube1024Side)" />
      <rect x="0" y="0" width="61" height="50" rx="8" fill="url(#cube1024Face)" />
    </g>
    <text x="30.5" y="34" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="20" fill="#000000" text-anchor="middle">1024</text>
  </g>

  <!-- Bottom-MidLeft Cube: "64" Lime (Slot 3,1) -->
  <g transform="translate(132, 255)" filter="url(#brutalShadowSm)">
    <g stroke="#000000" stroke-width="2">
      <polygon points="0,50 6,56 65,56 61,50" fill="url(#cube128Side)" />
      <polygon points="61,0 67,6 67,56 61,50" fill="url(#cube128Side)" />
      <rect x="0" y="0" width="61" height="50" rx="8" fill="url(#cube128Face)" />
    </g>
    <text x="30.5" y="34" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="24" fill="#000000" text-anchor="middle">64</text>
  </g>

  <!-- FUSION MERGE ENERGY ARCS (Toward Giant 2048 Cube) -->
  <g stroke="#FFE600" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M 125,90 Q 180,110 205,140" stroke-dasharray="6,4" />
    <path d="M 125,220 Q 180,200 205,185" stroke-dasharray="6,4" />
  </g>

  <!-- 3D HERO GIANT MERGED 2048 GOLD TITAN CUBE (Spanning 2x2 Sector: X=204, Y=125) -->
  <g transform="translate(202, 125)" filter="url(#fusionGlow)">
    <g filter="url(#brutalShadowLg)">
      <!-- 3D Extrusion Side & Bottom -->
      <g stroke="#000000" stroke-width="3.5">
        <polygon points="0,180 12,192 142,192 130,180" fill="url(#cube2048Side)" />
        <polygon points="130,0 142,12 142,192 130,180" fill="url(#cube2048Side)" />
        <!-- Main Face -->
        <rect x="0" y="0" width="130" height="180" rx="16" fill="url(#cube2048Face)" />
      </g>

      <!-- Specular Highlight Gloss Spine -->
      <polygon points="10,12 120,12 110,32 10,32" fill="#FFFFFF" opacity="0.75" />

      <!-- 3D Imperial Gold Crown -->
      <g transform="translate(65, -8)">
        <polygon points="-35,0 -22,-20 0,-8 22,-20 35,0 0,6" fill="#FF7700" stroke="#000000" stroke-width="3" />
        <circle cx="-22" cy="-20" r="4.5" fill="#FF007F" stroke="#000000" stroke-width="1.8" />
        <circle cx="0" cy="-8" r="6" fill="#00F0FF" stroke="#000000" stroke-width="2" />
        <circle cx="22" cy="-20" r="4.5" fill="#FF007F" stroke="#000000" stroke-width="1.8" />
      </g>

      <!-- Giant 2048 Number Typography -->
      <text x="65" y="105" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#000000" text-anchor="middle" letter-spacing="1">
        2048
      </text>

      <!-- Cyber Mascot Eyes & Smile -->
      <g>
        <ellipse cx="40" cy="54" rx="7" ry="9" fill="#000000" />
        <circle cx="43" cy="51" r="3" fill="#FFFFFF" />
        <ellipse cx="90" cy="54" rx="7" ry="9" fill="#000000" />
        <circle cx="93" cy="51" r="3" fill="#FFFFFF" />
        <path d="M 52,66 Q 65,78 78,66" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round" />
        <circle cx="26" cy="65" r="7" fill="#FF007F" opacity="0.6" />
        <circle cx="104" cy="65" r="7" fill="#FF007F" opacity="0.6" />
      </g>

      <!-- Bottom Subtitle Badge on Cube -->
      <rect x="25" y="128" width="80" height="22" rx="6" fill="#000000" />
      <text x="65" y="143" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="11" fill="#FFE600" text-anchor="middle" letter-spacing="1">
        MASTER CORE
      </text>
    </g>
  </g>

  <!-- ACTION POPUP COMBO BADGE: "HYPER MERGE!" -->
  <g transform="translate(200, 116)" filter="url(#brutalShadow)">
    <polygon points="0,-22 8,-8 24,-14 16,-1 30,10 14,14 18,28 4,20 -4,28 -2,14 -18,18 -12,4 -28,-2 -14,-10 -20,-24 -6,-16" fill="url(#badgeGold)" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="9" fill="#000000" text-anchor="middle" letter-spacing="0.5">
      HYPER MERGE!
    </text>
  </g>

  <!-- TOP TAG RIBBON: "NEURAL MERGE MATRIX" -->
  <g transform="translate(200, 32)" filter="url(#brutalShadowSm)">
    <rect x="-85" y="-12" width="170" height="24" rx="8" class="theme-tag-rect" stroke-width="2.5" />
    <text x="0" y="4.5" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="10.5" text-anchor="middle" letter-spacing="1.2">
      NEURAL MERGE MATRIX
    </text>
  </g>

  <!-- BOTTOM TITLE MARQUEE: "QUANTUM 2048" -->
  <g transform="translate(200, 360)" filter="url(#brutalShadowLg)">
    <rect x="-125" y="-18" width="250" height="36" rx="12" class="theme-badge-rect" stroke-width="3.5" />
    <rect x="-120" y="-14" width="240" height="28" rx="8" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.3" />
    <text x="0" y="6" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="15" text-anchor="middle" letter-spacing="1.5">
      QUANTUM 2048
    </text>
  </g>

  <!-- Bottom Left/Right Rivet Accents -->
  <circle cx="84" cy="360" r="3" fill="#000000" />
  <circle cx="316" cy="360" r="3" fill="#000000" />
</svg>
