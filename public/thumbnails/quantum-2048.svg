<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="neoShadowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000000" />
    </filter>
    <filter id="neoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" />
    </filter>
    <filter id="neoShadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Neo Ground -->
  <rect width="400" height="400" fill="#FAF8F5" />

  <!-- Dot Matrix Grid -->
  <g fill="#000000" opacity="0.08">
    <circle cx="40" cy="40" r="2" /><circle cx="100" cy="40" r="2" /><circle cx="160" cy="40" r="2" /><circle cx="220" cy="40" r="2" /><circle cx="280" cy="40" r="2" /><circle cx="340" cy="40" r="2" />
    <circle cx="40" cy="100" r="2" /><circle cx="100" cy="100" r="2" /><circle cx="160" cy="100" r="2" /><circle cx="220" cy="100" r="2" /><circle cx="280" cy="100" r="2" /><circle cx="340" cy="100" r="2" />
    <circle cx="40" cy="160" r="2" /><circle cx="100" cy="160" r="2" /><circle cx="160" cy="160" r="2" /><circle cx="220" cy="160" r="2" /><circle cx="280" cy="160" r="2" /><circle cx="340" cy="160" r="2" />
    <circle cx="40" cy="220" r="2" /><circle cx="100" cy="220" r="2" /><circle cx="160" cy="220" r="2" /><circle cx="220" cy="220" r="2" /><circle cx="280" cy="220" r="2" /><circle cx="340" cy="220" r="2" />
    <circle cx="40" cy="280" r="2" /><circle cx="100" cy="280" r="2" /><circle cx="160" cy="280" r="2" /><circle cx="220" cy="280" r="2" /><circle cx="280" cy="280" r="2" /><circle cx="340" cy="280" r="2" />
    <circle cx="40" cy="340" r="2" /><circle cx="100" cy="340" r="2" /><circle cx="160" cy="340" r="2" /><circle cx="220" cy="340" r="2" /><circle cx="280" cy="340" r="2" /><circle cx="340" cy="340" r="2" />
  </g>

  <!-- Outer Border -->
  <rect x="12" y="12" width="376" height="376" rx="20" fill="none" stroke="#000000" stroke-width="4" />

  <!-- Main Container -->
  <rect x="36" y="36" width="328" height="328" rx="16" fill="#FE90E8" stroke="#000000" stroke-width="3.5" filter="url(#neoShadowLg)" />

  <!-- Grid Tray Floor -->
  <rect x="52" y="52" width="296" height="296" rx="12" fill="#FAF8F5" stroke="#000000" stroke-width="3" />

  <!-- 4x4 Grid Tiles Swatches -->
  <!-- Row 1 -->
  <rect x="64" y="64" width="60" height="60" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" filter="url(#neoShadowSm)" />
  <text x="94" y="104" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="24" fill="#000000" text-anchor="middle">2</text>

  <rect x="134" y="64" width="60" height="60" rx="10" fill="#FFDC8B" stroke="#000000" stroke-width="2.5" filter="url(#neoShadowSm)" />
  <text x="164" y="104" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="24" fill="#000000" text-anchor="middle">4</text>

  <rect x="204" y="64" width="60" height="60" rx="10" fill="#C0F7FE" stroke="#000000" stroke-width="2.5" filter="url(#neoShadowSm)" />
  <text x="234" y="104" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="24" fill="#000000" text-anchor="middle">8</text>

  <rect x="274" y="64" width="60" height="60" rx="10" fill="#99E885" stroke="#000000" stroke-width="2.5" filter="url(#neoShadowSm)" />
  <text x="304" y="104" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="22" fill="#000000" text-anchor="middle">16</text>

  <!-- Row 2 -->
  <rect x="64" y="134" width="60" height="60" rx="10" fill="#FFDC8B" stroke="#000000" stroke-width="2.5" filter="url(#neoShadowSm)" />
  <text x="94" y="174" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="22" fill="#000000" text-anchor="middle">32</text>

  <rect x="134" y="134" width="60" height="60" rx="10" fill="#FE90E8" stroke="#000000" stroke-width="2.5" filter="url(#neoShadowSm)" />
  <text x="164" y="174" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="22" fill="#000000" text-anchor="middle">64</text>

  <rect x="204" y="134" width="60" height="60" rx="10" fill="#F7CB46" stroke="#000000" stroke-width="2.5" filter="url(#neoShadowSm)" />
  <text x="234" y="174" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="18" fill="#000000" text-anchor="middle">128</text>

  <rect x="274" y="134" width="60" height="60" rx="10" fill="#C0F7FE" stroke="#000000" stroke-width="2.5" filter="url(#neoShadowSm)" />
  <text x="304" y="174" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="18" fill="#000000" text-anchor="middle">256</text>

  <!-- Big Central 2048 Mega Tile (Rows 3 & 4 Merged Showcase) -->
  <g transform="translate(134, 239)" filter="url(#neoShadow)">
    <rect x="-60" y="-30" width="130" height="95" rx="14" fill="#F7CB46" stroke="#000000" stroke-width="3.5" />
    <text x="5" y="18" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="28" fill="#000000" text-anchor="middle" letter-spacing="1">1024</text>
    <rect x="-45" y="26" width="100" height="12" rx="4" fill="#FE90E8" stroke="#000000" stroke-width="1.5" />
  </g>

  <g transform="translate(269, 239)" filter="url(#neoShadow)">
    <rect x="-60" y="-30" width="130" height="95" rx="14" fill="#99E885" stroke="#000000" stroke-width="3.5" />
    <text x="5" y="20" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="32" fill="#000000" stroke="#000000" stroke-width="1" text-anchor="middle" letter-spacing="1">2048</text>
    <rect x="-45" y="26" width="100" height="12" rx="4" fill="#F7CB46" stroke="#000000" stroke-width="1.5" />
  </g>

  <!-- Top Banner Tag -->
  <g transform="translate(200, 26) rotate(1)">
    <rect x="-75" y="-14" width="150" height="28" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" filter="url(#neoShadowSm)" />
    <text x="0" y="5" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">✦ SYNTHESIS 2048 ✦</text>
  </g>

  <!-- Corner Figma Transform Nodes -->
  <rect x="6" y="6" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="382" y="6" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="6" y="382" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="382" y="382" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
</svg>
