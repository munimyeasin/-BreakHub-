<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="puzBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09001f" />
      <stop offset="60%" stop-color="#19033b" />
      <stop offset="100%" stop-color="#2d004d" />
    </linearGradient>
    <filter id="cubeGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ffe600" flood-opacity="0.9" />
    </filter>
    <filter id="neonPurple">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#puzBg)" />

  <!-- 4x4 Grid Board Platform (Slight Perspective) -->
  <rect x="50" y="50" width="300" height="300" rx="28" fill="#14062e" stroke="#6b21a8" stroke-width="4" />

  <!-- Grid Cell Slots -->
  <g fill="#230a4d" rx="14">
    <rect x="68" y="68" width="60" height="60" rx="14" />
    <rect x="136" y="68" width="60" height="60" rx="14" />
    <rect x="204" y="68" width="60" height="60" rx="14" />
    <rect x="272" y="68" width="60" height="60" rx="14" />

    <rect x="68" y="136" width="60" height="60" rx="14" />
    <rect x="136" y="136" width="60" height="60" rx="14" />
    <rect x="204" y="136" width="60" height="60" rx="14" />
    <rect x="272" y="136" width="60" height="60" rx="14" />

    <rect x="68" y="204" width="60" height="60" rx="14" />
    <rect x="136" y="204" width="60" height="60" rx="14" />
    <rect x="204" y="204" width="60" height="60" rx="14" />
    <rect x="272" y="204" width="60" height="60" rx="14" />

    <rect x="68" y="272" width="60" height="60" rx="14" />
    <rect x="136" y="272" width="60" height="60" rx="14" />
    <rect x="204" y="272" width="60" height="60" rx="14" />
    <rect x="272" y="272" width="60" height="60" rx="14" />
  </g>

  <!-- Cute Number Cube 2 (Cyan) -->
  <g transform="translate(68, 136)">
    <rect width="60" height="60" rx="14" fill="#00f0ff" stroke="#ffffff" stroke-width="3" />
    <text x="30" y="38" font-family="'Arial Black', sans-serif" font-size="24" fill="#000000" font-weight="900" text-anchor="middle">2</text>
    <!-- Cute Eyes -->
    <circle cx="20" cy="18" r="2.5" fill="#000" />
    <circle cx="40" cy="18" r="2.5" fill="#000" />
    <path d="M 26,23 Q 30,27 34,23" stroke="#000" stroke-width="1.5" fill="none" />
  </g>

  <!-- Cute Number Cube 4 (Lime Green) -->
  <g transform="translate(136, 136)">
    <rect width="60" height="60" rx="14" fill="#00ff66" stroke="#ffffff" stroke-width="3" />
    <text x="30" y="38" font-family="'Arial Black', sans-serif" font-size="24" fill="#000000" font-weight="900" text-anchor="middle">4</text>
    <circle cx="20" cy="18" r="2.5" fill="#000" />
    <circle cx="40" cy="18" r="2.5" fill="#000" />
  </g>

  <!-- Cute Number Cube 8 (Orange) -->
  <g transform="translate(68, 68)">
    <rect width="60" height="60" rx="14" fill="#ff7700" stroke="#ffffff" stroke-width="3" />
    <text x="30" y="38" font-family="'Arial Black', sans-serif" font-size="24" fill="#ffffff" font-weight="900" text-anchor="middle">8</text>
    <circle cx="20" cy="18" r="2.5" fill="#fff" />
    <circle cx="40" cy="18" r="2.5" fill="#fff" />
  </g>

  <!-- Cute Number Cube 16 (Pink) -->
  <g transform="translate(136, 68)">
    <rect width="60" height="60" rx="14" fill="#ff007f" stroke="#ffffff" stroke-width="3" />
    <text x="30" y="37" font-family="'Arial Black', sans-serif" font-size="20" fill="#ffffff" font-weight="900" text-anchor="middle">16</text>
  </g>

  <!-- Giant Golden 2048 Mega Cube in Center Merging! -->
  <g filter="url(#cubeGlow)" transform="translate(180, 180)">
    <!-- Golden Cube Body -->
    <rect x="0" y="0" width="135" height="135" rx="26" fill="#ffe600" stroke="#ffffff" stroke-width="5" />

    <!-- Cute Crown on 2048 Cube -->
    <polygon points="35,-15 48,5 67,-18 87,5 100,-15 100,5 35,5" fill="#ffaa00" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="35" cy="-15" r="3" fill="#ff0055" />
    <circle cx="67" cy="-18" r="4" fill="#00f0ff" />
    <circle cx="100" cy="-15" r="3" fill="#ff0055" />

    <!-- 2048 Text -->
    <text x="67.5" y="80" font-family="'Arial Black', sans-serif" font-size="34" fill="#000000" font-weight="900" text-anchor="middle">2048</text>

    <!-- Cute Happy Eyes & Blushing Face -->
    <ellipse cx="44" cy="38" rx="6" ry="8" fill="#000" />
    <circle cx="46" cy="35" r="2.5" fill="#fff" />
    <ellipse cx="91" cy="38" rx="6" ry="8" fill="#000" />
    <circle cx="93" cy="35" r="2.5" fill="#fff" />

    <path d="M 56,48 Q 67.5,58 79,48" stroke="#000" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <circle cx="30" cy="48" r="5" fill="#ff007f" opacity="0.6" />
    <circle cx="105" cy="48" r="5" fill="#ff007f" opacity="0.6" />

    <!-- Sparkles -->
    <path d="M 120,-8 L 123,-1 L 130,2 L 123,5 L 120,12 L 117,5 L 110,2 L 117,-1 Z" fill="#ffffff" />
  </g>

  <!-- Title Badge -->
  <rect x="25" y="345" width="130" height="30" rx="10" fill="#a855f7" opacity="0.25" stroke="#a855f7" stroke-width="1.5" />
  <text x="90" y="365" fill="#d8b4fe" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">QUANTUM 2048</text>
</svg>
