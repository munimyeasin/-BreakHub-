<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0221" />
      <stop offset="50%" stop-color="#0f052d" />
      <stop offset="100%" stop-color="#001824" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc" />
      <stop offset="50%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#00cc44" />
    </linearGradient>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ff0033" />
    </linearGradient>
    <filter id="neonGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00ff66" flood-opacity="0.8" />
    </filter>
    <filter id="appleGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff0055" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)" />

  <!-- Cyber Retro Grid -->
  <g stroke="#00f0ff" stroke-width="1" opacity="0.12">
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
  </g>

  <!-- Background Ambient Glow -->
  <circle cx="180" cy="220" r="160" fill="url(#glow)" />

  <!-- Snake Body Tail Segments (Cartoon Chubby Rings) -->
  <g filter="url(#neonGlow)">
    <!-- Tail tip -->
    <circle cx="85" cy="305" r="18" fill="url(#snakeGrad)" stroke="#ffffff" stroke-width="3" />
    <circle cx="120" cy="315" r="22" fill="url(#snakeGrad)" stroke="#ffffff" stroke-width="3" />
    <circle cx="165" cy="310" r="25" fill="url(#snakeGrad)" stroke="#ffffff" stroke-width="3" />
    <circle cx="195" cy="275" r="28" fill="url(#snakeGrad)" stroke="#ffffff" stroke-width="3.5" />
    <circle cx="180" cy="225" r="30" fill="url(#snakeGrad)" stroke="#ffffff" stroke-width="3.5" />
    <circle cx="140" cy="190" r="32" fill="url(#snakeGrad)" stroke="#ffffff" stroke-width="3.5" />
    <circle cx="130" cy="135" r="35" fill="url(#snakeGrad)" stroke="#ffffff" stroke-width="4" />

    <!-- Snake Cute Head -->
    <ellipse cx="185" cy="115" rx="46" ry="40" fill="url(#snakeGrad)" stroke="#ffffff" stroke-width="4.5" />
  </g>

  <!-- Cute Big Cartoon Eyes -->
  <!-- Left Eye -->
  <ellipse cx="170" cy="100" rx="14" ry="17" fill="#ffffff" />
  <circle cx="174" cy="98" r="9" fill="#0d0221" />
  <circle cx="177" cy="94" r="3.5" fill="#00ffff" />
  <circle cx="171" cy="103" r="2" fill="#ffffff" />

  <!-- Right Eye -->
  <ellipse cx="205" cy="102" rx="13" ry="16" fill="#ffffff" />
  <circle cx="208" cy="100" r="8" fill="#0d0221" />
  <circle cx="211" cy="97" r="3" fill="#00ffff" />
  <circle cx="206" cy="104" r="1.5" fill="#ffffff" />

  <!-- Cute Cheeks & Smile -->
  <circle cx="152" cy="122" r="7" fill="#ff007f" opacity="0.6" />
  <circle cx="218" cy="124" r="7" fill="#ff007f" opacity="0.6" />
  <path d="M 175 125 Q 188 138 202 126" stroke="#0d0221" stroke-width="4" fill="none" stroke-linecap="round" />
  <!-- Cute tiny snake tongue -->
  <path d="M 188 132 Q 192 146 195 148 L 191 144 M 195 148 L 200 144" stroke="#ff0055" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Glowing Cyber Apple Target -->
  <g filter="url(#appleGlow)">
    <circle cx="310" cy="120" r="32" fill="url(#appleGrad)" stroke="#ffffff" stroke-width="3.5" />
    <!-- Apple Leaf -->
    <path d="M 310 88 Q 325 75 330 85 Q 320 95 310 88" fill="#00ff66" stroke="#ffffff" stroke-width="2" />
    <rect x="307" y="80" width="6" height="10" rx="3" fill="#884400" />
    <!-- Apple Highlight -->
    <ellipse cx="298" cy="108" rx="8" ry="12" fill="#ffffff" opacity="0.6" transform="rotate(-30 298 108)" />
    <!-- Target Sparkles -->
    <path d="M 310 50 L 314 62 L 326 66 L 314 70 L 310 82 L 306 70 L 294 66 L 306 62 Z" fill="#ffe600" />
  </g>

  <!-- Speed Dash Particles -->
  <circle cx="270" cy="95" r="4" fill="#00ffcc" />
  <circle cx="282" cy="148" r="3" fill="#00ff66" />
  <circle cx="260" cy="125" r="2.5" fill="#ffe600" />

  <!-- Badge banner -->
  <rect x="25" y="340" width="130" height="32" rx="10" fill="#00f0ff" opacity="0.15" stroke="#00f0ff" stroke-width="1.5" />
  <text x="90" y="361" fill="#00f0ff" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">SNAKE 2077</text>
</svg>
