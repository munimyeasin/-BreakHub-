<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="snakeBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04120D" />
      <stop offset="50%" stop-color="#07241A" />
      <stop offset="100%" stop-color="#020B08" />
    </linearGradient>
    <linearGradient id="snakeBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#ECFDF5" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#A3E635" />
    </linearGradient>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="appleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF007F" flood-opacity="0.9" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#snakeBgDark); }
    .theme-grid-line { stroke: #00FF88; stroke-opacity: 0.15; }
    .theme-badge-rect { fill: #00FF88; stroke: #000000; }
    .theme-badge-text { fill: #000000; }
    .theme-tag-rect { fill: #FFE600; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#snakeBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.1; }
      .theme-badge-rect { fill: #00FF88; stroke: #000000; }
      .theme-badge-text { fill: #000000; }
      .theme-tag-rect { fill: #FFE600; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Cyber Retro Grid -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="60" x2="400" y2="60" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="180" x2="400" y2="180" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="360" x2="400" y2="360" />
    <line x1="60" y1="0" x2="60" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="180" y1="0" x2="180" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
  </g>

  <!-- Snake Body Tail Segments with Brutal Drop Shadows -->
  <g filter="url(#brutalShadowSm)">
    <!-- Tail tip -->
    <circle cx="80" cy="300" r="16" fill="url(#snakeGrad)" stroke="#000000" stroke-width="3" />
    <circle cx="115" cy="310" r="20" fill="url(#snakeGrad)" stroke="#000000" stroke-width="3" />
    <circle cx="160" cy="305" r="23" fill="url(#snakeGrad)" stroke="#000000" stroke-width="3.5" />
    <circle cx="190" cy="270" r="26" fill="url(#snakeGrad)" stroke="#000000" stroke-width="3.5" />
    <circle cx="175" cy="220" r="28" fill="url(#snakeGrad)" stroke="#000000" stroke-width="3.5" />
    <circle cx="135" cy="185" r="30" fill="url(#snakeGrad)" stroke="#000000" stroke-width="4" />
    <circle cx="125" cy="130" r="33" fill="url(#snakeGrad)" stroke="#000000" stroke-width="4" />

    <!-- Snake Head -->
    <ellipse cx="180" cy="110" rx="44" ry="38" fill="url(#snakeGrad)" stroke="#000000" stroke-width="4.5" />
  </g>

  <!-- Big Expressive Cartoon Eyes -->
  <!-- Left Eye -->
  <ellipse cx="165" cy="95" rx="13" ry="16" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <circle cx="169" cy="93" r="8" fill="#000000" />
  <circle cx="172" cy="89" r="3" fill="#00F0FF" />
  <circle cx="166" cy="98" r="1.5" fill="#FFFFFF" />

  <!-- Right Eye -->
  <ellipse cx="200" cy="97" rx="12" ry="15" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <circle cx="203" cy="95" r="7.5" fill="#000000" />
  <circle cx="206" cy="92" r="2.5" fill="#00F0FF" />
  <circle cx="201" cy="99" r="1.5" fill="#FFFFFF" />

  <!-- Cute Cheeks & Smile -->
  <circle cx="148" cy="116" r="6.5" fill="#FF007F" opacity="0.8" />
  <circle cx="212" cy="118" r="6.5" fill="#FF007F" opacity="0.8" />
  <path d="M 170 120 Q 183 132 196 120" stroke="#000000" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <!-- Tongue -->
  <path d="M 183 126 Q 187 140 190 142 L 186 138 M 190 142 L 195 138" stroke="#FF007F" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Glowing Cyber Apple Target with Neo-Brutalist Shadow -->
  <g transform="translate(305, 120)" filter="url(#appleGlow)">
    <g filter="url(#brutalShadowSm)">
      <circle cx="0" cy="0" r="32" fill="url(#appleGrad)" stroke="#000000" stroke-width="3.5" />
      <!-- Apple Leaf -->
      <path d="M 0,-32 Q 15,-45 20,-35 Q 10,-25 0,-32" fill="#A3E635" stroke="#000000" stroke-width="2.5" />
      <rect x="-3" y="-40" width="6" height="10" rx="2" fill="#FFE600" stroke="#000000" stroke-width="1.5" />
      <!-- Highlight -->
      <ellipse cx="-12" cy="-12" rx="7" ry="11" fill="#FFFFFF" opacity="0.7" transform="rotate(-30 -12 -12)" />
    </g>
  </g>

  <!-- Sparkles & Particles -->
  <g fill="#FFE600">
    <polygon points="310,40 313,48 321,51 313,54 310,62 307,54 299,51 307,48" stroke="#000000" stroke-width="1" />
    <circle cx="265" cy="85" r="4" fill="#00F0FF" stroke="#000000" stroke-width="1" />
    <circle cx="275" cy="140" r="3.5" fill="#A3E635" stroke="#000000" stroke-width="1" />
    <circle cx="60" cy="240" r="4" fill="#FFE600" stroke="#000000" stroke-width="1" />
  </g>

  <!-- Top Tag Pill: CYBER ARCADE CLASSIC -->
  <g transform="translate(200, 24)" filter="url(#brutalShadowSm)">
    <rect x="-85" y="-10" width="170" height="20" rx="6" class="theme-tag-rect" stroke-width="2" />
    <text x="0" y="4" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1">CYBER ARCADE CLASSIC</text>
  </g>

  <!-- Bottom Title Badge Pill: NEON SNAKE 2077 -->
  <g transform="translate(200, 366)" filter="url(#brutalShadowSm)">
    <rect x="-95" y="-15" width="190" height="30" rx="10" class="theme-badge-rect" stroke-width="3" />
    <text x="0" y="5" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1.5">NEON SNAKE 2077</text>
  </g>
</svg>
