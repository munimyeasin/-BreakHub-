<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="neoShadowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000000" />
    </filter>
    <filter id="neoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" />
    </filter>
    <filter id="neoShadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Neo Ground -->
  <rect width="400" height="400" fill="#FAF8F5" />

  <!-- Dot Matrix Grid -->
  <g fill="#000000" opacity="0.08">
    <circle cx="40" cy="40" r="2" /><circle cx="100" cy="40" r="2" /><circle cx="160" cy="40" r="2" /><circle cx="220" cy="40" r="2" /><circle cx="280" cy="40" r="2" /><circle cx="340" cy="40" r="2" />
    <circle cx="40" cy="100" r="2" /><circle cx="100" cy="100" r="2" /><circle cx="160" cy="100" r="2" /><circle cx="220" cy="100" r="2" /><circle cx="280" cy="100" r="2" /><circle cx="340" cy="100" r="2" />
    <circle cx="40" cy="160" r="2" /><circle cx="100" cy="160" r="2" /><circle cx="160" cy="160" r="2" /><circle cx="220" cy="160" r="2" /><circle cx="280" cy="160" r="2" /><circle cx="340" cy="160" r="2" />
    <circle cx="40" cy="220" r="2" /><circle cx="100" cy="220" r="2" /><circle cx="160" cy="220" r="2" /><circle cx="220" cy="220" r="2" /><circle cx="280" cy="220" r="2" /><circle cx="340" cy="220" r="2" />
    <circle cx="40" cy="280" r="2" /><circle cx="100" cy="280" r="2" /><circle cx="160" cy="280" r="2" /><circle cx="220" cy="280" r="2" /><circle cx="280" cy="280" r="2" /><circle cx="340" cy="280" r="2" />
    <circle cx="40" cy="340" r="2" /><circle cx="100" cy="340" r="2" /><circle cx="160" cy="340" r="2" /><circle cx="220" cy="340" r="2" /><circle cx="280" cy="340" r="2" /><circle cx="340" cy="340" r="2" />
  </g>

  <!-- Outer Border -->
  <rect x="12" y="12" width="376" height="376" rx="20" fill="none" stroke="#000000" stroke-width="4" />

  <!-- Main Container -->
  <rect x="36" y="36" width="328" height="328" rx="16" fill="#99E885" stroke="#000000" stroke-width="3.5" filter="url(#neoShadowLg)" />

  <!-- Internal White Grid Canvas -->
  <rect x="52" y="52" width="296" height="296" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="3" />

  <!-- Snake Body Segments (Winding S-Curve Pattern) -->
  <g filter="url(#neoShadow)">
    <!-- Tail -->
    <rect x="80" y="270" width="36" height="36" rx="8" fill="#FFDC8B" stroke="#000000" stroke-width="2.5" />
    <rect x="80" y="226" width="36" height="36" rx="8" fill="#C0F7FE" stroke="#000000" stroke-width="2.5" />
    <rect x="80" y="182" width="36" height="36" rx="8" fill="#FE90E8" stroke="#000000" stroke-width="2.5" />
    <rect x="80" y="138" width="36" height="36" rx="8" fill="#F7CB46" stroke="#000000" stroke-width="2.5" />

    <!-- Corner Bend 1 -->
    <rect x="124" y="138" width="36" height="36" rx="8" fill="#99E885" stroke="#000000" stroke-width="2.5" />
    <rect x="168" y="138" width="36" height="36" rx="8" fill="#C0F7FE" stroke="#000000" stroke-width="2.5" />

    <!-- Bend Down -->
    <rect x="168" y="182" width="36" height="36" rx="8" fill="#FE90E8" stroke="#000000" stroke-width="2.5" />
    <rect x="168" y="226" width="36" height="36" rx="8" fill="#FFDC8B" stroke="#000000" stroke-width="2.5" />

    <!-- Bend Right -->
    <rect x="212" y="226" width="36" height="36" rx="8" fill="#F7CB46" stroke="#000000" stroke-width="2.5" />
    <rect x="256" y="226" width="36" height="36" rx="8" fill="#99E885" stroke="#000000" stroke-width="2.5" />

    <!-- Snake Head (Pointing Right) -->
    <rect x="256" y="182" width="40" height="40" rx="10" fill="#FE90E8" stroke="#000000" stroke-width="3" />
    <!-- Snake Eyes -->
    <circle cx="282" cy="192" r="4" fill="#000000" />
    <circle cx="282" cy="212" r="4" fill="#000000" />
    <!-- Tongue -->
    <path d="M296 202 L312 202 L318 196 M312 202 L318 208" stroke="#000000" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Apple Food Item -->
  <g transform="translate(276, 110)" filter="url(#neoShadowSm)">
    <circle cx="0" cy="0" r="18" fill="#FE90E8" stroke="#000000" stroke-width="3" />
    <path d="M0 -18 Q6 -26 12 -22 Q14 -16 0 -18" fill="#99E885" stroke="#000000" stroke-width="2" />
  </g>

  <!-- Star Bonus Item -->
  <g transform="translate(130, 260)" filter="url(#neoShadowSm)">
    <circle cx="0" cy="0" r="16" fill="#F7CB46" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="6" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="16" fill="#000000" text-anchor="middle">★</text>
  </g>

  <!-- Top Length Counter Ribbon -->
  <g transform="translate(200, 26) rotate(-2)">
    <rect x="-80" y="-14" width="160" height="28" rx="8" fill="#F7CB46" stroke="#000000" stroke-width="2.5" filter="url(#neoShadowSm)" />
    <text x="0" y="5" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">🐍 LENGTH: 99 • SPEED 10X</text>
  </g>

  <!-- Corner Figma Transform Nodes -->
  <rect x="6" y="6" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="382" y="6" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="6" y="382" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="382" y="382" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
</svg>
