<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="slicerBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18000f" />
      <stop offset="50%" stop-color="#2a0518" />
      <stop offset="100%" stop-color="#070014" />
    </linearGradient>
    <linearGradient id="slicerBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FFF1F2" />
      <stop offset="100%" stop-color="#FFE4E6" />
    </linearGradient>

    <!-- Katana Blade Steel & Laser Edge -->
    <linearGradient id="bladeSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="bladeNeonEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3DF5" />
      <stop offset="50%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Hilt (Tsuka) & Guard (Tsuba) -->
    <linearGradient id="hiltGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF570" />
      <stop offset="100%" stop-color="#D49B00" />
    </linearGradient>
    <linearGradient id="hiltDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Sliced Cyber Cube 1: Cyan Cube -->
    <linearGradient id="cyanCubeFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DF9FF" />
      <stop offset="100%" stop-color="#00D0FF" />
    </linearGradient>
    <linearGradient id="cyanCubeSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0099CC" />
      <stop offset="100%" stop-color="#006699" />
    </linearGradient>

    <!-- Sliced Cyber Cube 2: Pink/Red Cube -->
    <linearGradient id="pinkCubeFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF63C6" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <linearGradient id="pinkCubeSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BA005C" />
      <stop offset="100%" stop-color="#8A0044" />
    </linearGradient>

    <!-- Molten Sliced Interior Core -->
    <linearGradient id="moltenCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>

    <!-- Motion Slash Wave Gradient -->
    <linearGradient id="slashWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#FF007F" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="100%" stop-color="#FFE600" />
    </linearGradient>

    <!-- Neo-Brutalist Hard Drop Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowLg" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="slashGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF007F" flood-opacity="0.85" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#slicerBgDark); }
    .theme-grid-line { stroke: #FFFFFF; stroke-opacity: 0.12; }
    .theme-frame-bg { fill: #140516; stroke: #FF007F; }
    .theme-stage-grid { stroke: #3D1030; }
    .theme-badge-rect { fill: #FF007F; stroke: #000000; }
    .theme-badge-text { fill: #FFFFFF; }
    .theme-tag-rect { fill: #FFDE59; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#slicerBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.08; }
      .theme-frame-bg { fill: #FFFFFF; stroke: #000000; }
      .theme-stage-grid { stroke: #E2E8F0; }
      .theme-badge-rect { fill: #FF007F; stroke: #000000; }
      .theme-badge-text { fill: #FFFFFF; }
      .theme-tag-rect { fill: #FFDE59; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Retro Cyber Grid Backdrop -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- Neo Sparks & Blade Embers -->
  <g fill="#FFDE59">
    <polygon points="40,46 42,54 50,56 42,58 40,66 38,58 30,56 38,54" />
    <polygon points="360,40 362,48 370,50 362,52 360,60 358,52 350,50 358,48" />
    <polygon points="365,300 367,306 373,308 367,310 365,316 363,310 357,308 363,306" />
    <polygon points="34,310 36,316 42,318 36,320 34,326 32,320 26,318 32,316" />
  </g>

  <!-- 3D MAIN ARCADE CONTAINER -->
  <g filter="url(#brutalShadowLg)">
    <rect x="36" y="38" width="328" height="298" rx="22" class="theme-frame-bg" stroke-width="4" />
  </g>

  <!-- Inner Playfield Dojo Stage -->
  <rect x="48" y="48" width="304" height="278" rx="16" fill="#08020B" stroke="#000000" stroke-width="2.5" />

  <!-- Perspective Arena Grid Lines -->
  <g class="theme-stage-grid" stroke-width="1.5" stroke-dasharray="4,3">
    <line x1="48" y1="88" x2="352" y2="88" />
    <line x1="48" y1="136" x2="352" y2="136" />
    <line x1="48" y1="184" x2="352" y2="184" />
    <line x1="48" y1="232" x2="352" y2="232" />
    <line x1="48" y1="280" x2="352" y2="280" />
    <line x1="96" y1="48" x2="96" y2="326" />
    <line x1="148" y1="48" x2="148" y2="326" />
    <line x1="200" y1="48" x2="200" y2="326" />
    <line x1="252" y1="48" x2="252" y2="326" />
    <line x1="304" y1="48" x2="304" y2="326" />
  </g>

  <!-- SLICED TARGET 1: 3D CYAN CUBE SPLIT IN HALF -->
  <!-- Top-Half of Cyan Cube Flying Up-Left -->
  <g transform="translate(85, 95) rotate(-18)" filter="url(#brutalShadow)">
    <g stroke="#000000" stroke-width="2.5">
      <polygon points="0,20 40,-10 70,0 30,30" fill="url(#cyanCubeFace)" />
      <polygon points="70,0 76,-4 46,-14 40,-10" fill="url(#cyanCubeSide)" />
      <!-- Cut Exposed Molten Face -->
      <polygon points="0,20 30,30 30,42 0,32" fill="url(#moltenCore)" />
    </g>
    <!-- Glossy Specular Highlight -->
    <path d="M 6,18 L 36,-6 L 24,18 Z" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Bottom-Half of Cyan Cube Flying Down-Right -->
  <g transform="translate(125, 145) rotate(14)" filter="url(#brutalShadow)">
    <g stroke="#000000" stroke-width="2.5">
      <!-- Cut Exposed Molten Face -->
      <polygon points="0,0 30,10 30,22 0,12" fill="url(#moltenCore)" />
      <polygon points="0,12 30,22 30,48 0,38" fill="url(#cyanCubeSide)" />
      <polygon points="30,22 65,10 65,36 30,48" fill="url(#cyanCubeFace)" />
    </g>
  </g>

  <!-- SLICED TARGET 2: 3D MAGENTA ENERGY ORB / PYRAMID (Top Right) -->
  <g transform="translate(255, 90) rotate(22)" filter="url(#brutalShadow)">
    <g stroke="#000000" stroke-width="2.5">
      <polygon points="0,0 35,-15 45,15" fill="url(#pinkCubeFace)" />
      <polygon points="35,-15 45,15 52,8 42,-22" fill="url(#pinkCubeSide)" />
      <polygon points="0,0 45,15 35,28 -10,12" fill="url(#moltenCore)" />
    </g>
    <path d="M 4,2 L 30,-10 L 22,8 Z" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- PLASMA SLICING JUICE & PARTICLE BURSTS -->
  <g fill="#FFE600">
    <circle cx="160" cy="135" r="3.5" />
    <circle cx="175" cy="115" r="2.5" />
    <circle cx="210" cy="160" r="3" />
    <circle cx="240" cy="140" r="4" />
    <polygon points="180,125 186,128 180,131 177,128" />
    <polygon points="220,150 226,153 220,156 217,153" />
  </g>

  <!-- KATANA SLASH ENERGY ARC TRAIL -->
  <g filter="url(#slashGlow)">
    <path d="M 60,70 Q 180,150 320,270" stroke="url(#slashWave)" stroke-width="12" fill="none" stroke-linecap="round" />
    <path d="M 75,80 Q 185,155 310,265" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- 3D HERO CYBER KATANA BLADE (Diagonal Slice Pose) -->
  <g transform="translate(180, 180) rotate(-42)" filter="url(#brutalShadowLg)">
    <!-- 3D Blade Body (Curved Steel) -->
    <g stroke="#000000" stroke-width="3">
      <!-- Back Spine (Thick Dark Metal) -->
      <polygon points="-8,-120 0,-130 0,60 -8,50" fill="#334155" />
      <!-- Main Blade Bevel Steel -->
      <polygon points="0,-130 14,-110 8,60 0,60" fill="url(#bladeSteel)" />
      <!-- Glowing Razor-Sharp Edge -->
      <polygon points="14,-110 18,-100 12,60 8,60" fill="url(#bladeNeonEdge)" />
    </g>

    <!-- High-Gloss Specular Blade Reflection Streak -->
    <polygon points="2,-120 8,-100 4,45 -1,45" fill="#FFFFFF" opacity="0.85" />

    <!-- 3D Sword Guard (Tsuba) -->
    <g transform="translate(4, 62)" stroke="#000000" stroke-width="2.5">
      <!-- 3D Depth Layer -->
      <ellipse cx="0" cy="4" rx="26" ry="10" fill="url(#hiltGold)" />
      <!-- Top Face -->
      <ellipse cx="0" cy="0" rx="26" ry="10" fill="url(#hiltGold)" />
      <ellipse cx="0" cy="0" rx="20" ry="7" fill="none" stroke="#000000" stroke-width="1.5" />
    </g>

    <!-- 3D Handle (Tsuka) with Diamond Grip Wrap -->
    <g transform="translate(4, 72)" stroke="#000000" stroke-width="2.5">
      <rect x="-8" y="0" width="16" height="60" rx="4" fill="url(#hiltDark)" />
      <!-- Gold Diamond Wraps -->
      <polygon points="0,8 6,14 0,20 -6,14" fill="url(#hiltGold)" />
      <polygon points="0,24 6,30 0,36 -6,30" fill="url(#hiltGold)" />
      <polygon points="0,40 6,46 0,52 -6,46" fill="url(#hiltGold)" />
      <!-- Pommel (Kashira) -->
      <rect x="-9" y="58" width="18" height="8" rx="3" fill="url(#hiltGold)" />
    </g>
  </g>

  <!-- ACTION POPUP COMBO BADGE: "SLASH x10!" -->
  <g transform="translate(200, 160)" filter="url(#brutalShadow)">
    <polygon points="0,-22 8,-8 24,-14 16,-1 30,10 14,14 18,28 4,20 -4,28 -2,14 -18,18 -12,4 -28,-2 -14,-10 -20,-24 -6,-16" fill="url(#badgeGold)" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="9.5" fill="#000000" text-anchor="middle" letter-spacing="0.5">
      SLASH x10!
    </text>
  </g>

  <!-- TOP TAG RIBBON: "KATANA SLICER // ACTION" -->
  <g transform="translate(200, 32)" filter="url(#brutalShadowSm)">
    <rect x="-85" y="-12" width="170" height="24" rx="8" class="theme-tag-rect" stroke-width="2.5" />
    <text x="0" y="4.5" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="1.2">
      BLADE SLICER // ACTION
    </text>
  </g>

  <!-- BOTTOM TITLE MARQUEE: "CYBER KATANA SLICER" -->
  <g transform="translate(200, 360)" filter="url(#brutalShadowLg)">
    <rect x="-125" y="-18" width="250" height="36" rx="12" class="theme-badge-rect" stroke-width="3.5" />
    <rect x="-120" y="-14" width="240" height="28" rx="8" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.3" />
    <text x="0" y="6" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="15" text-anchor="middle" letter-spacing="1.5">
      CYBER KATANA SLICER
    </text>
  </g>

  <!-- Bottom Left/Right Rivet Accents -->
  <circle cx="84" cy="360" r="3" fill="#000000" />
  <circle cx="316" cy="360" r="3" fill="#000000" />
</svg>
