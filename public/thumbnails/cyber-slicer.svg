<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sliceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b19" />
      <stop offset="50%" stop-color="#140224" />
      <stop offset="100%" stop-color="#260017" />
    </linearGradient>
    <filter id="bladeGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00f0ff" flood-opacity="0.95" />
    </filter>
    <filter id="melonGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00ff66" flood-opacity="0.85" />
    </filter>
    <filter id="orangeGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffaa00" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#sliceBg)" />

  <!-- Background Subtle Dojo Grid -->
  <g stroke="#ff007f" stroke-width="1" opacity="0.1">
    <circle cx="200" cy="200" r="160" fill="none" />
    <circle cx="200" cy="200" r="110" fill="none" />
    <circle cx="200" cy="200" r="60" fill="none" />
  </g>

  <!-- Juicy Splash Splatter Particles -->
  <g fill="#ff0055" opacity="0.75">
    <circle cx="160" cy="110" r="6" />
    <circle cx="140" cy="130" r="4.5" />
    <circle cx="250" cy="210" r="5" />
    <circle cx="270" cy="180" r="7" />
    <circle cx="290" cy="230" r="4" />
  </g>
  <g fill="#00ff66" opacity="0.75">
    <circle cx="110" cy="190" r="5" />
    <circle cx="130" cy="240" r="4" />
    <circle cx="210" cy="280" r="6" />
  </g>

  <!-- Sliced Watermelon Halves splitting apart in mid-air -->
  <!-- Top Half (Floating Up-Left) -->
  <g filter="url(#melonGlow)" transform="translate(145, 145) rotate(-35)">
    <!-- Green Rind -->
    <path d="M -45,0 A 45 45 0 0 1 45,0 Z" fill="#00ff66" stroke="#ffffff" stroke-width="3.5" />
    <!-- White Inner Rind -->
    <path d="M -38,0 A 38 38 0 0 1 38,0 Z" fill="#ffffff" />
    <!-- Juicy Pink Flesh -->
    <path d="M -33,0 A 33 33 0 0 1 33,0 Z" fill="#ff0055" />
    <!-- Watermelon Seeds -->
    <circle cx="-16" cy="-12" r="2.5" fill="#000" />
    <circle cx="0" cy="-20" r="2.5" fill="#000" />
    <circle cx="16" cy="-12" r="2.5" fill="#000" />
  </g>

  <!-- Bottom Half (Falling Down-Right) -->
  <g filter="url(#melonGlow)" transform="translate(215, 235) rotate(-35)">
    <!-- Green Rind -->
    <path d="M -45,0 A 45 45 0 0 0 45,0 Z" fill="#00ff66" stroke="#ffffff" stroke-width="3.5" />
    <!-- White Inner Rind -->
    <path d="M -38,0 A 38 38 0 0 0 38,0 Z" fill="#ffffff" />
    <!-- Juicy Pink Flesh -->
    <path d="M -33,0 A 33 33 0 0 0 33,0 Z" fill="#ff0055" />
    <!-- Seeds -->
    <circle cx="-16" cy="12" r="2.5" fill="#000" />
    <circle cx="0" cy="20" r="2.5" fill="#000" />
    <circle cx="16" cy="12" r="2.5" fill="#000" />
  </g>

  <!-- Flying Plasma Orange in Corner -->
  <g filter="url(#orangeGlow)" transform="translate(80, 270)">
    <circle cx="0" cy="0" r="28" fill="#ff7700" stroke="#ffffff" stroke-width="3.5" />
    <circle cx="-8" cy="-8" r="8" fill="#ffaa00" />
    <circle cx="0" cy="0" r="20" fill="none" stroke="#ffe600" stroke-width="2" stroke-dasharray="6,4" />
    <!-- Cute cartoon shine -->
    <ellipse cx="-8" cy="-12" rx="6" ry="3" fill="#ffffff" opacity="0.6" transform="rotate(-30 -8 -12)" />
  </g>

  <!-- Flying Cyber Apple (Top Right) -->
  <g transform="translate(320, 100)">
    <circle cx="0" cy="0" r="26" fill="#00f0ff" stroke="#ffffff" stroke-width="3.5" />
    <path d="M 0,-26 Q 10,-35 15,-28 Q 8,-20 0,-26" fill="#00ff66" stroke="#fff" stroke-width="1.5" />
    <ellipse cx="-7" cy="-8" rx="5" ry="3" fill="#ffffff" opacity="0.7" transform="rotate(-30 -7 -8)" />
  </g>

  <!-- Giant Glowing Katana Blade Swipe Arc! (Across the diagonal) -->
  <g filter="url(#bladeGlow)">
    <!-- Outer Cyan Blade Trail Arc -->
    <path d="M 40,360 Q 180,200 360,40" stroke="#00f0ff" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.8" />
    <!-- Core Bright White Blade Arc -->
    <path d="M 40,360 Q 180,200 360,40" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Katana Hilt at bottom left -->
    <g transform="translate(45, 355) rotate(-45)">
      <rect x="-6" y="0" width="12" height="40" rx="4" fill="#1b122e" stroke="#00f0ff" stroke-width="2" />
      <ellipse cx="0" cy="0" rx="14" ry="5" fill="#ffe600" stroke="#fff" stroke-width="2" />
      <!-- Diamond hilt wrap -->
      <polygon points="0,8 4,14 0,20 -4,14" fill="#00f0ff" />
      <polygon points="0,20 4,26 0,32 -4,26" fill="#00f0ff" />
    </g>
  </g>

  <!-- Action "SLASH!" Comic Banner -->
  <g transform="translate(300, 270)">
    <polygon points="0,-18 35,-25 50,0 75,5 45,25 25,18 0,30 10,5" fill="#ffe600" stroke="#000" stroke-width="2" />
    <text x="32" y="8" font-family="'Arial Black', sans-serif" font-size="13" fill="#000" font-weight="900" text-anchor="middle">SLICE!</text>
  </g>

  <!-- Title Badge -->
  <rect x="25" y="345" width="130" height="30" rx="10" fill="#00f0ff" opacity="0.2" stroke="#00f0ff" stroke-width="1.5" />
  <text x="90" y="365" fill="#00f0ff" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">CYBER SLICER</text>
</svg>
