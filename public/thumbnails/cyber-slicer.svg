<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="neoShadowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000000" />
    </filter>
    <filter id="neoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" />
    </filter>
    <filter id="neoShadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Neo Ground -->
  <rect width="400" height="400" fill="#FAF8F5" />

  <!-- Subtle Dot Matrix Grid -->
  <g fill="#000000" opacity="0.08">
    <circle cx="40" cy="40" r="2" /><circle cx="100" cy="40" r="2" /><circle cx="160" cy="40" r="2" /><circle cx="220" cy="40" r="2" /><circle cx="280" cy="40" r="2" /><circle cx="340" cy="40" r="2" />
    <circle cx="40" cy="100" r="2" /><circle cx="100" cy="100" r="2" /><circle cx="160" cy="100" r="2" /><circle cx="220" cy="100" r="2" /><circle cx="280" cy="100" r="2" /><circle cx="340" cy="100" r="2" />
    <circle cx="40" cy="160" r="2" /><circle cx="100" cy="160" r="2" /><circle cx="160" cy="160" r="2" /><circle cx="220" cy="160" r="2" /><circle cx="280" cy="160" r="2" /><circle cx="340" cy="160" r="2" />
    <circle cx="40" cy="220" r="2" /><circle cx="100" cy="220" r="2" /><circle cx="160" cy="220" r="2" /><circle cx="220" cy="220" r="2" /><circle cx="280" cy="220" r="2" /><circle cx="340" cy="220" r="2" />
    <circle cx="40" cy="280" r="2" /><circle cx="100" cy="280" r="2" /><circle cx="160" cy="280" r="2" /><circle cx="220" cy="280" r="2" /><circle cx="280" cy="280" r="2" /><circle cx="340" cy="280" r="2" />
    <circle cx="40" cy="340" r="2" /><circle cx="100" cy="340" r="2" /><circle cx="160" cy="340" r="2" /><circle cx="220" cy="340" r="2" /><circle cx="280" cy="340" r="2" /><circle cx="340" cy="340" r="2" />
  </g>

  <!-- Outer Border -->
  <rect x="12" y="12" width="376" height="376" rx="20" fill="none" stroke="#000000" stroke-width="4" />

  <!-- Main Container -->
  <rect x="36" y="36" width="328" height="328" rx="16" fill="#FFDC8B" stroke="#000000" stroke-width="3.5" filter="url(#neoShadowLg)" />

  <!-- Sliced Cyber Watermelon Halves -->
  <g transform="translate(140, 160) rotate(-25)" filter="url(#neoShadow)">
    <!-- Top Watermelon Half -->
    <path d="M-45 -10 A45 45 0 0 1 45 -10 Z" fill="#99E885" stroke="#000000" stroke-width="3" />
    <path d="M-38 -10 A38 38 0 0 1 38 -10 Z" fill="#FE90E8" stroke="#000000" stroke-width="2" />
    <!-- Seeds -->
    <circle cx="-15" cy="-22" r="3" fill="#000000" />
    <circle cx="0" cy="-28" r="3" fill="#000000" />
    <circle cx="15" cy="-22" r="3" fill="#000000" />
  </g>

  <g transform="translate(190, 240) rotate(15)" filter="url(#neoShadow)">
    <!-- Bottom Watermelon Half -->
    <path d="M-45 10 A45 45 0 0 0 45 10 Z" fill="#99E885" stroke="#000000" stroke-width="3" />
    <path d="M-38 10 A38 38 0 0 0 38 10 Z" fill="#FE90E8" stroke="#000000" stroke-width="2" />
    <!-- Seeds -->
    <circle cx="-15" cy="22" r="3" fill="#000000" />
    <circle cx="0" cy="28" r="3" fill="#000000" />
    <circle cx="15" cy="22" r="3" fill="#000000" />
  </g>

  <!-- Flying Neo Cyber Orange / Fruit -->
  <g transform="translate(290, 120)" filter="url(#neoShadowSm)">
    <circle cx="0" cy="0" r="32" fill="#F7CB46" stroke="#000000" stroke-width="3" />
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#000000" stroke-width="2" />
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#000000" stroke-width="2" />
    <line x1="-12" y1="-12" x2="12" y2="12" stroke="#000000" stroke-width="2" />
    <line x1="-12" y1="12" x2="12" y2="-12" stroke="#000000" stroke-width="2" />
  </g>

  <!-- Splash Juice Droplets -->
  <circle cx="110" cy="110" r="8" fill="#FE90E8" stroke="#000000" stroke-width="2" />
  <circle cx="230" cy="120" r="6" fill="#FE90E8" stroke="#000000" stroke-width="2" />
  <circle cx="250" cy="210" r="10" fill="#F7CB46" stroke="#000000" stroke-width="2" />
  <circle cx="120" cy="260" r="7" fill="#99E885" stroke="#000000" stroke-width="2" />

  <!-- Katana Blade Slice Slash Trail -->
  <path d="M50 340 L350 60" stroke="#000000" stroke-width="12" stroke-linecap="round" />
  <path d="M50 340 L350 60" stroke="#C0F7FE" stroke-width="6" stroke-linecap="round" />
  <path d="M60 330 L340 70" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

  <!-- Katana Hilt (Bottom Left) -->
  <g transform="translate(70, 320) rotate(-43)">
    <rect x="-12" y="-6" width="24" height="12" rx="3" fill="#F7CB46" stroke="#000000" stroke-width="2.5" />
    <rect x="-8" y="6" width="16" height="34" rx="4" fill="#FE90E8" stroke="#000000" stroke-width="2.5" />
    <line x1="-8" y1="16" x2="8" y2="16" stroke="#000000" stroke-width="2" />
    <line x1="-8" y1="26" x2="8" y2="26" stroke="#000000" stroke-width="2" />
  </g>

  <!-- Multi-Combo Floating Badge -->
  <g transform="translate(120, 70) rotate(-8)" filter="url(#neoShadowSm)">
    <rect x="-50" y="-16" width="100" height="32" rx="8" fill="#FE90E8" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="5" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">★ 5X COMBO</text>
  </g>

  <!-- Corner Figma Transform Nodes -->
  <rect x="6" y="6" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="382" y="6" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="6" y="382" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="382" y="382" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
</svg>
