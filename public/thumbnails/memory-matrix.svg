<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="memBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04091a" />
      <stop offset="50%" stop-color="#0c1638" />
      <stop offset="100%" stop-color="#14062e" />
    </linearGradient>
    <linearGradient id="memBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <!-- 3D Card Palettes -->
    <linearGradient id="cardFrontCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DF9FF" />
      <stop offset="100%" stop-color="#00D0FF" />
    </linearGradient>
    <linearGradient id="cardSideCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088B8" />
      <stop offset="100%" stop-color="#004D66" />
    </linearGradient>

    <linearGradient id="cardFrontPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF77C8" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <linearGradient id="cardSidePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8005A" />
      <stop offset="100%" stop-color="#700037" />
    </linearGradient>

    <linearGradient id="cardBackDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1338" />
      <stop offset="100%" stop-color="#110826" />
    </linearGradient>
    <linearGradient id="cardBackSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B041C" />
      <stop offset="100%" stop-color="#05010E" />
    </linearGradient>

    <linearGradient id="goldFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF570" />
      <stop offset="100%" stop-color="#FFDE59" />
    </linearGradient>
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="100%" stop-color="#FFE600" />
    </linearGradient>

    <!-- Neo-Brutalist Hard Drop Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowLg" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="synapseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.85" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#memBgDark); }
    .theme-grid-line { stroke: #00F0FF; stroke-opacity: 0.12; }
    .theme-frame-bg { fill: #0B132B; stroke: #00F0FF; }
    .theme-stage-grid { stroke: #19264D; }
    .theme-brain-dome { fill: #101F42; stroke: #000000; }
    .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
    .theme-badge-text { fill: #000000; }
    .theme-tag-rect { fill: #FFE600; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#memBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.08; }
      .theme-frame-bg { fill: #FFFFFF; stroke: #000000; }
      .theme-stage-grid { stroke: #E2E8F0; }
      .theme-brain-dome { fill: #FFFFFF; stroke: #000000; }
      .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
      .theme-badge-text { fill: #000000; }
      .theme-tag-rect { fill: #FFE600; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Retro Cyber Grid Backdrop -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- Neo Sparks & Power Nodes -->
  <g fill="#FFE600">
    <polygon points="40,46 42,54 50,56 42,58 40,66 38,58 30,56 38,54" />
    <polygon points="360,40 362,48 370,50 362,52 360,60 358,52 350,50 358,48" />
    <polygon points="365,300 367,306 373,308 367,310 365,316 363,310 357,308 363,306" />
    <polygon points="34,310 36,316 42,318 36,320 34,326 32,320 26,318 32,316" />
  </g>

  <!-- 3D MAIN ARCADE CONTAINER -->
  <g filter="url(#brutalShadowLg)">
    <rect x="36" y="38" width="328" height="298" rx="22" class="theme-frame-bg" stroke-width="4" />
  </g>

  <!-- Inner Playfield Matrix Stage -->
  <rect x="48" y="48" width="304" height="278" rx="16" fill="#040714" stroke="#000000" stroke-width="2.5" />

  <!-- Background Synapse Circuit Lines -->
  <g stroke="#243869" stroke-width="2" fill="none">
    <path d="M 68,90 L 140,90 L 180,120 L 220,120 L 260,90 L 332,90" />
    <path d="M 68,260 L 130,260 L 170,220 L 230,220 L 270,260 L 332,260" />
    <circle cx="180" cy="120" r="4" fill="#00F0FF" stroke="#000000" stroke-width="1.5" />
    <circle cx="220" cy="120" r="4" fill="#00F0FF" stroke="#000000" stroke-width="1.5" />
    <circle cx="170" cy="220" r="4" fill="#FFE600" stroke="#000000" stroke-width="1.5" />
    <circle cx="230" cy="220" r="4" fill="#FFE600" stroke="#000000" stroke-width="1.5" />
  </g>

  <!-- 3D ROBOT BRAIN MASCOT (Top Center: X=200, Y=86) -->
  <g transform="translate(200, 86)" filter="url(#synapseGlow)">
    <g filter="url(#brutalShadowSm)">
      <!-- Cyber Lightbulb Antenna -->
      <polygon points="-6,-26 0,-36 6,-26" fill="#FFE600" stroke="#000000" stroke-width="2" />
      <circle cx="0" cy="-36" r="6" fill="#FFE600" stroke="#000000" stroke-width="1.8" />
      <!-- Glass Brain Dome -->
      <ellipse cx="0" cy="0" rx="42" ry="28" class="theme-brain-dome" stroke-width="3" />
      <!-- Glowing Synapse Gyri -->
      <path d="M -24,4 Q -16,-12 -4,2 Q 8,-12 24,4" stroke="#FF007F" stroke-width="4.5" fill="none" stroke-linecap="round" />
      <!-- Cyber Visor Eyes -->
      <ellipse cx="-14" cy="6" rx="6" ry="7" fill="#00F0FF" stroke="#000000" stroke-width="2" />
      <ellipse cx="14" cy="6" rx="6" ry="7" fill="#00F0FF" stroke="#000000" stroke-width="2" />
      <circle cx="-12" cy="4" r="2" fill="#FFFFFF" />
      <circle cx="16" cy="4" r="2" fill="#FFFFFF" />
    </g>
  </g>

  <!-- 3D EXTRUDED MEMORY CARDS SPREAD -->
  <!-- Card 1: Left 3D Matched Star Card (Rotated -12°, X=105, Y=195) -->
  <g transform="translate(105, 195) rotate(-12)" filter="url(#brutalShadowLg)">
    <g stroke="#000000" stroke-width="3">
      <!-- 3D Extrusion Side -->
      <polygon points="-40,55 -32,65 48,65 40,55" fill="url(#cardSideCyan)" />
      <polygon points="40,-55 48,-45 48,65 40,55" fill="url(#cardSideCyan)" />
      <!-- Front Face -->
      <rect x="-40" y="-55" width="80" height="110" rx="14" fill="#0E1E45" />
    </g>
    <!-- Card Border Inner Glow -->
    <rect x="-34" y="-49" width="68" height="98" rx="10" fill="url(#cardFrontCyan)" opacity="0.25" stroke="#00F0FF" stroke-width="2" />
    <!-- 3D Golden Star Symbol -->
    <polygon points="0,-24 8,-6 26,-6 12,6 18,24 0,12 -18,24 -12,6 -26,-6 -8,-6" fill="url(#goldFace)" stroke="#000000" stroke-width="2.5" />
    <!-- Specular Highlight -->
    <polygon points="-30,-45 20,-45 10,-32 -30,-32" fill="#FFFFFF" opacity="0.8" />
    <!-- Match Pill -->
    <rect x="-26" y="28" width="52" height="16" rx="5" fill="#00F0FF" stroke="#000000" stroke-width="1.8" />
    <text x="0" y="40" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="9" fill="#000000" text-anchor="middle" letter-spacing="0.5">MATCH!</text>
  </g>

  <!-- Card 2: Right 3D Matched Star Card (Rotated 14°, X=295, Y=195) -->
  <g transform="translate(295, 195) rotate(14)" filter="url(#brutalShadowLg)">
    <g stroke="#000000" stroke-width="3">
      <polygon points="-40,55 -32,65 48,65 40,55" fill="url(#cardSideCyan)" />
      <polygon points="40,-55 48,-45 48,65 40,55" fill="url(#cardSideCyan)" />
      <rect x="-40" y="-55" width="80" height="110" rx="14" fill="#0E1E45" />
    </g>
    <rect x="-34" y="-49" width="68" height="98" rx="10" fill="url(#cardFrontCyan)" opacity="0.25" stroke="#00F0FF" stroke-width="2" />
    <polygon points="0,-24 8,-6 26,-6 12,6 18,24 0,12 -18,24 -12,6 -26,-6 -8,-6" fill="url(#goldFace)" stroke="#000000" stroke-width="2.5" />
    <polygon points="-30,-45 20,-45 10,-32 -30,-32" fill="#FFFFFF" opacity="0.8" />
    <rect x="-26" y="28" width="52" height="16" rx="5" fill="#00F0FF" stroke="#000000" stroke-width="1.8" />
    <text x="0" y="40" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="9" fill="#000000" text-anchor="middle" letter-spacing="0.5">MATCH!</text>
  </g>

  <!-- Card 3: Center Mid-Flip Energy Card (Perspective Thin Card: X=200, Y=200) -->
  <g transform="translate(200, 200) scale(0.72, 1)" filter="url(#brutalShadowLg)">
    <g stroke="#000000" stroke-width="3.5">
      <polygon points="-40,55 -32,65 48,65 40,55" fill="url(#cardSidePink)" />
      <polygon points="40,-55 48,-45 48,65 40,55" fill="url(#cardSidePink)" />
      <rect x="-40" y="-55" width="80" height="110" rx="14" fill="url(#cardFrontPink)" />
    </g>
    <!-- Lightning Bolt -->
    <polygon points="6,-32 -14,6 2,6 -4,34 22,-4 6,-4" fill="#FFE600" stroke="#000000" stroke-width="3" />
  </g>

  <!-- Card 4 & 5: Bottom Facedown Cyber Pattern Cards -->
  <g transform="translate(130, 275) rotate(-6)" filter="url(#brutalShadowSm)">
    <g stroke="#000000" stroke-width="2.5">
      <polygon points="-28,38 -22,46 34,46 28,38" fill="url(#cardBackSide)" />
      <polygon points="28,-38 34,-30 34,46 28,38" fill="url(#cardBackSide)" />
      <rect x="-28" y="-38" width="56" height="76" rx="10" fill="url(#cardBackDark)" />
    </g>
    <rect x="-22" y="-32" width="44" height="64" rx="6" fill="none" stroke="#C084FC" stroke-dasharray="4,4" stroke-width="2" />
    <text x="0" y="10" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="24" fill="#C084FC" text-anchor="middle">?</text>
  </g>

  <g transform="translate(270, 275) rotate(8)" filter="url(#brutalShadowSm)">
    <g stroke="#000000" stroke-width="2.5">
      <polygon points="-28,38 -22,46 34,46 28,38" fill="url(#cardBackSide)" />
      <polygon points="28,-38 34,-30 34,46 28,38" fill="url(#cardBackSide)" />
      <rect x="-28" y="-38" width="56" height="76" rx="10" fill="url(#cardBackDark)" />
    </g>
    <rect x="-22" y="-32" width="44" height="64" rx="6" fill="none" stroke="#C084FC" stroke-dasharray="4,4" stroke-width="2" />
    <text x="0" y="10" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="24" fill="#C084FC" text-anchor="middle">?</text>
  </g>

  <!-- ACTION POPUP COMBO BADGE: "PERFECT SYNC!" -->
  <g transform="translate(200, 130)" filter="url(#brutalShadow)">
    <polygon points="0,-22 8,-8 24,-14 16,-1 30,10 14,14 18,28 4,20 -4,28 -2,14 -18,18 -12,4 -28,-2 -14,-10 -20,-24 -6,-16" fill="url(#badgeGold)" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="9" fill="#000000" text-anchor="middle" letter-spacing="0.5">
      PERFECT SYNC!
    </text>
  </g>

  <!-- TOP TAG RIBBON: "NEURAL MEMORY MATRIX" -->
  <g transform="translate(200, 32)" filter="url(#brutalShadowSm)">
    <rect x="-85" y="-12" width="170" height="24" rx="8" class="theme-tag-rect" stroke-width="2.5" />
    <text x="0" y="4.5" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="1.2">
      NEURAL MEMORY MATRIX
    </text>
  </g>

  <!-- BOTTOM TITLE MARQUEE: "MEMORY MATRIX" -->
  <g transform="translate(200, 360)" filter="url(#brutalShadowLg)">
    <rect x="-125" y="-18" width="250" height="36" rx="12" class="theme-badge-rect" stroke-width="3.5" />
    <rect x="-120" y="-14" width="240" height="28" rx="8" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.3" />
    <text x="0" y="6" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="15" text-anchor="middle" letter-spacing="1.5">
      MEMORY MATRIX
    </text>
  </g>

  <!-- Bottom Left/Right Rivet Accents -->
  <circle cx="84" cy="360" r="3" fill="#000000" />
  <circle cx="316" cy="360" r="3" fill="#000000" />
</svg>
