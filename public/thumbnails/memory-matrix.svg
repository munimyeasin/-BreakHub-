<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="memBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050819" />
      <stop offset="60%" stop-color="#0d1b3e" />
      <stop offset="100%" stop-color="#14062e" />
    </linearGradient>
    <filter id="cardGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f0ff" flood-opacity="0.8" />
    </filter>
    <filter id="goldGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ffe600" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#memBg)" />

  <!-- Background Cyber Circuit Matrix Lines -->
  <g stroke="#00f0ff" stroke-width="1.5" opacity="0.15">
    <path d="M 50,50 L 120,50 L 160,90 L 280,90 L 320,50 L 350,50" fill="none" />
    <path d="M 50,350 L 100,350 L 150,300 L 250,300 L 300,350 L 350,350" fill="none" />
    <circle cx="160" cy="90" r="4" fill="#00f0ff" />
    <circle cx="280" cy="90" r="4" fill="#00f0ff" />
  </g>

  <!-- Cute Robot Brain Mascot in Center Top -->
  <g transform="translate(200, 75)" filter="url(#goldGlow)">
    <!-- Lightbulb idea on top -->
    <path d="M -8,-25 Q 0,-35 8,-25 Q 12,-15 4,-12 L -4,-12 Q -12,-15 -8,-25" fill="#ffe600" stroke="#fff" stroke-width="2" />
    <!-- Robot Brain Glass Dome -->
    <ellipse cx="0" cy="0" rx="35" ry="26" fill="#1b254b" stroke="#00f0ff" stroke-width="3" />
    <!-- Pink Brain Curves -->
    <path d="M -22,3 Q -15,-12 -2,0 Q 12,-12 22,3" stroke="#ff007f" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- Cute Robot Blinking Eyes -->
    <ellipse cx="-12" cy="5" rx="5" ry="6" fill="#00ffff" />
    <ellipse cx="12" cy="5" rx="5" ry="6" fill="#00ffff" />
    <circle cx="-10" cy="3" r="2" fill="#ffffff" />
    <circle cx="14" cy="3" r="2" fill="#ffffff" />
  </g>

  <!-- Memory Cards Matrix in 3D Dynamic Spread -->
  <!-- Card 1: Flipped with Star (Left) -->
  <g filter="url(#cardGlow)" transform="translate(70, 150) rotate(-10)">
    <rect width="80" height="110" rx="16" fill="#0d1b3e" stroke="#00f0ff" stroke-width="3.5" />
    <circle cx="40" cy="55" r="26" fill="#00f0ff" opacity="0.2" />
    <!-- Golden Star Symbol -->
    <polygon points="40,32 46,47 62,47 49,57 54,72 40,62 26,72 31,57 18,47 34,47" fill="#ffe600" stroke="#fff" stroke-width="2" />
    <text x="40" y="98" font-family="'Arial Black', sans-serif" font-size="10" fill="#00f0ff" font-weight="900" text-anchor="middle">MATCH!</text>
  </g>

  <!-- Card 2: Flipped with Star (Matched Pair! - Right) -->
  <g filter="url(#cardGlow)" transform="translate(250, 140) rotate(12)">
    <rect width="80" height="110" rx="16" fill="#0d1b3e" stroke="#00f0ff" stroke-width="3.5" />
    <circle cx="40" cy="55" r="26" fill="#00f0ff" opacity="0.2" />
    <!-- Golden Star Symbol -->
    <polygon points="40,32 46,47 62,47 49,57 54,72 40,62 26,72 31,57 18,47 34,47" fill="#ffe600" stroke="#fff" stroke-width="2" />
    <text x="40" y="98" font-family="'Arial Black', sans-serif" font-size="10" fill="#00f0ff" font-weight="900" text-anchor="middle">MATCH!</text>
  </g>

  <!-- Card 3: Center Mid-Flip Card (Perspective Thin Card) -->
  <g transform="translate(170, 160) scale(0.65, 1)">
    <rect width="80" height="110" rx="16" fill="#ff007f" stroke="#ffffff" stroke-width="4" />
    <!-- Lightning bolt inside -->
    <polygon points="42,28 28,58 38,58 34,82 54,48 44,48" fill="#ffe600" stroke="#000" stroke-width="2" />
  </g>

  <!-- Card 4 & 5: Facedown Cyber Back pattern -->
  <g transform="translate(100, 270) rotate(5)">
    <rect width="65" height="85" rx="12" fill="#14062e" stroke="#a855f7" stroke-width="3" />
    <rect x="10" y="10" width="45" height="65" rx="8" fill="none" stroke="#a855f7" stroke-dasharray="4,4" stroke-width="2" />
    <text x="32.5" y="48" font-family="'Arial Black', sans-serif" font-size="20" fill="#a855f7" font-weight="900" text-anchor="middle">?</text>
  </g>

  <g transform="translate(230, 260) rotate(-6)">
    <rect width="65" height="85" rx="12" fill="#14062e" stroke="#a855f7" stroke-width="3" />
    <rect x="10" y="10" width="45" height="65" rx="8" fill="none" stroke="#a855f7" stroke-dasharray="4,4" stroke-width="2" />
    <text x="32.5" y="48" font-family="'Arial Black', sans-serif" font-size="20" fill="#a855f7" font-weight="900" text-anchor="middle">?</text>
  </g>

  <!-- Title Badge -->
  <rect x="25" y="345" width="145" height="30" rx="10" fill="#00f0ff" opacity="0.2" stroke="#00f0ff" stroke-width="1.5" />
  <text x="97" y="365" fill="#00f0ff" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">MEMORY MATRIX</text>
</svg>
