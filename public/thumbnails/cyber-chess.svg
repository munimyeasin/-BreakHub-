<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="chessBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050514" />
      <stop offset="50%" stop-color="#0D0928" />
      <stop offset="100%" stop-color="#180735" />
    </linearGradient>
    <linearGradient id="chessBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#F5F3FF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>

    <!-- Neon Yellow White Pieces -->
    <linearGradient id="goldPieceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFF570" />
      <stop offset="80%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Neon Pink/Magenta Black Pieces -->
    <linearGradient id="pinkPieceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4F1" />
      <stop offset="35%" stop-color="#FF4B91" />
      <stop offset="80%" stop-color="#FF0055" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>

    <!-- Neon Cyan Accents -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0FFFF" />
      <stop offset="40%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Board Tile Pattern -->
    <pattern id="matrixTiles" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#0A0F1D" />
      <rect width="20" height="20" fill="#1E293B" />
      <rect x="20" y="20" width="20" height="20" fill="#1E293B" />
      <path d="M 0 0 L 40 0 L 40 40 L 0 40 Z" fill="none" stroke="#00F0FF" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <!-- Neo-Brutalist Hard Drop Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowLg" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00F0FF" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#chessBgDark); }
    .theme-grid-line { stroke: #FFFFFF; stroke-opacity: 0.12; }
    .theme-frame-bg { fill: #08041F; stroke: #00F0FF; }
    .theme-stage-grid { stroke: #23164D; }
    .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
    .theme-badge-text { fill: #000000; }
    .theme-tag-rect { fill: #FFDE59; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#chessBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.08; }
      .theme-frame-bg { fill: #FFFFFF; stroke: #000000; }
      .theme-stage-grid { stroke: #E2E8F0; }
      .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
      .theme-badge-text { fill: #000000; }
      .theme-tag-rect { fill: #FFDE59; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Retro Cyber Grid Backdrop -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- Neo Sparks & Floating Nodes -->
  <g fill="#FFDE59">
    <polygon points="40,46 42,54 50,56 42,58 40,66 38,58 30,56 38,54" />
    <polygon points="360,40 362,48 370,50 362,52 360,60 358,52 350,50 358,48" />
    <polygon points="365,300 367,306 373,308 367,310 365,316 363,310 357,308 363,306" />
    <polygon points="34,310 36,316 42,318 36,320 34,326 32,320 26,318 32,316" />
  </g>

  <!-- 3D MAIN ARCADE CONTAINER -->
  <g filter="url(#brutalShadowLg)">
    <rect x="36" y="38" width="328" height="298" rx="22" class="theme-frame-bg" stroke-width="4" />
  </g>

  <!-- Inner Cyber Matrix Chess Stage -->
  <g>
    <!-- Clip Path for inner contents -->
    <clipPath id="innerChessClip">
      <rect x="48" y="48" width="304" height="278" rx="16" />
    </clipPath>

    <g clip-path="url(#innerChessClip)">
      <rect x="48" y="48" width="304" height="278" fill="#030112" stroke="#000000" stroke-width="2.5" />

      <!-- Perspective Isometric Matrix Chessboard Floor -->
      <g transform="translate(200, 230) rotate(-14) skewX(22) scale(0.85, 0.52)">
        <rect x="-160" y="-160" width="320" height="320" fill="url(#matrixTiles)" stroke="#00F0FF" stroke-width="3.5" stroke-opacity="0.7" />

        <!-- Active Target Attack Crosshair on Board -->
        <circle cx="20" cy="20" r="20" fill="#FF0055" fill-opacity="0.25" stroke="#FF0055" stroke-width="2.5" stroke-dasharray="5,3" />
        <circle cx="20" cy="20" r="6" fill="#FF0055" />
      </g>

      <!-- Laser Beams & Hologram Rays -->
      <line x1="50" y1="320" x2="350" y2="60" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="6,6" />
      <line x1="350" y1="320" x2="50" y2="60" stroke="#FF0055" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="6,6" />

      <!-- Cyber Knight (Left Side - Aggressor) -->
      <g transform="translate(95, 125) scale(1.15)" filter="url(#brutalShadowSm)">
        <path
          d="M 28 8 C 28 8, 16 10, 14 22 C 12 28, 16 31, 22 30 C 15 36, 12 44, 12 44 L 40 44 C 40 44, 42 32, 38 23 C 34 16, 31 10, 28 8 Z"
          fill="url(#pinkPieceGrad)"
          stroke="#000"
          stroke-width="2.5"
        />
        <circle cx="20" cy="20" r="2.5" fill="#000" />
        <circle cx="20" cy="20" r="1" fill="#FFF" />
        <path d="M 17 25 L 26 23" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" />
        <rect x="11" y="44" width="31" height="6" rx="2" fill="url(#pinkPieceGrad)" stroke="#000" stroke-width="2" />
      </g>

      <!-- Cyber Queen (Right Side - Supporting Tactician) -->
      <g transform="translate(265, 135) scale(1.1)" filter="url(#brutalShadowSm)">
        <circle cx="9" cy="14" r="2.5" fill="url(#cyanGrad)" stroke="#000" stroke-width="1.5" />
        <circle cx="15.5" cy="11" r="2.5" fill="url(#cyanGrad)" stroke="#000" stroke-width="1.5" />
        <circle cx="22.5" cy="9.5" r="2.5" fill="url(#cyanGrad)" stroke="#000" stroke-width="1.5" />
        <circle cx="29.5" cy="11" r="2.5" fill="url(#cyanGrad)" stroke="#000" stroke-width="1.5" />
        <circle cx="36" cy="14" r="2.5" fill="url(#cyanGrad)" stroke="#000" stroke-width="1.5" />
        <path d="M 10 16 L 14 36 L 31 36 L 35 16 L 28 24 L 22.5 12 L 17 24 Z" fill="url(#cyanGrad)" stroke="#000" stroke-width="2.5" />
        <rect x="10" y="36" width="25" height="5.5" rx="2" fill="url(#cyanGrad)" stroke="#000" stroke-width="2" />
      </g>

      <!-- Royal Grandmaster Cyber King (Centerpiece) -->
      <g transform="translate(180, 105) scale(1.5)" filter="url(#brutalShadow)">
        <!-- King Cross -->
        <path d="M 22.5 4 L 22.5 15 M 17.5 9.5 L 27.5 9.5" stroke="#FFE600" stroke-width="4" stroke-linecap="round" />
        <path d="M 22.5 4 L 22.5 15 M 17.5 9.5 L 27.5 9.5" stroke="#000" stroke-width="1.8" stroke-linecap="round" />

        <!-- Crown & Royal Hull -->
        <path
          d="M 10 20 C 10 20, 13 15, 22.5 15 C 32 15, 35 20, 35 20 C 35 28, 30 32, 30 40 L 15 40 C 15 32, 10 28, 10 20 Z"
          fill="url(#goldPieceGrad)"
          stroke="#000"
          stroke-width="2.5"
        />

        <!-- Matrix Circuit Inlays -->
        <circle cx="22.5" cy="24" r="3" fill="#00F0FF" stroke="#000" stroke-width="1.2" />
        <line x1="22.5" y1="27" x2="22.5" y2="35" stroke="#00F0FF" stroke-width="1.8" />
        <circle cx="22.5" cy="35" r="1.5" fill="#00F0FF" />

        <!-- Pedestal Base -->
        <rect x="9" y="40" width="27" height="6.5" rx="2" fill="url(#goldPieceGrad)" stroke="#000" stroke-width="2" />
      </g>

      <!-- Floating Quantum Data Sparks -->
      <circle cx="75" cy="90" r="2.5" fill="#00F0FF" />
      <circle cx="320" cy="85" r="2" fill="#FF0055" />
      <circle cx="150" cy="65" r="3" fill="#FFE600" />
      <circle cx="250" cy="75" r="2" fill="#00F0FF" />
    </g>
  </g>

  <!-- ACTION POPUP COMBO BADGE: "CHECKMATE!" -->
  <g transform="translate(200, 75)" filter="url(#brutalShadowSm)">
    <polygon points="0,-16 6,-6 18,-10 12,-1 22,7 10,10 13,20 3,14 -3,20 -1,10 -13,13 -9,3 -20,-2 -10,-8 -14,-18 -4,-12" fill="#FFE600" stroke="#000000" stroke-width="2" />
    <text x="0" y="3" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="8" fill="#000000" text-anchor="middle">
      CHECKMATE!
    </text>
  </g>

  <!-- TOP TAG RIBBON: "QUANTUM AI // 64 SQUARES" -->
  <g transform="translate(200, 32)" filter="url(#brutalShadowSm)">
    <rect x="-85" y="-12" width="170" height="24" rx="8" class="theme-tag-rect" stroke-width="2.5" />
    <text x="0" y="4.5" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="10.5" text-anchor="middle" letter-spacing="1.2">
      QUANTUM AI // 64 SQUARES
    </text>
  </g>

  <!-- BOTTOM TITLE MARQUEE: "CYBER CHESS" -->
  <g transform="translate(200, 360)" filter="url(#brutalShadowLg)">
    <rect x="-115" y="-18" width="230" height="36" rx="12" class="theme-badge-rect" stroke-width="3.5" />
    <rect x="-110" y="-14" width="220" height="28" rx="8" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.3" />
    <text x="0" y="6" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="17" text-anchor="middle" letter-spacing="2">
      CYBER CHESS
    </text>
  </g>

  <!-- Bottom Left/Right Rivet Accents -->
  <circle cx="94" cy="360" r="3" fill="#000000" />
  <circle cx="306" cy="360" r="3" fill="#000000" />
</svg>