<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cyberChessBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050512" />
      <stop offset="50%" stop-color="#0B0924" />
      <stop offset="100%" stop-color="#15082E" />
    </linearGradient>

    <!-- Neon Yellow White Pieces -->
    <linearGradient id="goldPieceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFF570" />
      <stop offset="80%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Neon Pink/Magenta Black Pieces -->
    <linearGradient id="pinkPieceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4F1" />
      <stop offset="35%" stop-color="#FF4B91" />
      <stop offset="80%" stop-color="#FF0055" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>

    <!-- Neon Cyan Accents -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0FFFF" />
      <stop offset="40%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Board Tile Pattern -->
    <pattern id="matrixTiles" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="#0A0F1D" />
      <rect width="25" height="25" fill="#1E293B" />
      <rect x="25" y="25" width="25" height="25" fill="#1E293B" />
      <path d="M 0 0 L 50 0 L 50 50 L 0 50 Z" fill="none" stroke="#00F0FF" stroke-width="0.75" stroke-opacity="0.15" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#cyberChessBg)" />

  <!-- Perspective 3D Isometric Cyber Board -->
  <g transform="translate(200, 240) rotate(-15) skewX(25) scale(0.9, 0.55)">
    <!-- Floor Matrix Grid -->
    <rect x="-180" y="-180" width="360" height="360" fill="url(#matrixTiles)" stroke="#00F0FF" stroke-width="4" stroke-opacity="0.6" filter="url(#neonGlow)" />

    <!-- Active Attack Target Crosshair -->
    <circle cx="25" cy="25" r="22" fill="#FF0055" fill-opacity="0.25" stroke="#FF0055" stroke-width="3" stroke-dasharray="6,4" />
    <circle cx="25" cy="25" r="8" fill="#FF0055" />
  </g>

  <!-- Ambient Hologram Laser Beams -->
  <line x1="20" y1="380" x2="380" y2="40" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8,8" />
  <line x1="380" y1="380" x2="20" y2="40" stroke="#FF0055" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8,8" />

  <!-- Main Cyber Knight (Black Side - Left Background) -->
  <g transform="translate(85, 120) scale(1.3)" filter="url(#neonGlow)">
    <path
      d="M 28 8 C 28 8, 16 10, 14 22 C 12 28, 16 31, 22 30 C 15 36, 12 44, 12 44 L 40 44 C 40 44, 42 32, 38 23 C 34 16, 31 10, 28 8 Z"
      fill="url(#pinkPieceGrad)"
      stroke="#000"
      stroke-width="3"
    />
    <circle cx="20" cy="20" r="3" fill="#000" />
    <circle cx="20" cy="20" r="1.5" fill="#FFF" />
    <!-- Cyber Visor Accent -->
    <path d="M 17 25 L 26 23" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" />
    <rect x="11" y="44" width="31" height="6" rx="2" fill="url(#pinkPieceGrad)" stroke="#000" stroke-width="2.5" />
  </g>

  <!-- Main Royal King Piece (White Side - Center Foreground) -->
  <g transform="translate(195, 110) scale(1.7)" filter="url(#intenseGlow)">
    <!-- King Cross -->
    <path d="M 22.5 4 L 22.5 15 M 17.5 9.5 L 27.5 9.5" stroke="#FFE600" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 22.5 4 L 22.5 15 M 17.5 9.5 L 27.5 9.5" stroke="#000" stroke-width="2" stroke-linecap="round" />

    <!-- Crown Arch & Body -->
    <path
      d="M 10 20 C 10 20, 13 15, 22.5 15 C 32 15, 35 20, 35 20 C 35 28, 30 32, 30 40 L 15 40 C 15 32, 10 28, 10 20 Z"
      fill="url(#goldPieceGrad)"
      stroke="#000"
      stroke-width="3"
    />

    <!-- Cyber Circuit Inlays -->
    <circle cx="22.5" cy="24" r="3.5" fill="#00F0FF" stroke="#000" stroke-width="1.5" />
    <line x1="22.5" y1="27.5" x2="22.5" y2="35" stroke="#00F0FF" stroke-width="2" />
    <circle cx="22.5" cy="35" r="2" fill="#00F0FF" />

    <!-- Pedestal Base -->
    <rect x="9" y="40" width="27" height="6.5" rx="2" fill="url(#goldPieceGrad)" stroke="#000" stroke-width="2.5" />
  </g>

  <!-- Cyber Queen & Rook (Right Background) -->
  <g transform="translate(285, 140) scale(1.2)" filter="url(#neonGlow)">
    <circle cx="9" cy="14" r="2.5" fill="url(#cyanGrad)" stroke="#000" stroke-width="2" />
    <circle cx="15.5" cy="11" r="2.5" fill="url(#cyanGrad)" stroke="#000" stroke-width="2" />
    <circle cx="22.5" cy="9.5" r="2.5" fill="url(#cyanGrad)" stroke="#000" stroke-width="2" />
    <circle cx="29.5" cy="11" r="2.5" fill="url(#cyanGrad)" stroke="#000" stroke-width="2" />
    <circle cx="36" cy="14" r="2.5" fill="url(#cyanGrad)" stroke="#000" stroke-width="2" />
    <path d="M 10 16 L 14 36 L 31 36 L 35 16 L 28 24 L 22.5 12 L 17 24 Z" fill="url(#cyanGrad)" stroke="#000" stroke-width="3" />
    <rect x="10" y="36" width="25" height="5.5" rx="2" fill="url(#cyanGrad)" stroke="#000" stroke-width="2.5" />
  </g>

  <!-- Tactical Energy Sparks / Floating Data Nodes -->
  <circle cx="60" cy="100" r="3" fill="#00F0FF" filter="url(#neonGlow)" />
  <circle cx="340" cy="90" r="2.5" fill="#FF0055" filter="url(#neonGlow)" />
  <circle cx="160" cy="65" r="3.5" fill="#FFE600" filter="url(#neonGlow)" />
  <circle cx="260" cy="75" r="2" fill="#00F0FF" filter="url(#neonGlow)" />

  <!-- Bottom Neo-Brutalist Title Badge -->
  <g transform="translate(200, 360)">
    <!-- Shadow Box -->
    <rect x="-140" y="-22" width="280" height="42" rx="10" fill="#000000" transform="translate(4, 4)" />
    <!-- Foreground Card -->
    <rect x="-140" y="-22" width="280" height="42" rx="10" fill="#00F0FF" stroke="#000000" stroke-width="3" />

    <!-- Cyber Badge Accent Tag -->
    <rect x="-132" y="-15" width="46" height="28" rx="6" fill="#000000" />
    <text x="-109" y="4" fill="#FFE600" font-family="'Courier New', monospace" font-size="11" font-weight="900" text-anchor="middle">
      AI 3.0
    </text>

    <!-- Main Title -->
    <text x="-15" y="6" fill="#000000" font-family="'Impact', 'Arial Black', sans-serif" font-size="20" font-weight="900" letter-spacing="1">
      CYBER CHESS
    </text>
  </g>
</svg>
