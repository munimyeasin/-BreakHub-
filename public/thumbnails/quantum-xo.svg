<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="xoBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0819" />
      <stop offset="50%" stop-color="#180D35" />
      <stop offset="100%" stop-color="#050818" />
    </linearGradient>
    <linearGradient id="xoBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#FFECC8" />
    </linearGradient>

    <!-- Mascot Gradients -->
    <linearGradient id="xCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00A3FF" />
    </linearGradient>
    <linearGradient id="oPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="100%" stop-color="#D9006C" />
    </linearGradient>
    <linearGradient id="starGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="100%" stop-color="#FFE600" />
    </linearGradient>

    <!-- Neo-Brutalist Hard Drop Shadow -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <style>
    /* Default Dark Mode Styles */
    .theme-bg { fill: url(#xoBgDark); }
    .theme-grid-line { stroke: #FFFFFF; stroke-opacity: 0.18; }
    .theme-dot { fill: #FFFFFF; fill-opacity: 0.08; }
    .theme-board-card { fill: #130F26; stroke: #FFE600; }
    .theme-board-slot { fill: #0B0819; stroke: #2A224D; }
    .theme-o-inner { fill: #130F26; }
    .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
    .theme-badge-text { fill: #000000; }
    .theme-tag-rect { fill: #FFE600; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    /* Responsive Light Mode Styles */
    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#xoBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.12; }
      .theme-dot { fill: #000000; fill-opacity: 0.08; }
      .theme-board-card { fill: #FFFFFF; stroke: #000000; }
      .theme-board-slot { fill: #FFF8E7; stroke: #E2D9C8; }
      .theme-o-inner { fill: #FFFFFF; }
      .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
      .theme-badge-text { fill: #000000; }
      .theme-tag-rect { fill: #FFE600; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Subtle Retro Grid Pattern -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- 3D Neo-Brutalist Main Arena Platform -->
  <rect x="44" y="44" width="316" height="316" rx="28" fill="#000000" />
  <rect x="40" y="38" width="316" height="316" rx="28" class="theme-board-card" stroke-width="3.5" />

  <!-- 3x3 Grid Slot Matrix -->
  <g class="theme-board-slot" stroke-width="2">
    <!-- Row 0 -->
    <rect x="58" y="56" width="86" height="86" rx="16" />
    <rect x="157" y="56" width="86" height="86" rx="16" />
    <rect x="256" y="56" width="86" height="86" rx="16" />
    <!-- Row 1 -->
    <rect x="58" y="153" width="86" height="86" rx="16" />
    <rect x="157" y="153" width="86" height="86" rx="16" />
    <rect x="256" y="153" width="86" height="86" rx="16" />
    <!-- Row 2 -->
    <rect x="58" y="250" width="86" height="86" rx="16" />
    <rect x="157" y="250" width="86" height="86" rx="16" />
    <rect x="256" y="250" width="86" height="86" rx="16" />
  </g>

  <!-- Top-Left Mini X Tile -->
  <g transform="translate(101, 99)" filter="url(#brutalShadowSm)">
    <line x1="-22" y1="-22" x2="22" y2="22" stroke="#000000" stroke-width="14" stroke-linecap="round" />
    <line x1="22" y1="-22" x2="-22" y2="22" stroke="#000000" stroke-width="14" stroke-linecap="round" />
    <line x1="-22" y1="-22" x2="22" y2="22" stroke="url(#xCyanGrad)" stroke-width="8" stroke-linecap="round" />
    <line x1="22" y1="-22" x2="-22" y2="22" stroke="url(#xCyanGrad)" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Top-Right Mini O Tile -->
  <g transform="translate(299, 99)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#000000" stroke-width="14" />
    <circle cx="0" cy="0" r="24" fill="none" stroke="url(#oPinkGrad)" stroke-width="8" />
  </g>

  <!-- Bottom-Center Mini X Tile -->
  <g transform="translate(200, 293)" filter="url(#brutalShadowSm)">
    <line x1="-22" y1="-22" x2="22" y2="22" stroke="#000000" stroke-width="14" stroke-linecap="round" />
    <line x1="22" y1="-22" x2="-22" y2="22" stroke="#000000" stroke-width="14" stroke-linecap="round" />
    <line x1="-22" y1="-22" x2="22" y2="22" stroke="url(#xCyanGrad)" stroke-width="8" stroke-linecap="round" />
    <line x1="22" y1="-22" x2="-22" y2="22" stroke="url(#xCyanGrad)" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Center Center: Tactical Clash Star & "VS AI" Banner -->
  <g transform="translate(200, 196)" filter="url(#brutalShadowSm)">
    <!-- Golden Clash Star -->
    <polygon points="0,-28 9,-7 30,-7 14,7 20,28 0,14 -20,28 -14,7 -30,-7 -9,-7" fill="url(#starGoldGrad)" stroke="#000000" stroke-width="3" />
    <!-- Center AI Core Dot -->
    <circle cx="0" cy="3" r="4" fill="#000000" />
  </g>

  <!-- Main Animated Character: Neon "X" Hero (Middle Left Slot) -->
  <g transform="translate(101, 196)" filter="url(#brutalShadow)">
    <!-- Bold Black Border Arms -->
    <line x1="-30" y1="-30" x2="30" y2="30" stroke="#000000" stroke-width="20" stroke-linecap="round" />
    <line x1="30" y1="-30" x2="-30" y2="30" stroke="#000000" stroke-width="20" stroke-linecap="round" />

    <!-- Vibrant Electric Cyan Fills -->
    <line x1="-30" y1="-30" x2="30" y2="30" stroke="url(#xCyanGrad)" stroke-width="13" stroke-linecap="round" />
    <line x1="30" y1="-30" x2="-30" y2="30" stroke="url(#xCyanGrad)" stroke-width="13" stroke-linecap="round" />

    <!-- Inner Crisp White Lighting Spine -->
    <line x1="-27" y1="-27" x2="27" y2="27" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <line x1="27" y1="-27" x2="-27" y2="27" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9" />

    <!-- Cute Expressive Eyes on X -->
    <circle cx="-10" cy="-3" r="4" fill="#000000" />
    <circle cx="10" cy="-3" r="4" fill="#000000" />
    <circle cx="-8.5" cy="-4.5" r="1.5" fill="#FFFFFF" />
    <circle cx="11.5" cy="-4.5" r="1.5" fill="#FFFFFF" />
    <!-- Feisty Grin -->
    <path d="M -7,7 Q 0,13 7,7" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Main Animated Character: Neon "O" Hero (Middle Right Slot) -->
  <g transform="translate(299, 196)" filter="url(#brutalShadow)">
    <!-- Outer Bold Black Ring -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="#000000" stroke-width="18" />
    <!-- Vibrant Magenta-Pink Body -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="url(#oPinkGrad)" stroke-width="12" />
    <!-- Inner Highlight Ring -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.8" />
    <!-- Inner Center Mask -->
    <circle cx="0" cy="0" r="25" class="theme-o-inner" />

    <!-- Cute Cheerful Eyes on O -->
    <ellipse cx="-10" cy="-3" rx="3.5" ry="5" fill="#000000" />
    <ellipse cx="10" cy="-3" rx="3.5" ry="5" fill="#000000" />
    <circle cx="-8.5" cy="-4.5" r="1.5" fill="#FFFFFF" />
    <circle cx="11.5" cy="-4.5" r="1.5" fill="#FFFFFF" />
    <!-- Happy Smile -->
    <path d="M -7,7 Q 0,14 7,7" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Top Ribbon Badge: "3x3 STRATEGY" -->
  <g transform="translate(200, 40)" filter="url(#brutalShadowSm)">
    <rect x="-65" y="-12" width="130" height="24" rx="8" class="theme-tag-rect" stroke-width="2.5" />
    <text x="0" y="4" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">OVERTHINKER AI</text>
  </g>

  <!-- Bottom Title Badge Pill: "QUANTUM XO" -->
  <g transform="translate(200, 362)" filter="url(#brutalShadowSm)">
    <rect x="-85" y="-15" width="170" height="30" rx="10" class="theme-badge-rect" stroke-width="3" />
    <text x="0" y="5" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1.5">QUANTUM XO</text>
  </g>
</svg>
