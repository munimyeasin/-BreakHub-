<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="neoShadowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000000" />
    </filter>
    <filter id="neoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" />
    </filter>
    <filter id="neoShadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Neo Ground -->
  <rect width="400" height="400" fill="#FAF8F5" />

  <!-- Dot Matrix Grid -->
  <g fill="#000000" opacity="0.08">
    <circle cx="40" cy="40" r="2" /><circle cx="100" cy="40" r="2" /><circle cx="160" cy="40" r="2" /><circle cx="220" cy="40" r="2" /><circle cx="280" cy="40" r="2" /><circle cx="340" cy="40" r="2" />
    <circle cx="40" cy="100" r="2" /><circle cx="100" cy="100" r="2" /><circle cx="160" cy="100" r="2" /><circle cx="220" cy="100" r="2" /><circle cx="280" cy="100" r="2" /><circle cx="340" cy="100" r="2" />
    <circle cx="40" cy="160" r="2" /><circle cx="100" cy="160" r="2" /><circle cx="160" cy="160" r="2" /><circle cx="220" cy="160" r="2" /><circle cx="280" cy="160" r="2" /><circle cx="340" cy="160" r="2" />
    <circle cx="40" cy="220" r="2" /><circle cx="100" cy="220" r="2" /><circle cx="160" cy="220" r="2" /><circle cx="220" cy="220" r="2" /><circle cx="280" cy="220" r="2" /><circle cx="340" cy="220" r="2" />
    <circle cx="40" cy="280" r="2" /><circle cx="100" cy="280" r="2" /><circle cx="160" cy="280" r="2" /><circle cx="220" cy="280" r="2" /><circle cx="280" cy="280" r="2" /><circle cx="340" cy="280" r="2" />
    <circle cx="40" cy="340" r="2" /><circle cx="100" cy="340" r="2" /><circle cx="160" cy="340" r="2" /><circle cx="220" cy="340" r="2" /><circle cx="280" cy="340" r="2" /><circle cx="340" cy="340" r="2" />
  </g>

  <!-- Outer Border -->
  <rect x="12" y="12" width="376" height="376" rx="20" fill="none" stroke="#000000" stroke-width="4" />

  <!-- Main Container -->
  <rect x="36" y="36" width="328" height="328" rx="16" fill="#99E885" stroke="#000000" stroke-width="3.5" filter="url(#neoShadowLg)" />

  <!-- Board White Panel -->
  <rect x="54" y="54" width="292" height="292" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="3" />

  <!-- 3x3 Grid Lines (Bold Solid Black Bars) -->
  <line x1="151" y1="64" x2="151" y2="336" stroke="#000000" stroke-width="6" stroke-linecap="round" />
  <line x1="248" y1="64" x2="248" y2="336" stroke="#000000" stroke-width="6" stroke-linecap="round" />
  <line x1="64" y1="151" x2="336" y2="151" stroke="#000000" stroke-width="6" stroke-linecap="round" />
  <line x1="64" y1="248" x2="336" y2="248" stroke="#000000" stroke-width="6" stroke-linecap="round" />

  <!-- Cells & Pieces -->
  <!-- Cell (0,0): X (Neo Pink) -->
  <g transform="translate(102, 102)" filter="url(#neoShadowSm)">
    <line x1="-24" y1="-24" x2="24" y2="24" stroke="#000000" stroke-width="12" stroke-linecap="round" />
    <line x1="24" y1="-24" x2="-24" y2="24" stroke="#000000" stroke-width="12" stroke-linecap="round" />
    <line x1="-24" y1="-24" x2="24" y2="24" stroke="#FE90E8" stroke-width="6" stroke-linecap="round" />
    <line x1="24" y1="-24" x2="-24" y2="24" stroke="#FE90E8" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Cell (1,1): X (Neo Pink Central) -->
  <g transform="translate(200, 200)" filter="url(#neoShadow)">
    <line x1="-28" y1="-28" x2="28" y2="28" stroke="#000000" stroke-width="14" stroke-linecap="round" />
    <line x1="28" y1="-28" x2="-28" y2="28" stroke="#000000" stroke-width="14" stroke-linecap="round" />
    <line x1="-28" y1="-28" x2="28" y2="28" stroke="#FE90E8" stroke-width="8" stroke-linecap="round" />
    <line x1="28" y1="-28" x2="-28" y2="28" stroke="#FE90E8" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Cell (2,2): X (Neo Pink Winning Diagonal) -->
  <g transform="translate(298, 298)" filter="url(#neoShadowSm)">
    <line x1="-24" y1="-24" x2="24" y2="24" stroke="#000000" stroke-width="12" stroke-linecap="round" />
    <line x1="24" y1="-24" x2="-24" y2="24" stroke="#000000" stroke-width="12" stroke-linecap="round" />
    <line x1="-24" y1="-24" x2="24" y2="24" stroke="#FE90E8" stroke-width="6" stroke-linecap="round" />
    <line x1="24" y1="-24" x2="-24" y2="24" stroke="#FE90E8" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Cell (0,1): O (Neo Cyan) -->
  <g transform="translate(102, 200)" filter="url(#neoShadowSm)">
    <circle cx="0" cy="0" r="28" fill="#C0F7FE" stroke="#000000" stroke-width="4" />
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
  </g>

  <!-- Cell (2,0): O (Neo Yellow) -->
  <g transform="translate(298, 102)" filter="url(#neoShadowSm)">
    <circle cx="0" cy="0" r="28" fill="#F7CB46" stroke="#000000" stroke-width="4" />
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
  </g>

  <!-- Diagonal Win Strike Line -->
  <line x1="68" y1="68" x2="332" y2="332" stroke="#000000" stroke-width="8" stroke-linecap="round" />
  <line x1="68" y1="68" x2="332" y2="332" stroke="#F7CB46" stroke-width="4" stroke-linecap="round" />

  <!-- Top Versus Floating Badge -->
  <g transform="translate(200, 26) rotate(-2)">
    <rect x="-80" y="-14" width="160" height="28" rx="8" fill="#F7CB46" stroke="#000000" stroke-width="2.5" filter="url(#neoShadowSm)" />
    <text x="0" y="5" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">VS OVERTHINKER AI</text>
  </g>

  <!-- Corner Figma Transform Nodes -->
  <rect x="6" y="6" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="382" y="6" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="6" y="382" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="382" y="382" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
</svg>
