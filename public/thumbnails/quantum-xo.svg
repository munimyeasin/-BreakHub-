<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18000F" />
      <stop offset="50%" stop-color="#2A0518" />
      <stop offset="100%" stop-color="#070014" />
    </linearGradient>
    <radialGradient id="bgMagGlow" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="rgba(255,0,127,0.2)" />
      <stop offset="40%" stop-color="rgba(0,240,255,0.1)" />
      <stop offset="100%" stop-color="rgba(24,0,15,0)" />
    </radialGradient>
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowLg" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" fill="url(#bgDark)" />

  <!-- Radial Magenta / Cyan Glow -->
  <circle cx="200" cy="186" r="270" fill="url(#bgMagGlow)" />

  <!-- White Cyber Dashed Grid -->
  <g stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4,3">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- 3D MAIN ARCADE CONTAINER -->
  <g filter="url(#brutalShadowLg)">
    <rect x="36" y="38" width="328" height="298" rx="22" fill="#140516" stroke="#FF007F" stroke-width="4" />
  </g>

  <!-- Inner Playfield Void Stage -->
  <rect x="48" y="48" width="304" height="278" rx="16" fill="#08020B" stroke="#000000" stroke-width="2.5" />

  <!-- Perspective Arena Grid Lines (Dashed Cyber Grid) -->
  <g stroke="#3D1030" stroke-width="1.5" stroke-dasharray="4,3">
    <line x1="48" y1="88" x2="352" y2="88" />
    <line x1="48" y1="136" x2="352" y2="136" />
    <line x1="48" y1="184" x2="352" y2="184" />
    <line x1="48" y1="232" x2="352" y2="232" />
    <line x1="48" y1="280" x2="352" y2="280" />
    <line x1="96" y1="48" x2="96" y2="326" />
    <line x1="148" y1="48" x2="148" y2="326" />
    <line x1="200" y1="48" x2="200" y2="326" />
    <line x1="252" y1="48" x2="252" y2="326" />
    <line x1="304" y1="48" x2="304" y2="326" />
  </g>

  <!-- Top-Left Mini 3D X Token (Slot 0,0) -->
  <g transform="translate(101, 96)" filter="url(#brutalShadowSm)">
    <g stroke="#000000" stroke-width="2.5">
      <line x1="-18" y1="-14" x2="22" y2="26" stroke="#0080B3" stroke-width="12" stroke-linecap="round" />
      <line x1="22" y1="-14" x2="-18" y2="26" stroke="#0080B3" stroke-width="12" stroke-linecap="round" />
      <line x1="-20" y1="-18" x2="20" y2="22" stroke="#7DF9FF" stroke-width="8" stroke-linecap="round" />
      <line x1="20" y1="-18" x2="-20" y2="22" stroke="#7DF9FF" stroke-width="8" stroke-linecap="round" />
    </g>
  </g>

  <!-- Top-Right Mini 3D O Token (Slot 0,2) -->
  <g transform="translate(299, 96)" filter="url(#brutalShadowSm)">
    <g stroke="#000000" stroke-width="2.5">
      <circle cx="2" cy="4" r="22" fill="none" stroke="#BA005C" stroke-width="10" />
      <circle cx="0" cy="0" r="22" fill="#FF63C6" />
      <circle cx="0" cy="0" r="11" fill="#000000" opacity="0.7" />
    </g>
  </g>

  <!-- Bottom-Left Mini 3D O Token (Slot 2,0) -->
  <g transform="translate(101, 276)" filter="url(#brutalShadowSm)">
    <g stroke="#000000" stroke-width="2.5">
      <circle cx="2" cy="4" r="22" fill="none" stroke="#BA005C" stroke-width="10" />
      <circle cx="0" cy="0" r="22" fill="#FF63C6" />
      <circle cx="0" cy="0" r="11" fill="#000000" opacity="0.7" />
    </g>
  </g>

  <!-- Bottom-Right Mini 3D X Token (Slot 2,2) -->
  <g transform="translate(299, 276)" filter="url(#brutalShadowSm)">
    <g stroke="#000000" stroke-width="2.5">
      <line x1="-18" y1="-14" x2="22" y2="26" stroke="#0080B3" stroke-width="12" stroke-linecap="round" />
      <line x1="22" y1="-14" x2="-18" y2="26" stroke="#0080B3" stroke-width="12" stroke-linecap="round" />
      <line x1="-20" y1="-18" x2="20" y2="22" stroke="#7DF9FF" stroke-width="8" stroke-linecap="round" />
      <line x1="20" y1="-18" x2="-20" y2="22" stroke="#7DF9FF" stroke-width="8" stroke-linecap="round" />
    </g>
  </g>

  <!-- 3D Hero Titan X Warrior (Middle Left: X=101, Y=186) -->
  <g transform="translate(101, 186)" filter="url(#brutalShadowLg)">
    <g stroke="#000000" stroke-width="3.5">
      <line x1="-28" y1="-22" x2="32" y2="38" stroke="#0080B3" stroke-width="20" stroke-linecap="round" />
      <line x1="32" y1="-22" x2="-28" y2="38" stroke="#0080B3" stroke-width="20" stroke-linecap="round" />
      <line x1="-30" y1="-28" x2="30" y2="32" stroke="#7DF9FF" stroke-width="14" stroke-linecap="round" />
      <line x1="30" y1="-28" x2="-30" y2="32" stroke="#7DF9FF" stroke-width="14" stroke-linecap="round" />
      <!-- Extruded side facets -->
      <polygon points="-32,-28 -16,-34 0,-28 -14,-22 -32,-12" fill="#005B80" opacity="0.8" />
      <polygon points="32,32 16,26 0,34 14,22 32,12" fill="#005B80" opacity="0.8" />
    </g>
    <path d="M -26,-26 L -10,-30 L 16,12 L 10,18 Z" fill="#FFFFFF" opacity="0.85" />
    <!-- Cyber Visor Eyes -->
    <circle cx="-10" cy="2" r="3.5" fill="#000000" />
    <circle cx="10" cy="2" r="3.5" fill="#000000" />
    <circle cx="-8.5" cy="0.5" r="1.5" fill="#FFFFFF" />
    <circle cx="11.5" cy="0.5" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- 3D Hero Titan O Guardian (Middle Right: X=299, Y=186) -->
  <g transform="translate(299, 186)" filter="url(#brutalShadowLg)">
    <g stroke="#000000" stroke-width="3.5">
      <circle cx="4" cy="6" r="32" fill="none" stroke="#BA005C" stroke-width="18" />
      <circle cx="0" cy="0" r="32" fill="#FF63C6" />
      <circle cx="0" cy="0" r="16" fill="#000000" opacity="0.75" />
    </g>
    <path d="M -22,-20 A 28 28 0 0 1 20,-22" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
    <ellipse cx="-10" cy="2" rx="3.5" ry="5" fill="#000000" />
    <ellipse cx="10" cy="2" rx="3.5" ry="5" fill="#000000" />
    <circle cx="-8.5" cy="0.5" r="1.5" fill="#FFFFFF" />
    <circle cx="11.5" cy="0.5" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Center Quantum Clash Matrix Node -->
  <g transform="translate(200, 186)" filter="url(#brutalShadow)">
    <polygon points="0,-26 8,-8 26,-8 12,6 18,24 0,12 -18,24 -12,6 -26,-8 -8,-8" fill="#FFF066" stroke="#000000" stroke-width="2.5" />
    <circle cx="0" cy="2" r="5" fill="#000000" />
    <polygon points="0,-6 5,4 -5,4" fill="#FFE600" />
    <circle cx="0" cy="2" r="2" fill="#FF007F" />
  </g>

  <!-- Orbiting particles around center node -->
  <g fill="#FFE600" opacity="0.6">
    <circle cx="101" cy="96" r="1.3" />
    <circle cx="299" cy="96" r="1.3" />
    <circle cx="101" cy="276" r="1.3" />
    <circle cx="299" cy="276" r="1.3" />
  </g>

  <!-- Action Popup Combo Badge: "QUANTUM STRIKE!" -->
  <g transform="translate(200, 110)" filter="url(#brutalShadow)">
    <polygon points="0,-22 8,-8 24,-14 16,-1 30,10 14,14 18,28 4,20 -4,28 -2,14 -18,18 -12,4 -28,-2 -14,-10 -20,-24 -6,-16" fill="#FFF066" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="8.5" fill="#000000" text-anchor="middle" letter-spacing="0.5">
      QUANTUM STRIKE!
    </text>
  </g>

  <!-- Top Tag Ribbon: "TACTICAL 3X3 MATRIX" -->
  <g transform="translate(200, 32)" filter="url(#brutalShadowSm)">
    <rect x="-85" y="-12" width="170" height="24" rx="8" fill="#FF007F" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="4.5" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="10.5" text-anchor="middle" letter-spacing="1.2">
      TACTICAL 3X3 MATRIX
    </text>
  </g>

  <!-- Bottom Title Marquee: "QUANTUM XO" -->
  <g transform="translate(200, 360)" filter="url(#brutalShadowLg)">
    <rect x="-125" y="-18" width="250" height="36" rx="12" fill="#FF007F" stroke="#000000" stroke-width="3.5" />
    <rect x="-120" y="-14" width="240" height="28" rx="8" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.3" />
    <text x="0" y="6" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="15" text-anchor="middle" letter-spacing="1.5">
      QUANTUM XO
    </text>
  </g>

  <!-- Bottom Left/Right Rivet Accents -->
  <circle cx="84" cy="360" r="3" fill="#000000" />
  <circle cx="316" cy="360" r="3" fill="#000000" />
</svg>