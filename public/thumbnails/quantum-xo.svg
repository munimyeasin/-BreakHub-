<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="xoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04091a" />
      <stop offset="50%" stop-color="#14082e" />
      <stop offset="100%" stop-color="#021c1e" />
    </linearGradient>
    <filter id="xGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00f0ff" flood-opacity="0.95" />
    </filter>
    <filter id="oGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff007f" flood-opacity="0.95" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#xoBg)" />

  <!-- 3x3 Neon Grid -->
  <g stroke="#ffffff" stroke-width="5" opacity="0.3" stroke-linecap="round">
    <line x1="140" y1="50" x2="140" y2="330" />
    <line x1="260" y1="50" x2="260" y2="330" />
    <line x1="50" y1="140" x2="350" y2="140" />
    <line x1="50" y1="240" x2="350" y2="240" />
  </g>

  <!-- Cute Cartoon Neon "X" Mascot Hero (Left) -->
  <g filter="url(#xGlow)" transform="translate(95, 190)">
    <!-- Main Cross Arms -->
    <line x1="-35" y1="-35" x2="35" y2="35" stroke="#00f0ff" stroke-width="18" stroke-linecap="round" />
    <line x1="35" y1="-35" x2="-35" y2="35" stroke="#00f0ff" stroke-width="18" stroke-linecap="round" />

    <line x1="-35" y1="-35" x2="35" y2="35" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
    <line x1="35" y1="-35" x2="-35" y2="35" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />

    <!-- Cute Eyes on X -->
    <circle cx="-12" cy="-4" r="4.5" fill="#000" />
    <circle cx="12" cy="-4" r="4.5" fill="#000" />
    <circle cx="-10" cy="-6" r="1.5" fill="#fff" />
    <circle cx="14" cy="-6" r="1.5" fill="#fff" />
    <!-- Feisty grin -->
    <path d="M -8,8 Q 0,16 8,8" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Cute Cartoon Neon "O" Mascot Hero (Right) -->
  <g filter="url(#oGlow)" transform="translate(305, 190)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="38" fill="#1b082e" stroke="#ff007f" stroke-width="15" />
    <circle cx="0" cy="0" r="38" fill="none" stroke="#ffffff" stroke-width="6" />

    <!-- Cute Cheerful Eyes on O -->
    <ellipse cx="-12" cy="-4" rx="4.5" ry="6" fill="#fff" />
    <ellipse cx="12" cy="-4" rx="4.5" ry="6" fill="#fff" />
    <circle cx="-11" cy="-5" r="2.5" fill="#000" />
    <circle cx="13" cy="-5" r="2.5" fill="#000" />
    <!-- Happy Smile -->
    <path d="M -8,9 Q 0,18 8,9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>

  <!-- Mini Grid Pieces -->
  <!-- Top Left: Mini X -->
  <g transform="translate(95, 95)" opacity="0.85">
    <line x1="-20" y1="-20" x2="20" y2="20" stroke="#00f0ff" stroke-width="9" stroke-linecap="round" />
    <line x1="20" y1="-20" x2="-20" y2="20" stroke="#00f0ff" stroke-width="9" stroke-linecap="round" />
  </g>

  <!-- Top Center: Mini O -->
  <g transform="translate(200, 95)" opacity="0.85">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#ff007f" stroke-width="9" />
  </g>

  <!-- Center Center: Winning Golden Star Strike -->
  <g transform="translate(200, 190)">
    <!-- Lightning Clash in Center! -->
    <polygon points="0,-25 8,-5 25,-5 12,6 18,24 0,12 -18,24 -12,6 -25,-5 -8,-5" fill="#ffe600" stroke="#fff" stroke-width="2" />
    <text x="0" y="38" font-family="'Arial Black', sans-serif" font-size="12" fill="#ffe600" font-weight="900" text-anchor="middle">VS AI</text>
  </g>

  <!-- Bottom Center: Mini X -->
  <g transform="translate(200, 285)" opacity="0.85">
    <line x1="-20" y1="-20" x2="20" y2="20" stroke="#00f0ff" stroke-width="9" stroke-linecap="round" />
    <line x1="20" y1="-20" x2="-20" y2="20" stroke="#00f0ff" stroke-width="9" stroke-linecap="round" />
  </g>

  <!-- Title Badge -->
  <rect x="25" y="345" width="130" height="30" rx="10" fill="#00f0ff" opacity="0.2" stroke="#00f0ff" stroke-width="1.5" />
  <text x="90" y="365" fill="#00f0ff" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">QUANTUM XO</text>
</svg>
