<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="fruitBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051d" />
      <stop offset="50%" stop-color="#14082e" />
      <stop offset="100%" stop-color="#031628" />
    </linearGradient>
    <linearGradient id="fruitBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FFF5E6" />
      <stop offset="100%" stop-color="#FFE8C2" />
    </linearGradient>

    <!-- Fruit Sphere Gradients -->
    <!-- Watermelon (Cyan/Emerald/Dark Green) -->
    <radialGradient id="melonGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E6FFFF" />
      <stop offset="35%" stop-color="#00FFCC" />
      <stop offset="75%" stop-color="#00B386" />
      <stop offset="100%" stop-color="#004D38" />
    </radialGradient>
    <!-- Pineapple (Golden Amber) -->
    <radialGradient id="pineappleGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFBE6" />
      <stop offset="35%" stop-color="#FFDE59" />
      <stop offset="75%" stop-color="#FF8800" />
      <stop offset="100%" stop-color="#803300" />
    </radialGradient>
    <!-- Apple / Strawberry (Hot Pink / Neon Red) -->
    <radialGradient id="appleGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFE6EC" />
      <stop offset="35%" stop-color="#FF0055" />
      <stop offset="75%" stop-color="#B3003B" />
      <stop offset="100%" stop-color="#4D0019" />
    </radialGradient>
    <!-- Grape (Plasma Purple) -->
    <radialGradient id="grapeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F2E6FF" />
      <stop offset="35%" stop-color="#9900FF" />
      <stop offset="75%" stop-color="#6600B3" />
      <stop offset="100%" stop-color="#2D004D" />
    </radialGradient>
    <!-- Dekopon Orange -->
    <radialGradient id="orangeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF0E6" />
      <stop offset="35%" stop-color="#FF8800" />
      <stop offset="75%" stop-color="#CC5500" />
      <stop offset="100%" stop-color="#662200" />
    </radialGradient>

    <!-- Neon Drop Guide Laser -->
    <linearGradient id="dropLaser" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF0055" stop-opacity="0" />
      <stop offset="40%" stop-color="#FF0055" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF0055" stop-opacity="0.9" />
    </linearGradient>

    <!-- Starburst Gold -->
    <linearGradient id="goldBurst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF570" />
      <stop offset="100%" stop-color="#FFDE59" />
    </linearGradient>

    <!-- Neo-Brutalist Hard Drop Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowLg" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00FFCC" flood-opacity="0.8" />
    </filter>
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF0055" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#fruitBgDark); }
    .theme-grid-line { stroke: #FFFFFF; stroke-opacity: 0.12; }
    .theme-frame-bg { fill: #0B081E; stroke: #FFDE59; }
    .theme-stage-grid { stroke: #2A1C54; }
    .theme-badge-rect { fill: #FF007F; stroke: #000000; }
    .theme-badge-text { fill: #FFFFFF; }
    .theme-tag-rect { fill: #00FFCC; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#fruitBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.1; }
      .theme-frame-bg { fill: #FFFFFF; stroke: #000000; }
      .theme-stage-grid { stroke: #E2E8F0; }
      .theme-badge-rect { fill: #FF007F; stroke: #000000; }
      .theme-badge-text { fill: #FFFFFF; }
      .theme-tag-rect { fill: #00FFCC; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Retro Cyber Grid Backdrop -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- Sparkles / Cyber Stars -->
  <g fill="#FFDE59">
    <polygon points="35,46 37,54 45,56 37,58 35,66 33,58 25,56 33,54" />
    <polygon points="365,40 367,48 375,50 367,52 365,60 363,52 355,50 363,48" />
    <polygon points="360,300 362,306 368,308 362,310 360,316 358,310 352,308 358,306" />
    <polygon points="40,315 42,321 48,323 42,325 40,331 38,325 32,323 38,321" />
  </g>

  <!-- 3D NEO-BRUTALIST CONTAINER -->
  <g filter="url(#brutalShadowLg)">
    <rect x="36" y="38" width="328" height="298" rx="22" class="theme-frame-bg" stroke-width="4" />
  </g>

  <!-- Inner Stage Playfield -->
  <rect x="48" y="48" width="304" height="278" rx="16" fill="#04020E" stroke="#000000" stroke-width="2.5" />

  <!-- Playfield Subtle Grid Lines -->
  <g class="theme-stage-grid" stroke-width="1.2" stroke-dasharray="4,4">
    <line x1="48" y1="90" x2="352" y2="90" />
    <line x1="48" y1="135" x2="352" y2="135" />
    <line x1="48" y1="180" x2="352" y2="180" />
    <line x1="48" y1="225" x2="352" y2="225" />
    <line x1="48" y1="270" x2="352" y2="270" />
    <line x1="100" y1="48" x2="100" y2="326" />
    <line x1="160" y1="48" x2="160" y2="326" />
    <line x1="220" y1="48" x2="220" y2="326" />
    <line x1="280" y1="48" x2="280" y2="326" />
  </g>

  <!-- DANGER OVERFLOW LIMIT LINE (Top Hazard line) -->
  <g>
    <line x1="48" y1="96" x2="352" y2="96" stroke="#FF0055" stroke-width="2" stroke-dasharray="6,4" opacity="0.65" />
    <text x="344" y="91" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="7.5" fill="#FF0055" text-anchor="end" opacity="0.75" letter-spacing="1">
      LIMIT THRESHOLD
    </text>
  </g>

  <!-- DROPPER LASER AIM PROJECTION -->
  <g>
    <line x1="270" y1="62" x2="270" y2="220" stroke="#FF007F" stroke-width="1.8" stroke-dasharray="4,4" opacity="0.45" />
    <line x1="270" y1="56" x2="270" y2="82" stroke="#FF007F" stroke-width="3" opacity="0.8" />
  </g>

  <!-- FRUIT PHYSICS STACK IN CONTAINER -->

  <!-- FRUIT 1: BOTTOM LEFT SOLAR PINEAPPLE (LV.9) -->
  <g transform="translate(115, 260)" filter="url(#brutalShadow)">
    <circle cx="0" cy="0" r="42" fill="url(#pineappleGrad)" stroke="#000000" stroke-width="3.5" />
    <!-- Cyberpunk Circuit Decal -->
    <path d="M -22,-15 A 28 28 0 0 1 20,20" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4" />
    <!-- Specular Highlight -->
    <ellipse cx="-14" cy="-16" rx="12" ry="6" transform="rotate(-30, -14, -16)" fill="#FFFFFF" opacity="0.7" />
    <!-- Fruit Icon -->
    <text x="0" y="4" font-size="28" text-anchor="middle" dominant-baseline="middle">🍍</text>
    <text x="0" y="24" font-family="'Impact', 'Arial Black', sans-serif" font-size="9" font-weight="900" fill="#000000" text-anchor="middle">LV.9</text>
  </g>

  <!-- FRUIT 2: HERO SINGULARITY CYBER WATERMELON (LV.MAX - Center Giant) -->
  <g transform="translate(235, 232)" filter="url(#cyanGlow)">
    <circle cx="0" cy="0" r="56" fill="url(#melonGrad)" stroke="#000000" stroke-width="4" />
    <!-- Cyber Striping Bands -->
    <path d="M -44,-10 Q 0,-30 44,-10" fill="none" stroke="#004D38" stroke-width="4" opacity="0.8" />
    <path d="M -50,15 Q 0,-5 50,15" fill="none" stroke="#004D38" stroke-width="4" opacity="0.8" />
    <path d="M -38,40 Q 0,20 38,40" fill="none" stroke="#004D38" stroke-width="3.5" opacity="0.8" />
    <!-- Specular Arc -->
    <ellipse cx="-20" cy="-22" rx="18" ry="8" transform="rotate(-35, -20, -22)" fill="#FFFFFF" opacity="0.75" />
    <!-- Watermelon Center Emoji -->
    <text x="0" y="2" font-size="38" text-anchor="middle" dominant-baseline="middle">🍉</text>
    <text x="0" y="32" font-family="'Impact', 'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="0.5">MAX</text>
  </g>

  <!-- FRUIT 3: RADIANT APPLE (LV.6 - Top Left Floating) -->
  <g transform="translate(100, 172)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="28" fill="url(#appleGrad)" stroke="#000000" stroke-width="3" />
    <!-- Highlight -->
    <ellipse cx="-8" cy="-10" rx="8" ry="4" transform="rotate(-30, -8, -10)" fill="#FFFFFF" opacity="0.7" />
    <text x="0" y="2" font-size="20" text-anchor="middle" dominant-baseline="middle">🍎</text>
    <text x="0" y="16" font-family="'Impact', 'Arial Black', sans-serif" font-size="7.5" font-weight="900" fill="#000000" text-anchor="middle">LV.6</text>
  </g>

  <!-- FRUIT 4: PLASMA GRAPE (LV.3) -->
  <g transform="translate(162, 168)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="20" fill="url(#grapeGrad)" stroke="#000000" stroke-width="2.5" />
    <ellipse cx="-6" cy="-6" rx="6" ry="3" transform="rotate(-30, -6, -6)" fill="#FFFFFF" opacity="0.7" />
    <text x="0" y="1" font-size="14" text-anchor="middle" dominant-baseline="middle">🍇</text>
  </g>

  <!-- FRUIT 5: QUANTUM DEKOPON (LV.4) -->
  <g transform="translate(305, 142)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="24" fill="url(#orangeGrad)" stroke="#000000" stroke-width="2.5" />
    <ellipse cx="-7" cy="-8" rx="7" ry="3.5" transform="rotate(-30, -7, -8)" fill="#FFFFFF" opacity="0.7" />
    <text x="0" y="1" font-size="16" text-anchor="middle" dominant-baseline="middle">🍊</text>
  </g>

  <!-- FRUIT 6: ACTIVE DROPPER STRAWBERRY (LV.2 - Hanging at Dropper Launcher) -->
  <g transform="translate(270, 68)" filter="url(#pinkGlow)">
    <circle cx="0" cy="0" r="16" fill="url(#appleGrad)" stroke="#000000" stroke-width="2.5" />
    <ellipse cx="-4" cy="-5" rx="5" ry="2.5" transform="rotate(-30, -4, -5)" fill="#FFFFFF" opacity="0.8" />
    <text x="0" y="1" font-size="12" text-anchor="middle" dominant-baseline="middle">🍓</text>
  </g>

  <!-- MERGE SHOCKWAVE EFFECT & PARTICLES -->
  <g filter="url(#cyanGlow)">
    <circle cx="175" cy="205" r="22" fill="none" stroke="#00FFCC" stroke-width="3" stroke-dasharray="4,4" opacity="0.8" />
    <circle cx="175" cy="205" r="34" fill="none" stroke="#FFDE59" stroke-width="2" opacity="0.5" />
  </g>
  <g fill="#00FFCC">
    <circle cx="152" cy="195" r="3" />
    <circle cx="195" cy="190" r="2.5" />
    <circle cx="188" cy="225" r="3" />
    <circle cx="160" cy="220" r="2.5" />
  </g>

  <!-- ACTION POPUP COMBO STARBURST: "+2,048 FUSION!" -->
  <g transform="translate(180, 115)" filter="url(#brutalShadow)">
    <polygon points="0,-22 8,-8 24,-14 16,-1 30,10 14,14 18,28 4,20 -4,28 -2,14 -18,18 -12,4 -28,-2 -14,-10 -20,-24 -6,-16" fill="url(#goldBurst)" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="9" fill="#000000" text-anchor="middle" letter-spacing="0.5">
      +2048 FUSION!
    </text>
  </g>

  <!-- TOP TAG RIBBON: "2D PHYSICS // FRUIT FUSION" -->
  <g transform="translate(200, 32)" filter="url(#brutalShadowSm)">
    <rect x="-95" y="-12" width="190" height="24" rx="8" class="theme-tag-rect" stroke-width="2.5" />
    <text x="0" y="4.5" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="1.2">
      2D PHYSICS // FRUIT FUSION
    </text>
  </g>

  <!-- BOTTOM TITLE MARQUEE: "CYBER FRUIT FUSION" -->
  <g transform="translate(200, 360)" filter="url(#brutalShadowLg)">
    <!-- Outer Brutalist Badge -->
    <rect x="-125" y="-18" width="250" height="36" rx="12" class="theme-badge-rect" stroke-width="3.5" />
    <!-- Inner Dashed Outline -->
    <rect x="-120" y="-14" width="240" height="28" rx="8" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4" />
    <!-- Title Text -->
    <text x="0" y="6" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="15.5" text-anchor="middle" letter-spacing="2">
      CYBER FRUIT FUSION
    </text>
  </g>

  <!-- Bottom Corner Rivets -->
  <circle cx="84" cy="360" r="3" fill="#000000" />
  <circle cx="316" cy="360" r="3" fill="#000000" />
</svg>
