<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Hard Neo-Brutalist Zero-Blur Drop Shadows -->
    <filter id="neoShadowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000000" />
    </filter>
    <filter id="neoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" />
    </filter>
    <filter id="neoShadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Neo-Brutalist Warm Canvas Ground -->
  <rect width="400" height="400" fill="#FAF8F5" />

  <!-- Subtle 24px Dot Matrix Ground Grid -->
  <g fill="#000000" opacity="0.08">
    <circle cx="40" cy="40" r="2" /><circle cx="80" cy="40" r="2" /><circle cx="120" cy="40" r="2" /><circle cx="160" cy="40" r="2" /><circle cx="200" cy="40" r="2" /><circle cx="240" cy="40" r="2" /><circle cx="280" cy="40" r="2" /><circle cx="320" cy="40" r="2" /><circle cx="360" cy="40" r="2" />
    <circle cx="40" cy="80" r="2" /><circle cx="80" cy="80" r="2" /><circle cx="120" cy="80" r="2" /><circle cx="160" cy="80" r="2" /><circle cx="200" cy="80" r="2" /><circle cx="240" cy="80" r="2" /><circle cx="280" cy="80" r="2" /><circle cx="320" cy="80" r="2" /><circle cx="360" cy="80" r="2" />
    <circle cx="40" cy="120" r="2" /><circle cx="80" cy="120" r="2" /><circle cx="120" cy="120" r="2" /><circle cx="160" cy="120" r="2" /><circle cx="200" cy="120" r="2" /><circle cx="240" cy="120" r="2" /><circle cx="280" cy="120" r="2" /><circle cx="320" cy="120" r="2" /><circle cx="360" cy="120" r="2" />
    <circle cx="40" cy="160" r="2" /><circle cx="80" cy="160" r="2" /><circle cx="120" cy="160" r="2" /><circle cx="160" cy="160" r="2" /><circle cx="200" cy="160" r="2" /><circle cx="240" cy="160" r="2" /><circle cx="280" cy="160" r="2" /><circle cx="320" cy="160" r="2" /><circle cx="360" cy="160" r="2" />
    <circle cx="40" cy="200" r="2" /><circle cx="80" cy="200" r="2" /><circle cx="120" cy="200" r="2" /><circle cx="160" cy="200" r="2" /><circle cx="200" cy="200" r="2" /><circle cx="240" cy="200" r="2" /><circle cx="280" cy="200" r="2" /><circle cx="320" cy="200" r="2" /><circle cx="360" cy="200" r="2" />
    <circle cx="40" cy="240" r="2" /><circle cx="80" cy="240" r="2" /><circle cx="120" cy="240" r="2" /><circle cx="160" cy="240" r="2" /><circle cx="200" cy="240" r="2" /><circle cx="240" cy="240" r="2" /><circle cx="280" cy="240" r="2" /><circle cx="320" cy="240" r="2" /><circle cx="360" cy="240" r="2" />
    <circle cx="40" cy="280" r="2" /><circle cx="80" cy="280" r="2" /><circle cx="120" cy="280" r="2" /><circle cx="160" cy="280" r="2" /><circle cx="200" cy="280" r="2" /><circle cx="240" cy="280" r="2" /><circle cx="280" cy="280" r="2" /><circle cx="320" cy="280" r="2" /><circle cx="360" cy="280" r="2" />
    <circle cx="40" cy="320" r="2" /><circle cx="80" cy="320" r="2" /><circle cx="120" cy="320" r="2" /><circle cx="160" cy="320" r="2" /><circle cx="200" cy="320" r="2" /><circle cx="240" cy="320" r="2" /><circle cx="280" cy="320" r="2" /><circle cx="320" cy="320" r="2" /><circle cx="360" cy="320" r="2" />
    <circle cx="40" cy="360" r="2" /><circle cx="80" cy="360" r="2" /><circle cx="120" cy="360" r="2" /><circle cx="160" cy="360" r="2" /><circle cx="200" cy="360" r="2" /><circle cx="240" cy="360" r="2" /><circle cx="280" cy="360" r="2" /><circle cx="320" cy="360" r="2" /><circle cx="360" cy="360" r="2" />
  </g>

  <!-- Outer Structural Border -->
  <rect x="12" y="12" width="376" height="376" rx="20" fill="none" stroke="#000000" stroke-width="4" />

  <!-- Background Geometry Swatches -->
  <rect x="36" y="36" width="328" height="328" rx="16" fill="#C0F7FE" stroke="#000000" stroke-width="3.5" filter="url(#neoShadowLg)" />

  <!-- Minefield Grid Matrix Tiles (Neo-Brutalist Tactile Swatches) -->
  <g>
    <!-- Row 1 -->
    <rect x="56" y="56" width="64" height="64" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="3" filter="url(#neoShadowSm)" />
    <text x="88" y="98" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="900" font-size="28" fill="#FE90E8" stroke="#000000" stroke-width="1.5" text-anchor="middle">1</text>

    <rect x="130" y="56" width="64" height="64" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="3" filter="url(#neoShadowSm)" />
    <text x="162" y="98" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="900" font-size="28" fill="#F7CB46" stroke="#000000" stroke-width="1.5" text-anchor="middle">2</text>

    <rect x="204" y="56" width="64" height="64" rx="10" fill="#99E885" stroke="#000000" stroke-width="3" filter="url(#neoShadowSm)" />
    <text x="236" y="98" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="900" font-size="28" fill="#000000" stroke="#000000" stroke-width="1" text-anchor="middle">★</text>

    <rect x="278" y="56" width="64" height="64" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="3" filter="url(#neoShadowSm)" />
    <text x="310" y="98" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="900" font-size="28" fill="#FE90E8" stroke="#000000" stroke-width="1.5" text-anchor="middle">1</text>

    <!-- Row 2 -->
    <rect x="56" y="130" width="64" height="64" rx="10" fill="#FFDC8B" stroke="#000000" stroke-width="3" filter="url(#neoShadowSm)" />
    <text x="88" y="172" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="900" font-size="28" fill="#000000" stroke="#000000" stroke-width="1" text-anchor="middle">3</text>

    <rect x="130" y="130" width="64" height="64" rx="10" fill="#FE90E8" stroke="#000000" stroke-width="3" filter="url(#neoShadowSm)" />
    <!-- Flag Icon -->
    <path d="M152 146 L174 156 L152 166 Z" fill="#F7CB46" stroke="#000000" stroke-width="2.5" />
    <line x1="152" y1="144" x2="152" y2="182" stroke="#000000" stroke-width="3" stroke-linecap="round" />
    <line x1="144" y1="182" x2="162" y2="182" stroke="#000000" stroke-width="3" stroke-linecap="round" />

    <rect x="204" y="130" width="64" height="64" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="3" filter="url(#neoShadowSm)" />
    <text x="236" y="172" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="900" font-size="28" fill="#C0F7FE" stroke="#000000" stroke-width="1.5" text-anchor="middle">2</text>

    <rect x="278" y="130" width="64" height="64" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="3" filter="url(#neoShadowSm)" />
    <text x="310" y="172" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="900" font-size="28" fill="#FE90E8" stroke="#000000" stroke-width="1.5" text-anchor="middle">1</text>
  </g>

  <!-- Big Central Neo-Brutalist Quantum Mine Icon Container -->
  <g transform="translate(200, 268)" filter="url(#neoShadow)">
    <rect x="-144" y="-54" width="288" height="108" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="3.5" />

    <!-- Mine Spikes -->
    <line x1="0" y1="-38" x2="0" y2="38" stroke="#000000" stroke-width="6" stroke-linecap="round" />
    <line x1="-38" y1="0" x2="38" y2="0" stroke="#000000" stroke-width="6" stroke-linecap="round" />
    <line x1="-27" y1="-27" x2="27" y2="27" stroke="#000000" stroke-width="6" stroke-linecap="round" />
    <line x1="-27" y1="27" x2="27" y2="-27" stroke="#000000" stroke-width="6" stroke-linecap="round" />

    <!-- Outer Mine Ball -->
    <circle cx="0" cy="0" r="30" fill="#FE90E8" stroke="#000000" stroke-width="3.5" />
    <circle cx="0" cy="0" r="16" fill="#F7CB46" stroke="#000000" stroke-width="2.5" />
    <circle cx="0" cy="0" r="6" fill="#000000" />

    <!-- Side Badges -->
    <rect x="-132" y="-18" width="56" height="36" rx="8" fill="#99E885" stroke="#000000" stroke-width="2.5" />
    <text x="-104" y="6" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="14" fill="#000000" text-anchor="middle">SAFE</text>

    <rect x="76" y="-18" width="56" height="36" rx="8" fill="#F7CB46" stroke="#000000" stroke-width="2.5" />
    <text x="104" y="6" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="14" fill="#000000" text-anchor="middle">00:45</text>
  </g>

  <!-- Top Ribbon Badge -->
  <g transform="translate(200, 28) rotate(-2)">
    <rect x="-90" y="-14" width="180" height="28" rx="8" fill="#F7CB46" stroke="#000000" stroke-width="2.5" filter="url(#neoShadowSm)" />
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#000000" text-anchor="middle" letter-spacing="1">✦ QUANTUM MINES ✦</text>
  </g>

  <!-- Corner Figma Transform Nodes -->
  <rect x="6" y="6" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="382" y="6" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="6" y="382" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="382" y="382" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
</svg>
