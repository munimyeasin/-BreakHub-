<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="chromaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070014" />
      <stop offset="60%" stop-color="#14062e" />
      <stop offset="100%" stop-color="#021526" />
    </linearGradient>
    <filter id="simonGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00f0ff" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#chromaBg)" />

  <!-- Simon Reflex 4-Quadrant Ring Body -->
  <g transform="translate(200, 190)">
    <!-- Base Circular Outer Housing -->
    <circle cx="0" cy="0" r="145" fill="#0f0926" stroke="#25174f" stroke-width="6" />

    <!-- 1. Top-Left: Glowing Cyan Quadrant -->
    <path d="M -15,-130 A 130 130 0 0 0 -130,-15 L -55,-10 A 55 55 0 0 1 -10,-55 Z" fill="#00f0ff" stroke="#ffffff" stroke-width="4" filter="url(#simonGlow)" />
    <!-- Cute Face on Cyan quadrant -->
    <circle cx="-65" cy="-65" r="5" fill="#000" />
    <circle cx="-50" cy="-65" r="5" fill="#000" />
    <path d="M -62,-55 Q -57,-50 -52,-55" stroke="#000" stroke-width="2.5" fill="none" />

    <!-- 2. Top-Right: Glowing Pink Quadrant -->
    <path d="M 15,-130 A 130 130 0 0 1 130,-15 L 55,-10 A 55 55 0 0 0 10,-55 Z" fill="#ff007f" stroke="#ffffff" stroke-width="4" />
    <circle cx="50" cy="-65" r="5" fill="#fff" />
    <circle cx="65" cy="-65" r="5" fill="#fff" />
    <path d="M 52,-55 Q 57,-50 62,-55" stroke="#fff" stroke-width="2.5" fill="none" />

    <!-- 3. Bottom-Left: Glowing Yellow Quadrant -->
    <path d="M -15,130 A 130 130 0 0 1 -130,15 L -55,10 A 55 55 0 0 0 -10,55 Z" fill="#ffe600" stroke="#ffffff" stroke-width="4" />
    <circle cx="-65" cy="65" r="5" fill="#000" />
    <circle cx="-50" cy="65" r="5" fill="#000" />
    <path d="M -62,75 Q -57,80 -52,75" stroke="#000" stroke-width="2.5" fill="none" />

    <!-- 4. Bottom-Right: Glowing Lime Green Quadrant -->
    <path d="M 15,130 A 130 130 0 0 0 130,15 L 55,10 A 55 55 0 0 1 10,55 Z" fill="#00ff66" stroke="#ffffff" stroke-width="4" />
    <circle cx="50" cy="65" r="5" fill="#000" />
    <circle cx="65" cy="65" r="5" fill="#000" />
    <path d="M 52,75 Q 57,80 62,75" stroke="#000" stroke-width="2.5" fill="none" />

    <!-- Center Cyber Core Button -->
    <circle cx="0" cy="0" r="42" fill="#070014" stroke="#ffffff" stroke-width="4" />
    <text x="0" y="-4" font-family="'Arial Black', sans-serif" font-size="12" fill="#00f0ff" font-weight="900" text-anchor="middle">REFLEX</text>
    <text x="0" y="14" font-family="'Arial Black', sans-serif" font-size="14" fill="#ffe600" font-weight="900" text-anchor="middle">TEST</text>
  </g>

  <!-- Musical Note Tone Burst (Cartoon Audio Reflex) -->
  <g transform="translate(60, 60)">
    <text x="0" y="0" font-size="28" fill="#00f0ff">🎵</text>
  </g>
  <g transform="translate(320, 60)">
    <text x="0" y="0" font-size="28" fill="#ff007f">🎶</text>
  </g>

  <!-- Title Badge -->
  <rect x="25" y="345" width="145" height="30" rx="10" fill="#00ff66" opacity="0.2" stroke="#00ff66" stroke-width="1.5" />
  <text x="97" y="365" fill="#00ff66" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">CHROMA REFLEX</text>
</svg>
