<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="geoBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05011A" />
      <stop offset="50%" stop-color="#120436" />
      <stop offset="100%" stop-color="#2D004D" />
    </linearGradient>
    <linearGradient id="geoBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>

    <!-- 3D Cube Hero Palettes -->
    <linearGradient id="cubeFaceLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
    <linearGradient id="cubeSideLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>

    <!-- 3D Hazard Spikes -->
    <linearGradient id="spikeFacePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF66B2" />
      <stop offset="100%" stop-color="#FF0055" />
    </linearGradient>
    <linearGradient id="spikeSidePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B3003C" />
      <stop offset="100%" stop-color="#660022" />
    </linearGradient>

    <!-- 3D Star / Coin -->
    <linearGradient id="starFaceGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF570" />
      <stop offset="100%" stop-color="#FFDE59" />
    </linearGradient>
    <linearGradient id="starSideGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49B00" />
      <stop offset="100%" stop-color="#805D00" />
    </linearGradient>

    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="100%" stop-color="#FFE600" />
    </linearGradient>

    <!-- Neo-Brutalist Hard Drop Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowLg" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="cubeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00FF88" flood-opacity="0.85" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#geoBgDark); }
    .theme-grid-line { stroke: #00FF88; stroke-opacity: 0.12; }
    .theme-frame-bg { fill: #13052E; stroke: #00FF88; }
    .theme-stage-grid { stroke: #2E0B54; }
    .theme-floor { fill: #0B0317; stroke: #000000; }
    .theme-cube-inner { fill: #060212; stroke: #000000; }
    .theme-badge-rect { fill: #00FF88; stroke: #000000; }
    .theme-badge-text { fill: #000000; }
    .theme-tag-rect { fill: #FFE600; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#geoBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.08; }
      .theme-frame-bg { fill: #FFFFFF; stroke: #000000; }
      .theme-stage-grid { stroke: #E2E8F0; }
      .theme-floor { fill: #F1F5F9; stroke: #000000; }
      .theme-cube-inner { fill: #FFFFFF; stroke: #000000; }
      .theme-badge-rect { fill: #00FF88; stroke: #000000; }
      .theme-badge-text { fill: #000000; }
      .theme-tag-rect { fill: #FFE600; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Retro Cyber Grid Backdrop -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- Neo Sparks & Cyber Particles -->
  <g fill="#FFE600">
    <polygon points="40,46 42,54 50,56 42,58 40,66 38,58 30,56 38,54" />
    <polygon points="360,40 362,48 370,50 362,52 360,60 358,52 350,50 358,48" />
    <polygon points="365,300 367,306 373,308 367,310 365,316 363,310 357,308 363,306" />
    <polygon points="34,310 36,316 42,318 36,320 34,326 32,320 26,318 32,316" />
  </g>

  <!-- 3D MAIN ARCADE CONTAINER -->
  <g filter="url(#brutalShadowLg)">
    <rect x="36" y="38" width="328" height="298" rx="22" class="theme-frame-bg" stroke-width="4" />
  </g>

  <!-- Inner Playfield Matrix Stage -->
  <rect x="48" y="48" width="304" height="278" rx="16" fill="#070214" stroke="#000000" stroke-width="2.5" />

  <!-- Stage Speed & Rhythm Matrix Grid -->
  <g class="theme-stage-grid" stroke-width="1.2">
    <line x1="48" y1="95" x2="352" y2="95" stroke-dasharray="6,4" opacity="0.4" />
    <line x1="48" y1="150" x2="352" y2="150" stroke-dasharray="6,4" opacity="0.6" />
    <line x1="48" y1="205" x2="352" y2="205" stroke-dasharray="4,4" opacity="0.8" />
  </g>

  <!-- 3D Perspective Rhythm Floor Deck (Bottom) -->
  <g>
    <polygon points="48,260 352,260 352,326 48,326" class="theme-floor" stroke-width="2.5" />
    <line x1="48" y1="260" x2="352" y2="260" stroke="#00FF88" stroke-width="3.5" />
    <!-- Floor Bevel Plates -->
    <rect x="60" y="270" width="40" height="42" fill="#14072E" stroke="#000000" stroke-width="1.8" />
    <rect x="120" y="270" width="40" height="42" fill="#14072E" stroke="#000000" stroke-width="1.8" />
    <rect x="180" y="270" width="40" height="42" fill="#14072E" stroke="#000000" stroke-width="1.8" />
    <rect x="240" y="270" width="40" height="42" fill="#14072E" stroke="#000000" stroke-width="1.8" />
    <rect x="300" y="270" width="40" height="42" fill="#14072E" stroke="#000000" stroke-width="1.8" />
  </g>

  <!-- 3D EXTRUDED JUMP PAD RING (Floor Trigger: X=110, Y=255) -->
  <g transform="translate(110, 255)" filter="url(#brutalShadowSm)">
    <ellipse cx="0" cy="8" rx="32" ry="12" fill="#D97706" stroke="#000000" stroke-width="2.5" />
    <ellipse cx="0" cy="4" rx="32" ry="12" fill="#FFE600" stroke="#000000" stroke-width="2.5" />
    <ellipse cx="0" cy="4" rx="20" ry="7" fill="#FF007F" stroke="#000000" stroke-width="1.8" />
    <polygon points="0,-1 6,7 -6,7" fill="#FFFFFF" />
  </g>

  <!-- 3D EXTRUDED LASER HAZARD SPIKES (Right: X=275, Y=260) -->
  <g filter="url(#brutalShadowSm)">
    <!-- Spike 1 (X=245) -->
    <g stroke="#000000" stroke-width="2.5">
      <polygon points="230,260 248,195 258,260" fill="url(#spikeFacePink)" />
      <polygon points="248,195 258,202 268,260 258,260" fill="url(#spikeSidePink)" />
    </g>
    <!-- Spike 2 (X=285) -->
    <g stroke="#000000" stroke-width="2.5">
      <polygon points="270,260 288,195 298,260" fill="url(#spikeFacePink)" />
      <polygon points="288,195 298,202 308,260 298,260" fill="url(#spikeSidePink)" />
    </g>
    <!-- Spike 3 (X=325) -->
    <g stroke="#000000" stroke-width="2.5">
      <polygon points="310,260 328,205 338,260" fill="url(#spikeFacePink)" />
      <polygon points="328,205 338,212 346,260 338,260" fill="url(#spikeSidePink)" />
    </g>
  </g>

  <!-- 3D FLOATING SECRET GOLDEN STAR (Target: X=290, Y=105) -->
  <g transform="translate(290, 105) rotate(15)" filter="url(#brutalShadow)">
    <g stroke="#000000" stroke-width="2.5">
      <!-- 3D Extruded Star Side -->
      <polygon points="0,22 6,28 14,28 8,22" fill="url(#starSideGold)" />
      <polygon points="24,8 30,14 14,28 8,22" fill="url(#starSideGold)" />
      <!-- Star Front Face -->
      <polygon points="0,-24 7,-8 24,-8 11,3 16,20 0,10 -16,20 -11,3 -24,-8 -7,-8" fill="url(#starFaceGold)" />
    </g>
    <polygon points="-6,-6 6,-6 3,0 -6,0" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- 3D HERO NEON CUBE IN MID-AIR FLIP (Center: X=165, Y=150) -->
  <g transform="translate(165, 145) rotate(-24)" filter="url(#brutalShadowLg)">
    <!-- 3D Isometric Extrusion Side & Bottom -->
    <g stroke="#000000" stroke-width="3.5">
      <polygon points="38,-38 52,-24 52,52 38,38" fill="url(#cubeSideLime)" />
      <polygon points="-38,38 -24,52 52,52 38,38" fill="url(#cubeSideLime)" />
      <!-- Front Face Body -->
      <rect x="-38" y="-38" width="76" height="76" rx="14" fill="url(#cubeFaceLime)" />
    </g>

    <!-- Specular Highlight Gloss Edge -->
    <polygon points="-32,-32 30,-32 20,-20 -32,-20" fill="#FFFFFF" opacity="0.8" />

    <!-- Inner Cyber Screen Face -->
    <rect x="-24" y="-24" width="48" height="48" rx="8" class="theme-cube-inner" stroke-width="2.5" />

    <!-- Confident Cyan Cyber Visor Eyes -->
    <rect x="-16" y="-14" width="12" height="12" rx="3" fill="#00F0FF" stroke="#000000" stroke-width="2" />
    <circle cx="-10" cy="-8" r="2" fill="#FFFFFF" />
    <rect x="4" y="-14" width="12" height="12" rx="3" fill="#00F0FF" stroke="#000000" stroke-width="2" />
    <circle cx="10" cy="-8" r="2" fill="#FFFFFF" />

    <!-- Smiling Mouth -->
    <rect x="-8" y="6" width="16" height="7" rx="3" fill="#FFE600" stroke="#000000" stroke-width="1.8" />
  </g>

  <!-- RHYTHMIC SHOCKWAVE TRAIL & BEAT PULSES -->
  <g stroke="#00FF88" stroke-width="2.5" fill="none" opacity="0.8">
    <path d="M 80,210 Q 110,180 130,175" stroke-dasharray="6,4" />
    <path d="M 90,230 Q 120,200 140,195" stroke-dasharray="6,4" />
  </g>

  <!-- ACTION POPUP COMBO BADGE: "PULSE SYNC!" -->
  <g transform="translate(195, 80)" filter="url(#brutalShadow)">
    <polygon points="0,-22 8,-8 24,-14 16,-1 30,10 14,14 18,28 4,20 -4,28 -2,14 -18,18 -12,4 -28,-2 -14,-10 -20,-24 -6,-16" fill="url(#badgeGold)" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="9" fill="#000000" text-anchor="middle" letter-spacing="0.5">
      PULSE SYNC!
    </text>
  </g>

  <!-- TOP TAG RIBBON: "RHYTHM PLATFORM RUNNER" -->
  <g transform="translate(200, 32)" filter="url(#brutalShadowSm)">
    <rect x="-85" y="-12" width="170" height="24" rx="8" class="theme-tag-rect" stroke-width="2.5" />
    <text x="0" y="4.5" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="1.2">
      RHYTHM PLATFORM RUNNER
    </text>
  </g>

  <!-- BOTTOM TITLE MARQUEE: "NEON PULSE DASH" -->
  <g transform="translate(200, 360)" filter="url(#brutalShadowLg)">
    <rect x="-125" y="-18" width="250" height="36" rx="12" class="theme-badge-rect" stroke-width="3.5" />
    <rect x="-120" y="-14" width="240" height="28" rx="8" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.3" />
    <text x="0" y="6" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="15" text-anchor="middle" letter-spacing="1.5">
      NEON PULSE DASH
    </text>
  </g>

  <!-- Bottom Left/Right Rivet Accents -->
  <circle cx="84" cy="360" r="3" fill="#000000" />
  <circle cx="316" cy="360" r="3" fill="#000000" />
</svg>
