<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="neoShadowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000000" />
    </filter>
    <filter id="neoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" />
    </filter>
    <filter id="neoShadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Neo Ground -->
  <rect width="400" height="400" fill="#FAF8F5" />

  <!-- Dot Matrix Grid -->
  <g fill="#000000" opacity="0.08">
    <circle cx="40" cy="40" r="2" /><circle cx="100" cy="40" r="2" /><circle cx="160" cy="40" r="2" /><circle cx="220" cy="40" r="2" /><circle cx="280" cy="40" r="2" /><circle cx="340" cy="40" r="2" />
    <circle cx="40" cy="100" r="2" /><circle cx="100" cy="100" r="2" /><circle cx="160" cy="100" r="2" /><circle cx="220" cy="100" r="2" /><circle cx="280" cy="100" r="2" /><circle cx="340" cy="100" r="2" />
    <circle cx="40" cy="160" r="2" /><circle cx="100" cy="160" r="2" /><circle cx="160" cy="160" r="2" /><circle cx="220" cy="160" r="2" /><circle cx="280" cy="160" r="2" /><circle cx="340" cy="160" r="2" />
    <circle cx="40" cy="220" r="2" /><circle cx="100" cy="220" r="2" /><circle cx="160" cy="220" r="2" /><circle cx="220" cy="220" r="2" /><circle cx="280" cy="220" r="2" /><circle cx="340" cy="220" r="2" />
    <circle cx="40" cy="280" r="2" /><circle cx="100" cy="280" r="2" /><circle cx="160" cy="280" r="2" /><circle cx="220" cy="280" r="2" /><circle cx="280" cy="280" r="2" /><circle cx="340" cy="280" r="2" />
    <circle cx="40" cy="340" r="2" /><circle cx="100" cy="340" r="2" /><circle cx="160" cy="340" r="2" /><circle cx="220" cy="340" r="2" /><circle cx="280" cy="340" r="2" /><circle cx="340" cy="340" r="2" />
  </g>

  <!-- Outer Border -->
  <rect x="12" y="12" width="376" height="376" rx="20" fill="none" stroke="#000000" stroke-width="4" />

  <!-- Main Showcase Container -->
  <rect x="36" y="36" width="328" height="328" rx="16" fill="#99E885" stroke="#000000" stroke-width="3.5" filter="url(#neoShadowLg)" />

  <!-- Platform Floor -->
  <rect x="48" y="270" width="304" height="82" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
  <line x1="48" y1="270" x2="352" y2="270" stroke="#000000" stroke-width="4" />
  <!-- Platform Checker Pattern -->
  <rect x="70" y="285" width="40" height="40" rx="4" fill="#C0F7FE" stroke="#000000" stroke-width="2" />
  <rect x="140" y="285" width="40" height="40" rx="4" fill="#FE90E8" stroke="#000000" stroke-width="2" />
  <rect x="210" y="285" width="40" height="40" rx="4" fill="#F7CB46" stroke="#000000" stroke-width="2" />
  <rect x="280" y="285" width="40" height="40" rx="4" fill="#99E885" stroke="#000000" stroke-width="2" />

  <!-- Sharp Hazard Spikes on Platform -->
  <g transform="translate(285, 270)" filter="url(#neoShadowSm)">
    <polygon points="-24,0 0,-48 24,0" fill="#FE90E8" stroke="#000000" stroke-width="3" />
    <polygon points="12,0 36,-48 60,0" fill="#FE90E8" stroke="#000000" stroke-width="3" />
  </g>

  <!-- Yellow Jump Pad Booster on Floor -->
  <g transform="translate(115, 268)">
    <rect x="-24" y="-6" width="48" height="12" rx="6" fill="#F7CB46" stroke="#000000" stroke-width="2.5" />
    <polygon points="-8,4 0,-4 8,4" fill="#000000" />
  </g>

  <!-- Iconic Rotating Geometry Dash Cube in Mid-Air Flip! -->
  <g transform="translate(175, 155) rotate(-28)" filter="url(#neoShadow)">
    <!-- Outer Neon Yellow Cube Body -->
    <rect x="-40" y="-40" width="80" height="80" rx="14" fill="#F7CB46" stroke="#000000" stroke-width="3.5" />

    <!-- Inner Pink Center Face -->
    <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#FE90E8" stroke="#000000" stroke-width="2.5" />

    <!-- Eyes inside Cube Face -->
    <rect x="-16" y="-14" width="12" height="12" rx="3" fill="#000000" />
    <rect x="4" y="-14" width="12" height="12" rx="3" fill="#000000" />
    <circle cx="-10" cy="-10" r="2" fill="#FFFFFF" />
    <circle cx="10" cy="-10" r="2" fill="#FFFFFF" />

    <!-- Smiling Mouth -->
    <rect x="-8" y="6" width="16" height="6" rx="2" fill="#000000" />
  </g>

  <!-- Secret Gold Coin in Sky -->
  <g transform="translate(290, 100)" filter="url(#neoShadowSm)">
    <circle cx="0" cy="0" r="18" fill="#F7CB46" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="7" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="18" fill="#000000" text-anchor="middle">★</text>
  </g>

  <!-- Motion Velocity Speed Streaks -->
  <g stroke="#000000" stroke-width="3" stroke-linecap="round">
    <line x1="85" y1="210" x2="125" y2="185" />
    <line x1="65" y1="235" x2="105" y2="210" />
  </g>

  <!-- Top Ribbon Tag -->
  <g transform="translate(200, 26) rotate(-2)">
    <rect x="-80" y="-14" width="160" height="28" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" filter="url(#neoShadowSm)" />
    <text x="0" y="5" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">⚡ RHYTHM JUMP 100%</text>
  </g>

  <!-- Corner Figma Transform Nodes -->
  <rect x="6" y="6" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="382" y="6" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="6" y="382" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="382" y="382" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
</svg>
