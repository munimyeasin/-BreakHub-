<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="geoBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05011A" />
      <stop offset="50%" stop-color="#120436" />
      <stop offset="100%" stop-color="#2D004D" />
    </linearGradient>
    <linearGradient id="geoBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#ECFDF5" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#geoBgDark); }
    .theme-grid-line { stroke: #00FF88; stroke-opacity: 0.15; }
    .theme-floor { fill: #0D0724; stroke: #000000; }
    .theme-tile { fill: #1A0F44; stroke: #000000; }
    .theme-cube-face { fill: #0D0221; stroke: #000000; }
    .theme-badge-rect { fill: #00FF88; stroke: #000000; }
    .theme-badge-text { fill: #000000; }
    .theme-tag-rect { fill: #FFE600; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#geoBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.1; }
      .theme-floor { fill: #FFFFFF; stroke: #000000; }
      .theme-tile { fill: #F1F5F9; stroke: #000000; }
      .theme-cube-face { fill: #FFFFFF; stroke: #000000; }
      .theme-badge-rect { fill: #00FF88; stroke: #000000; }
      .theme-badge-text { fill: #000000; }
      .theme-tag-rect { fill: #FFE600; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Geometric Grid Pattern -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- Platform Floor -->
  <g transform="translate(0, 290)">
    <rect x="-10" y="0" width="420" height="110" class="theme-floor" stroke-width="4" />
    <line x1="0" y1="0" x2="400" y2="0" stroke="#00FF88" stroke-width="4" />

    <!-- Floor Tiles -->
    <rect x="0" y="10" width="50" height="45" class="theme-tile" stroke-width="2" />
    <rect x="100" y="10" width="50" height="45" class="theme-tile" stroke-width="2" />
    <rect x="200" y="10" width="50" height="45" class="theme-tile" stroke-width="2" />
    <rect x="300" y="10" width="50" height="45" class="theme-tile" stroke-width="2" />
  </g>

  <!-- Sharp Neon Spikes Hazard (Neo-Brutalist) -->
  <g filter="url(#brutalShadowSm)">
    <!-- Spike 1 -->
    <polygon points="255,290 275,225 295,290" fill="#FF0055" stroke="#000000" stroke-width="3.5" />
    <polygon points="268,290 275,238 282,290" fill="#FFE600" opacity="0.8" />

    <!-- Spike 2 -->
    <polygon points="295,290 315,225 335,290" fill="#FF0055" stroke="#000000" stroke-width="3.5" />
    <polygon points="308,290 315,238 322,290" fill="#FFE600" opacity="0.8" />

    <!-- Spike 3 -->
    <polygon points="335,290 355,225 375,290" fill="#FF0055" stroke="#000000" stroke-width="3.5" />
  </g>

  <!-- Yellow Jump Pad Booster Ring on Floor -->
  <g transform="translate(130, 280)" filter="url(#brutalShadowSm)">
    <ellipse cx="0" cy="8" rx="28" ry="10" fill="#FFE600" stroke="#000000" stroke-width="3" />
    <ellipse cx="0" cy="5" rx="16" ry="6" fill="#FF7700" stroke="#000000" stroke-width="1.5" />
  </g>

  <!-- Iconic Cube Hero in Mid-Air Flip Jump -->
  <g transform="translate(170, 150) rotate(-28)" filter="url(#brutalShadow)">
    <!-- Outer Lime Neon Cube Body -->
    <rect x="-42" y="-42" width="84" height="84" rx="18" fill="#00FF88" stroke="#000000" stroke-width="4.5" />

    <!-- Inner Face Square -->
    <rect x="-26" y="-26" width="52" height="52" rx="10" class="theme-cube-face" stroke-width="3" />

    <!-- Cute Eyes inside Cube Face -->
    <rect x="-18" y="-16" width="14" height="14" rx="4" fill="#00F0FF" stroke="#000000" stroke-width="2" />
    <rect x="4" y="-16" width="14" height="14" rx="4" fill="#00F0FF" stroke="#000000" stroke-width="2" />

    <!-- Confident Smiling Mouth -->
    <rect x="-10" y="6" width="20" height="8" rx="3" fill="#FFE600" stroke="#000000" stroke-width="2" />
  </g>

  <!-- Flying Cyber Secret Star (Top Right) -->
  <g transform="translate(280, 95)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="18" fill="#FFE600" stroke="#000000" stroke-width="3" />
    <polygon points="0,-10 3,-3 10,-3 5,2 7,8 0,4 -7,8 -5,2 -10,-3 -3,-3" fill="#FF007F" stroke="#000000" stroke-width="1.5" />
  </g>

  <!-- Top Tag Pill: RHYTHM PLATFORM RUNNER -->
  <g transform="translate(200, 24)" filter="url(#brutalShadowSm)">
    <rect x="-90" y="-10" width="180" height="20" rx="6" class="theme-tag-rect" stroke-width="2" />
    <text x="0" y="4" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1">RHYTHM PLATFORM RUNNER</text>
  </g>

  <!-- Bottom Title Badge Pill: NEON PULSE DASH -->
  <g transform="translate(200, 366)" filter="url(#brutalShadowSm)">
    <rect x="-95" y="-15" width="190" height="30" rx="10" class="theme-badge-rect" stroke-width="3" />
    <text x="0" y="5" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1.5">NEON PULSE DASH</text>
  </g>
</svg>
