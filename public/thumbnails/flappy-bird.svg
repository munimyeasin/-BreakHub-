<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="slicerBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18000f" />
      <stop offset="50%" stop-color="#2a0518" />
      <stop offset="100%" stop-color="#070014" />
    </linearGradient>
    <linearGradient id="birdFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600"/>
      <stop offset="50%" stop-color="#FFDE59"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>
    <linearGradient id="birdSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49B00"/>
      <stop offset="100%" stop-color="#7A5200"/>
    </linearGradient>
    <linearGradient id="pipeFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFCC"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0099CC"/>
    </linearGradient>
    <linearGradient id="pipeCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF0055"/>
      <stop offset="100%" stop-color="#990033"/>
    </linearGradient>
    <filter id="brutalShadowLg" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#slicerBgDark)"/>

  <!-- Cyber grid -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4,3">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>

  <!-- Cyber skyline silhouette -->
  <g fill="#140516" stroke="#000000" stroke-width="2">
    <rect x="0" y="340" width="60" height="60" rx="2"/>
    <rect x="55" y="320" width="50" height="80" rx="2"/>
    <rect x="110" y="335" width="70" height="65" rx="2"/>
    <rect x="185" y="310" width="45" height="90" rx="2"/>
    <rect x="235" y="330" width="55" height="70" rx="2"/>
    <rect x="300" y="315" width="65" height="85" rx="2"/>
    <rect x="370" y="340" width="30" height="60" rx="2"/>
  </g>

  <!-- 3D Cyber Bird -->
  <g filter="url(#brutalShadowLg)" transform="translate(200,190)">
    <ellipse cx="0" cy="0" rx="35" ry="25" fill="url(#birdFace)" stroke="#000000" stroke-width="4"/>
    <ellipse cx="-10" cy="5" rx="11" ry="6" fill="url(#birdSide)" stroke="#000" stroke-width="2.5" transform="rotate(-18 -10 5)"/>
    <ellipse cx="14" cy="-7" rx="7" ry="10" fill="#00F0FF" stroke="#000" stroke-width="2.5"/>
    <circle cx="16" cy="-6" r="3" fill="#FFFFFF"/>
    <circle cx="16.5" cy="-6" r="1.2" fill="#000"/>
    <polygon points="28,3 54,13 28,16" fill="#FF5500" stroke="#000" stroke-width="2.5"/>
    <polygon points="-22,2 -32,10 -35,0 -32,-10" fill="#FFE600" opacity="0.9"/>
  </g>

  <!-- Neon Pipes -->
  <g filter="url(#brutalShadowLg)">
    <rect x="70" y="55" width="56" height="115" rx="7" fill="url(#pipeFace)" stroke="#000" stroke-width="3.5"/>
    <rect x="64" y="148" width="68" height="24" rx="6" fill="url(#pipeCap)" stroke="#000" stroke-width="3"/>
    <rect x="280" y="238" width="56" height="102" rx="7" fill="url(#pipeFace)" stroke="#000" stroke-width="3.5"/>
    <rect x="274" y="222" width="68" height="24" rx="6" fill="url(#pipeCap)" stroke="#000" stroke-width="3"/>
  </g>

  <!-- Top Tag Ribbon -->
  <g transform="translate(200, 32)">
    <rect x="-85" y="-12" width="170" height="24" rx="8" fill="#FFDE59" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="4.5" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="10" fill="#000000" text-anchor="middle" letter-spacing="1.2">
      FLIGHT // ARCADE
    </text>
  </g>

  <!-- Title Banner -->
  <g transform="translate(200, 360)" filter="url(#brutalShadowLg)">
    <rect x="-140" y="-18" width="280" height="36" rx="12" fill="#FF007F" stroke="#000000" stroke-width="3.5" />
    <text x="0" y="6" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      NEON FLAPPY FLYER
    </text>
  </g>
</svg>