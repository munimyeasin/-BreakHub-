<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100%" y2="100%"><stop offset="0%" stop-color="#050E26"/><stop offset="100%" stop-color="#180436"/></linearGradient>
    <filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.9"/></filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="#00F0FF" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="80" x2="400" y2="80"/><line x1="0" y1="160" x2="400" y2="160"/><line x1="0" y1="240" x2="400" y2="240"/><line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/><line x1="160" y1="0" x2="160" y2="400"/><line x1="240" y1="0" x2="240" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
  </g>
  <!-- bird body -->
  <g filter="url(#glow)" transform="translate(200,190)">
    <circle cx="0" cy="0" r="28" fill="#FFDE59" stroke="#000" stroke-width="3"/>
    <circle cx="10" cy="-8" r="6" fill="#FFF" stroke="#000" stroke-width="1.5"/>
    <circle cx="12" cy="-6" r="2" fill="#000"/>
    <polygon points="28,4 48,12 28,14" fill="#FF5500" stroke="#000" stroke-width="1.5"/>
    <path d="M-28,0 Q-12,-14 0,-6" stroke="#00F0FF" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- top pipe -->
  <rect x="70" y="60" width="56" height="110" rx="8" fill="#00FFCC" stroke="#000" stroke-width="3"/>
  <rect x="67" y="150" width="62" height="20" rx="4" fill="#FF0055" stroke="#000" stroke-width="2"/>
  <!-- bottom pipe -->
  <rect x="280" y="240" width="56" height="100" rx="8" fill="#00FFCC" stroke="#000" stroke-width="3"/>
  <rect x="277" y="230" width="62" height="20" rx="4" fill="#FF0055" stroke="#000" stroke-width="2"/>
  <!-- title -->
  <text x="200" y="370" font-family="Impact,Arial Black,sans-serif" font-size="22" fill="#00F0FF" text-anchor="middle" letter-spacing="2" stroke="#000" stroke-width="0.5">NEON FLAPPY</text>
  <text x="200" y="390" font-family="Impact,Arial Black,sans-serif" font-size="11" fill="#FFE600" text-anchor="middle" letter-spacing="1">CYBER-ARCADE CLONE</text>
</svg>
