<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030014"/>
      <stop offset="35%" stop-color="#0d0628"/>
      <stop offset="100%" stop-color="#18052a"/>
    </linearGradient>
    <linearGradient id="birdFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600"/>
      <stop offset="50%" stop-color="#FFDE59"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>
    <linearGradient id="birdSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49B00"/>
      <stop offset="100%" stop-color="#7A5200"/>
    </linearGradient>
    <linearGradient id="pipeFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFCC"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0099CC"/>
    </linearGradient>
    <linearGradient id="pipeCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF0055"/>
      <stop offset="100%" stop-color="#990033"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00F0FF" flood-opacity="1"/>
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#FFDE59" flood-opacity="0.8"/>
    </filter>
    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#FF0055" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Deep space background with radial glow -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="300" fill="#1a0530" opacity="0.5"/>

  <!-- Parallax stars -->
  <g fill="#FFFFFF">
    <circle cx="70" cy="60" r="1.5" opacity="0.9"/>
    <circle cx="340" cy="90" r="2" opacity="0.7"/>
    <circle cx="50" cy="150" r="1" opacity="0.5"/>
    <circle cx="360" cy="180" r="2.5" opacity="0.8"/>
    <circle cx="100" cy="280" r="1" opacity="0.6"/>
    <circle cx="320" cy="300" r="1.5" opacity="0.9"/>
    <circle cx="200" cy="350" r="1" opacity="0.4"/>
  </g>

  <!-- Cyber neon grid -->
  <g stroke="#00F0FF" stroke-opacity="0.15" stroke-width="1.5">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>

  <!-- Moving particle trails -->
  <g filter="url(#glow)">
    <circle cx="60" cy="120" r="3" fill="#00F0FF" opacity="0.3"/>
    <circle cx="340" cy="270" r="4" fill="#FFE600" opacity="0.3"/>
    <circle cx="120" cy="60" r="2.5" fill="#FF0055" opacity="0.4"/>
  </g>

  <!-- Cyber skyline silhouette -->
  <g fill="#060228">
    <rect x="0" y="340" width="60" height="60" rx="2"/>
    <rect x="55" y="320" width="50" height="80" rx="2"/>
    <rect x="110" y="335" width="70" height="65" rx="2"/>
    <rect x="185" y="310" width="45" height="90" rx="2"/>
    <rect x="235" y="330" width="55" height="70" rx="2"/>
    <rect x="300" y="315" width="65" height="85" rx="2"/>
    <rect x="370" y="340" width="30" height="60" rx="2"/>
  </g>
  <!-- Neon lights in skyline -->
  <g fill="#00F0FF" opacity="0.6">
    <rect x="8" y="350" width="4" height="8" rx="1"/>
    <rect x="70" y="332" width="4" height="10" rx="1"/>
    <rect x="195" y="325" width="5" height="6" rx="1"/>
    <rect x="308" y="328" width="4" height="12" rx="1"/>
  </g>
  <g fill="#FF0055" opacity="0.5">
    <rect x="120" y="345" width="4" height="6" rx="1"/>
    <rect x="240" y="340" width="3" height="8" rx="1"/>
  </g>

  <!-- 3D Bird -->
  <g filter="url(#glow)" transform="translate(200,190)">
    <!-- Cyber metal body -->
    <ellipse cx="0" cy="0" rx="35" ry="25" fill="url(#birdFace)" stroke="#000000" stroke-width="4"/>
    <!-- Wing (animated) -->
    <ellipse cx="-10" cy="5" rx="11" ry="6" fill="url(#birdSide)" stroke="#000" stroke-width="2.5" transform="rotate(-18 -10 5)"/>
    <!-- Cyber eye -->
    <ellipse cx="14" cy="-7" rx="7" ry="10" fill="#00F0FF" stroke="#000" stroke-width="2.5"/>
    <circle cx="16" cy="-6" r="3" fill="#FFFFFF"/>
    <circle cx="16.5" cy="-6" r="1.2" fill="#000"/>
    <!-- Beak -->
    <polygon points="28,3 54,13 28,16" fill="#FF5500" stroke="#000" stroke-width="2.5"/>
    <!-- Thruster flame -->
    <polygon points="-22,2 -32,10 -35,0 -32,-10" fill="#FFE600" opacity="0.7"/>
  </g>

  <!-- Neon Pipes -->
  <g filter="url(#glow)">
    <!-- Top pipe -->
    <rect x="70" y="55" width="56" height="115" rx="7" fill="url(#pipeFace)" stroke="#000" stroke-width="3.5"/>
    <rect x="64" y="148" width="68" height="24" rx="6" fill="url(#pipeCap)" stroke="#000" stroke-width="3" filter="url(#glowPink)"/>
    <!-- Pipe flow / water stream -->
    <g fill="#00F0FF" opacity="0.7">
      <circle cx="100" cy="92" r="4" filter="url(#glow)"/>
      <circle cx="92" cy="108" r="3.5" filter="url(#glow)"/>
      <circle cx="106" cy="104" r="3" filter="url(#glow)"/>
      <circle cx="96" cy="120" r="3.5" filter="url(#glow)"/>
      <circle cx="102" cy="76" r="2.5" filter="url(#glow)"/>
    </g>
    <!-- Bottom pipe -->
    <rect x="280" y="238" width="56" height="102" rx="7" fill="url(#pipeFace)" stroke="#000" stroke-width="3.5"/>
    <rect x="274" y="222" width="68" height="24" rx="6" fill="url(#pipeCap)" stroke="#000" stroke-width="3" filter="url(#glowPink)"/>
  </g>

  <!-- Title -->
  <text x="200" y="375" font-family="Impact, Arial Black, sans-serif" font-size="28" fill="#00F0FF" text-anchor="middle" letter-spacing="3" stroke="#000" stroke-width="1.2">NEON FLAPPY</text>
  <text x="200" y="397" font-family="Impact, Arial Black, sans-serif" font-size="14" fill="#FFE600" text-anchor="middle" letter-spacing="2.5">CYBER-ARCADE CLONE</text>
</svg>
