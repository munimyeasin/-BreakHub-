<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bhBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070214" />
      <stop offset="50%" stop-color="#140630" />
      <stop offset="100%" stop-color="#020008" />
    </linearGradient>
    <linearGradient id="bhBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#FFECC8" />
    </linearGradient>

    <!-- Accretion Radial Gradients -->
    <radialGradient id="bhAccretion" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="35%" stop-color="#180033" />
      <stop offset="60%" stop-color="#FF007F" />
      <stop offset="85%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#FFE600" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="singularityCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="75%" stop-color="#050010" />
      <stop offset="90%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#FF007F" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#bhBgDark); }
    .theme-grid-line { stroke: #FFFFFF; stroke-opacity: 0.15; }
    .theme-tri-line { stroke: #492E86; }
    .theme-card-body { fill: #120A2C; stroke: #FFE600; }
    .theme-badge-rect { fill: #FFE600; stroke: #000000; }
    .theme-badge-text { fill: #000000; }
    .theme-tag-rect { fill: #00F0FF; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#bhBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.12; }
      .theme-tri-line { stroke: #000000; stroke-opacity: 0.35; }
      .theme-card-body { fill: #FFFFFF; stroke: #000000; }
      .theme-badge-rect { fill: #FFE600; stroke: #000000; }
      .theme-badge-text { fill: #000000; }
      .theme-tag-rect { fill: #00F0FF; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Subtle Coordinate Grid -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- Triangular Network Grid Lines -->
  <g class="theme-tri-line" stroke-width="2.5" stroke-linecap="round">
    <!-- Horizontal -->
    <line x1="170" y1="100" x2="230" y2="100" />
    <line x1="140" y1="150" x2="260" y2="150" />
    <line x1="110" y1="200" x2="290" y2="200" />
    <line x1="80" y1="250" x2="320" y2="250" />
    <line x1="50" y1="300" x2="350" y2="300" />

    <!-- Diagonals Down-Right -->
    <line x1="200" y1="50" x2="350" y2="300" />
    <line x1="170" y1="100" x2="290" y2="300" />
    <line x1="140" y1="150" x2="230" y2="300" />
    <line x1="110" y1="200" x2="170" y2="300" />
    <line x1="80" y1="250" x2="110" y2="300" />

    <!-- Diagonals Down-Left -->
    <line x1="200" y1="50" x2="50" y2="300" />
    <line x1="230" y1="100" x2="110" y2="300" />
    <line x1="260" y1="150" x2="170" y2="300" />
    <line x1="290" y1="200" x2="230" y2="300" />
    <line x1="320" y1="250" x2="290" y2="300" />
  </g>

  <!-- Central Black Hole Event Horizon -->
  <g transform="translate(230, 200)" filter="url(#brutalShadow)">
    <circle cx="0" cy="0" r="44" fill="url(#bhAccretion)" opacity="0.9" />
    <ellipse cx="0" cy="0" rx="38" ry="18" fill="none" stroke="#FFE600" stroke-width="2.5" transform="rotate(-30)" />
    <ellipse cx="0" cy="0" rx="30" ry="12" fill="none" stroke="#00F0FF" stroke-width="2" transform="rotate(-30)" />
    <!-- Singularity Core -->
    <circle cx="0" cy="0" r="18" fill="url(#singularityCore)" stroke="#000000" stroke-width="2.5" />
    <circle cx="0" cy="0" r="12" fill="#000000" />
    <circle cx="-3" cy="-3" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Outer Board Triangular Nodes -->
  <!-- Row 0 -->
  <g transform="translate(200, 50)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="16" fill="#00F0FF" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="5" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#000000" text-anchor="middle">1</text>
  </g>

  <!-- Row 1 -->
  <g transform="translate(170, 100)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="16" fill="#FF007F" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="5" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
  </g>
  <g transform="translate(230, 100)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="16" fill="#00F0FF" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="5" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#000000" text-anchor="middle">3</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(140, 150)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="16" fill="#00F0FF" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="5" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#000000" text-anchor="middle">5</text>
  </g>
  <g transform="translate(200, 150)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="16" fill="#FF007F" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="5" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">8</text>
  </g>
  <g transform="translate(260, 150)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="16" fill="#00F0FF" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="5" font-family="'Impact', 'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#000000" text-anchor="middle">10</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(110, 200)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="16" fill="#FF007F" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="5" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">4</text>
  </g>
  <g transform="translate(170, 200)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="16" fill="#00F0FF" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="5" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#000000" text-anchor="middle">7</text>
  </g>
  <g transform="translate(290, 200)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="16" fill="#FF007F" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="5" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">9</text>
  </g>

  <!-- Row 4 -->
  <g transform="translate(80, 250)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="16" fill="#00F0FF" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="5" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#000000" text-anchor="middle">2</text>
  </g>
  <g transform="translate(140, 250)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="16" fill="#FF007F" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="5" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">6</text>
  </g>
  <g transform="translate(200, 250)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="16" fill="#00F0FF" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="5" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#000000" text-anchor="middle">4</text>
  </g>
  <g transform="translate(260, 250)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="16" fill="#FF007F" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="5" font-family="'Impact', 'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">10</text>
  </g>
  <g transform="translate(320, 250)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="16" fill="#00F0FF" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="5" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#000000" text-anchor="middle">8</text>
  </g>

  <!-- Row 5 (Bottom Row) -->
  <g transform="translate(50, 300)" filter="url(#brutalShadowSm)"><circle cx="0" cy="0" r="13" fill="#FF007F" stroke="#000" stroke-width="2" /><text x="0" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-size="10" font-weight="900" fill="#fff" text-anchor="middle">1</text></g>
  <g transform="translate(110, 300)" filter="url(#brutalShadowSm)"><circle cx="0" cy="0" r="13" fill="#00F0FF" stroke="#000" stroke-width="2" /><text x="0" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-size="10" font-weight="900" fill="#000" text-anchor="middle">6</text></g>
  <g transform="translate(170, 300)" filter="url(#brutalShadowSm)"><circle cx="0" cy="0" r="13" fill="#FF007F" stroke="#000" stroke-width="2" /><text x="0" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-size="10" font-weight="900" fill="#fff" text-anchor="middle">3</text></g>
  <g transform="translate(230, 300)" filter="url(#brutalShadowSm)"><circle cx="0" cy="0" r="13" fill="#00F0FF" stroke="#000" stroke-width="2" /><text x="0" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-size="10" font-weight="900" fill="#000" text-anchor="middle">9</text></g>
  <g transform="translate(290, 300)" filter="url(#brutalShadowSm)"><circle cx="0" cy="0" r="13" fill="#FF007F" stroke="#000" stroke-width="2" /><text x="0" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-size="10" font-weight="900" fill="#fff" text-anchor="middle">5</text></g>
  <g transform="translate(350, 300)" filter="url(#brutalShadowSm)"><circle cx="0" cy="0" r="13" fill="#00F0FF" stroke="#000" stroke-width="2" /><text x="0" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-size="10" font-weight="900" fill="#000" text-anchor="middle">7</text></g>

  <!-- Top Tag Pill: GALE'S SINGULARITY DUEL -->
  <g transform="translate(200, 24)" filter="url(#brutalShadowSm)">
    <rect x="-80" y="-10" width="160" height="20" rx="6" class="theme-tag-rect" stroke-width="2" />
    <text x="0" y="4" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1">GALE'S SINGULARITY DUEL</text>
  </g>

  <!-- Bottom Title Badge Pill: SINGULARITY HORIZON -->
  <g transform="translate(200, 366)" filter="url(#brutalShadowSm)">
    <rect x="-105" y="-15" width="210" height="30" rx="10" class="theme-badge-rect" stroke-width="3" />
    <text x="0" y="5" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1.5">SINGULARITY HORIZON</text>
  </g>
</svg>