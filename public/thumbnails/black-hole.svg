<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18000F" />
      <stop offset="50%" stop-color="#2A0518" />
      <stop offset="100%" stop-color="#070014" />
    </linearGradient>
    <radialGradient id="bgMagGlow" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="rgba(255,0,127,0.2)" />
      <stop offset="40%" stop-color="rgba(0,240,255,0.1)" />
      <stop offset="100%" stop-color="rgba(24,0,15,0)" />
    </radialGradient>
    <linearGradient id="gridLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#3D1030" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="frameBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140516" />
      <stop offset="100%" stop-color="#08020B" />
    </linearGradient>
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowLg" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="bhGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF007F" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" fill="url(#bgDark)" />

  <!-- Radial Magenta / Cyan Glow -->
  <circle cx="200" cy="170" r="290" fill="url(#bgMagGlow)" />

  <!-- White Cyber Dashed Grid -->
  <g stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4,3">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- Outer 3D Arena Frame -->
  <g filter="url(#brutalShadowLg)">
    <rect x="36" y="38" width="328" height="298" rx="22" fill="url(#frameBg)" stroke="#FF007F" stroke-width="4" />
  </g>

  <!-- Inner Playfield Void Stage -->
  <rect x="48" y="48" width="304" height="278" rx="16" fill="#08020B" stroke="#000000" stroke-width="2.5" />

  <!-- Perspective Arena Grid Lines (Dashed Cyber Grid) -->
  <g stroke="#3D1030" stroke-width="1.5" stroke-dasharray="4,3">
    <line x1="48" y1="88" x2="352" y2="88" />
    <line x1="48" y1="136" x2="352" y2="136" />
    <line x1="48" y1="184" x2="352" y2="184" />
    <line x1="48" y1="232" x2="352" y2="232" />
    <line x1="48" y1="280" x2="352" y2="280" />
    <line x1="96" y1="48" x2="96" y2="326" />
    <line x1="148" y1="48" x2="148" y2="326" />
    <line x1="200" y1="48" x2="200" y2="326" />
    <line x1="252" y1="48" x2="252" y2="326" />
    <line x1="304" y1="48" x2="304" y2="326" />
  </g>

  <!-- 3D Central Singularity Vortex (Main Hero Object) -->
  <g transform="translate(200, 185) rotate(-22)" filter="url(#bhGlow)">
    <!-- Outer Accretion Glow Halo -->
    <ellipse cx="0" cy="0" rx="80" ry="34" fill="rgba(255,0,127,0.12)" />

    <!-- Swirling Accretion Disk Rings (Tilted Perspective Extruded Side) -->
    <g stroke="#FF007F" stroke-width="8" opacity="0.9">
      <ellipse cx="0" cy="0" rx="68" ry="24" transform="rotate(-22)" />
      <ellipse cx="0" cy="0" rx="44" ry="15" transform="rotate(-22)" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.9" />
    </g>

    <!-- Back Accretion Arc Side (Extruded darker facet) -->
    <polygon points="-68,-24 -30,-40 -20,-14 -68,24 -30,40 -20,14 -68,-24" fill="#BA005C" opacity="0.55" />

    <!-- Photon Sphere Ring Specular Core -->
    <circle cx="0" cy="0" r="40" fill="rgba(255,230,0,0.15)" />
    <ellipse cx="0" cy="0" rx="42" ry="15" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.85" />
  </g>

  <!-- Central Pitch-Black Event Horizon Core Sphere -->
  <g filter="url(#brutalShadowLg)">
    <circle cx="200" cy="185" r="28" fill="#000000" stroke="#FF007F" stroke-width="3" />
    <circle cx="200" cy="185" r="20" fill="#000000" />
    <path d="M 178,175 A 24 24 0 0 1 222,175" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <circle cx="200" cy="185" r="10" fill="#000000" opacity="0.95" />
  </g>

  <!-- Ambient Orbiting Cyber Nodes (spinning sub-elements around the singularity) -->
  <g filter="url(#brutalShadow)">
    <!-- Node orbit ring path (ghosted dashed orbit) -->
    <circle cx="200" cy="185" r="95" fill="none" stroke="rgba(0,240,255,0.25)" stroke-width="1" stroke-dasharray="3,4" />

    <!-- Orbit Node 1: Magenta/Cyan glowy orb, slightly below-left -->
    <g transform="translate(262, 148)">
      <polygon points="0,-8 6,-5 8,4 4,9 -3,7 -6,0 -7,-6 -4,-9" fill="#FF007F" opacity="0.85" stroke="#000000" stroke-width="1.5" />
      <circle cx="0" cy="0" r="6" fill="#000000" opacity="0.6" />
    </g>

    <!-- Orbit Node 2: Cyan orb, above-right -->
    <g transform="translate(136, 122)">
      <polygon points="0,-8 -5,-5 -8,4 -4,9 3,7 6,0 7,-6 4,-9" fill="#00F0FF" opacity="0.85" stroke="#000000" stroke-width="1.5" />
      <circle cx="0" cy="0" r="6" fill="#000000" opacity="0.6" />
    </g>

    <!-- Orbit Node 3: Gold orb, right side -->
    <g transform="translate(280, 228)">
      <polygon points="0,-7 5,-4 7,3 3,8 -2,6 -5,0 -6,-5 -3,-8" fill="#FFE600" opacity="0.85" stroke="#000000" stroke-width="1.5" />
      <circle cx="0" cy="0" r="5" fill="#000000" opacity="0.6" />
    </g>

    <!-- Orbit Node 4: Purple orb, below-left corner -->
    <g transform="translate(120, 228)">
      <polygon points="0,-7 -4,-4 -7,3 -3,8 2,6 5,0 6,-5 3,-8" fill="#C084FC" opacity="0.8" stroke="#000000" stroke-width="1.5" />
      <circle cx="0" cy="0" r="5" fill="#000000" opacity="0.6" />
    </g>

    <!-- Orbit Node 5: White/Steel orb, upper left -->
    <g transform="translate(130, 100)">
      <polygon points="0,-7 4,-4 6,3 2,8 -1,6 -4,0 -5,-5 -2,-8" fill="#E2E8F0" opacity="0.8" stroke="#000000" stroke-width="1.5" />
      <circle cx="0" cy="0" r="5" fill="#000000" opacity="0.6" />
    </g>

    <!-- Orbit Node 6: Orange-red orb, lower middle -->
    <g transform="translate(240, 230)">
      <polygon points="0,-7 4,-4 6,3 2,8 -1,6 -4,0 -5,-5 -2,-8" fill="#FF0055" opacity="0.85" stroke="#000000" stroke-width="1.5" />
      <circle cx="0" cy="0" r="5" fill="#000000" opacity="0.6" />
    </g>
  </g>

  <!-- Orbit Trail Particles (dim magenta/cyan sparkles along orbits) -->
  <g fill="#FFE600" opacity="0.65">
    <circle cx="262" cy="148" r="1.8" />
    <circle cx="136" cy="122" r="1.6" />
    <circle cx="280" cy="228" r="1.7" />
    <circle cx="120" cy="228" r="1.4" />
    <circle cx="130" cy="100" r="1.5" />
    <circle cx="240" cy="230" r="1.6" />
  </g>

  <!-- Action Popup Combo Badge: "SINGULARITY BREACH!" -->
  <g transform="translate(200, 120)" filter="url(#brutalShadow)">
    <polygon points="0,-22 8,-8 24,-14 16,-1 30,10 14,14 18,28 4,20 -4,28 -2,14 -18,18 -12,4 -28,-2 -14,-10 -20,-24 -6,-16" fill="#FFF066" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="8" fill="#000000" text-anchor="middle" letter-spacing="0.5">
      BREACH!
    </text>
  </g>

  <!-- Top Tag Ribbon: "BLACK HOLE STRATEGY // ACTION" -->
  <g transform="translate(200, 32)" filter="url(#brutalShadowSm)">
    <rect x="-85" y="-12" width="170" height="24" rx="8" fill="#FF007F" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="4.5" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="1.2">
      BLACK HOLE STRATEGY
    </text>
  </g>

  <!-- Bottom Title Marquee: "SINGULARITY HORIZON" -->
  <g transform="translate(200, 360)" filter="url(#brutalShadowLg)">
    <rect x="-125" y="-18" width="250" height="36" rx="12" fill="#FF007F" stroke="#000000" stroke-width="3.5" />
    <rect x="-120" y="-14" width="240" height="28" rx="8" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.3" />
    <text x="0" y="6" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="15" text-anchor="middle" letter-spacing="1.5">
      SINGULARITY HORIZON
    </text>
  </g>

  <!-- Bottom Left/Right Rivet Accents -->
  <circle cx="84" cy="360" r="3" fill="#000000" />
  <circle cx="316" cy="360" r="3" fill="#000000" />
</svg>