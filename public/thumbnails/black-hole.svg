<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070214" />
      <stop offset="50%" stop-color="#12042b" />
      <stop offset="100%" stop-color="#020008" />
    </linearGradient>
    <radialGradient id="bhAccretion" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="35%" stop-color="#180033" />
      <stop offset="60%" stop-color="#ff007f" />
      <stop offset="85%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ffe600" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="singularityCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="75%" stop-color="#050010" />
      <stop offset="90%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </radialGradient>
    <filter id="bhGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00f0ff" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#ff007f" flood-opacity="0.6" />
    </filter>
    <filter id="p1Glow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f0ff" flood-opacity="0.9" />
    </filter>
    <filter id="p2Glow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff007f" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bhBg)" />

  <!-- Cosmic Grid Lattice & Stars -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.15">
    <line x1="200" y1="50" x2="80" y2="310" stroke-dasharray="4,4" />
    <line x1="200" y1="50" x2="320" y2="310" stroke-dasharray="4,4" />
    <line x1="80" y1="310" x2="320" y2="310" stroke-dasharray="4,4" />
  </g>

  <!-- Triangular Nodes Network Grid Lines -->
  <g stroke="#3a236e" stroke-width="3" stroke-linecap="round">
    <!-- Horizontal -->
    <line x1="170" y1="110" x2="230" y2="110" />
    <line x1="140" y1="160" x2="260" y2="160" />
    <line x1="110" y1="210" x2="290" y2="210" />
    <line x1="80" y1="260" x2="320" y2="260" />
    <line x1="50" y1="310" x2="350" y2="310" />

    <!-- Diagonals Down-Right -->
    <line x1="200" y1="60" x2="350" y2="310" />
    <line x1="170" y1="110" x2="290" y2="310" />
    <line x1="140" y1="160" x2="230" y2="310" />
    <line x1="110" y1="210" x2="170" y2="310" />
    <line x1="80" y1="260" x2="110" y2="310" />

    <!-- Diagonals Down-Left -->
    <line x1="200" y1="60" x2="50" y2="310" />
    <line x1="230" y1="110" x2="110" y2="310" />
    <line x1="260" y1="160" x2="170" y2="310" />
    <line x1="290" y1="210" x2="230" y2="310" />
    <line x1="320" y1="260" x2="290" y2="310" />
  </g>

  <!-- Central Black Hole Event Horizon (Center-Right node at 230, 210) -->
  <g transform="translate(230, 210)" filter="url(#bhGlow)">
    <!-- Swirling Vortex Accretion Disk -->
    <circle cx="0" cy="0" r="54" fill="url(#bhAccretion)" opacity="0.85" />
    <ellipse cx="0" cy="0" rx="46" ry="24" fill="none" stroke="#ffe600" stroke-width="2.5" transform="rotate(-30)" opacity="0.8" />
    <ellipse cx="0" cy="0" rx="38" ry="18" fill="none" stroke="#00f0ff" stroke-width="3" transform="rotate(-30)" />
    <ellipse cx="0" cy="0" rx="30" ry="12" fill="none" stroke="#ff007f" stroke-width="2" transform="rotate(-30)" />

    <!-- Gravitational Singularity Core -->
    <circle cx="0" cy="0" r="22" fill="url(#singularityCore)" stroke="#00f0ff" stroke-width="3" />
    <circle cx="0" cy="0" r="16" fill="#000000" />
    <circle cx="-3" cy="-3" r="3" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Suction Gravitational Vector Rays -->
  <g stroke="#ff007f" stroke-width="2" stroke-dasharray="3,3" opacity="0.8">
    <line x1="170" y1="210" x2="210" y2="210" />
    <line x1="260" y1="160" x2="240" y2="195" />
    <line x1="200" y1="160" x2="220" y2="195" />
    <line x1="200" y1="260" x2="220" y2="225" />
    <line x1="260" y1="260" x2="240" y2="225" />
    <line x1="290" y1="210" x2="250" y2="210" />
  </g>

  <!-- Outer Board Nodes -->
  <!-- Row 0: Peak Node (P1: 1) -->
  <g transform="translate(200, 60)" filter="url(#p1Glow)">
    <circle cx="0" cy="0" r="18" fill="#00f0ff" stroke="#000" stroke-width="3" />
    <text x="0" y="6" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#000" text-anchor="middle">1</text>
  </g>

  <!-- Row 1 Nodes -->
  <g transform="translate(170, 110)" filter="url(#p2Glow)">
    <circle cx="0" cy="0" r="18" fill="#ff007f" stroke="#000" stroke-width="3" />
    <text x="0" y="6" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#fff" text-anchor="middle">2</text>
  </g>
  <g transform="translate(230, 110)" filter="url(#p1Glow)">
    <circle cx="0" cy="0" r="18" fill="#00f0ff" stroke="#000" stroke-width="3" />
    <text x="0" y="6" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#000" text-anchor="middle">3</text>
  </g>

  <!-- Row 2 Nodes -->
  <g transform="translate(140, 160)" filter="url(#p1Glow)">
    <circle cx="0" cy="0" r="18" fill="#00f0ff" stroke="#000" stroke-width="3" />
    <text x="0" y="6" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#000" text-anchor="middle">5</text>
  </g>
  <g transform="translate(200, 160)" filter="url(#p2Glow)">
    <circle cx="0" cy="0" r="18" fill="#ff007f" stroke="#000" stroke-width="3" />
    <text x="0" y="6" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#fff" text-anchor="middle">8</text>
  </g>
  <g transform="translate(260, 160)" filter="url(#p1Glow)">
    <circle cx="0" cy="0" r="18" fill="#00f0ff" stroke="#000" stroke-width="3" />
    <text x="0" y="6" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#000" text-anchor="middle">10</text>
  </g>

  <!-- Row 3 Nodes (Left side) -->
  <g transform="translate(110, 210)" filter="url(#p2Glow)">
    <circle cx="0" cy="0" r="18" fill="#ff007f" stroke="#000" stroke-width="3" />
    <text x="0" y="6" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#fff" text-anchor="middle">4</text>
  </g>
  <g transform="translate(170, 210)" filter="url(#p1Glow)">
    <circle cx="0" cy="0" r="18" fill="#00f0ff" stroke="#000" stroke-width="3" />
    <text x="0" y="6" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#000" text-anchor="middle">7</text>
  </g>
  <g transform="translate(290, 210)" filter="url(#p2Glow)">
    <circle cx="0" cy="0" r="18" fill="#ff007f" stroke="#000" stroke-width="3" />
    <text x="0" y="6" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#fff" text-anchor="middle">9</text>
  </g>

  <!-- Row 4 Nodes -->
  <g transform="translate(80, 260)" filter="url(#p1Glow)">
    <circle cx="0" cy="0" r="18" fill="#00f0ff" stroke="#000" stroke-width="3" />
    <text x="0" y="6" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#000" text-anchor="middle">2</text>
  </g>
  <g transform="translate(140, 260)" filter="url(#p2Glow)">
    <circle cx="0" cy="0" r="18" fill="#ff007f" stroke="#000" stroke-width="3" />
    <text x="0" y="6" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#fff" text-anchor="middle">6</text>
  </g>
  <g transform="translate(200, 260)" filter="url(#p1Glow)">
    <circle cx="0" cy="0" r="18" fill="#00f0ff" stroke="#000" stroke-width="3" />
    <text x="0" y="6" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#000" text-anchor="middle">4</text>
  </g>
  <g transform="translate(260, 260)" filter="url(#p2Glow)">
    <circle cx="0" cy="0" r="18" fill="#ff007f" stroke="#000" stroke-width="3" />
    <text x="0" y="6" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#fff" text-anchor="middle">10</text>
  </g>
  <g transform="translate(320, 260)" filter="url(#p1Glow)">
    <circle cx="0" cy="0" r="18" fill="#00f0ff" stroke="#000" stroke-width="3" />
    <text x="0" y="6" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#000" text-anchor="middle">8</text>
  </g>

  <!-- Row 5 Nodes -->
  <g transform="translate(50, 310)" filter="url(#p2Glow)"><circle cx="0" cy="0" r="15" fill="#ff007f" stroke="#000" stroke-width="2.5" /><text x="0" y="5" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#fff" text-anchor="middle">1</text></g>
  <g transform="translate(110, 310)" filter="url(#p1Glow)"><circle cx="0" cy="0" r="15" fill="#00f0ff" stroke="#000" stroke-width="2.5" /><text x="0" y="5" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#000" text-anchor="middle">6</text></g>
  <g transform="translate(170, 310)" filter="url(#p2Glow)"><circle cx="0" cy="0" r="15" fill="#ff007f" stroke="#000" stroke-width="2.5" /><text x="0" y="5" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#fff" text-anchor="middle">3</text></g>
  <g transform="translate(230, 310)" filter="url(#p1Glow)"><circle cx="0" cy="0" r="15" fill="#00f0ff" stroke="#000" stroke-width="2.5" /><text x="0" y="5" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#000" text-anchor="middle">9</text></g>
  <g transform="translate(290, 310)" filter="url(#p2Glow)"><circle cx="0" cy="0" r="15" fill="#ff007f" stroke="#000" stroke-width="2.5" /><text x="0" y="5" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#fff" text-anchor="middle">5</text></g>
  <g transform="translate(350, 310)" filter="url(#p2Glow)"><circle cx="0" cy="0" r="15" fill="#ff007f" stroke="#000" stroke-width="2.5" /><text x="0" y="5" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#fff" text-anchor="middle">7</text></g>

  <!-- Neo-Brutalist Title Badge -->
  <g transform="translate(200, 370)">
    <rect x="-105" y="-18" width="210" height="32" rx="8" fill="#ffe600" stroke="#000000" stroke-width="3" />
    <text x="0" y="4" fill="#000000" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1.5">RETRO BLACK HOLE</text>
  </g>
</svg>
