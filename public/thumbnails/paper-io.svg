<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="paperBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A18" />
      <stop offset="50%" stop-color="#0E1838" />
      <stop offset="100%" stop-color="#020714" />
    </linearGradient>
    <linearGradient id="paperBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#ECFDF5" />
    </linearGradient>

    <!-- 3D Territory Palettes -->
    <linearGradient id="zoneCyanFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DF9FF" />
      <stop offset="100%" stop-color="#00D0FF" />
    </linearGradient>
    <linearGradient id="zoneCyanSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088B8" />
      <stop offset="100%" stop-color="#004D66" />
    </linearGradient>

    <linearGradient id="zonePinkFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF77C8" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <linearGradient id="zonePinkSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8005A" />
      <stop offset="100%" stop-color="#700037" />
    </linearGradient>

    <linearGradient id="heroCubeFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="100%" stop-color="#FFE600" />
    </linearGradient>
    <linearGradient id="heroCubeSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49B00" />
      <stop offset="100%" stop-color="#805D00" />
    </linearGradient>

    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="100%" stop-color="#FFE600" />
    </linearGradient>

    <!-- Neo-Brutalist Hard Drop Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowLg" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="trailGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.85" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#paperBgDark); }
    .theme-grid-line { stroke: #00F0FF; stroke-opacity: 0.12; }
    .theme-frame-bg { fill: #0B132B; stroke: #00F0FF; }
    .theme-stage-grid { stroke: #19264D; }
    .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
    .theme-badge-text { fill: #000000; }
    .theme-tag-rect { fill: #FFE600; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#paperBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.08; }
      .theme-frame-bg { fill: #FFFFFF; stroke: #000000; }
      .theme-stage-grid { stroke: #E2E8F0; }
      .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
      .theme-badge-text { fill: #000000; }
      .theme-tag-rect { fill: #FFE600; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Retro Cyber Grid Backdrop -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- Neo Sparks & Power Nodes -->
  <g fill="#FFE600">
    <polygon points="40,46 42,54 50,56 42,58 40,66 38,58 30,56 38,54" />
    <polygon points="360,40 362,48 370,50 362,52 360,60 358,52 350,50 358,48" />
    <polygon points="365,300 367,306 373,308 367,310 365,316 363,310 357,308 363,306" />
    <polygon points="34,310 36,316 42,318 36,320 34,326 32,320 26,318 32,316" />
  </g>

  <!-- 3D MAIN ARCADE CONTAINER -->
  <g filter="url(#brutalShadowLg)">
    <rect x="36" y="38" width="328" height="298" rx="22" class="theme-frame-bg" stroke-width="4" />
  </g>

  <!-- Inner Playfield Matrix Stage -->
  <rect x="48" y="48" width="304" height="278" rx="16" fill="#040816" stroke="#000000" stroke-width="2.5" />

  <!-- Playfield Subtle Grid Lines -->
  <g class="theme-stage-grid" stroke-width="1.2" stroke-dasharray="6,4">
    <line x1="48" y1="110" x2="352" y2="110" opacity="0.4" />
    <line x1="48" y1="180" x2="352" y2="180" opacity="0.6" />
    <line x1="48" y1="250" x2="352" y2="250" opacity="0.8" />
    <line x1="120" y1="48" x2="120" y2="326" opacity="0.5" />
    <line x1="200" y1="48" x2="200" y2="326" opacity="0.5" />
    <line x1="280" y1="48" x2="280" y2="326" opacity="0.5" />
  </g>

  <!-- 3D EXTRUDED ENEMY TERRITORY ZONE (Top-Right: Pink) -->
  <g filter="url(#brutalShadowSm)">
    <g stroke="#000000" stroke-width="2.5">
      <!-- 3D Extruded Depth -->
      <polygon points="220,135 228,143 336,143 328,135" fill="url(#zonePinkSide)" />
      <polygon points="328,65 336,73 336,143 328,135" fill="url(#zonePinkSide)" />
      <!-- Zone Face -->
      <path d="M 220,65 L 328,65 L 328,135 L 260,135 L 260,105 L 220,105 Z" fill="url(#zonePinkFace)" />
    </g>
    <!-- Zone Grid Lines -->
    <line x1="220" y1="85" x2="328" y2="85" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" stroke-dasharray="4,4" />
  </g>

  <!-- 3D EXTRUDED PLAYER EXPANSION ENCLOSURE (Center Field) -->
  <g filter="url(#brutalShadowSm)">
    <g stroke="#000000" stroke-width="3">
      <!-- 3D Base Platform Extrusion -->
      <polygon points="65,220 75,230 205,230 195,220" fill="url(#zoneCyanSide)" />
      <polygon points="195,75 205,85 205,230 195,220" fill="url(#zoneCyanSide)" />
      <!-- Main Player Zone -->
      <path d="M 65,75 L 195,75 L 195,220 L 125,220 L 125,155 L 65,155 Z" fill="url(#zoneCyanFace)" />
    </g>
    <polygon points="70,80 190,80 180,92 70,92" fill="#FFFFFF" opacity="0.65" />
  </g>

  <!-- 3D EXTRUDED ACTIVE EXPANSION HIGHWAY TRAIL -->
  <g filter="url(#trailGlow)">
    <g stroke="#000000" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 195,150 L 285,150 L 285,270 L 145,270 L 145,220" />
    </g>
    <g stroke="#00F0FF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 195,150 L 285,150 L 285,270 L 145,270 L 145,220" />
    </g>
    <g stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 195,150 L 285,150 L 285,270 L 145,270 L 145,220" />
    </g>
  </g>

  <!-- ENEMY TAIL SLICE EXPLOSION SPARK (Target: X=285, Y=190) -->
  <g transform="translate(285, 190)" filter="url(#brutalShadow)">
    <polygon points="0,-20 6,-6 20,-6 9,4 14,18 0,9 -14,18 -9,4 -20,-6 -6,-6" fill="#FFE600" stroke="#000000" stroke-width="2" />
    <circle cx="-16" cy="-14" r="4" fill="#FF007F" stroke="#000000" stroke-width="1.5" />
    <circle cx="16" cy="14" r="3.5" fill="#00F0FF" stroke="#000000" stroke-width="1.5" />
  </g>

  <!-- 3D HERO CROWNED CUBE RIDER (At loop endpoint: X=145, Y=220) -->
  <g transform="translate(145, 215)" filter="url(#brutalShadowLg)">
    <!-- 3D Isometric Extrusion Side -->
    <g stroke="#000000" stroke-width="3.5">
      <polygon points="20,-20 28,-12 28,28 20,20" fill="url(#heroCubeSide)" />
      <polygon points="-20,20 -12,28 28,28 20,20" fill="url(#heroCubeSide)" />
      <!-- Front Body Face -->
      <rect x="-20" y="-20" width="40" height="40" rx="9" fill="url(#heroCubeFace)" />
    </g>
    <!-- Specular Highlight -->
    <polygon points="-16,-16 16,-16 10,-8 -16,-8" fill="#FFFFFF" opacity="0.8" />

    <!-- Cute Confident Eyes -->
    <ellipse cx="-7" cy="-2" rx="3.5" ry="5" fill="#000000" />
    <circle cx="-6" cy="-4" r="1.5" fill="#FFFFFF" />
    <ellipse cx="7" cy="-2" rx="3.5" ry="5" fill="#000000" />
    <circle cx="8" cy="-4" r="1.5" fill="#FFFFFF" />
    <path d="M -6,7 Q 0,12 6,7" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Cheeks -->
    <circle cx="-12" cy="5" r="2.5" fill="#FF007F" />
    <circle cx="12" cy="5" r="2.5" fill="#FF007F" />

    <!-- 3D Monarch Crown -->
    <g stroke="#000000" stroke-width="2">
      <polygon points="-14,-20 -18,-32 -8,-25 0,-34 8,-25 18,-32 14,-20" fill="#FF007F" />
      <circle cx="0" cy="-28" r="2.5" fill="#FFE600" />
      <circle cx="-16" cy="-28" r="2" fill="#FFE600" />
      <circle cx="16" cy="-28" r="2" fill="#FFE600" />
    </g>
  </g>

  <!-- ACTION POPUP COMBO BADGE: "GRID DOMAIN!" -->
  <g transform="translate(195, 105)" filter="url(#brutalShadow)">
    <polygon points="0,-22 8,-8 24,-14 16,-1 30,10 14,14 18,28 4,20 -4,28 -2,14 -18,18 -12,4 -28,-2 -14,-10 -20,-24 -6,-16" fill="url(#badgeGold)" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="4" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="9" fill="#000000" text-anchor="middle" letter-spacing="0.5">
      GRID DOMAIN!
    </text>
  </g>

  <!-- TOP TAG RIBBON: "NEON TERRITORY CONQUEST" -->
  <g transform="translate(200, 32)" filter="url(#brutalShadowSm)">
    <rect x="-85" y="-12" width="170" height="24" rx="8" class="theme-tag-rect" stroke-width="2.5" />
    <text x="0" y="4.5" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="1.2">
      NEON TERRITORY CONQUEST
    </text>
  </g>

  <!-- BOTTOM TITLE MARQUEE: "NEON PAPER GRID" -->
  <g transform="translate(200, 360)" filter="url(#brutalShadowLg)">
    <rect x="-125" y="-18" width="250" height="36" rx="12" class="theme-badge-rect" stroke-width="3.5" />
    <rect x="-120" y="-14" width="240" height="28" rx="8" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.3" />
    <text x="0" y="6" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="15" text-anchor="middle" letter-spacing="1.5">
      NEON PAPER GRID
    </text>
  </g>

  <!-- Bottom Left/Right Rivet Accents -->
  <circle cx="84" cy="360" r="3" fill="#000000" />
  <circle cx="316" cy="360" r="3" fill="#000000" />
</svg>
