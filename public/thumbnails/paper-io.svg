<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="paperBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A18" />
      <stop offset="50%" stop-color="#0A122C" />
      <stop offset="100%" stop-color="#02050F" />
    </linearGradient>
    <linearGradient id="paperBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#ECFDF5" />
    </linearGradient>

    <linearGradient id="cyanTerritory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>
    <linearGradient id="pinkTerritory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#FF0055" />
    </linearGradient>
    <linearGradient id="limeTerritory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00CC66" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#paperBgDark); }
    .theme-grid-line { stroke: #00F0FF; stroke-opacity: 0.15; }
    .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
    .theme-badge-text { fill: #000000; }
    .theme-tag-rect { fill: #FFE600; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#paperBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.1; }
      .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
      .theme-badge-text { fill: #000000; }
      .theme-tag-rect { fill: #FFE600; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Grid Map Lines -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- Bot Enemy Territory 1 (Magenta Pink) -->
  <g filter="url(#brutalShadowSm)">
    <path d="M 230,45 L 355,45 L 355,155 L 285,155 L 285,110 L 230,110 Z" fill="url(#pinkTerritory)" stroke="#000000" stroke-width="3" />
  </g>

  <!-- Bot Enemy Territory 2 (Lime Green) -->
  <g filter="url(#brutalShadowSm)">
    <path d="M 45,245 L 145,245 L 145,340 L 45,340 Z" fill="url(#limeTerritory)" stroke="#000000" stroke-width="3" />
  </g>

  <!-- Player Main Territory Zone (Cyan) -->
  <g filter="url(#brutalShadow)">
    <path d="M 55,65 L 185,65 L 185,195 L 115,195 L 115,145 L 55,145 Z" fill="url(#cyanTerritory)" stroke="#000000" stroke-width="3.5" />
  </g>

  <!-- Player Active Enclosure Expansion Trail -->
  <g filter="url(#brutalShadowSm)">
    <path d="M 185,140 L 275,140 L 275,265 L 145,265 L 145,195" fill="none" stroke="#000000" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 185,140 L 275,140 L 275,265 L 145,265 L 145,195" fill="none" stroke="#00F0FF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 185,140 L 275,140 L 275,265 L 145,265 L 145,195" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Enemy Trail being sliced -->
  <g filter="url(#brutalShadowSm)">
    <path d="M 285,135 L 285,205 L 325,205" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round" />
    <path d="M 285,135 L 285,205 L 325,205" fill="none" stroke="#FF007F" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Slice Explosion Star & Sparks -->
  <g transform="translate(285, 175)">
    <polygon points="0,-18 5,-5 18,-5 8,3 12,16 0,8 -12,16 -8,3 -18,-5 -5,-5" fill="#FFE600" stroke="#000000" stroke-width="2" />
    <circle cx="-16" cy="-14" r="4" fill="#FF007F" stroke="#000000" stroke-width="1.5" />
    <circle cx="16" cy="14" r="3.5" fill="#00F0FF" stroke="#000000" stroke-width="1.5" />
    <circle cx="18" cy="-12" r="3" fill="#FFE600" stroke="#000000" stroke-width="1.5" />
  </g>

  <!-- Player Avatar Cube Hero -->
  <g transform="translate(145, 195)" filter="url(#brutalShadowSm)">
    <!-- Body Cube -->
    <rect x="-18" y="-18" width="36" height="36" rx="8" fill="#FFE600" stroke="#000000" stroke-width="3.5" />
    <!-- Cute Eyes -->
    <ellipse cx="-6" cy="-2" rx="3" ry="5" fill="#000000" />
    <circle cx="-5" cy="-3.5" r="1.5" fill="#FFFFFF" />
    <ellipse cx="6" cy="-2" rx="3" ry="5" fill="#000000" />
    <circle cx="7" cy="-3.5" r="1.5" fill="#FFFFFF" />
    <!-- Happy Smile -->
    <path d="M -5,7 Q 0,11 5,7" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Cheeks -->
    <circle cx="-11" cy="5" r="2.5" fill="#FF007F" />
    <circle cx="11" cy="5" r="2.5" fill="#FF007F" />

    <!-- Crown on top of cube -->
    <polygon points="-12,-18 -15,-28 -6,-23 0,-30 6,-23 15,-28 12,-18" fill="#FF007F" stroke="#000000" stroke-width="2" />
    <circle cx="0" cy="-25" r="2" fill="#FFE600" />
  </g>

  <!-- Top Tag Pill: TERRITORY CONQUEST -->
  <g transform="translate(200, 24)" filter="url(#brutalShadowSm)">
    <rect x="-90" y="-10" width="180" height="20" rx="6" class="theme-tag-rect" stroke-width="2" />
    <text x="0" y="4" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1">TERRITORY CONQUEST</text>
  </g>

  <!-- Bottom Title Badge Pill: NEON PAPER GRID -->
  <g transform="translate(200, 366)" filter="url(#brutalShadowSm)">
    <rect x="-95" y="-15" width="190" height="30" rx="10" class="theme-badge-rect" stroke-width="3" />
    <text x="0" y="5" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1.5">NEON PAPER GRID</text>
  </g>
</svg>
