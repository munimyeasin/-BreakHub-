<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bsBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1A" />
      <stop offset="50%" stop-color="#0B1A38" />
      <stop offset="100%" stop-color="#02060E" />
    </linearGradient>
    <linearGradient id="bsBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#E2F5FF" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radarSweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#00F0FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="shipHullDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A3B5C" />
      <stop offset="100%" stop-color="#121D33" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#bsBgDark); }
    .theme-grid-line { stroke: #00F0FF; stroke-opacity: 0.2; }
    .theme-radar-ring { stroke: #00F0FF; stroke-opacity: 0.35; }
    .theme-ship-hull { fill: url(#shipHullDark); stroke: #00F0FF; }
    .theme-ship-deck { fill: #1B2845; stroke: #00F0FF; }
    .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
    .theme-badge-text { fill: #000000; }
    .theme-tag-rect { fill: #FFE600; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#bsBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.12; }
      .theme-radar-ring { stroke: #0284C7; stroke-opacity: 0.45; }
      .theme-ship-hull { fill: #FFFFFF; stroke: #000000; }
      .theme-ship-deck { fill: #F1F5F9; stroke: #000000; }
      .theme-badge-rect { fill: #00F0FF; stroke: #000000; }
      .theme-badge-text { fill: #000000; }
      .theme-tag-rect { fill: #FFE600; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Radar Rings & Coordinates -->
  <g stroke-width="1.5">
    <circle cx="200" cy="190" r="140" fill="none" class="theme-radar-ring" stroke-width="2" stroke-dasharray="8,6" />
    <circle cx="200" cy="190" r="95" fill="none" class="theme-radar-ring" stroke-width="1.5" />
    <circle cx="200" cy="190" r="50" fill="none" class="theme-radar-ring" stroke-width="1.5" />
    <circle cx="200" cy="190" r="10" fill="#00F0FF" opacity="0.5" />

    <!-- Crosshair Axes -->
    <line x1="50" y1="190" x2="350" y2="190" class="theme-radar-ring" stroke-width="2" stroke-dasharray="6,4" />
    <line x1="200" y1="40" x2="200" y2="340" class="theme-radar-ring" stroke-width="2" stroke-dasharray="6,4" />
  </g>

  <!-- Tactical Grid Lines -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="50" y1="90" x2="350" y2="90" />
    <line x1="50" y1="140" x2="350" y2="140" />
    <line x1="50" y1="240" x2="350" y2="240" />
    <line x1="50" y1="290" x2="350" y2="290" />
    <line x1="100" y1="40" x2="100" y2="340" />
    <line x1="150" y1="40" x2="150" y2="340" />
    <line x1="250" y1="40" x2="250" y2="340" />
    <line x1="300" y1="40" x2="300" y2="340" />
  </g>

  <!-- Radar Sweep Sector -->
  <path d="M200 190 L300 90 A140 140 0 0 0 200 50 Z" fill="url(#radarSweepGrad)" opacity="0.6" />
  <line x1="200" y1="190" x2="300" y2="90" stroke="#00F0FF" stroke-width="3" />

  <!-- Heavy Warship Model 2D -->
  <g transform="translate(100, 205) rotate(-22)" filter="url(#brutalShadow)">
    <polygon points="0,22 30,0 150,0 175,22 150,44 30,44" class="theme-ship-hull" stroke-width="3" />
    <!-- Superstructure Deck -->
    <rect x="42" y="9" width="88" height="26" rx="4" class="theme-ship-deck" stroke-width="2" />
    <!-- Main Turrets -->
    <circle cx="60" cy="22" r="9" fill="#FFE600" stroke="#000000" stroke-width="2" />
    <rect x="60" y="19" width="20" height="6" fill="#FFE600" stroke="#000000" stroke-width="1.5" />
    <circle cx="110" cy="22" r="9" fill="#FFE600" stroke="#000000" stroke-width="2" />
    <rect x="110" y="19" width="20" height="6" fill="#FFE600" stroke="#000000" stroke-width="1.5" />
    <!-- Bridge -->
    <rect x="78" y="14" width="16" height="16" fill="#00F0FF" stroke="#000000" stroke-width="2" />
  </g>

  <!-- Explosive Artillery Hit Indicator -->
  <g transform="translate(280, 110)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="16" fill="#FF007F" stroke="#000000" stroke-width="2.5" />
    <circle cx="0" cy="0" r="10" fill="#FFE600" stroke="#000000" stroke-width="2" />
    <path d="M-5 -5 L5 5 M-5 5 L5 -5" stroke="#000000" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Sonar Recon Ping (Cyan Ripple) -->
  <g transform="translate(120, 110)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-dasharray="4,3" />
    <circle cx="0" cy="0" r="5" fill="#00F0FF" />
  </g>

  <!-- Tactical Target Lock Crosshair HUD -->
  <g transform="translate(200, 190)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#FFE600" stroke-width="2.5" stroke-dasharray="14,8" />
    <line x1="-35" y1="0" x2="-18" y2="0" stroke="#FFE600" stroke-width="3" />
    <line x1="18" y1="0" x2="35" y2="0" stroke="#FFE600" stroke-width="3" />
    <line x1="0" y1="-35" x2="0" y2="-18" stroke="#FFE600" stroke-width="3" />
    <line x1="0" y1="18" x2="0" y2="35" stroke="#FFE600" stroke-width="3" />
  </g>

  <!-- Top Tag Pill: TACTICAL FLEET COMBAT -->
  <g transform="translate(200, 24)" filter="url(#brutalShadowSm)">
    <rect x="-80" y="-10" width="160" height="20" rx="6" class="theme-tag-rect" stroke-width="2" />
    <text x="0" y="4" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1">TACTICAL FLEET COMBAT</text>
  </g>

  <!-- Bottom Title Badge Pill: NAVAL GRID STRIKE -->
  <g transform="translate(200, 366)" filter="url(#brutalShadowSm)">
    <rect x="-105" y="-15" width="210" height="30" rx="10" class="theme-badge-rect" stroke-width="3" />
    <text x="0" y="5" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1.5">NAVAL GRID STRIKE</text>
  </g>
</svg>