<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    <linearGradient id="radarSweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="shipHullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a324b" />
      <stop offset="100%" stop-color="#141a29" />
    </linearGradient>
    <filter id="bsGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" floodColor="#00f0ff" floodOpacity="0.8" />
    </filter>
    <filter id="fireGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" floodColor="#ff4081" floodOpacity="0.9" />
    </filter>
  </defs>

  <!-- Dark Oceanic Grid Background -->
  <rect width="400" height="400" fill="url(#bsBg)" />

  <!-- Tactical Radar Grid Lines -->
  <g stroke="#1a2b4c" stroke-width="1.5" opacity="0.6">
    <!-- Concentric Radar Rings -->
    <circle cx="200" cy="200" r="160" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.25" stroke-dasharray="8,6" />
    <circle cx="200" cy="200" r="110" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.3" />
    <circle cx="200" cy="200" r="60" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.35" />
    <circle cx="200" cy="200" r="15" fill="#00f0ff" opacity="0.4" />

    <!-- Crosshair Axes -->
    <line x1="40" y1="200" x2="360" y2="200" stroke="#00f0ff" stroke-width="2" opacity="0.4" />
    <line x1="200" y1="40" x2="200" y2="360" stroke="#00f0ff" stroke-width="2" opacity="0.4" />

    <!-- 10x10 Tactical Grid lines -->
    <line x1="40" y1="80" x2="360" y2="80" />
    <line x1="40" y1="120" x2="360" y2="120" />
    <line x1="40" y1="160" x2="360" y2="160" />
    <line x1="40" y1="240" x2="360" y2="240" />
    <line x1="40" y1="280" x2="360" y2="280" />
    <line x1="40" y1="320" x2="360" y2="320" />

    <line x1="80" y1="40" x2="80" y2="360" />
    <line x1="120" y1="40" x2="120" y2="360" />
    <line x1="160" y1="40" x2="160" y2="360" />
    <line x1="240" y1="40" x2="240" y2="360" />
    <line x1="280" y1="40" x2="280" y2="360" />
    <line x1="320" y1="40" x2="320" y2="360" />
  </g>

  <!-- Radar Sweep Sector -->
  <path d="M200 200 L320 80 A160 160 0 0 0 200 40 Z" fill="url(#radarSweepGrad)" opacity="0.6" />
  <line x1="200" y1="200" x2="320" y2="80" stroke="#00f0ff" stroke-width="3" filter="url(#bsGlow)" />

  <!-- 2D Neo Battleship Silhouette (Friendly/Enemy) -->
  <g transform="translate(100, 220) rotate(-25)">
    <!-- Shadow -->
    <polygon points="0,25 35,0 160,0 185,25 160,50 35,50" fill="#000000" transform="translate(6, 6)" />
    <!-- Hull Base -->
    <polygon points="0,25 35,0 160,0 185,25 160,50 35,50" fill="url(#shipHullGrad)" stroke="#00f0ff" stroke-width="3" />

    <!-- Deck Details & Armor Plates -->
    <rect x="45" y="10" width="95" height="30" rx="4" fill="#1b233a" stroke="#00f0ff" stroke-width="2" />

    <!-- Heavy Turrets -->
    <circle cx="65" cy="25" r="10" fill="#ffe600" stroke="#000" stroke-width="2" />
    <rect x="65" y="22" width="22" height="6" fill="#ffe600" stroke="#000" stroke-width="1.5" />

    <circle cx="120" cy="25" r="10" fill="#ffe600" stroke="#000" stroke-width="2" />
    <rect x="120" y="22" width="22" height="6" fill="#ffe600" stroke="#000" stroke-width="1.5" />

    <!-- Command Bridge -->
    <rect x="85" y="16" width="18" height="18" fill="#00f0ff" stroke="#000" stroke-width="2" />
  </g>

  <!-- Sonar Ping Targets / Hits & Misses -->
  <!-- Target 1: Hit with Fire/Explosion -->
  <g transform="translate(280, 120)">
    <circle cx="0" cy="0" r="18" fill="#ff4081" fill-opacity="0.3" filter="url(#fireGlow)" />
    <circle cx="0" cy="0" r="12" fill="#ffe600" stroke="#ff4081" stroke-width="3" />
    <!-- Explosion spikes -->
    <path d="M-6 -6 L6 6 M-6 6 L6 -6" stroke="#000000" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="4" fill="#ff4081" />
  </g>

  <!-- Target 2: Hit with Plasma Blast -->
  <g transform="translate(320, 160)">
    <circle cx="0" cy="0" r="16" fill="#ff4081" fill-opacity="0.3" filter="url(#fireGlow)" />
    <circle cx="0" cy="0" r="10" fill="#ffe600" stroke="#ff4081" stroke-width="3" />
    <path d="M-5 -5 L5 5 M-5 5 L5 -5" stroke="#000000" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Target 3: Miss / Water Splash Ripple -->
  <g transform="translate(120, 120)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.7" stroke-dasharray="4,3" />
    <circle cx="0" cy="0" r="5" fill="#00f0ff" opacity="0.9" />
  </g>
  <g transform="translate(160, 80)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.5" />
    <circle cx="0" cy="0" r="4" fill="#00f0ff" opacity="0.7" />
  </g>

  <!-- Tactical Target Crosshair Locking HUD -->
  <g transform="translate(200, 200)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#ffe600" stroke-width="3" stroke-dasharray="16,10" filter="url(#bsGlow)" />
    <line x1="-40" y1="0" x2="-22" y2="0" stroke="#ffe600" stroke-width="3" />
    <line x1="22" y1="0" x2="40" y2="0" stroke="#ffe600" stroke-width="3" />
    <line x1="0" y1="-40" x2="0" y2="-22" stroke="#ffe600" stroke-width="3" />
    <line x1="0" y1="22" x2="0" y2="40" stroke="#ffe600" stroke-width="3" />
  </g>

  <!-- Neo-Brutalist Frame & Title Badge -->
  <g transform="translate(20, 20)">
    <!-- Outer Frame Corner Marks -->
    <path d="M 0 30 L 0 0 L 30 0" fill="none" stroke="#ffe600" stroke-width="4" />
    <path d="M 360 30 L 360 0 L 330 0" fill="none" stroke="#ffe600" stroke-width="4" />
    <path d="M 0 330 L 0 360 L 30 360" fill="none" stroke="#ffe600" stroke-width="4" />
    <path d="M 360 330 L 360 360 L 330 360" fill="none" stroke="#ffe600" stroke-width="4" />
  </g>

  <!-- Badge Banner -->
  <g transform="translate(200, 355)">
    <!-- Shadow -->
    <rect x="-120" y="-18" width="240" height="36" rx="6" fill="#000000" transform="translate(4, 4)" />
    <!-- Main Box -->
    <rect x="-120" y="-18" width="240" height="36" rx="6" fill="#ffe600" stroke="#000000" stroke-width="3" />
    <text x="0" y="6" fill="#000000" font-family="'Courier New', monospace, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="3">RETRO BATTLESHIP</text>
  </g>
</svg>
