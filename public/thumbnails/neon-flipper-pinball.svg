<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="pinballBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0526" />
      <stop offset="50%" stop-color="#14083a" />
      <stop offset="100%" stop-color="#05011a" />
    </linearGradient>
    <linearGradient id="pinballBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FDF4FF" />
      <stop offset="100%" stop-color="#FAE8FF" />
    </linearGradient>

    <!-- Neon Bumper Gradients -->
    <linearGradient id="bumperCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="bumperPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF70D9" />
      <stop offset="50%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>
    <linearGradient id="bumperYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF570" />
      <stop offset="50%" stop-color="#FFDE59" />
      <stop offset="100%" stop-color="#D49B00" />
    </linearGradient>

    <!-- Chrome Ball Gradient -->
    <linearGradient id="chromeBall" x1="30%" y1="20%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="60%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Flipper Gradients -->
    <linearGradient id="flipperPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF54B0" />
      <stop offset="50%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#9D024D" />
    </linearGradient>
    <linearGradient id="flipperCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Wireform Ramp Gradient -->
    <linearGradient id="wireformRamp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#FFE600" />
    </linearGradient>

    <!-- Neo-Brutalist Hard Drop Shadows -->
    <filter id="brutalShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowLg" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="brutalShadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00F0FF" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    .theme-bg { fill: url(#pinballBgDark); }
    .theme-grid-line { stroke: #FFFFFF; stroke-opacity: 0.1; }
    .theme-frame-bg { fill: #0a0422; stroke: #00F0FF; }
    .theme-stage-grid { stroke: #1e1346; }
    .theme-badge-rect { fill: #FF007F; stroke: #000000; }
    .theme-badge-text { fill: #FFFFFF; }
    .theme-tag-rect { fill: #FFDE59; stroke: #000000; }
    .theme-tag-text { fill: #000000; }

    @media (prefers-color-scheme: light) {
      .theme-bg { fill: url(#pinballBgLight); }
      .theme-grid-line { stroke: #000000; stroke-opacity: 0.08; }
      .theme-frame-bg { fill: #FFFFFF; stroke: #000000; }
      .theme-stage-grid { stroke: #E2E8F0; }
      .theme-badge-rect { fill: #FF007F; stroke: #000000; }
      .theme-badge-text { fill: #FFFFFF; }
      .theme-tag-rect { fill: #FFDE59; stroke: #000000; }
      .theme-tag-text { fill: #000000; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="400" height="400" class="theme-bg" />

  <!-- Retro Cyber Grid Backdrop -->
  <g class="theme-grid-line" stroke-width="1.5">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
  </g>

  <!-- Neo Sparks & Glints -->
  <g fill="#FFDE59">
    <polygon points="40,46 42,54 50,56 42,58 40,66 38,58 30,56 38,54" />
    <polygon points="360,40 362,48 370,50 362,52 360,60 358,52 350,50 358,48" />
    <polygon points="365,300 367,306 373,308 367,310 365,316 363,310 357,308 363,306" />
    <polygon points="34,310 36,316 42,318 36,320 34,326 32,320 26,318 32,316" />
  </g>

  <!-- 3D MAIN PINBALL CABINET FRAME -->
  <g filter="url(#brutalShadowLg)">
    <!-- Sloped Cabinet Body Shape -->
    <polygon points="65,42 335,42 355,335 45,335" class="theme-frame-bg" stroke-width="4" />
  </g>

  <!-- Inner Playfield Floor -->
  <polygon points="75,50 325,50 343,325 57,325" fill="#040114" stroke="#000000" stroke-width="2.5" />

  <!-- Playfield Neon Wire Ramps & Curved Rails -->
  <path d="M 90,130 C 90,65 310,65 310,130 L 310,210 C 310,230 290,240 275,230" fill="none" stroke="url(#wireformRamp)" stroke-width="4" stroke-linecap="round" />
  <path d="M 82,130 C 82,55 318,55 318,130" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.6" />

  <!-- Outer Guide Rails & Plunger Lane Wall -->
  <line x1="322" y1="90" x2="336" y2="310" stroke="#FFE600" stroke-width="3" />
  <line x1="330" y1="280" x2="330" y2="320" stroke="#FF007F" stroke-width="4" stroke-dasharray="4,4" />

  <!-- CYBER CORE POP BUMPERS -->
  <!-- Top Center Pop Bumper (Yellow) -->
  <g transform="translate(200, 110)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="22" fill="#000000" />
    <circle cx="0" cy="0" r="20" fill="url(#bumperYellow)" stroke="#000000" stroke-width="2.5" />
    <circle cx="0" cy="0" r="10" fill="#03010E" stroke="#FFFFFF" stroke-width="2" />
    <polygon points="0,-6 5,4 -5,4" fill="#FFE600" />
  </g>

  <!-- Left Pop Bumper (Cyan) -->
  <g transform="translate(145, 155)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="20" fill="#000000" />
    <circle cx="0" cy="0" r="18" fill="url(#bumperCyan)" stroke="#000000" stroke-width="2.5" />
    <circle cx="0" cy="0" r="9" fill="#03010E" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="0" cy="0" r="4" fill="#00F0FF" />
  </g>

  <!-- Right Pop Bumper (Pink) -->
  <g transform="translate(255, 155)" filter="url(#brutalShadowSm)">
    <circle cx="0" cy="0" r="20" fill="#000000" />
    <circle cx="0" cy="0" r="18" fill="url(#bumperPink)" stroke="#000000" stroke-width="2.5" />
    <circle cx="0" cy="0" r="9" fill="#03010E" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="0" cy="0" r="4" fill="#FF007F" />
  </g>

  <!-- DROP TARGET BANK (C-Y-B-E-R) Top Left -->
  <g transform="translate(95, 80)">
    <rect x="0" y="0" width="8" height="18" rx="2" fill="#FF007F" stroke="#000000" stroke-width="1.5" />
    <rect x="12" y="0" width="8" height="18" rx="2" fill="#00F0FF" stroke="#000000" stroke-width="1.5" />
    <rect x="24" y="0" width="8" height="18" rx="2" fill="#FFE600" stroke="#000000" stroke-width="1.5" />
  </g>

  <!-- SLINGSHOT KICKERS (Left & Right) -->
  <!-- Left Slingshot -->
  <g transform="translate(92, 215)" filter="url(#brutalShadowSm)">
    <polygon points="0,0 35,45 0,55" fill="#00F0FF" stroke="#000000" stroke-width="3" />
    <polygon points="4,8 28,42 4,48" fill="#080320" />
    <circle cx="12" cy="18" r="3" fill="#FFE600" />
    <circle cx="12" cy="38" r="3" fill="#FFE600" />
  </g>

  <!-- Right Slingshot -->
  <g transform="translate(270, 215)" filter="url(#brutalShadowSm)">
    <polygon points="35,0 0,45 35,55" fill="#FF007F" stroke="#000000" stroke-width="3" />
    <polygon points="31,8 7,42 31,48" fill="#080320" />
    <circle cx="23" cy="18" r="3" fill="#FFE600" />
    <circle cx="23" cy="38" r="3" fill="#FFE600" />
  </g>

  <!-- LEFT & RIGHT FLIPPERS (Main Action) -->
  <!-- Left Flipper (Angled Upwards with Motion Blur) -->
  <g transform="translate(132, 280) rotate(-18)" filter="url(#brutalShadow)">
    <!-- Base Flipper Pivot Circle -->
    <circle cx="0" cy="0" r="10" fill="#000000" />
    <!-- Flipper Bat -->
    <path d="M 0,-8 L 54,-4 C 58,-4 60,0 58,4 L 0,8 Z" fill="url(#flipperCyan)" stroke="#000000" stroke-width="2.5" />
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
    <path d="M 8,-4 L 46,-2" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Right Flipper (Angled Upwards with Motion Blur) -->
  <g transform="translate(230, 280) rotate(18)" filter="url(#brutalShadow)">
    <circle cx="0" cy="0" r="10" fill="#000000" />
    <path d="M 0,-8 L -54,-4 C -58,-4 -60,0 -58,4 L 0,8 Z" fill="url(#flipperPink)" stroke="#000000" stroke-width="2.5" />
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
    <path d="M -8,-4 L -46,-2" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- HIGH-SPEED NEON PINBALL WITH TRAIL -->
  <!-- Motion Blur Trail Rings -->
  <circle cx="170" cy="190" r="8" fill="#00F0FF" opacity="0.2" />
  <circle cx="182" cy="205" r="10" fill="#FF007F" opacity="0.35" />
  <circle cx="192" cy="222" r="12" fill="#FFE600" opacity="0.5" />

  <!-- Hero Chrome Steel Pinball -->
  <g transform="translate(195, 230)" filter="url(#brutalShadow)">
    <circle cx="0" cy="0" r="14" fill="url(#chromeBall)" stroke="#000000" stroke-width="2.5" />
    <!-- High-Gloss Specular Glint Reflection -->
    <circle cx="-4" cy="-4" r="5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="2" cy="3" r="1.5" fill="#FFFFFF" opacity="0.5" />
  </g>

  <!-- MULTI-BALL ALERT BADGE -->
  <g transform="translate(200, 48)" filter="url(#brutalShadowSm)">
    <polygon points="0,-16 6,-6 18,-10 12,-1 22,7 10,10 13,20 3,14 -3,20 -1,10 -13,13 -9,3 -20,-2 -10,-8 -14,-18 -4,-12" fill="#FFE600" stroke="#000000" stroke-width="2" />
    <text x="0" y="3" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="8" fill="#000000" text-anchor="middle">
      MULTI-BALL!
    </text>
  </g>

  <!-- TOP TAG RIBBON: "VECTOR PHYSICS // 60 FPS" -->
  <g transform="translate(200, 26)" filter="url(#brutalShadowSm)">
    <rect x="-85" y="-12" width="170" height="24" rx="8" class="theme-tag-rect" stroke-width="2.5" />
    <text x="0" y="4.5" class="theme-tag-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="10.5" text-anchor="middle" letter-spacing="1.2">
      CYBER PINBALL // ARCADE
    </text>
  </g>

  <!-- BOTTOM TITLE MARQUEE: "NEON FLIPPER" -->
  <g transform="translate(200, 360)" filter="url(#brutalShadowLg)">
    <rect x="-120" y="-18" width="240" height="36" rx="12" class="theme-badge-rect" stroke-width="3.5" />
    <rect x="-115" y="-14" width="230" height="28" rx="8" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.3" />
    <text x="0" y="6" class="theme-badge-text" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="16" text-anchor="middle" letter-spacing="1.5">
      NEON FLIPPER
    </text>
  </g>

  <!-- Bottom Rivet Accents -->
  <circle cx="89" cy="360" r="3" fill="#000000" />
  <circle cx="311" cy="360" r="3" fill="#000000" />
</svg>
