<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="neoShadowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000000" />
    </filter>
    <filter id="neoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" />
    </filter>
    <filter id="neoShadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Neo Ground -->
  <rect width="400" height="400" fill="#FAF8F5" />

  <!-- Subtle Dot Matrix Grid -->
  <g fill="#000000" opacity="0.08">
    <circle cx="40" cy="40" r="2" /><circle cx="100" cy="40" r="2" /><circle cx="160" cy="40" r="2" /><circle cx="220" cy="40" r="2" /><circle cx="280" cy="40" r="2" /><circle cx="340" cy="40" r="2" />
    <circle cx="40" cy="100" r="2" /><circle cx="100" cy="100" r="2" /><circle cx="160" cy="100" r="2" /><circle cx="220" cy="100" r="2" /><circle cx="280" cy="100" r="2" /><circle cx="340" cy="100" r="2" />
    <circle cx="40" cy="160" r="2" /><circle cx="100" cy="160" r="2" /><circle cx="160" cy="160" r="2" /><circle cx="220" cy="160" r="2" /><circle cx="280" cy="160" r="2" /><circle cx="340" cy="160" r="2" />
    <circle cx="40" cy="220" r="2" /><circle cx="100" cy="220" r="2" /><circle cx="160" cy="220" r="2" /><circle cx="220" cy="220" r="2" /><circle cx="280" cy="220" r="2" /><circle cx="340" cy="220" r="2" />
    <circle cx="40" cy="280" r="2" /><circle cx="100" cy="280" r="2" /><circle cx="160" cy="280" r="2" /><circle cx="220" cy="280" r="2" /><circle cx="280" cy="280" r="2" /><circle cx="340" cy="280" r="2" />
    <circle cx="40" cy="340" r="2" /><circle cx="100" cy="340" r="2" /><circle cx="160" cy="340" r="2" /><circle cx="220" cy="340" r="2" /><circle cx="280" cy="340" r="2" /><circle cx="340" cy="340" r="2" />
  </g>

  <!-- Outer Border -->
  <rect x="12" y="12" width="376" height="376" rx="20" fill="none" stroke="#000000" stroke-width="4" />

  <!-- Maze Main Board Container -->
  <rect x="36" y="36" width="328" height="328" rx="16" fill="#FE90E8" stroke="#000000" stroke-width="3.5" filter="url(#neoShadowLg)" />

  <!-- Maze White Floor -->
  <rect x="52" y="52" width="296" height="296" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="3" />

  <!-- Maze Walls Structure (Bold Neo-Brutalist Black Blocks & Outlines) -->
  <g fill="#F7CB46" stroke="#000000" stroke-width="3" filter="url(#neoShadowSm)">
    <!-- Outer maze inner blocks -->
    <rect x="80" y="80" width="40" height="90" rx="6" />
    <rect x="150" y="80" width="100" height="36" rx="6" fill="#C0F7FE" />
    <rect x="280" y="80" width="40" height="120" rx="6" fill="#99E885" />

    <rect x="80" y="200" width="110" height="36" rx="6" fill="#99E885" />
    <rect x="150" y="146" width="40" height="90" rx="6" />
    <rect x="220" y="146" width="36" height="120" rx="6" fill="#FFDC8B" />

    <rect x="80" y="266" width="40" height="52" rx="6" fill="#C0F7FE" />
    <rect x="150" y="266" width="106" height="52" rx="6" fill="#F7CB46" />
    <rect x="286" y="230" width="34" height="88" rx="6" fill="#FE90E8" />
  </g>

  <!-- Player Agent Avatar (Neo Cyan Square with Glowing Eyes & Border) -->
  <g transform="translate(68, 68)" filter="url(#neoShadow)">
    <rect x="-14" y="-14" width="28" height="28" rx="6" fill="#C0F7FE" stroke="#000000" stroke-width="2.5" />
    <circle cx="-5" cy="-2" r="3" fill="#000000" />
    <circle cx="5" cy="-2" r="3" fill="#000000" />
    <path d="M-5 6 Q0 9 5 6" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Goal Portal (Neo Yellow Star Target) -->
  <g transform="translate(303, 303)" filter="url(#neoShadowSm)">
    <circle cx="0" cy="0" r="16" fill="#F7CB46" stroke="#000000" stroke-width="2.5" />
    <text x="0" y="6" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="16" fill="#000000" text-anchor="middle">★</text>
  </g>

  <!-- Cyber Keycard Pickup Item -->
  <g transform="translate(200, 126)" filter="url(#neoShadowSm)">
    <rect x="-14" y="-10" width="28" height="20" rx="4" fill="#99E885" stroke="#000000" stroke-width="2" />
    <circle cx="-6" cy="0" r="3" fill="#000000" />
    <line x1="-3" y1="0" x2="8" y2="0" stroke="#000000" stroke-width="2" />
    <line x1="4" y1="0" x2="4" y2="4" stroke="#000000" stroke-width="2" />
  </g>

  <!-- Top Timer Floating Pill -->
  <g transform="translate(200, 26) rotate(1)">
    <rect x="-80" y="-14" width="160" height="28" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" filter="url(#neoShadowSm)" />
    <text x="0" y="5" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="12" fill="#000000" text-anchor="middle" letter-spacing="1">⏱ 00:59 • LVL 10</text>
  </g>

  <!-- Corner Figma Transform Nodes -->
  <rect x="6" y="6" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="382" y="6" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="6" y="382" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="382" y="382" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
</svg>
