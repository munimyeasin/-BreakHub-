<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Neo-Brutalist Hard Offset 3D Drop Shadow -->
  <rect x="9" y="9" width="48" height="48" rx="13" fill="#000000"/>

  <!-- Main High-Voltage Badge Face (Electric Cyber Yellow) -->
  <rect x="5" y="5" width="48" height="48" rx="13" fill="#FFE600" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Neo-Brutalism Cyber Cyan Corner Accent Stripe -->
  <path d="M 5 20 L 20 5 H 30 L 5 30 Z" fill="#00F0FF" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Top-Right Punchy Neo Sparkle Star (Hot Pink) -->
  <path d="M 47 7 C 47 11.5 44 13.5 41 14 C 44 14.5 47 16.5 47 21 C 47.5 16.5 50.5 14.5 53.5 14 C 50.5 13.5 47.5 11.5 47 7 Z" fill="#FF4081" stroke="#000000" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="47" cy="14" r="1" fill="#FFFFFF"/>

  <!-- Gamepad 3D Offset Hard Shadow -->
  <path d="M 18 25 H 40 C 45 25 48 28.5 47 34.5 L 45.5 42 C 44.2 45 40.5 45.5 38 43 C 35.5 40.5 34 38.5 29 38.5 C 24 38.5 22.5 40.5 20 43 C 17.5 45 13.8 45 12.5 42 L 11 34.5 C 10 28.5 13 25 18 25 Z" fill="#000000"/>

  <!-- Gamepad Main Chassis (Pitch Violet Ground #0B0819 with 2.6px Solid Black Stroke) -->
  <path d="M 18 22 H 40 C 45 22 48 25.5 47 31.5 L 45.5 39 C 44.2 42 40.5 42.5 38 40 C 35.5 37.5 34 35.5 29 35.5 C 24 35.5 22.5 37.5 20 40 C 17.5 42 13.8 42 12.5 39 L 11 31.5 C 10 25.5 13 22 18 22 Z" fill="#0B0819" stroke="#000000" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- D-Pad (Punchy Acid Lime #A3E635 with crisp Black Outline) -->
  <path d="M 17.5 26.5 H 20.5 V 29 H 23 V 32 H 20.5 V 34.5 H 17.5 V 32 H 15 V 29 H 17.5 V 26.5 Z" fill="#A3E635" stroke="#000000" stroke-width="1.2" stroke-linejoin="miter"/>

  <!-- Action ABXY Buttons (Punchy Neo Palette with Bold Outlines) -->
  <circle cx="37.5" cy="26.5" r="2.2" fill="#00F0FF" stroke="#000000" stroke-width="1.2"/>
  <circle cx="41.5" cy="30.5" r="2.2" fill="#FF4081" stroke="#000000" stroke-width="1.2"/>
  <circle cx="37.5" cy="34.5" r="2.2" fill="#FFE600" stroke="#000000" stroke-width="1.2"/>
  <circle cx="33.5" cy="30.5" r="2.2" fill="#A3E635" stroke="#000000" stroke-width="1.2"/>

  <!-- Center Status LED + Pill Buttons -->
  <circle cx="29" cy="25.5" r="1.2" fill="#00F0FF" stroke="#000000" stroke-width="0.8"/>
  <rect x="25.5" y="29.5" width="2.8" height="1.3" rx="0.65" fill="#FF4081" stroke="#000000" stroke-width="0.7" transform="rotate(-15 26.9 30.1)"/>
  <rect x="29.5" y="29.5" width="2.8" height="1.3" rx="0.65" fill="#FFE600" stroke="#000000" stroke-width="0.7" transform="rotate(-15 30.9 30.1)"/>
